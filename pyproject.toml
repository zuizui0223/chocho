[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "butterfly-specialization-ecology"
version = "1.0.0"
description = "Reproducible analyses for the butterfly specialization ecology manuscript"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
test = ["pytest>=8", "shapely>=2,<3"]
analysis = ["shapely>=2,<3", "rasterio>=1.4"]
figure = ["matplotlib>=3.9,<4"]
review = ["python-docx>=1.1,<2", "matplotlib>=3.9,<4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
