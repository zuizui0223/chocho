<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="830" viewBox="0 0 1200 830" role="img" aria-labelledby="title desc">
<title id="title">Additional butterfly community prediction and adverse transfer checks</title>
<desc id="desc">Previous main Figure 4D–F, relettered A–C without changing numerical evidence. A: community prediction; B: unseen divisions; C: adverse South American transfer.</desc>
<rect width="1200" height="830" fill="white"/>
