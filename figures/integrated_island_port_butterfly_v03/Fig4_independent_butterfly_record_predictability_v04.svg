<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="818" viewBox="0 0 1160 818" role="img" aria-labelledby="title desc">
<title id="title">Figure 4. Known host geography helps predict indexed butterfly communities, but transfer differs across biogeography</title>
<desc id="desc">Four panels show distinct source-cohort retrospective GBIF prediction gains for 155 species, a separate 224-species host-after-other alien test, entire major biogeographic heldouts and adverse South American cross-world transfer. Source models are observational, not host feeding or establishment.</desc>
