<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="860" viewBox="0 0 1240 860" role="img" aria-labelledby="title desc">
<title id="title">Figure 4. Documented larval-host geography adds information to independently recorded butterflies, with regional limits</title>
<desc id="desc">Separate, independent 155-species historical GBIF index prediction and 224-species butterfly community-composition tests show positive host-geography prediction gains. A widened third panel shows mean transfers to unseen biogeographic divisions, with a small fourth inset retaining adverse South American cross-world transfer under observation-intensity simulation assumptions.</desc>
<rect x="0" y="0" width="1240" height="860" rx="0" fill="#ffffff"/>
<text x="25" y="43" font-size="26" fill="#173048" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-weight="700">4  |  Host geography helps predict recorded butterfly distributions</text>
<text x="27" y="70" font-size="14" fill="#607486" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-weight="400">Different source cohorts and model contrasts — values are held-out mean squared error reductions, not butterfly population changes</text>
