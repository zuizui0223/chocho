  <g id="text_1">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172f33" x="29.88" y="29.009344" transform="rotate(-0 29.88 29.009344)">Where do introduced plants add butterfly hosts?</text>
  </g>
  <g id="text_2">
   <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #172f33" transform="translate(29.88 56.254359)">Earlier work documented alien host use in California and naturalized plant richness on islands.</text>
   <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #172f33" transform="translate(29.88 69.208816)">Here, each butterfly keeps its known hosts. A region gains potential resources only when</text>
   <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #172f33" transform="translate(29.88 82.163273)">an introduced plant supplies its first known host for that butterfly.</text>
  </g>
  <g id="text_3">
   <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #007866" x="29.88" y="125.963812" transform="rotate(-0 29.88 125.963812)">A   Global resource geography</text>
  </g>
  <g id="text_4">
   <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #172f33" transform="translate(29.88 149.051559)">239 butterflies × botanical regions</text>
   <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #172f33" transform="translate(29.88 162.006016)">126 insular and 237 mainland regions</text>
  </g>
  <g id="text_5">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #42585c" transform="translate(29.88 192.120037)">Comparison: native plant ranges versus</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #42585c" transform="translate(29.88 204.457616)">native plus introduced ranges.</text>
  </g>
  <g id="text_6">
   <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172f33" x="346.608" y="126.142837" transform="rotate(-0 346.608 126.142837)">Gain in butterfly–region combinations</text>
  </g>
  <g id="text_7">
   <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172f33" x="346.608" y="146.146116" transform="rotate(-0 346.608 146.146116)">Islands   4,829 → 10,570</text>
  </g>
  <g id="text_8">
   <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #007866" x="490.032" y="167.356125" transform="rotate(-0 490.032 167.356125)">+118.9%</text>
  </g>
  <g id="text_9">
   <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172f33" x="346.608" y="185.303316" transform="rotate(-0 346.608 185.303316)">Mainland   21,215 → 29,901</text>
  </g>
  <g id="text_10">
   <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #78929a" x="490.032" y="206.513325" transform="rotate(-0 490.032 206.513325)">+40.9%</text>
  </g>
  <g id="text_11">
   <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #007866" x="29.88" y="243.971812" transform="rotate(-0 29.88 243.971812)">B   Vegetation near ports</text>
  </g>
  <g id="text_12">
   <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #172f33" transform="translate(29.88 267.595959)">1,596 ports with plant inventories (5 km)</text>
   <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #172f33" transform="translate(29.88 280.550416)">687 candidate introduced host species</text>
  </g>
  <g id="text_13">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #42585c" transform="translate(29.88 310.128038)">Regional comparison: port counts and</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #42585c" transform="translate(29.88 322.465616)">introduced flora in 98 island regions.</text>
  </g>
  <g id="text_14">
   <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172f33" x="346.608" y="243.078037" transform="rotate(-0 346.608 243.078037)">Ports with a candidate host record</text>
  </g>
  <g id="text_15">
   <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #007866" x="346.608" y="268.869656" transform="rotate(-0 346.608 268.869656)">1,150 / 1,596   (72.1%)</text>
  </g>
  <g id="text_16">
   <text style="font-size: 9.7px; font-family: 'DejaVu Sans'; fill: #172f33" transform="translate(346.608 297.562884)">Port-rich regions had more host taxa.</text>
   <text style="font-size: 9.7px; font-family: 'DejaVu Sans'; fill: #172f33" transform="translate(346.608 309.530335)">Accounting for all introduced plants</text>
   <text style="font-size: 9.7px; font-family: 'DejaVu Sans'; fill: #172f33" transform="translate(346.608 321.497786)">removed the positive host association.</text>
  </g>
  <g id="text_17">
   <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #007866" x="29.88" y="355.543013" transform="rotate(-0 29.88 355.543013)">C   New island butterfly records</text>
  </g>
  <g id="text_18">
   <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #172f33" transform="translate(29.88 380.239959)">27 islands × 132 butterflies, 2011–2024</text>
   <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #172f33" transform="translate(29.88 393.194416)">42,228 at-risk species–island–years</text>
  </g>
  <g id="text_19">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #42585c" transform="translate(29.88 422.772038)">Exposure: a compatible candidate host</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #42585c" transform="translate(29.88 435.109616)">recorded near a port in 2001–2010.</text>
  </g>
  <g id="text_20">
   <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172f33" x="346.608" y="355.185637" transform="rotate(-0 346.608 355.185637)">Annual first-record rate on the island</text>
  </g>
  <g id="text_21">
   <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172f33" x="346.608" y="377.334516" transform="rotate(-0 346.608 377.334516)">Earlier host   66 / 5,675</text>
  </g>
  <g id="text_22">
   <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #007866" x="490.032" y="398.544525" transform="rotate(-0 490.032 398.544525)">1.16%</text>
  </g>
  <g id="text_23">
   <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172f33" x="346.608" y="416.491716" transform="rotate(-0 346.608 416.491716)">Unconfirmed   200 / 36,553</text>
  </g>
  <g id="text_24">
   <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #78929a" x="490.032" y="437.701725" transform="rotate(-0 490.032 437.701725)">0.55%</text>
  </g>
  <g id="text_25">
   <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #007866" x="29.88" y="472.120837" transform="rotate(-0 29.88 472.120837)">Adjusted annual difference</text>
  </g>
  <g id="text_26">
   <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172f33" x="206.172" y="472.120837" transform="rotate(-0 206.172 472.120837)">+0.35 percentage points (95% interval +0.03 to +0.68)</text>
  </g>
  <g id="text_27">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #42585c" transform="translate(29.88 494.426194)">Adjustment includes year, distance to an earlier same-species island, island and butterfly species.</text>
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #42585c" transform="translate(29.88 505.530014)">The three samples share host identities. Ship transport, arrival and breeding were unobserved.</text>
  </g>
 </g>
