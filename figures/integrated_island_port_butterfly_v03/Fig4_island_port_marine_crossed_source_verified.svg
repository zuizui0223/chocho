<svg xmlns="http://www.w3.org/2000/svg" width="1540" height="1030" viewBox="0 0 1540 1030" role="img" aria-labelledby="title desc"><title id="title">Figure 4. Island port and marine geography contrast plant origins and butterfly recordings</title><desc id="desc">Four source-defined panels. A: port count correlates with alien whole flora, but no positive host enrichment conditional on alien flora. B: native plants have 2.95 percentage points more coded sea-dispersal morphology among 22 adequately covered islands. C: uniform ocean electrical circuit predicts alien but not native floristic similarity while shortest water path predicts both. D: stricter butterfly community transfer has positive AIS-only but negative AIS and wind predictive gains. These observational panels do not prove dispersal or causal transport.</desc>
