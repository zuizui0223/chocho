  <g id="text_30">
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #53666d" x="41.76" y="45.36" transform="rotate(-0 41.76 45.36)">51 fixed islands · 1,275 pairs · one island withheld at a time · retrospective records</text>
  </g>
  <g id="text_31">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #53666d" x="41.76" y="403.704" transform="rotate(-0 41.76 403.704)">Labels in B: relative MSE reduction; parentheses: islands with lower MSE. Positive values indicate improvement.</text>
