  <g id="text_32">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #53666d" x="41.76" y="424.116" transform="rotate(-0 41.76 424.116)">Folds share training data and pairs share islands. No independent-fold uncertainty intervals. Host records span 2001–2024.</text>
  </g>
  <g id="text_33">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #53666d" x="41.76" y="442.26" transform="rotate(-0 41.76 442.26)">All models retain distance and original port-count controls; later-response models also include earlier butterfly similarity.</text>
