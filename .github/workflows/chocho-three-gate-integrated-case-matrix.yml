name: chocho three-gate integrated butterfly island case matrix v02
on:
  push:
    branches:
      - analysis/island-mainland-host-opportunity-20261102
    paths:
      - scripts/build_island_butterfly_three_gate_case_matrix.py
      - .github/workflows/chocho-three-gate-integrated-case-matrix.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble-three-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download exact corrected 11,573 Q2 species-host-island edges
        uses: actions/download-artifact@v4
        with:
          name: chocho-q2-introduced-host-native-source-v02-CNY
          run-id: 41398149093
          github-token: ${{ github.token }}
          repository: zuizui0223/chocho
          path: work/q2
      - name: Join literature butterfly, host, NASA, WPI and LepTraits source panels
        run: |
          q2edges="$(find work/q2 -type f -name introduced_host_source_edges.csv)"
          test -n "$q2edges" && test -f "$q2edges"
          echo "Q2_CNY_EDGES_SOURCE=$q2edges"
          python -m py_compile scripts/build_island_butterfly_three_gate_case_matrix.py
          python scripts/build_island_butterfly_three_gate_case_matrix.py \
            --literature-cases data/frozen/exploratory_island_butterfly_invasion_literature_seed_20261102.csv \
            --q2-edges-v02 "$q2edges" \
            --q2-audit-v02 results/colonial-host-native-source-q2-v02/host_source_audit.json \
            --q4-firstyear-pilot results/q4-gbif-first-year-pilot/gbif_first_year_pilot_pairs.csv \
            --nasa-power-case-climate results/three-gate-nasa-power/literature_case_power_temperature_context.csv \
            --port-counts-v02 results/three-gate-wpi-port-v02/wgsrpd3_port_counts_corrected_v02.csv \
            --leptraits data/external/leptraits_consensus_v1.0.csv \
            --geb-species-metrics data/frozen/figure_sources/anthropogenic_species_metrics.csv \
            --out-dir results/three-gate-island-integration-v02
      - name: Preserve evidence matrix artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chocho-three-gate-island-source-integrated-v02
          path: results/three-gate-island-integration-v02/
          retention-days: 90
          if-no-files-found: warn
      - name: Commit feasibility and source provenance table (not journal claims)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/three-gate-island-integration-v02/
          git diff --cached --quiet && exit 0
          git commit -m 'Integrate verified butterfly host climate ports and wing traits without identifying causal gates [skip ci]'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
