name: Recover and independently refit original GEB155 private source models
on:
  push:
    branches: [analysis/geb-v05-review-data-source-audit-20261120]
    paths:
      - .github/workflows/audit-GEB-v05-original155-recovered-archive-20261122.yml
      - scripts/recover_GEB_v05_original155_private_inputs_20261122.py
      - scripts/verify_GEB_v05_original155_refit_20261122.py
      - tests/test_original155_private_recovery.py
      - tests/test_verify_GEB_v05_original155_refit.py
  workflow_dispatch:
permissions:
  # Draft releases require push access, although every source API call is GET-only.
  # No release mutation, raw-record upload or automatic branch push is performed.
  contents: write
jobs:
  source-locked-original155-model:
    name: Original155 fresh ${{ matrix.mode }} model
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        mode: [temporal, spatial, species]
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          path: audit
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 42f8fcc3a388e96456c76180d7e56d75dd2ed48c
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify original score snapshot and independent failure guards
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "numpy==2.3.5" "pandas==2.2.3" "pyarrow>=19,<24" "joblib==1.5.3"
          python source/provenance/reviewer_defenses/results/host_forecast_validation_20261029/verify_snapshot.py
          python audit/tests/test_original155_private_recovery.py
          python audit/tests/test_verify_GEB_v05_original155_refit.py
          mkdir -p safe_receipts
      - name: Restore original split archive and verify the exact primary panel
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python -u audit/scripts/recover_GEB_v05_original155_private_inputs_20261122.py \
            --stage restore --mode '${{ matrix.mode }}' \
            --root "$RUNNER_TEMP/original155" \
            --fit-script source/provenance/reviewer_defenses/results/host_forecast_validation_20261029/analysis_source/fit_forecast.py \
            --output 'safe_receipts/ORIGINAL155_PRIVATE_SOURCE_RESTORED_${{ matrix.mode }}_20261122.json'
      - name: Install the selected replay scikit-learn version
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r "$RUNNER_TEMP/original155/model_requirement.txt"
      - name: Execute the untouched original model on the recovered panel
        shell: bash
        run: |
          set -euo pipefail
          python -u audit/scripts/recover_GEB_v05_original155_private_inputs_20261122.py \
            --stage fit --mode '${{ matrix.mode }}' \
            --root "$RUNNER_TEMP/original155" \
            --output 'safe_receipts/ORIGINAL155_FRESH_EXECUTION_${{ matrix.mode }}_20261122.json'
      - name: Compare every keyed prediction, species score and frozen primary result
        shell: bash
        env:
          REPLAY_MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'original155'
          mode = os.environ['REPLAY_MODE']
          restored = json.loads((root / 'restore_receipt.json').read_text())
          command = [sys.executable, 'audit/scripts/verify_GEB_v05_original155_refit_20261122.py',
                     '--mode', mode,
                     '--snapshot-dir', 'source/provenance/reviewer_defenses/results/host_forecast_validation_20261029',
                     '--fit-root', str(root / 'refit'),
                     '--original-predictions', str(root / 'original/work/temporal/forecast' / ('predictions_' + mode + '.parquet')),
                     '--original-predictions-sha256', restored['original_prediction_sha256'],
                     '--original-species-csv-dir', str(root / 'original/outputs'),
                     '--execution-receipt', 'safe_receipts/ORIGINAL155_FRESH_EXECUTION_' + mode + '_20261122.json',
                     '--output', 'safe_receipts/ORIGINAL155_FULL_REFIT_' + mode + '_20261122.json']
          subprocess.run(command, check=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GEB-v05-original155-${{ matrix.mode }}-private-recovery-and-refit-audit-NO-RECORDS
          path: |
            safe_receipts/ORIGINAL155_PRIVATE_SOURCE_RESTORED_${{ matrix.mode }}_20261122.json
            safe_receipts/ORIGINAL155_FRESH_EXECUTION_${{ matrix.mode }}_20261122.json
            safe_receipts/ORIGINAL155_FULL_REFIT_${{ matrix.mode }}_20261122.json
          if-no-files-found: warn
          retention-days: 90
