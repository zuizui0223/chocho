name: Audit three ambiguous later butterfly island records against original GBIF entries
on:
  push:
    branches: [analysis/port-host-ocean-interaction-20261114]
    paths:
      - scripts/audit_fixed_eight_cases_source_20261115.py
      - results/port_host_ocean_long_history_20261114/fixed8_external_history_crosswalk_20261115.json
      - .github/workflows/chocho-fixed8-source-audit.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  three-unresolved-GBIF-records:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check "numpy>=1.26,<3" "geopandas>=1.0,<2" "pyproj>=3.5,<4" "shapely>=2,<3"
      - name: Recover frozen 8-case source-defined interaction model from successful original run
        uses: actions/download-artifact@v4
        with:
          run-id: 43586888038
          github-token: ${{ github.token }}
          name: chocho-20261114-port-host-ocean-history-adjusted-estimands
          path: _scratch_8case_model
      - uses: actions/cache@v4
        with:
          key: chocho-original-gshhg-shp-237-sha8dbbe7e
          path: _scratch_coastal/gshhg-shp-2.3.7.zip
      - name: Verify GSHHG 2.3.7 authentic geometry bytes
        run: |
          mkdir -p _scratch_coastal
          if test ! -s _scratch_coastal/gshhg-shp-2.3.7.zip; then
            curl -fSL --retry 3 --max-time 360 -o _scratch_coastal/gshhg-shp-2.3.7.zip https://github.com/GenericMappingTools/gshhg-gmt/releases/download/2.3.7/gshhg-shp-2.3.7.zip
          fi
          echo "8dbbe7e071e77e9e75f2d639239099ebca8d5c16d6a07df8169729d49f15cf41  _scratch_coastal/gshhg-shp-2.3.7.zip" | sha256sum --check
      - name: Query original species and landmass for the three unresolved late records
        run: |
          python -m py_compile scripts/audit_fixed_eight_cases_source_20261115.py
          python scripts/audit_fixed_eight_cases_source_20261115.py \
            --model-json _scratch_8case_model/long_history_port_host_ocean_model.json \
            --case-crosswalk results/port_host_ocean_long_history_20261114/fixed8_external_history_crosswalk_20261115.json \
            --gshhg-zip _scratch_coastal/gshhg-shp-2.3.7.zip \
            --work _scratch_coastal/fixed8_review \
            --out-dir results/fixed8_original_gbif_20261115
      - name: Check fixed sample support and display source quality without inventing establishment
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('results/fixed8_original_gbif_20261115/fixed_three_original_GBIF_record_audit.json').read_text())
          assert len(x['cases'])==3 and x['GSHHG_source_zip_sha256'].startswith('8dbbe7e071')
          assert {(c['speciesKey'],c['island_id']) for c in x['cases']}=={('7762841','26'),('1929270','391'),('8049830','456')}
          for r in x['cases']:
            print('SOURCE CASE:',r['species'],r['island_source_description'],r['n_exact_speciesKey'],r['status'])
          print('SOURCE FIRST INDEX != VERIFIED ISLAND ARRIVAL')
          PY
      - name: Preserve original record metadata and query hashes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chocho-20261115-fixed8-three-original-record-identity-audit
          path: results/fixed8_original_gbif_20261115/
          if-no-files-found: warn
          retention-days: 90
