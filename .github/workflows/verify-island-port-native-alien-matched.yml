name: Verify matched island port-native and alien whole floras
on:
  push:
    branches:
      - paper/geb-single-island-port-endemics-20261118
    paths:
      - scripts/verify_island_port_native_alien_matched_20261118.py
      - results/three-gate-port-all-flora/all_flora_intro_native_wpi_islands.csv
      - results/three-gate-port-introduced-host-taxa/distinct_introduced_host_taxa_and_port_by_island.csv
      - .github/workflows/verify-island-port-native-alien-matched.yml
  pull_request:
    paths:
      - scripts/verify_island_port_native_alien_matched_20261118.py
      - .github/workflows/verify-island-port-native-alien-matched.yml
  workflow_dispatch:
jobs:
  matched-origin-contrast:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify source-matched HC3 models and uncertainty
        run: python scripts/verify_island_port_native_alien_matched_20261118.py | tee matched_port_origin_results.json
      - name: Validate structured receipt
        run: python -m json.tool matched_port_origin_results.json > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: matched-island-port-native-alien-126-123
          path: matched_port_origin_results.json
          retention-days: 60
