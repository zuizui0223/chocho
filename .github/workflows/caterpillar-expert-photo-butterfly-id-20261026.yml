name: Caterpillars Count expert larval butterfly identification gate
on:
  push:
    branches:
      - analysis/larval-host-seasonal-realization-20261026
    paths:
      - 'scripts/audit_caterpillars_count_exact_butterfly_photo_taxa_20261026.py'
      - '.github/workflows/caterpillar-expert-photo-butterfly-id-20261026.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  exact-species-source-identifiability:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          repository: hurlbertlab/caterpillars-on-plants
          ref: 2c5690ac7c6dba7eca506da886c49781c37617bd
          path: _external/CaterpillarsCount
      - name: Test original expert photo taxonomic identifications against accepted 239 butterfly binomials
        run: |
          python scripts/audit_caterpillars_count_exact_butterfly_photo_taxa_20261026.py \
            --original-repo _external/CaterpillarsCount \
            --out provenance/reviewer_defenses/results/caterpillars_count_expert_exact_butterfly_id_gate_20261026.json
      - uses: actions/upload-artifact@v4
        with:
          name: caterpillar-expert-photos-butterfly-specific-source-identification-gate
          path: provenance/reviewer_defenses/results/caterpillars_count_expert_exact_butterfly_id_gate_20261026.json
      - name: Archive aggregated expert taxonomic resolution without source sighting identities
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs=require('fs');
            const path='provenance/reviewer_defenses/results/caterpillars_count_expert_exact_butterfly_id_gate_20261026.json';
            const owner=context.repo.owner,repo=context.repo.repo;
            const branch=context.ref.replace('refs/heads/','');
            const content=Buffer.from(fs.readFileSync(path)).toString('base64');
            let sha;
            try{sha=(await github.rest.repos.getContent({owner,repo,path,ref:branch})).data.sha;}
            catch(e){if(e.status!==404)throw e;}
            const args={owner,repo,path,branch,content,
              message:'Archive source-only expert caterpillar photo butterfly binomial availability gate'};
            if(sha)args.sha=sha;
            await github.rest.repos.createOrUpdateFileContents(args);
