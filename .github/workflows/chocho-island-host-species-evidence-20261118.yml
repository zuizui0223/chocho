name: chocho island endemic larvae documented on exact host plant SPECIES
on:
  push:
    branches: [analysis/island-endemic-host-synonyms-20261118]
    paths:
      - scripts/audit_focal_island_larval_plant_species_20261118.py
      - scripts/audit_Pcheiranthi_host_portfolio_vs_geography_20261118.py
      - scripts/audit_focal_island_plant_WCVP_v13_20261118.R
      - provenance/reviewer_defenses/results/island_endemic_synonym_origin_20261118/independent_butterfly_host_plant_species_events_v1.csv
      - .github/workflows/chocho-island-host-species-evidence-20261118.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  island-host-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate independent butterfly species island and precise larval plant species observations
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/audit_focal_island_larval_plant_species_20261118.py
          python3 scripts/audit_focal_island_larval_plant_species_20261118.py
      - name: Pin exact original WCVP v13 accepted plant taxa and distributions
        uses: actions/checkout@v4
        with:
          repository: matildabrown/rWCVPdata
          ref: 65bed76bae9d644ccb6ad200c05f9f5071d89e05
          path: _original_wcvp
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
      - name: Verify actual species-level native or introduced CNY flora on source-known butterflies
        run: |
          set -euo pipefail
          test "$(git -C _original_wcvp rev-parse HEAD)" = "65bed76bae9d644ccb6ad200c05f9f5071d89e05"
          Rscript scripts/audit_focal_island_plant_WCVP_v13_20261118.R \
            _original_wcvp \
            results/focal_island_larval_plant_species_20261118/focal_host_plant_species_evidence_checked.csv \
            results/focal_island_larval_plant_species_20261118
      - name: Preserve separation of added host species versus newly occupied butterfly-island resource units
        run: |
          set -euo pipefail
          python3 scripts/audit_Pcheiranthi_host_portfolio_vs_geography_20261118.py
      - name: Protect biological and locality inference limits
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,csv
          root=Path('results/focal_island_larval_plant_species_20261118')
          z=json.loads((root/'focal_host_plant_species_evidence_summary.json').read_text())
          with (root/'focal_host_plant_species_evidence_checked.csv').open(newline='') as f:
              data=list(csv.DictReader(f))
          assert len(data)==13
          assert z['strict_direct_introduced_host_use']['events']==2
          assert z['strict_direct_introduced_host_use']['different_islands']==['La Palma','Tenerife']
          assert z['strict_direct_introduced_host_use']['host_plants']==['Tropaeolum majus']
          assert z['taxonomic_concept_unresolved']==3
          assert z['historically_extinct_records_excluded']==2
          with (root/'focal_island_named_host_plant_species_WCVP_CNY_v13.csv').open(newline='') as f:
              plants=list(csv.DictReader(f))
          assert len(plants)==13
          confirmed=[r for r in plants if r['trusted_island_specific_direct_introduced_use']=='1']
          assert all(r['reported_host_binomial']=='Tropaeolum majus' for r in confirmed)
          assert {r['named_island'] for r in confirmed}<= {'Tenerife','La Palma'}
          assert all(r['admissible_species_origin']=='quarantined_plant_taxonomic_concept'
                     for r in plants if r['source_taxonomic_grade']=='taxon_unresolved')
          portfolio=json.loads((root/'P_cheiranthi_native_alien_host_portfolio_two_islands.json').read_text())
          assert portfolio['butterfly_island_units_source_documented']==2
          assert portfolio['minimum_new_documented_introduced_host_species_butterfly_island_links']==2
          assert portfolio['newly_gained_island_units_under_native_host_already_documented']==0
          assert all(x['time_coincident_resources_verified']==0 for x in portfolio['islands'])
          print('SPECIES_PORTFOLIO_VS_GEO_UNITS_NOT_CONFLATED',portfolio['butterfly_island_units_source_documented'])
          print('SPECIES_LEVEL_ORIGIN_CROSSWALK_ROWS',len(plants),'confirmed_direct_alien_field',len(confirmed))
          assert all(int(r['confirmed_larval_performance'])==0 for r in data)
          print('EXACT_PLANT_SPECIES_NATIVE_ALIEN_FIELD_AND_LITERATURE_SEPARATION_VALIDATED')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chocho-source-typed-island-larval-plant-species-20261118
          path: results/focal_island_larval_plant_species_20261118/
          retention-days: 90
          if-no-files-found: warn
