name: Illinois adult temporal niche source-verified 10h effort sensitivity
on:
  push:
    branches:
      - analysis/sbus-host-sharing-abundance-20261025
    paths:
      - 'scripts/audit_sbus_illinois_10h_source_cofluctuation_20261026.py'
      - '.github/workflows/sbus-illinois-10h-cofluctuation-20261026.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  independent-source-effort-correction:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
      - name: Install numerical dependencies
        run: python -m pip install 'numpy>=1.26,<3'
      - uses: actions/checkout@v4
        with:
          repository: globalbioticinteractions/HOSTS
          ref: 808e0b869f9ec1adf8efff87cf6a395adda103e0
          path: _external/HOSTS
      - uses: actions/checkout@v4
        with:
          repository: matildabrown/rWCVPdata
          ref: 65bed76bae9d644ccb6ad200c05f9f5071d89e05
          path: _external/WCVP
      - name: Rebuild original accepted HOSTS plant network
        run: |
          Rscript scripts/build_wcvp_hosts_null_sidecars.R \
            _external/WCVP _external/HOSTS results/native results/contemporary
      - name: Re-evaluate same site/years under published source duration cap and 199 degree-null draws
        run: |
          python -u scripts/audit_sbus_illinois_10h_source_cofluctuation_20261026.py \
            --accepted-host-csv results/native/insect_host_accepted.csv \
            --out provenance/reviewer_defenses/results/sbus_illinois_10h_source_cofluctuation_20261026.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sbus-illinois-published-duration-cap-source-sensitivity
          path: provenance/reviewer_defenses/results/sbus_illinois_10h_source_cofluctuation_20261026.json
          if-no-files-found: ignore
      - name: Archive source-verifiable aggregate duration correction only
        if: success()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs=require('fs');
            const path='provenance/reviewer_defenses/results/sbus_illinois_10h_source_cofluctuation_20261026.json';
            const owner=context.repo.owner,repo=context.repo.repo,branch=context.ref.replace('refs/heads/','');
            const content=Buffer.from(fs.readFileSync(path)).toString('base64');
            let sha;try{sha=(await github.rest.repos.getContent({owner,repo,path,ref:branch})).data.sha;}catch(e){if(e.status!==404)throw e;}
            const data={owner,repo,path,branch,content,message:'Archive original source publication 600-minute survey exclusion on fixed butterfly temporal niche signal'};
            if(sha)data.sha=sha;
            await github.rest.repos.createOrUpdateFileContents(data);
