name: BCE Clarke continent-constrained butterfly resource homogenization null
on:
  push:
    branches: [analysis/resource-homogenization-v01]
    paths:
      - scripts/analyze_bce_clarke_homogenization_level1_null.py
      - tests/test_bce_clarke_level1_null.py
      - .github/workflows/butterfly-bce-clarke-level1-null.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify Level1 swap invariants on synthetic known inputs
        run: python -m unittest discover -s tests -p 'test_bce_clarke_level1_null.py' -v
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
      - name: Download frozen accepted-ID BCE source audit artifact
        uses: actions/download-artifact@v4
        with:
          name: chocho-bce-clarke-92-wcvp-accepted-host-gap-v01
          path: inputs/bce
          repository: zuizui0223/chocho
          github-token: ${{ github.token }}
          run-id: 37777881774
      - name: Checkout fixed original HOSTS
        uses: actions/checkout@v4
        with:
          repository: globalbioticinteractions/HOSTS
          ref: 808e0b869f9ec1adf8efff87cf6a395adda103e0
          path: _external/HOSTS
      - name: Checkout fixed original WCVP
        uses: actions/checkout@v4
        with:
          repository: matildabrown/rWCVPdata
          ref: 65bed76bae9d644ccb6ad200c05f9f5071d89e05
          path: _external/WCVP
      - name: Checkout fixed original WGSRPD Level3 geographic identifiers
        uses: actions/checkout@v4
        with:
          repository: tdwg/wgsrpd
          ref: 52da7828aba9d461dd133c27b3bd7a4407161f54
          path: _external/WGSRPD
      - name: Reconstruct exact original butterfly-HOSTS x WCVP native and contemporary
        run: |
          Rscript scripts/build_wcvp_hosts_null_sidecars.R \
            _external/WCVP _external/HOSTS \
            results/bce_level1/native results/bce_level1/contemporary
      - name: Rebuild source-only accepted botanical ranges and IDs
        run: |
          python scripts/analyze_bce_clarke_added_hosts_geography.py prepare \
            --crosswalk-json inputs/bce/bce_host_accepted_taxon_gap_v01.json \
            --output-csv results/bce_level1/additional_ids.csv
          Rscript scripts/build_bce_clarke_additional_host_wcvp_ranges.R \
            _external/WCVP results/bce_level1/additional_ids.csv \
            results/bce_level1/additional_ranges
      - name: Compare scenario-matched continent-preserving null results
        run: |
          python scripts/analyze_bce_clarke_homogenization_level1_null.py \
            --protocol-json docs/exploratory/BCE_CLARKE_LEVEL1_NULL_HOST_COMPLETENESS_PROTOCOL_V01.json \
            --source-crosswalk-json inputs/bce/bce_host_accepted_taxon_gap_v01.json \
            --insect-host-csv results/bce_level1/native/insect_host_accepted.csv \
            --native-csv results/bce_level1/native/native_extant_nondoubtful_wgsrpd3.csv \
            --contemporary-csv results/bce_level1/contemporary/extant_nondoubtful_wgsrpd3.csv \
            --added-native-csv results/bce_level1/additional_ranges/additional_native_wgsrpd3.csv \
            --added-contemporary-csv results/bce_level1/additional_ranges/additional_contemporary_wgsrpd3.csv \
            --frozen-metrics-csv data/frozen/figure_sources/anthropogenic_species_metrics.csv \
            --level3-geojson _external/WGSRPD/geojson/level3.geojson \
            --output-json results/bce_level1/bce_clarke_continent_fixed_margin_comparison_v01.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chocho-bce-clarke-continent-preserving-host-source-null-v01
          path: results/bce_level1/bce_clarke_continent_fixed_margin_comparison_v01.json
          retention-days: 30
          if-no-files-found: warn
