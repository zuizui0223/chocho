name: build blinded GEB review DOCX

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "manuscript/**"
      - "scripts/build_blinded_review_docx.py"
      - "scripts/render_butterfly_specialization_v02_figures.py"
      - "data/frozen/figure_sources/**"
      - "provenance/reviewer_defenses/**"
      - "pyproject.toml"
      - ".github/workflows/build-blinded-review-docx.yml"
  workflow_dispatch:

jobs:
  build-review-docx:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install review build environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[review]"

      - name: Render current blinded v0.2 manuscript
        run: |
          python scripts/render_butterfly_specialization_blinded_manuscript.py \
            --input manuscript/butterfly_specialization_ecology_v0.2.md \
            --output manuscript/generated/butterfly_specialization_ecology_blinded_v0.2.md

      - name: Render v0.2 manuscript figures
        run: |
          python scripts/render_butterfly_specialization_v02_figures.py \
            --anthropogenic-csv data/frozen/figure_sources/anthropogenic_species_metrics.csv \
            --matched-null-json provenance/reviewer_defenses/results/butterfly_resource_expansion_matched_null_v0.2.json \
            --hostbias-null-json provenance/reviewer_defenses/results/butterfly_resource_expansion_hostbias_null_v0.1.json \
            --plant-prominence-json provenance/reviewer_defenses/results/butterfly_host_plant_prominence_expansion_v0.1.json \
            --host-concentration-json provenance/reviewer_defenses/results/butterfly_host_contribution_concentration_v0.1.json \
            --occurrence-csv data/frozen/figure_sources/occurrence_resource_validation_species.csv \
            --occurrence-null-json provenance/reviewer_defenses/results/butterfly_occurrence_overlap_null_v0.1.json \
            --occurrence-species-robustness-json provenance/reviewer_defenses/results/butterfly_occurrence_species_robustness_v0.1.json \
            --ceiling-json provenance/reviewer_defenses/results/butterfly_expansion_ceiling_sensitivity_v0.1.json \
            --regional-json provenance/reviewer_defenses/results/butterfly_regional_robustness_v0.1.json \
            --climate-csv data/frozen/figure_sources/climate_distance_sensitivity_species.csv \
            --climate-effect-json provenance/reviewer_defenses/results/butterfly_climate_effect_size_v0.1.json \
            --output-dir _review_figures

      - name: Build double-anonymous review DOCX
        run: |
          mkdir -p dist
          python scripts/build_blinded_review_docx.py \
            --input-md manuscript/generated/butterfly_specialization_ecology_blinded_v0.2.md \
            --figures-dir _review_figures \
            --output dist/butterfly_specialization_GEB_blinded_review.docx

      - name: Render separate editable GEB Supporting Information DOCX
        run: |
          python scripts/build_butterfly_supporting_information_docx.py \
            --input-md manuscript/butterfly_specialization_supplement_v0.2.md \
            --output dist/butterfly_specialization_GEB_supporting_information.docx

      - name: Verify S1–S9 tables and anonymous metadata
        run: |
          python -m pytest -q tests/test_butterfly_supporting_docx.py
          python - <<'PY'
          from pathlib import Path
          from docx import Document
          doc = Document("dist/butterfly_specialization_GEB_supporting_information.docx")
          assert len(doc.tables) == 12, len(doc.tables)
          joined = "\n".join(p.text for p in doc.paragraphs)
          assert all(f"Supplementary Table S{i}." in joined for i in range(1,10))
          assert not (doc.core_properties.author or "").strip()
          assert not (doc.core_properties.last_modified_by or "").strip()
          assert Path("dist/butterfly_specialization_GEB_supporting_information.docx").stat().st_size > 20000
          print("Supporting DOCX: 12 native Word tables; S1-S9; anonymous metadata verified")
          PY

      - name: Verify line numbering, figures, and metadata scrub
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile
          from lxml import etree

          path = Path("dist/butterfly_specialization_GEB_blinded_review.docx")
          assert path.exists() and path.stat().st_size > 20_000

          with zipfile.ZipFile(path) as z:
              names = z.namelist()
              document = z.read("word/document.xml")
              core = z.read("docProps/core.xml")
              media = [n for n in names if n.startswith("word/media/")]
              assert len(media) >= 4

              root = etree.fromstring(document)
              ns = {"w": "http://schemas.openxmlformats.org/wordprocessingml/2006/main"}
              line_nodes = root.xpath("//w:sectPr/w:lnNumType", namespaces=ns)
              assert line_nodes
              assert line_nodes[0].get("{%s}countBy" % ns["w"]) == "1"
              assert line_nodes[0].get("{%s}start" % ns["w"]) == "0"
              assert line_nodes[0].get("{%s}restart" % ns["w"]) == "continuous"

              joined = b"\n".join(z.read(n) for n in names if n.endswith(".xml")).lower()
              for token in (b"zuizui0223", b"ttf repository", b"original ttf program"):
                  assert token not in joined

              core_root = etree.fromstring(core)
              ns_core = {
                  "dc": "http://purl.org/dc/elements/1.1/",
                  "cp": "http://schemas.openxmlformats.org/package/2006/metadata/core-properties",
              }
              creators = core_root.xpath("//dc:creator/text()", namespaces=ns_core)
              modifiers = core_root.xpath("//cp:lastModifiedBy/text()", namespaces=ns_core)
              assert not creators or not creators[0].strip()
              assert not modifiers or not modifiers[0].strip()

          print(path)
          PY

      - name: Record checksums
        run: |
          sha256sum dist/butterfly_specialization_GEB_blinded_review.docx > dist/SHA256SUMS
          sha256sum dist/butterfly_specialization_GEB_supporting_information.docx >> dist/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: geb-blinded-review-docx
          path: |
            dist/butterfly_specialization_GEB_blinded_review.docx
            dist/butterfly_specialization_GEB_supporting_information.docx
            dist/SHA256SUMS
          retention-days: 30
