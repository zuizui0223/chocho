name: chocho island port colonial trade legacy versus host butterfly assemblage

on:
  push:
    branches: [analysis/island-port-observed-association-first-20261031]
    paths:
      - ".github/workflows/chocho-island-port-colonial-association.yml"
      - "provenance/reviewer_defenses/results/island_observational_robustness_20261031/test_island_port_colonial_association.py"
      - "tests/test_island_port_colonial_association_20261101.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chocho-historic-island-port-host-pairs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  historico-maritime-geography-island-nodes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate source-locked historical harbor association test
        run: |
          python -m pip install 'numpy>=1.26,<3' 'pytest>=8' ruff
          ruff check --select F821 provenance/reviewer_defenses/results/island_observational_robustness_20261031/test_island_port_colonial_association.py
          python -m pytest tests/test_island_port_colonial_association_20261101.py -q
      - name: Test original host-butterfly pairs conditional on empire history, with source distance sensitivities
        run: |
          script=provenance/reviewer_defenses/results/island_observational_robustness_20261031/test_island_port_colonial_association.py
          dest=provenance/reviewer_defenses/results/island_observational_robustness_20261031
          for km in 2 10 25; do
            python "$script" \
              --max-port-to-region-km "$km" \
              --ridge-lambda 1 \
              --output "${dest}/island_port_colonial_association_${km}km_v1.json"
          done
      - name: Verify all outcome-blind geographic cohorts and publish derived statistical receipts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("provenance/reviewer_defenses/results/island_observational_robustness_20261031")
          expected={2:40,10:42,25:42}
          for km,n in expected.items():
              j=json.loads((root/f"island_port_colonial_association_{km}km_v1.json").read_text())
              assert j["island_source"]["eligible_history_islands"]==n
              assert j["island_pair_count"]==n*(n-1)//2
              assert j["country_shipping_sensitivity"]["status"].startswith("COUNTRY_PAIR_LSBCI")
              assert j["model_comparisons"]["host_addition_given_colonial_context"]["n_shared_node_folds"]==n
              print(km,n,j["pair_rank_associations"],j["model_comparisons"])
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          prefix=provenance/reviewer_defenses/results/island_observational_robustness_20261031
          git add "${prefix}/island_port_colonial_association_2km_v1.json" \
                  "${prefix}/island_port_colonial_association_10km_v1.json" \
                  "${prefix}/island_port_colonial_association_25km_v1.json"
          if git diff --cached --quiet; then echo 'No scientific source result change'; exit 0; fi
          git fetch origin "${GITHUB_REF_NAME}"
          if ! git diff --quiet "origin/${GITHUB_REF_NAME}" -- \
             "${prefix}/test_island_port_colonial_association.py" \
             "${prefix}/island_port_colonial_design_lock_20261101.json" \
             "${prefix}/island_port_colonial_10km.islands.csv"; then
            echo 'Historical source/lock changed since checkout; no stale commit'; exit 0
          fi
          git commit -m 'Quantify island host and colonial-history geographic associations with country shipping and island-heldout tests [skip ci]'
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
