name: butterfly resource homogenization

on:
  workflow_dispatch:
  push:
    branches:
      - analysis/resource-homogenization-v01
    paths:
      - "scripts/analyze_butterfly_resource_homogenization.py"
      - "scripts/analyze_butterfly_resource_overlap_resilience.py"
      - "scripts/simulate_butterfly_competition_attenuation.py"
      - "scripts/analyze_butterfly_resource_niche_rewiring.py"
      - "scripts/analyze_butterfly_resource_homogenization_sensitivity.py"
      - ".github/workflows/butterfly-resource-homogenization.yml"

permissions:
  contents: read
  actions: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"

      - name: Restore exact S1 resource reconstruction
        uses: actions/download-artifact@v4
        with:
          name: butterfly-resource-envelope-pilot-v01
          path: inputs/s1
          github-token: ${{ github.token }}
          repository: zuizui0223/TTF
          run-id: 36222306369

      - name: Checkout fixed HOSTS source
        uses: actions/checkout@v7
        with:
          repository: globalbioticinteractions/HOSTS
          ref: 808e0b869f9ec1adf8efff87cf6a395adda103e0
          path: _external/HOSTS

      - name: Checkout fixed WCVP source
        uses: actions/checkout@v7
        with:
          repository: matildabrown/rWCVPdata
          ref: 65bed76bae9d644ccb6ad200c05f9f5071d89e05
          path: _external/WCVP

      - name: Rebuild exact butterfly-host distribution sidecars
        run: |
          Rscript scripts/build_wcvp_hosts_null_sidecars.R \
            _external/WCVP _external/HOSTS results/native results/contemporary

      - name: Test resource-assemblage homogenization
        run: |
          mkdir -p results/resource-homogenization
          python scripts/analyze_butterfly_resource_homogenization.py \
            --descriptors-csv inputs/s1/butterfly-resource-envelope-pilot-v0.1/s1_resource_descriptors.csv \
            --leptraits-csv data/external/leptraits_consensus_v1.0.csv \
            --insect-host-csv results/native/insect_host_accepted.csv \
            --native-distribution-csv results/native/native_extant_nondoubtful_wgsrpd3.csv \
            --contemporary-distribution-csv results/contemporary/extant_nondoubtful_wgsrpd3.csv \
            --permutations 499 \
            --seed 20261007 \
            --output-json results/resource-homogenization/butterfly_resource_homogenization_v0.1.json \
            --output-host-csv results/resource-homogenization/butterfly_resource_homogenization_hosts_v0.1.csv

      - name: Test potential competition and removal resilience
        run: |
          python scripts/analyze_butterfly_resource_overlap_resilience.py \
            --descriptors-csv inputs/s1/butterfly-resource-envelope-pilot-v0.1/s1_resource_descriptors.csv \
            --leptraits-csv data/external/leptraits_consensus_v1.0.csv \
            --insect-host-csv results/native/insect_host_accepted.csv \
            --native-distribution-csv results/native/native_extant_nondoubtful_wgsrpd3.csv \
            --contemporary-distribution-csv results/contemporary/extant_nondoubtful_wgsrpd3.csv \
            --randomizations 499 \
            --seed 20261007 \
            --output-json results/resource-homogenization/butterfly_resource_overlap_resilience_v0.1.json \
            --output-host-csv results/resource-homogenization/butterfly_resource_overlap_resilience_hosts_v0.1.csv

      - name: Test resource-niche rewiring and removal robustness
        run: |
          python scripts/analyze_butterfly_resource_niche_rewiring.py \
            --descriptors-csv inputs/s1/butterfly-resource-envelope-pilot-v0.1/s1_resource_descriptors.csv \
            --leptraits-csv data/external/leptraits_consensus_v1.0.csv \
            --insect-host-csv results/native/insect_host_accepted.csv \
            --native-distribution-csv results/native/native_extant_nondoubtful_wgsrpd3.csv \
            --contemporary-distribution-csv results/contemporary/extant_nondoubtful_wgsrpd3.csv \
            --random-reps 499 \
            --seed 20261007 \
            --output-json results/resource-homogenization/butterfly_resource_niche_rewiring_v0.1.json \
            --output-host-csv results/resource-homogenization/butterfly_resource_niche_rewiring_hosts_v0.1.csv

      - name: Build FAO crop taxonomy
        run: |
          mkdir -p input/fao
          curl --location --fail --silent --show-error --retry 3 \
            "https://www.fao.org/4/a0135e/A0135E10.htm" \
            -o input/fao/fao_icc_appendix4.html
          python scripts/extract_fao_crop_taxa.py \
            --html input/fao/fao_icc_appendix4.html \
            --output-json input/fao/fao_crop_taxa_v0.1.json

      - name: Test crop and Poaceae homogenization sensitivities
        run: |
          python scripts/analyze_butterfly_resource_homogenization_sensitivity.py \
            --descriptors-csv inputs/s1/butterfly-resource-envelope-pilot-v0.1/s1_resource_descriptors.csv \
            --insect-host-csv results/native/insect_host_accepted.csv \
            --native-distribution-csv results/native/native_extant_nondoubtful_wgsrpd3.csv \
            --contemporary-distribution-csv results/contemporary/extant_nondoubtful_wgsrpd3.csv \
            --crop-json input/fao/fao_crop_taxa_v0.1.json \
            --output-json results/resource-homogenization/butterfly_resource_homogenization_sensitivity_v0.1.json

      - name: Simulate competition attenuation of new resource opportunity
        run: |
          python scripts/simulate_butterfly_competition_attenuation.py \
            --descriptors-csv inputs/s1/butterfly-resource-envelope-pilot-v0.1/s1_resource_descriptors.csv \
            --insect-host-csv results/native/insect_host_accepted.csv \
            --native-distribution-csv results/native/native_extant_nondoubtful_wgsrpd3.csv \
            --contemporary-distribution-csv results/contemporary/extant_nondoubtful_wgsrpd3.csv \
            --output-json results/resource-homogenization/butterfly_competition_attenuation_v0.1.json \
            --output-species-csv results/resource-homogenization/butterfly_competition_attenuation_species_v0.1.csv

      - uses: actions/upload-artifact@v4
        with:
          name: butterfly-resource-homogenization-v01
          path: results/resource-homogenization/
          retention-days: 30
