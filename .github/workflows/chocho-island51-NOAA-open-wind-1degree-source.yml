name: chocho NOAA NCEP 2015-2021 open monthly 10m U/V wind source for island routes

on:
  push:
    branches:
      - analysis/island51-observed-AIS-conductance-20261106
    paths:
      - "scripts/build_island51_NOAA_R1_10m_monthly_wind_1degree.py"
      - "tests/test_build_island51_NOAA_R1_10m_monthly_wind_1degree.py"
      - ".github/workflows/chocho-island51-NOAA-open-wind-1degree-source.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  open-Noaa-wind-uv-2015to2021:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify native NOAA Gaussian interpolation/longitude wrap with synthetic wind
        run: |
          python -m pip install --quiet pytest numpy scipy xarray netCDF4
          python -m pytest -q tests/test_build_island51_NOAA_R1_10m_monthly_wind_1degree.py
      - name: Download public NOAA NCEP Reanalysis 1 monthly 10m wind vector U and V
        run: |
          mkdir -p /tmp/noaa_wind2015
          curl -fLsS --retry 3 --retry-delay 5 --connect-timeout 30 --max-time 600 \
            https://downloads.psl.noaa.gov/Datasets/ncep.reanalysis.derived/surface_gauss/uwnd.10m.mon.mean.nc \
            -o /tmp/noaa_wind2015/uwnd.10m.mon.mean.nc
          curl -fLsS --retry 3 --retry-delay 5 --connect-timeout 30 --max-time 600 \
            https://downloads.psl.noaa.gov/Datasets/ncep.reanalysis.derived/surface_gauss/vwnd.10m.mon.mean.nc \
            -o /tmp/noaa_wind2015/vwnd.10m.mon.mean.nc
          test "$(stat -c %s /tmp/noaa_wind2015/uwnd.10m.mon.mean.nc)" -gt 1000000
          test "$(stat -c %s /tmp/noaa_wind2015/vwnd.10m.mon.mean.nc)" -gt 1000000
          sha256sum /tmp/noaa_wind2015/*10m.mon.mean.nc
      - name: Derive sourced 2015-2021 monthly U/V and wind-speed scalar 1degree grid
        run: |
          python -u scripts/build_island51_NOAA_R1_10m_monthly_wind_1degree.py \
            --u /tmp/noaa_wind2015/uwnd.10m.mon.mean.nc \
            --v /tmp/noaa_wind2015/vwnd.10m.mon.mean.nc \
            --out /tmp/noaa_wind2015/NOAA_NCEP_R1_10m_wind2015to2021_1deg.npz \
            --receipt /tmp/noaa_wind2015/NOAA_NCEP_R1_10m_wind2015to2021_1deg_receipt.json
          python - <<'PY'
          import json, numpy as np
          from pathlib import Path
          p=Path('/tmp/noaa_wind2015/NOAA_NCEP_R1_10m_wind2015to2021_1deg.npz')
          d=np.load(p)
          assert d['mean_monthly_wind_vector_speed_10m'].shape==(170,360)
          assert d['mean_U_east_10m'].shape==(170,360)
          assert d['mean_V_north_10m'].shape==(170,360)
          v=json.loads(Path('/tmp/noaa_wind2015/NOAA_NCEP_R1_10m_wind2015to2021_1deg_receipt.json').read_text())
          assert v['observed_months']==74
          assert v['status'].startswith('PUBLIC_NOAA_UV_REANALYSIS_SOURCE_VERIFIED')
          print('NOAA_NCEP_R1_OPEN_WIND_74_MONTHS_SOURCE_PASS',v['median_wind_speed_proxy_m_s'])
          PY
      - name: Archive 1-degree observed NOAA wind source-derived U/V and scalar without original giant NetCDF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: island51-NOAA-NCEP-R1-2015to2021-10m-monthly-wind-1deg
          path: |
            /tmp/noaa_wind2015/NOAA_NCEP_R1_10m_wind2015to2021_1deg.npz
            /tmp/noaa_wind2015/NOAA_NCEP_R1_10m_wind2015to2021_1deg_receipt.json
          if-no-files-found: warn
          retention-days: 30
