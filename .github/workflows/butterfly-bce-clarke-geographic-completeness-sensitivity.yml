name: BCE Clarke accepted-host botanical geography sensitivity
on:
  push:
    branches: [analysis/resource-homogenization-v01]
    paths:
      - scripts/analyze_bce_clarke_added_hosts_geography.py
      - scripts/build_bce_clarke_additional_host_wcvp_ranges.R
      - .github/workflows/butterfly-bce-clarke-geographic-completeness-sensitivity.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
      - name: Get exact prior WCVP-reconciled source receipt
        uses: actions/download-artifact@v4
        with:
          name: chocho-bce-clarke-92-wcvp-accepted-host-gap-v01
          path: inputs/bce
          repository: zuizui0223/chocho
          github-token: ${{ github.token }}
          run-id: 37777881774
      - name: Clone frozen original HOSTS
        uses: actions/checkout@v4
        with:
          repository: globalbioticinteractions/HOSTS
          ref: 808e0b869f9ec1adf8efff87cf6a395adda103e0
          path: _external/HOSTS
      - name: Clone frozen original WCVP
        uses: actions/checkout@v4
        with:
          repository: matildabrown/rWCVPdata
          ref: 65bed76bae9d644ccb6ad200c05f9f5071d89e05
          path: _external/WCVP
      - name: Prepare all unique accepted additional source host IDs
        run: |
          python scripts/analyze_bce_clarke_added_hosts_geography.py prepare \
            --crosswalk-json inputs/bce/bce_host_accepted_taxon_gap_v01.json \
            --output-csv results/bce_clarke_geo/additional_accepted_ids.csv
      - name: Rebuild exact frozen original host and botanical distribution panel
        run: |
          Rscript scripts/build_wcvp_hosts_null_sidecars.R \
            _external/WCVP _external/HOSTS \
            results/bce_clarke_geo/original_native results/bce_clarke_geo/original_contemporary
      - name: Rebuild new accepted botanical ranges without any unverified taxon imputation
        run: |
          Rscript scripts/build_bce_clarke_additional_host_wcvp_ranges.R \
            _external/WCVP \
            results/bce_clarke_geo/additional_accepted_ids.csv \
            results/bce_clarke_geo/additional_ranges
      - name: Validate frozen 239 butterflies then calculate one-direction host augmentation sensitivity
        run: |
          python scripts/analyze_bce_clarke_added_hosts_geography.py audit \
            --crosswalk-json inputs/bce/bce_host_accepted_taxon_gap_v01.json \
            --insect-host-csv results/bce_clarke_geo/original_native/insect_host_accepted.csv \
            --native-csv results/bce_clarke_geo/original_native/native_extant_nondoubtful_wgsrpd3.csv \
            --contemporary-csv results/bce_clarke_geo/original_contemporary/extant_nondoubtful_wgsrpd3.csv \
            --added-native-csv results/bce_clarke_geo/additional_ranges/additional_native_wgsrpd3.csv \
            --added-contemporary-csv results/bce_clarke_geo/additional_ranges/additional_contemporary_wgsrpd3.csv \
            --frozen-metrics-csv data/frozen/figure_sources/anthropogenic_species_metrics.csv \
            --output-json results/bce_clarke_geo/partial_europe_source_host_geography_v01.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chocho-bce-clarke-accepted-host-europe-geography-v01
          path: |
            results/bce_clarke_geo/additional_accepted_ids.csv
            results/bce_clarke_geo/partial_europe_source_host_geography_v01.json
          retention-days: 30
          if-no-files-found: warn
