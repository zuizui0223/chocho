name: temporal-hindcast-full-history

on:
  push:
    branches:
      - analysis/resource-homogenization-v01
    paths:
      - ".github/workflows/temporal-hindcast-full-history.yml"
      - "scripts/map_butterfly_occurrences_wgsrpd3_year.py"
      - "scripts/audit_butterfly_temporal_hindcast_full_history.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: temporal-hindcast-full-history
  cancel-in-progress: true

jobs:
  full-history-audit:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout analysis branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install analysis dependencies
        run: python -m pip install "numpy>=2,<3" "shapely>=2,<3"

      - name: Download frozen 53,434-record occurrence snapshot
        uses: actions/download-artifact@v4
        with:
          name: butterfly-climate-release-postgate-summary-v01
          path: _ttf
          github-token: ${{ github.token }}
          repository: zuizui0223/TTF
          run-id: 36270581743

      - name: Download exact HOSTS-WCVP sidecars
        uses: actions/download-artifact@v4
        with:
          name: temporal-hindcast-sidecars
          path: _sidecars
          github-token: ${{ github.token }}
          repository: zuizui0223/chocho
          run-id: 37628559686

      - name: Checkout fixed WGSRPD source
        uses: actions/checkout@v4
        with:
          repository: tdwg/wgsrpd
          ref: 52da7828aba9d461dd133c27b3bd7a4407161f54
          path: _external/WGSRPD

      - name: Map frozen occurrences while retaining year
        run: |
          mkdir -p results/exploratory
          python scripts/map_butterfly_occurrences_wgsrpd3_year.py \
            --occurrences-csv _ttf/occurrences.csv \
            --level3-geojson _external/WGSRPD/geojson/level3.geojson \
            --output-csv results/exploratory/butterfly_occurrences_wgsrpd3_year_v0.1.csv

      - name: Reconstruct frozen cohort and replace snapshot absence with full GBIF history
        run: |
          python scripts/audit_butterfly_temporal_hindcast_full_history.py \
            --occurrence-mapped-csv results/exploratory/butterfly_occurrences_wgsrpd3_year_v0.1.csv \
            --insect-host-csv _sidecars/native/insect_host_accepted.csv \
            --native-distribution-csv _sidecars/native/native_extant_nondoubtful_wgsrpd3.csv \
            --contemporary-distribution-csv _sidecars/contemporary/extant_nondoubtful_wgsrpd3.csv \
            --level3-geojson _external/WGSRPD/geojson/level3.geojson \
            --effort-threshold 10 \
            --history-start 1800 \
            --history-end 2025 \
            --permutations 99999 \
            --seed 20261007 \
            --workers 1 \
            --output-csv results/exploratory/butterfly_temporal_hindcast_full_history_cells_v0.1.csv \
            --output-json results/exploratory/butterfly_temporal_hindcast_full_history_v0.1.json

      - name: Upload full-history temporal audit
        uses: actions/upload-artifact@v4
        with:
          name: butterfly-temporal-hindcast-full-history-v01
          path: |
            results/exploratory/butterfly_occurrences_wgsrpd3_year_v0.1.csv
            results/exploratory/butterfly_temporal_hindcast_full_history_cells_v0.1.csv
            results/exploratory/butterfly_temporal_hindcast_full_history_v0.1.json
          if-no-files-found: error
          retention-days: 14
