name: chocho 51-island 194-port colonial-history geographic alignment

on:
  push:
    branches: [analysis/island-port-observed-association-first-20261031]
    paths:
      - ".github/workflows/chocho-island-port-colonial-history-gate.yml"
      - "provenance/reviewer_defenses/results/island_observational_robustness_20261031/join_island_ports_colonial_history.py"
      - "tests/test_island_port_colonial_geography_20261101.py"
      - "provenance/reviewer_defenses/results/island_observational_robustness_20261031/island_port_colonial_design_lock_20261101.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chocho-island-port-colonial-${{ github.ref }}
  cancel-in-progress: true

jobs:
  match-original-wpi-ports-to-four-empire-history:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install original geography libraries and test source-free boundary cases
        run: |
          python -m pip install 'shapely>=2.1,<3' 'pyproj>=3.7,<4' 'pytest>=8' ruff
          ruff check --select F821 provenance/reviewer_defenses/results/island_observational_robustness_20261031/join_island_ports_colonial_history.py
          python -m pytest tests/test_island_port_colonial_geography_20261101.py -q
      - name: Checkout source-reconstructed Lenzner colonial occupation by WGSRPD3 region
        uses: actions/checkout@v4
        with:
          repository: zuizui0223/chocho
          ref: analysis/lenzner-colonial-region-source-20261031
          path: _external/colonial
      - name: Checkout exact 369 official TDWG spatial polygons
        uses: actions/checkout@v4
        with:
          repository: tdwg/wgsrpd
          ref: 52da7828aba9d461dd133c27b3bd7a4407161f54
          path: _external/tdwg
      - name: Match ALL 194 original harbor points without outcome-informed selection
        run: |
          script=provenance/reviewer_defenses/results/island_observational_robustness_20261031/join_island_ports_colonial_history.py
          prefix=provenance/reviewer_defenses/results/island_observational_robustness_20261031/island_port_colonial
          for km in 2 10 25; do
            python "$script" --max-port-to-region-km "$km" --output-prefix "${prefix}_${km}km"
          done
      - name: Verify source cohort and preserve historical connection metadata only
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=Path("provenance/reviewer_defenses/results/island_observational_robustness_20261031")
          for km in (2,10,25):
              f=d/f"island_port_colonial_{km}km.audit.json"
              x=json.loads(f.read_text(encoding="utf8"))
              assert x["source_WPI_ports"]==194
              assert x["source_islands"]==51
              assert x["original_geographic_regions"]==369
              assert x["per_island_matching_threshold_km"]==km
              assert 0<=x["eligible_historic_islands"]<=51
              print(km,x["eligible_historic_islands"],x["WPI_to_GloNAF_port_status"])
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add provenance/reviewer_defenses/results/island_observational_robustness_20261031/island_port_colonial_*km.audit.json \
                  provenance/reviewer_defenses/results/island_observational_robustness_20261031/island_port_colonial_*km.ports.csv \
                  provenance/reviewer_defenses/results/island_observational_robustness_20261031/island_port_colonial_*km.islands.csv
          git diff --cached --quiet && exit 0
          git fetch origin "${GITHUB_REF_NAME}"
          if ! git diff --quiet "origin/${GITHUB_REF_NAME}" -- \
            provenance/reviewer_defenses/results/island_observational_robustness_20261031/join_island_ports_colonial_history.py \
            provenance/reviewer_defenses/results/island_observational_robustness_20261031/island_port_colonial_design_lock_20261101.json; then
            echo 'Geocoding source code or study lock changed; do not publish stale match';exit 0
          fi
          git commit -m 'Match 51 islands 194 historic-indexed ports to source-verified four-empire WGSRPD regions [skip ci]'
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
      - name: Remove checked-out third-party geography
        if: always()
        run: rm -rf _external
