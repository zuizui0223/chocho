name: chocho source-bound v08 LGM other-plant host-identity identifiability audit
on:
  push:
    branches: [ecology/lgm-v08-otherplant-identifiability-audit-v09]
    paths:
      - .github/workflows/lgm-v08-identifiability-audit-v09.yml
      - scripts/audit_v08_host_identity_identifiability_v09.py
      - tests/test_v08_host_identity_identifiability_v09.py
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: chocho-source-v08-botanical-null-identifiability-v09
  cancel-in-progress: false
jobs:
  audit-no-biological-response-reuse:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify original post-result audit script and tests
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'numpy>=1.26,<3' 'scipy>=1.13,<2' 'pytest>=8,<9'
          python -m pytest -q tests/test_v08_host_identity_identifiability_v09.py
          python -m py_compile scripts/audit_v08_host_identity_identifiability_v09.py
      - name: Recompute frozen 292-species botanical null on every original donor group
        run: |
          set -euo pipefail
          input=results/lgm_292_source_matched_otherplant_sameedge_null_v08
          echo 'd5e5e374e89eeac701c449e05edd775e7b0f0014c714b965a03378af0c7fa4b4  '$input'/all_292_insect_summary_v08.csv' | sha256sum -c -
          echo '2574cd7c6b346720733c232b2044e9c4d88407b0d597264b5ffcf115ef7cb261  '$input'/all_source_plant_group_fourway_contact_v08.csv' | sha256sum -c -
          echo '7fcd67aa367d138960aa7d0d94e6482139a5678a1c2a4be08a38dcbe4264bc55  '$input'/summary.json' | sha256sum -c -
          out=results/lgm_v08_biological_specificity_identifiability_audit_v09
          mkdir -p "$out"
          python -u scripts/audit_v08_host_identity_identifiability_v09.py \
            --species "$input/all_292_insect_summary_v08.csv" \
            --groups "$input/all_source_plant_group_fourway_contact_v08.csv" \
            --summary "$input/summary.json" \
            --out "$out"
          python - <<'PYTHON'
          import json,hashlib,os
          from pathlib import Path
          p=Path('results/lgm_v08_biological_specificity_identifiability_audit_v09')
          r=json.loads((p/'identifiability_summary_v09.json').read_text())
          assert r['status']=='EXPLORATORY_NEGATIVE_HOST_IDENTITY_CONTROL_WITH_LIMITED_COMMON_EDGE_INFORMATION'
          assert r['source_preselected_species']==292
          assert r['source_group_scenario_radius_records']==12648
          assert r['source_species_scenario_radius_records']==1752
          q=r['by_scenario_radius']['analog_100km']
          assert q['source_groups']==2108
          assert q['groups_no_fourway_common_edge']==608
          assert q['groups_at_least_one_common_edge']==1500
          assert q['groups_at_least_five_common_edges']==1176
          assert q['groups_exact_zero_effect_among_contactable']==563
          a=q['species_at_least_one_donor']
          b=q['species_at_least_four_donors_with_five_pairs']
          assert (a['species'],a['actual_host_more_split_species'],a['other_plant_more_split_species'],a['ties_no_difference_species'])==(226,62,79,85)
          assert (b['species'],b['actual_host_more_split_species'],b['other_plant_more_split_species'],b['ties_no_difference_species'])==(176,56,67,53)
          assert a['median_actual_minus_otherplant_delta']==b['median_actual_minus_otherplant_delta']==0
          assert a['baseline_vs_difference_mathematically_coupled'] is True
          assert not a['genus_cluster_descriptive_bootstrap']['confirmatory_inference']
          rec={'schema':'chocho_v09_original_v08_botanical_climate_null_information_audit_receipt',
             'run_id':os.environ['GITHUB_RUN_ID'],'head_commit':os.environ['GITHUB_SHA'],
             'sha256':hashlib.sha256((p/'identifiability_summary_v09.json').read_bytes()).hexdigest(),
             'no_new_ancient_plant_occupancy_or_genetic_response':True,
             'no_original_v08_model_or_source_modification':True}
          (p/'receipt.json').write_text(json.dumps(rec,indent=2,sort_keys=True)+'\n')
          print('PASS_292_SOURCE_PRESPECIFIED_OTHER_PLANT_NEGATIVE_NULL_INFORMATION_AUDIT')
          PYTHON
      - name: Save source-identity and information diagnostics on isolated draft branch
        run: |
          set -euo pipefail
          git fetch origin "${{ github.ref_name }}"
          test "$(git rev-parse FETCH_HEAD)" = "${{ github.sha }}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/lgm_v08_biological_specificity_identifiability_audit_v09/
          git commit -m 'Audit frozen 292-insect other-plant LGM graph null information limits and genus dependence'
          git push origin "HEAD:${{ github.ref_name }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chocho-v08-292-insect-source-null-identifiability-v09
          path: results/lgm_v08_biological_specificity_identifiability_audit_v09/
          if-no-files-found: warn
          retention-days: 30
