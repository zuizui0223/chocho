name: chocho test GBIF species vs record rarefaction depth

on:
  pull_request:
    paths:
      - "scripts/exploratory_port_n_rarefaction_depth_sensitivity.py"
      - "tests/test_exploratory_port_n_rarefaction_depth_sensitivity.py"
      - ".github/workflows/chocho-n-rarefaction-depth-sensitivity.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  all-offline-no-new-GBIF:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check exact rarefaction sampling arithmetic
        run: |
          python -m pip install --quiet pytest
          python -m pytest -q tests/test_exploratory_port_n_rarefaction_depth_sensitivity.py
      - name: Read original 312 site-period GBIF facets, no new API calls
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/n_depth
          gh run download 41407370295 --name allflora-N-host-vs-other-WPI78 --dir /tmp/n_depth --repo zuizui0223/chocho
          test -s /tmp/n_depth/allplant_312_facets.jsonl
          test -s /tmp/n_depth/allplant_GBIF_mapping.json
          test -s /tmp/n_depth/allplant_N_background_analysis.json
      - name: Compare 10 record-depth and equal-plant-richness simulation settings
        run: |
          python -u scripts/exploratory_port_n_rarefaction_depth_sensitivity.py \
            --raw /tmp/n_depth/allplant_312_facets.jsonl \
            --map /tmp/n_depth/allplant_GBIF_mapping.json \
            --aggregate /tmp/n_depth/allplant_N_background_analysis.json \
            --draws 299 --seed 549311 \
            --out /tmp/n_depth/record_vs_species_rarefaction_sensitivity.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/n_depth/record_vs_species_rarefaction_sensitivity.json').read_text())
          assert (d["focal_exactly_matched_pairs"],d["island_count"])==(27,6)
          assert len(d["settings"])==10
          assert all(0<=s["full_six_islands_probability"]<=1 for s in d["settings"])
          print('DEPTH_SENSITIVITY_SOURCE_AND_COMPUTATION_VERIFIED')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: host-N-record-vs-species-depth-sensitivity
          path: /tmp/n_depth/record_vs_species_rarefaction_sensitivity.json
          if-no-files-found: warn
          retention-days: 30
