name: chocho native-region screened TTF host observational evidence
on:
  push:
    branches: [ecology/lgm-wcvp-native-occurrences-v01]
    paths:
      - .github/workflows/lgm-native-host-occurrence-v01.yml
      - scripts/export_ttf_wcvp_native_l3.R
      - scripts/audit_ttf_host_native_observations.py
      - tests/test_ttf_native_wcvp_classification.py
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: chocho-wcvp-native-ttf-host-occurrence-v01
  cancel-in-progress: false
jobs:
  wcvp-native-observation-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/checkout@v4
        with:
          repository: zuizui0223/TTF
          ref: 187e15c6a7b777c119b97b8a43a0d92783ef7c5c
          path: input/TTF
      - uses: actions/checkout@v4
        with:
          repository: matildabrown/rWCVPdata
          ref: 65bed76bae9d644ccb6ad200c05f9f5071d89e05
          path: input/rWCVPdata
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test exact source identities and independent native region classifier
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'numpy>=1.26,<3' 'shapely>=2,<3' 'pyproj>=3.6,<4' 'pytest>=8,<9'
          python -m pytest -q tests/test_ttf_native_wcvp_classification.py
          test "$(git -C input/rWCVPdata rev-parse HEAD)" = '65bed76bae9d644ccb6ad200c05f9f5071d89e05'
          test "$(git -C input/rWCVPdata hash-object data/wgsrpd3.rda)" = 'f005f28d1ca51b818b1071e13741b905a8cacaa9'
          test "$(git -C input/rWCVPdata hash-object data/wcvp_distributions.rda)" = '60a2fa8e6c81fda225a8ba26bec7b5b3bf5bc18a'
          echo 'a28fba9efa8a9dc79c162336f62c883059c5dddbfabec2861f554d038dd98044  input/TTF/benchmarks/exploratory/lgm_external_reference_v01/host_reference_request_manifest.csv' | sha256sum -c -
          echo 'cffb1144a61151c9da78737b1c7a84034398fb50d03ea5ecb46642b317d93634  input/TTF/benchmarks/exploratory/lgm_host_reference_yearstrat_v02/summary.json' | sha256sum -c -
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::sf
            any::jsonlite
      - name: Rebuild WCVP native-by-L3 source and original region polygons
        run: |
          set -euo pipefail
          mkdir -p input/native_WCVP
          Rscript scripts/export_ttf_wcvp_native_l3.R \
            input/rWCVPdata \
            input/TTF/benchmarks/exploratory/lgm_external_reference_v01/host_reference_request_manifest.csv \
            input/native_WCVP
          python - <<'PYTHON'
          import json,csv
          from pathlib import Path
          x=json.loads(Path('input/native_WCVP/native_source_summary.json').read_text())
          assert x['original_hosts']==518
          assert x['hosts_with_native_records']==517
          assert x['polygon_regions']==369
          expected=x['missing_host_names']
          if isinstance(expected,str): expected=[expected]
          assert expected==['Brachypodium pinnatum']
          assert x['genetic_response_used'] is False and x['paleoclimate_response_used'] is False
          print('PASS_ORIGINAL_517_WCVP_NATIVE_TAXA_AND_369_POLYGONS')
          PYTHON
      - name: Classify all 296697 modern host observations by native source L3 geography
        run: |
          set -euo pipefail
          python -u scripts/audit_ttf_host_native_observations.py \
            --native input/native_WCVP/native_host_wgsrpd3.csv \
            --geojson input/native_WCVP/wgsrpd3_regions.geojson \
            --host-snapshot input/TTF/benchmarks/exploratory/lgm_host_reference_yearstrat_v02 \
            --host-manifest input/TTF/benchmarks/exploratory/lgm_external_reference_v01/host_reference_request_manifest.csv \
            --output results/lgm_wcvp_native_observations_v01
          python - <<'PYTHON'
          import json
          from pathlib import Path
          p=Path('results/lgm_wcvp_native_observations_v01')
          x=json.loads((p/'summary.json').read_text())
          assert x['all_host_taxa']==518
          assert x['with_documented_native_L3']==517
          assert x['source_quality_observations']==296697
          assert sum(x['source_status_counts'].values())==296697
          assert x['status']=='DESCRIPTIVE_MODERN_NATIVE_L3_CONSISTENCY_NOT_LGM_OCCUPANCY'
          print('PASS_296697_EXPLICIT_NATIVE_WCVP_REGIONAL_ASSIGNMENTS_NO_LGM_OR_GENETICS')
          PYTHON
      - name: Save durable small native-audit tables with source hash receipt
        run: |
          set -euo pipefail
          mkdir -p results/lgm_wcvp_native_observations_v01
          python - <<'PYTHON'
          import hashlib,json,os
          from pathlib import Path
          p=Path('results/lgm_wcvp_native_observations_v01')
          native=Path('input/native_WCVP')
          q={'schema':'chocho_lgm_native_observation_receipt_v01','run_id':os.environ['GITHUB_RUN_ID'],
             'code_sha':os.environ['GITHUB_SHA'],
             'source_sha256':{x.name:hashlib.sha256(x.read_bytes()).hexdigest()
                 for x in sorted(native.iterdir()) if x.is_file()},
             'output_sha256':{x.name:hashlib.sha256(x.read_bytes()).hexdigest()
                 for x in sorted(p.iterdir()) if x.is_file()},
             'LGM_occupancy_reconstructed':False,'genetic_response_read':False}
          (p/'receipt.json').write_text(json.dumps(q,indent=2,sort_keys=True)+'\n')
          PYTHON
          git fetch origin "${{ github.ref_name }}"
          test "$(git rev-parse FETCH_HEAD)" = "${{ github.sha }}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/lgm_wcvp_native_observations_v01/summary.json
          git add results/lgm_wcvp_native_observations_v01/host_native_observation_audit.csv
          git add results/lgm_wcvp_native_observations_v01/receipt.json
          git commit -m 'Preserve all-518 modern host observations'\'' native TDWG L3 provenance and coverage'
          git push origin "HEAD:${{ github.ref_name }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chocho-wcvp-native-ttf-host-observation-evidence-v01
          path: |
            input/native_WCVP/
            results/lgm_wcvp_native_observations_v01/
          retention-days: 30
          if-no-files-found: warn
