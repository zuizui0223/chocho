name: chocho global WorldCover 2021 built-up adjusted WWTP-port analysis

on:
  pull_request:
    paths:
      - "scripts/exploratory_global_hydrowaste_worldcover_adjustment.py"
      - "tests/test_exploratory_global_hydrowaste_worldcover_adjustment.py"
      - ".github/workflows/chocho-global-hydrowaste-worldcover.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  original-cog-raster-and-country-fixed-effects:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 36
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare source GIS and country fixed effects
        run: |
          python -m pip install --quiet rasterio scipy numpy pandas statsmodels pytest
          python -m pytest -q tests/test_exploratory_global_hydrowaste_worldcover_adjustment.py
      - name: Download frozen WPI1596 HydroWASTE original success artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/hydrowaste_urban
          gh run download 41414513676 --name global-hydrowaste-58502-WPI1596-port-host-study \
            --dir /tmp/hydrowaste_urban --repo zuizui0223/chocho
          test -s /tmp/hydrowaste_urban/WWTP_port_1596_features.csv
      - name: Sample true 2021 WorldCover pixels at all 1596 global ports
        run: |
          python -u scripts/exploratory_global_hydrowaste_worldcover_adjustment.py \
            --ports /tmp/hydrowaste_urban/WWTP_port_1596_features.csv \
            --out /tmp/hydrowaste_urban/WPI1596_worldcover2021_countries_adjusted.json \
            --table /tmp/hydrowaste_urban/WPI1596_worldcover2021_port_measurements.csv \
            --radius-m 500
          python - <<'PY'
          import json
          from pathlib import Path
          z=json.loads(Path('/tmp/hydrowaste_urban/WPI1596_worldcover2021_countries_adjusted.json').read_text())
          assert z['port_source_population']==1596
          assert z['ports_with_complete_2021_landcover']<=1596
          assert z['source_WorldCover']=='ESA WorldCover 2021 v200 native 10m GeoTIFF COG'
          print('WORLD_COVER1596_COUNTRY_FE_URBAN_SOURCE_CENSUS',z['ports_with_complete_2021_landcover'])
          PY
      - name: Archive source 2021 geospatial pixel and port confounding measures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hydroWASTE-WPI1596-WorldCover2021-urban
          path: |
            /tmp/hydrowaste_urban/WPI1596_worldcover2021_countries_adjusted.json
            /tmp/hydrowaste_urban/WPI1596_worldcover2021_port_measurements.csv
          if-no-files-found: warn
          retention-days: 30
