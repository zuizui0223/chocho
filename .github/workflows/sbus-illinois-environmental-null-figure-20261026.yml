name: Illinois butterfly climate-versus-niche evidence visualization
on:
  push:
    branches:
      - analysis/sbus-environment-shock-20261026
    paths:
      - 'scripts/render_sbus_illinois_year_daymet_null_comparison_20261026.py'
      - '.github/workflows/sbus-illinois-environmental-null-figure-20261026.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render-source-verified-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install chart dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'matplotlib>=3.9,<4'
      - name: Render source-verified 199-null histograms for before/year/weather adjustment
        run: |
          python scripts/render_sbus_illinois_year_daymet_null_comparison_20261026.py \
            --svg docs/exploratory/figures/SBUS_Illinois_year_vs_Daymet_niche_null_20261026.svg \
            --png docs/exploratory/figures/SBUS_Illinois_year_vs_Daymet_niche_null_20261026.png
      - uses: actions/upload-artifact@v4
        with:
          name: sbus-illinois-year-daymet-ecological-null-comparison
          path: |
            docs/exploratory/figures/SBUS_Illinois_year_vs_Daymet_niche_null_20261026.svg
            docs/exploratory/figures/SBUS_Illinois_year_vs_Daymet_niche_null_20261026.png
      - name: Archive complete source-checked vector and raster comparison
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs=require('fs');
            const owner=context.repo.owner,repo=context.repo.repo;
            const branch=context.ref.replace('refs/heads/','');
            for(const path of [
              'docs/exploratory/figures/SBUS_Illinois_year_vs_Daymet_niche_null_20261026.svg',
              'docs/exploratory/figures/SBUS_Illinois_year_vs_Daymet_niche_null_20261026.png'
            ]){
              let sha;try{sha=(await github.rest.repos.getContent({owner,repo,path,ref:branch})).data.sha;}
              catch(e){if(e.status!==404)throw e;}
              const props={owner,repo,path,branch,
                content:Buffer.from(fs.readFileSync(path)).toString('base64'),
                message:'Archive source-verified adult butterfly host synchrony climate null figure '+path.split('.').pop()};
              if(sha)props.sha=sha;
              await github.rest.repos.createOrUpdateFileContents(props);
            }
