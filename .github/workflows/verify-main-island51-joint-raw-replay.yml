name: Verify clean main-source island51 joint marine replay
on:
  push:
    branches:
      - analysis/chocho-clean-marine-replay-20261118
    paths:
      - ".github/workflows/verify-main-island51-joint-raw-replay.yml"
      - "data/exploratory/island51_observed_ocean_20261106/**"
      - "results/island51_observed_ocean_circuit_20261106/**"
      - "scripts/**"
      - "tests/test_run_island51_host_circuit_joint.py"
      - "tests/test_verify_island51_joint_predictions.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run-immutable-source-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install source analysis requirements
        run: python -m pip install -e ".[test,analysis]" "pandas>=2.2" "scipy>=1.12"
      - name: Original marine and joint-model tests
        run: |
          python -m pytest -q \
            tests/test_run_island51_host_circuit_joint.py \
            tests/test_verify_island51_joint_predictions.py \
            tests/test_exploratory_island51_circuit_network_holdout.py \
            tests/test_run_island51_observed_ocean_circuits.py
      - name: Refit and verify original 51-island 1275-pair joint-host marine model
        run: |
          mkdir -p _ci_joint_results
          python scripts/run_island51_host_circuit_joint.py --out-dir _ci_joint_results
          python results/island51_host_circuit_joint_20261106/verify_saved_predictions.py --results-dir _ci_joint_results
      - name: Archive complete fixed-model predictions and checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clean-main-source-51-island-host-marine-replay
          path: |
            _ci_joint_results/*.json
            _ci_joint_results/*.csv
            _ci_joint_results/*.csv.gz
          if-no-files-found: ignore
