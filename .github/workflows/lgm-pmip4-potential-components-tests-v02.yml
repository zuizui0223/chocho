name: chocho PMIP4 potential climate land component topology tests
on:
  push:
    branches: [ecology/lgm-pmip4-2d-climatic-connectivity-v02]
    paths:
      - .github/workflows/lgm-pmip4-potential-components-tests-v02.yml
      - scripts/pmip4_potential_habitat_components_v02.py
      - tests/test_pmip4_potential_habitat_components_v02.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-components-before-climate-estimation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          set -euo pipefail
          python -m pip install 'numpy>=1.26,<3' 'scipy>=1.13,<2' 'pytest>=8,<9'
          python -m pytest -q tests/test_pmip4_potential_habitat_components_v02.py
          python -m py_compile scripts/pmip4_potential_habitat_components_v02.py
          echo PASS_POTENTIAL_CLIMATIC_HABITAT_ONLY_NO_PLANT_OCCUPANCY
