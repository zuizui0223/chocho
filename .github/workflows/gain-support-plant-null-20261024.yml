name: Butterfly gain-support plant-range structural null
on:
  push:
    branches:
      - analysis/gain-support-plantnull-20261024
    paths:
      - 'scripts/analyze_butterfly_gain_support_plant_null_20261024.py'
      - 'tests/test_gain_support_plant_range_null_20261024.py'
      - '.github/workflows/gain-support-plant-null-20261024.yml'
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  source-locked-null:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exploratory repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up base R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
      - name: Install analysis tests
        run: python -m pip install 'numpy>=1.26,<3' 'pytest>=8,<10'
      - name: Test source-independent bitsets and constraint preservation
        run: python -m pytest -q tests/test_gain_support_plant_range_null_20261024.py
      - name: Checkout SHA-pinned HOSTS interactions
        uses: actions/checkout@v4
        with:
          repository: globalbioticinteractions/HOSTS
          ref: 808e0b869f9ec1adf8efff87cf6a395adda103e0
          path: _external/HOSTS
      - name: Checkout SHA-pinned WCVP plant ranges
        uses: actions/checkout@v4
        with:
          repository: matildabrown/rWCVPdata
          ref: 65bed76bae9d644ccb6ad200c05f9f5071d89e05
          path: _external/WCVP
      - name: Rebuild exact native and introduced plant×region support
        run: |
          Rscript scripts/build_wcvp_hosts_null_sidecars.R \
            _external/WCVP _external/HOSTS results/native results/contemporary
      - name: Audit original 239 butterflies and run two-chain 199-draw structural null
        run: |
          python scripts/analyze_butterfly_gain_support_plant_null_20261024.py \
            --insect-host-csv results/native/insect_host_accepted.csv \
            --native-csv results/native/native_extant_nondoubtful_wgsrpd3.csv \
            --contemporary-csv results/contemporary/extant_nondoubtful_wgsrpd3.csv \
            --level1-json data/frozen/wgsrpd3_level1_lookup_v0.1.json \
            --output provenance/reviewer_defenses/results/butterfly_gain_support_plant_null_20261024.json
      - name: Upload auditable score chains and source-conditioned result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: butterfly-gain-support-plant-null-20261024
          path: provenance/reviewer_defenses/results/butterfly_gain_support_plant_null_20261024.json
          if-no-files-found: ignore
      - name: Commit the source-verified aggregate receipt to this analysis branch
        if: success()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs=require('fs');
            const owner=context.repo.owner,repo=context.repo.repo;
            const path='provenance/reviewer_defenses/results/butterfly_gain_support_plant_null_20261024.json';
            const content=Buffer.from(fs.readFileSync(path)).toString('base64');
            const branch=context.ref.replace('refs/heads/','');
            let previous;
            try {
              previous=(await github.rest.repos.getContent({owner,repo,path,ref:branch})).data.sha;
            }catch(e){if(e.status!==404)throw e;}
            const data={owner,repo,path,branch,content,
              message:'Archive source-locked 2-chain degree-preserving test of butterfly gain-support slope'};
            if(previous)data.sha=previous;
            await github.rest.repos.createOrUpdateFileContents(data);
