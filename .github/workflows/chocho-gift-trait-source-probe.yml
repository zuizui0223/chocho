name: chocho GIFT life-cycle and growth-form source feasibility

on:
  push:
    branches:
      - analysis/island-port-trait-selection-gate-20261105
    paths:
      - ".github/workflows/chocho-gift-trait-source-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  official-gift-metadata-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect official GIFT versioned trait metadata and a small matching sample
        run: |
          python - <<'PY'
          import urllib.request,urllib.parse,json,re,time,hashlib
          from pathlib import Path
          base='https://gift.uni-goettingen.de/api/extended/'
          versions=('3.2','3.1','3.0','2.0')
          def get(version,kw):
              url=base+f'index{version}.php?'+urllib.parse.urlencode(kw)
              req=urllib.request.Request(url,headers={'User-Agent':'chocho-ecological-trait-coverage-audit/1.0','Accept':'application/json'})
              with urllib.request.urlopen(req,timeout=23) as f:data=f.read(12000000)
              x=json.loads(data.decode('utf-8-sig'))
              if isinstance(x,dict) and ('error' in x or 'message' in x):
                  raise ValueError(str(x)[:250])
              return x,{'url':url,'sha256':hashlib.sha256(data).hexdigest(),'nbytes':len(data)}
          errors=[]
          selected=None
          for v in versions:
              try:
                  r,rec=get(v,{'query':'traits_meta'})
                  if isinstance(r,dict):
                      r=r.get('data',r.get('results'))
                  if not isinstance(r,list) or not r or 'Lvl3' not in r[0]:
                      raise ValueError('Unexpected metadata layout '+str(type(r)))
                  selected=v
                  break
              except Exception as e:
                  errors.append({'version':v,'error':str(e)[:220]})
          result={'schema':'chocho_GIFT_global_trait_source_feasibility_v1',
                  'source':base,'selected_api_version':selected,
                  'attempts':errors,'WCVP_is_not_a_lifeform_trait_db':True}
          if selected is not None:
              m=[{k:z.get(k) for k in ('Lvl3','Trait2','Trait1','count','type')}
                 for z in r if re.search('life.?cycle|life.?form|growth.?form|woodiness|annual|raunki',str(z.get('Trait1',''))+' '+str(z.get('Trait2','')),re.I)]
              result['trait_metadata_sha256']=rec['sha256']
              result['trait_candidates']=m
              result['all_traits_in_GIFT']=len(r)
              records=[]
              for row in sorted(m,key=lambda x: (0 if 'life_cycle' in str(x['Trait2']).lower() else 1,x['Lvl3']))[:3]:
                  try:
                      traits,prov=get(selected,{'query':'traits','traitid':row['Lvl3'],
                                      'biasref':0,'biasderiv':0,'startat':0})
                      if isinstance(traits,dict):traits=traits.get('data',traits.get('results'))
                      if not isinstance(traits,list):raise ValueError('not a list trait reply')
                      from collections import Counter
                      counts=Counter(str(t.get('trait_value')) for t in traits if isinstance(t,dict))
                      records.append({'trait_id':row['Lvl3'],'n_page':len(traits),'columns':list(traits[0]) if traits else [],
                          'types':counts.most_common(30),'source_url':prov['url'],'sha256':prov['sha256']})
                  except Exception as e:records.append({'trait_id':row['Lvl3'],'error':str(e)[:300]})
              result['trait_sample_pages']=records
          p=Path('/tmp/gift_source_coverage.json')
          p.write_text(json.dumps(result,indent=2,ensure_ascii=False)+'\n')
          print('GIFT_OFFICIAL_TRAIT_SOURCE_FEASIBILITY',json.dumps(result,ensure_ascii=False)[:24000],flush=True)
          assert result['schema']=='chocho_GIFT_global_trait_source_feasibility_v1'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GIFT-official-life-cycle-plant-trait-source-coverage
          path: /tmp/gift_source_coverage.json
          if-no-files-found: warn
          retention-days: 30
