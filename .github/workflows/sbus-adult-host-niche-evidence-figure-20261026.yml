name: Original butterfly monitored niche evidence visual audit
on:
  push:
    branches:
      - analysis/sbus-host-sharing-abundance-20261025
    paths:
      - 'scripts/render_sbus_real_adult_niche_20261026.py'
      - '.github/workflows/sbus-adult-host-niche-evidence-figure-20261026.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  figure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source plotting dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'matplotlib>=3.9,<4'
      - name: Render validated source-field adult niche/competition evidence ladder
        run: |
          python scripts/render_sbus_real_adult_niche_20261026.py \
            --svg docs/exploratory/figures/SBUS_adult_host_niche_evidence_20261026.svg \
            --png docs/exploratory/figures/SBUS_adult_host_niche_evidence_20261026.png
      - uses: actions/upload-artifact@v4
        with:
          name: sbus-real-adult-host-niche-competition-evidence-ladder
          path: |
            docs/exploratory/figures/SBUS_adult_host_niche_evidence_20261026.svg
            docs/exploratory/figures/SBUS_adult_host_niche_evidence_20261026.png
      - name: Commit audited source visualization to isolated branch
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs=require('fs');
            const owner=context.repo.owner,repo=context.repo.repo,branch=context.ref.replace('refs/heads/','');
            for(const path of [
              'docs/exploratory/figures/SBUS_adult_host_niche_evidence_20261026.svg',
              'docs/exploratory/figures/SBUS_adult_host_niche_evidence_20261026.png'
            ]){
              const content=Buffer.from(fs.readFileSync(path)).toString('base64');
              let sha;
              try{sha=(await github.rest.repos.getContent({owner,repo,path,ref:branch})).data.sha;}
              catch(e){if(e.status!==404)throw e;}
              const props={owner,repo,path,branch,content,message:'Archive verified field butterfly adult host-niche evidence '+path.split('.').pop()};
              if(sha)props.sha=sha;
              await github.rest.repos.createOrUpdateFileContents(props);
            }
