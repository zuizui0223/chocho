name: chocho all-641 native-screened larval host reference eligibility
on:
  push:
    branches: [ecology/lgm-wcvp-native-occurrences-v01]
    paths:
      - .github/workflows/lgm-native-paired-qualify-v01.yml
      - scripts/qualify_ttf_native_host_reference_v01.py
      - tests/test_native_ttf_paired_qualification.py
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: chocho-ttf-641-native-paired-qualification-v01
  cancel-in-progress: false
jobs:
  native-host-versus-original-insect-geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/checkout@v4
        with:
          repository: zuizui0223/TTF
          ref: 187e15c6a7b777c119b97b8a43a0d92783ef7c5c
          path: input/TTF
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test paired-native-source reference matching independent of LGM/genetics
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'numpy>=1.26,<3' 'scipy>=1.13,<2' 'pytest>=8,<9'
          python -m pytest -q tests/test_native_ttf_paired_qualification.py
      - name: Reuse original source-bound TTF species and indigenous host observations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input/native_WCVP input/TTF/input/native_geometry
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/12185640323/zip" > /tmp/native_WCVP_snapshot.zip
          echo '4a3f55b43998bdc7d72a62e189789d35b6e1589888bfb8fb0ec00046c8956381  /tmp/native_WCVP_snapshot.zip' | sha256sum -c -
          unzip -q /tmp/native_WCVP_snapshot.zip -d input/native_WCVP
          echo 'bf00cbbd49d901da80dcb30e3824c2ae30a427a17ace2b0e935b05f69fd72cd4  input/native_WCVP/results/lgm_wcvp_native_observations_v01/native_supported_observations.csv.gz' | sha256sum -c -
          echo 'a28fba9efa8a9dc79c162336f62c883059c5dddbfabec2861f554d038dd98044  input/TTF/benchmarks/exploratory/lgm_external_reference_v01/host_reference_request_manifest.csv' | sha256sum -c -
          echo '92e19da615ffc2003a90569afd4089eb24871f1fc0df69cc3aface4263b96dc4  input/TTF/provenance/data/historical_host_memory_geometry_642_canonical_v01.tar.xz' | sha256sum -c -
          tar -xJf input/TTF/provenance/data/historical_host_memory_geometry_642_canonical_v01.tar.xz -C input/TTF/input/native_geometry
          echo '037cd8fa1f059fb67c349a465540d3d5fac469b5d14a2a4d2658d74c036c0ae9  input/TTF/input/native_geometry/historical_host_memory_localities_v0.1.csv' | sha256sum -c -
          echo 'ab10a876895cf00817e8ce555665ebb78a0f2ac64323d2e93c213e1857738ba9  input/TTF/input/native_geometry/historical_host_memory_edges_v0.1.csv' | sha256sum -c -
      - name: Recalculate all-641 native qualified insect-host reference pairs
        run: |
          set -euo pipefail
          python -u scripts/qualify_ttf_native_host_reference_v01.py \
            --ttf-root input/TTF \
            --native-observations input/native_WCVP/results/lgm_wcvp_native_observations_v01/native_supported_observations.csv.gz \
            --out results/lgm_native_TTF_paired_reference_v01
          python - <<'PYTHON'
          import csv,json,hashlib,os
          from pathlib import Path
          out=Path('results/lgm_native_TTF_paired_reference_v01')
          q=json.loads((out/'summary.json').read_text())
          v=list(csv.DictReader((out/'all_641_native_reference_eligibility.csv').open()))
          assert q['original_species']==641 and q['original_unfiltered_qualified']==398
          assert q['native_qualified_species']==392 and q['lost_after_native_screen']==6
          assert q['native_reference_point_rows']==111759
          assert q['counts']['paired_all_native_hosts_observed']==372
          assert q['counts']['paired_all_native_hosts_selected']==366
          assert len(v)==641
          assert q['genetic_response_used'] is False and q['historical_plant_range_or_barrier_inferred'] is False
          receipt={'schema':'chocho_lgm_native_screened_641_qualifier_receipt_v01',
                   'run_id':os.environ['GITHUB_RUN_ID'],'commit':os.environ['GITHUB_SHA'],
                   'result_sha256':{x.name:hashlib.sha256(x.read_bytes()).hexdigest()
                        for x in sorted(out.iterdir()) if x.is_file()},
                   'plant_LGM_occupancy_reconstructed':False,'genetic_response_opened':False}
          (out/'receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          print('PASS_392_NATIVE_SCREENED_INSECTS_641_UNCHANGED_SPECIES')
          PYTHON
      - name: Save compact aggregate source-linked audit only
        run: |
          set -euo pipefail
          git fetch origin "${{ github.ref_name }}"
          test "$(git rev-parse FETCH_HEAD)" = "${{ github.sha }}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/lgm_native_TTF_paired_reference_v01/summary.json
          git add results/lgm_native_TTF_paired_reference_v01/all_641_native_reference_eligibility.csv
          git add results/lgm_native_TTF_paired_reference_v01/receipt.json
          git commit -m 'Preserve 641-species WCVP-native-screened host-reference eligibility with source checks'
          git push origin "HEAD:${{ github.ref_name }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chocho-native-host-641-qualified-reference-v01
          path: results/lgm_native_TTF_paired_reference_v01/
          if-no-files-found: warn
          retention-days: 30
