name: v15 Acacia flowering source acquisition
on:
  push:
    branches: [analysis/resource-redundancy-20261011]
    paths: [.github/workflows/chocho-v15-acacia-phenology-source.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Acquire primary DOI full text and independently extract tables
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 100 \
            'https://reference-global.com/download/article/10.1515/sg-2012-0029.pdf' -o /tmp/kato2012.pdf
          head -c 4 /tmp/kato2012.pdf | grep -q '%PDF'
          pdfinfo /tmp/kato2012.pdf > evidence/pdfinfo.txt
          pdftotext -layout /tmp/kato2012.pdf evidence/kato2012_fulltext_layout.txt
          pdftotext -layout -f 4 -l 6 /tmp/kato2012.pdf evidence/kato2012_results_tables_layout.txt
          pdftoppm -f 4 -l 6 -scale-to 1800 -png /tmp/kato2012.pdf evidence/page >/dev/null 2>&1
          printf 'Primary research article: Kato et al., Silvae Genetica 61(6), 228-236, DOI 10.1515/sg-2012-0029\nSource: https://reference-global.com/download/article/10.1515/sg-2012-0029.pdf\n' > evidence/provenance.txt
          sha256sum /tmp/kato2012.pdf > evidence/original_pdf_sha256.txt
          (cd evidence && sha256sum *.txt *.png > SHA256SUMS)
          wc -l evidence/*.txt
          ls -lah evidence
      - uses: actions/upload-artifact@v4
        with:
          name: chocho-v15-acacia-phenology-primary-verified
          path: evidence/
          retention-days: 30
