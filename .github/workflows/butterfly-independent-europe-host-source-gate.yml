name: Independent Europe butterfly host evidence source gate
on:
  push:
    branches: [analysis/resource-homogenization-v01]
    paths:
      - scripts/probe_clarke_european_host_reference.py
      - .github/workflows/butterfly-independent-europe-host-source-gate.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "openpyxl>=3.1,<4"
      - name: Test original DOI table and publication supplement independently
        run: |
          python scripts/probe_clarke_european_host_reference.py \
            --protocol docs/exploratory/CLARKE_EUROPEAN_HOST_EVIDENCE_INDEPENDENT_AUDIT_PROTOCOL_V01.json \
            --output results/clarke2024/source_feasibility_v01.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chocho-clarke-europe-host-source-feasibility-v01
          path: results/clarke2024/source_feasibility_v01.json
          if-no-files-found: warn
          retention-days: 30
