name: chocho three-gate Canary botanical historical first records
on:
  push:
    branches:
      - analysis/island-mainland-host-opportunity-20261102
    paths:
      - scripts/extract_q4_canary_plant_names.R
      - scripts/audit_q4_canary_three_plant_first_years.py
      - .github/workflows/chocho-three-gate-canary-plants-firstyear.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  canary-plant-first-year:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
      - name: Install WKT geometry validated query dependencies
        run: python -m pip install "shapely>=2,<3" "pyproj>=3.6,<4"
      - uses: actions/checkout@v4
        with:
          repository: matildabrown/rWCVPdata
          ref: 65bed76bae9d644ccb6ad200c05f9f5071d89e05
          path: _external/WCVP
      - uses: actions/checkout@v4
        with:
          repository: tdwg/wgsrpd
          ref: 52da7828aba9d461dd133c27b3bd7a4407161f54
          path: _external/WGSRPD
      - name: Resolve exact new CNY plants against WCVP names and rank
        run: |
          Rscript scripts/extract_q4_canary_plant_names.R \
            _external/WCVP results/q4-host-first-year-v02/new_CNY_host_island_pairs.csv \
            work/q4/CNY_three_species_names.csv
      - name: Fetch GBIF first-indexed plant years for 3 response-blind Canary plants
        run: |
          python -m py_compile scripts/audit_q4_canary_three_plant_first_years.py
          python scripts/audit_q4_canary_three_plant_first_years.py \
            --CNY-three-pairs results/q4-host-first-year-v02/new_CNY_host_island_pairs.csv \
            --WCVP-three-names work/q4/CNY_three_species_names.csv \
            --wgsrpd-geojson _external/WGSRPD/geojson/level3.geojson \
            --q4-v02-source-audit results/q4-host-first-year-v02/Q4_CNY_extension_audit.json \
            --out-dir results/q4-canary-plant-firstyear-v02
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chocho-q4-canary-plants-first-record-years
          path: results/q4-canary-plant-firstyear-v02/
          retention-days: 90
          if-no-files-found: warn
      - name: Commit Canary time-source evidence without changing original 500 cases
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/q4-canary-plant-firstyear-v02/
          git diff --cached --quiet && exit 0
          git commit -m 'Check fixed Canary island host first indexed year with taxon and effort controls [skip ci]'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
