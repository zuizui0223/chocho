name: chocho original same-edge 0BP versus 21ka host climate component transitions
on:
  push:
    branches: [ecology/lgm-common-anchors-paired-edges-v06]
    paths:
      - .github/workflows/lgm-common-anchors-paired-edges-v06.yml
      - scripts/audit_common_modern_sampling_edges_v06.py
      - tests/test_common_modern_sampling_edges_v06.py
  workflow_dispatch:
permissions:
  actions: read
  contents: write
concurrency:
  group: chocho-513-original-modern-sampling-pairs-time-common-v06
  cancel-in-progress: false
jobs:
  both-epochs-same-source-modern-edges-only:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/checkout@v4
        with:
          repository: zuizui0223/TTF
          ref: 187e15c6a7b777c119b97b8a43a0d92783ef7c5c
          path: input/TTF
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test physically unavailable modern sampling anchors are not falsely treated as different LGM patches
        run: |
          set -euo pipefail
          python -m pip install 'numpy>=1.26,<3' 'scipy>=1.13,<2' 'pytest>=8,<9'
          python -m pytest -q tests/test_common_modern_sampling_edges_v06.py tests/test_modern_anchor_paleo_host_graph_v05.py
          python -m py_compile scripts/audit_common_modern_sampling_edges_v06.py
          python - <<'PY'
          import json
          x=json.load(open('docs/supporting/lgm_common_modern_anchors_paired_edges_v06_contract.json'))
          assert x['status']=='EXPLORATORY_FIXED_PAIR_DENOMINATOR_BEFORE_PAIRED_CONTACT_EFFECTS'
          assert x['methods']['radii_km']==[50,100,150]
          assert x['methods']['primary_radius']==100
          assert x['methods']['scenarios']==['analog','extrapolated']
          print('PASS_FROZEN_SAME_MODERN_GEOGRAPHIC_PAIRS_WITHOUT_GENOTYPES')
          PY
      - name: Verify all exact source-bound 513 insect host graph results and frozen TTF sampling locality geometry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input/geometry input/pmip
          echo '92e19da615ffc2003a90569afd4089eb24871f1fc0df69cc3aface4263b96dc4  input/TTF/provenance/data/historical_host_memory_geometry_642_canonical_v01.tar.xz' | sha256sum -c -
          tar -xJf input/TTF/provenance/data/historical_host_memory_geometry_642_canonical_v01.tar.xz -C input/geometry
          echo '037cd8fa1f059fb67c349a465540d3d5fac469b5d14a2a4d2658d74c036c0ae9  input/geometry/historical_host_memory_localities_v0.1.csv' | sha256sum -c -
          echo 'ab10a876895cf00817e8ce555665ebb78a0f2ac64323d2e93c213e1857738ba9  input/geometry/historical_host_memory_edges_v0.1.csv' | sha256sum -c -
          echo 'a28fba9efa8a9dc79c162336f62c883059c5dddbfabec2861f554d038dd98044  input/TTF/benchmarks/exploratory/lgm_external_reference_v01/host_reference_request_manifest.csv' | sha256sum -c -
          echo '1666e33b69297d692deca5054597564390004110266b0cee0934faa7acbb55b8  results/lgm_513_insects_native_host_potential_components_v02/all_641_insect_potential_21ka_host_components_v02.csv' | sha256sum -c -
          echo '169b9da084d0043abba5c89f008137d6867b554dfb7c7dbe283b750142d220af  results/lgm_416_native_05deg_potential_graph_v02/plant_potential_climate_graph_masks_primary_v02.npz' | sha256sum -c -
          echo '67c0d99852b8b8896559dbc0da07504bcb07a6ad7c017afa0eb86e31d40acc2a  results/lgm_416_native_nonanalog_source_recovery_v03/plant_potential_climate_masks_extrapolation_included_v03.npz' | sha256sum -c -
          echo '6272f2ac132ef3713356a4566b8b21007343931e0e05cd967150343d4b6194b7  results/lgm_513_modern_anchor_host_contact_v05/all_513_modern_anchor_host_climate_contact_v05.csv' | sha256sum -c -
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/12239910484/zip" > /tmp/pmip05.zip
          echo '706d482c5e139675951a170e538ceee11249281c77e38da99f37f2b3b7524947  /tmp/pmip05.zip' | sha256sum -c -
          unzip -q /tmp/pmip05.zip -d input/pmip
          echo 'd8283a8ef177b56fd4554dc5bcc115e62adc5556e445bf5b7492c2c636a2a9db  input/pmip/coarse_masks_finite_05deg.npz' | sha256sum -c -
      - name: Calculate exact common-original-edge host patch split versus merge without changing endpoints
        run: |
          set -euo pipefail
          out=results/lgm_513_original_modern_paired_edges_v06
          mkdir -p "$out"
          python -u scripts/audit_common_modern_sampling_edges_v06.py \
            --localities input/geometry/historical_host_memory_localities_v0.1.csv \
            --edges input/geometry/historical_host_memory_edges_v0.1.csv \
            --manifest input/TTF/benchmarks/exploratory/lgm_external_reference_v01/host_reference_request_manifest.csv \
            --analog results/lgm_416_native_05deg_potential_graph_v02/plant_potential_climate_graph_masks_primary_v02.npz \
            --extrapolated results/lgm_416_native_nonanalog_source_recovery_v03/plant_potential_climate_masks_extrapolation_included_v03.npz \
            --terrain input/pmip/coarse_masks_finite_05deg.npz \
            --original513 results/lgm_513_insects_native_host_potential_components_v02/all_641_insect_potential_21ka_host_components_v02.csv \
            --prior-v05 results/lgm_513_modern_anchor_host_contact_v05/all_513_modern_anchor_host_climate_contact_v05.csv \
            --out "$out"
          python - <<'PY'
          import csv,json,hashlib,os
          from pathlib import Path
          p=Path('results/lgm_513_original_modern_paired_edges_v06')
          x=json.loads((p/'summary.json').read_text())
          with (p/'all_513_original_edges_paired_contact_v06.csv').open(newline='') as f:rows=list(csv.DictReader(f))
          assert x['status']=='EXPLORATORY_PAIRED_MODERN_ANCHOR_POTENTIAL_PATCHES_NOT_REAL_GLACIAL_GENETIC_CONNECTIVITY'
          assert x['source_complete_host_insects']==513
          assert x['source_shared_hostsets']==349
          assert x['source_v05_per_epoch_rows_exactly_replayed']==6156
          assert len(rows)==x['source_513x2x3_pair_records']==3078
          assert len({r['insect_species'] for r in rows})==513
          assert len(x['matched_edge_comparisons'])==6
          for r in rows:
              assert int(r['all_original_edges_n'])==(
                  int(r['edge_contactable_in_both_eras_n'])+
                  int(r['edge_contactable_only_0BP_n'])+
                  int(r['edge_contactable_only_21ka_n'])+
                  int(r['edge_contactable_neither_n']))
              assert int(r['edge_contactable_in_both_eras_n'])==sum(int(r[q]) for q in (
                 'same_to_same','same_to_different','different_to_same','different_to_different'))
          receipt={'schema':'chocho_513_modern_sampling_edges_bothepochs_matched_v06_receipt',
             'run_id':os.environ['GITHUB_RUN_ID'],'code_commit':os.environ['GITHUB_SHA'],
             'source_6156_previous_records_reproduced':True,
             'output_sha256':{f.name:hashlib.sha256(f.read_bytes()).hexdigest()
                      for f in sorted(p.iterdir()) if f.is_file()},
             'no_ancient_species_occupancy_or_genetic_response_used':True}
          (p/'receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          print(json.dumps(x,sort_keys=True))
          PY
      - name: Commit source-bound same-edge results on exploratory branch only
        run: |
          set -euo pipefail
          git fetch origin "${{ github.ref_name }}"
          test "$(git rev-parse FETCH_HEAD)" = "${{ github.sha }}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/lgm_513_original_modern_paired_edges_v06/
          git commit -m 'Archive exact modern insect sampling pair host-patch split/merge under 0BP and 21ka climates'
          git push origin "HEAD:${{ github.ref_name }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chocho-513-original-sampling-pairs-both-epochs-hostpatch-v06
          path: results/lgm_513_original_modern_paired_edges_v06/
          retention-days: 30
          if-no-files-found: warn
