name: chocho ESA WorldCover 2021 port nonport urban audit

on:
  pull_request:
    paths:
      - "scripts/exploratory_port_worldcover_urban.py"
      - "tests/test_exploratory_port_worldcover_urban.py"
      - ".github/workflows/chocho-port-worldcover-urban.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  direct-esa-cog-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native GeoTIFF readers
        run: python -m pip install --quiet rasterio numpy pytest
      - name: Validate tile boundaries and raw pixel interpretation offline
        run: python -m pytest -q tests/test_exploratory_port_worldcover_urban.py
      - name: Retrieve exactly matched WPI geometry and GBIF plant source receipts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/urban27
          gh run download 41402076182 --name strict-disjoint-coastal-sites-wpi79 --dir /tmp/urban27 --repo zuizui0223/chocho
          gh run download 41407370295 --name allflora-N-host-vs-other-WPI78 --dir /tmp/urban27 --repo zuizui0223/chocho
          test -s /tmp/urban27/strict_disjoint_wpi79_sites.json
          test -s /tmp/urban27/allplant_N_background_analysis.json
      - name: Sample original land-cover class pixels 500m around all six European islands
        run: |
          python -u scripts/exploratory_port_worldcover_urban.py \
            --geometry /tmp/urban27/strict_disjoint_wpi79_sites.json \
            --allflora /tmp/urban27/allplant_N_background_analysis.json \
            --cohort 27 --radius-m 500 \
            --output /tmp/urban27/strict_worldcover_2021_27pair_urban.json
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path('/tmp/urban27/strict_worldcover_2021_27pair_urban.json').read_text())
          assert (j["n_target_pairs"],j["n_islands_target"])==(27,6)
          assert len(j["site_buffers"])==54
          assert j["summary"]["pairs_with_both_sites_valid"]<=27
          print("ESA_WORLDCOVER_27PORTS_6ISLANDS",j["summary"])
          PY
      - name: Save exact classified land-cover exposure and validity
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: esa-worldcover-v200-2021-wpi27-urban-pilot
          path: /tmp/urban27/strict_worldcover_2021_27pair_urban.json
          if-no-files-found: warn
          retention-days: 30
