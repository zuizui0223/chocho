name: "Render integrated island-port butterfly figures 2-4 v0.2"
on:
  push:
    branches: [analysis/butterfly-trait-public51-20261109]
    paths:
      - scripts/render_island_port_butterfly_v02_figures.py
      - .github/workflows/chocho-render-island-port-butterfly-v02.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  source-locked-butterfly-figures:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research rendering tools
        run: python -m pip install --disable-pip-version-check numpy scipy matplotlib
      - name: Compute reproducible source-exact butterfly/port sample joint checks and render three final-size sources
        run: |
          python -m py_compile scripts/render_island_port_butterfly_v02_figures.py
          python scripts/render_island_port_butterfly_v02_figures.py --out-dir figures/integrated_island_port_butterfly_v02
      - name: Archive same-run images and SHA-256 scientific receipts
        uses: actions/upload-artifact@v4
        with:
          name: butterfly-island-port-integrated-Fig2-Fig3-Fig4-v02
          path: figures/integrated_island_port_butterfly_v02/
          if-no-files-found: error
          retention-days: 60
      - name: Commit public derived figure assets without changing underlying GEB/JBI source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add figures/integrated_island_port_butterfly_v02/
          if git diff --cached --quiet; then echo "Current figures already saved"; exit 0; fi
          git commit -m "Render butterflies-first island port integrated main Figures 2–4 from frozen source receipts [skip ci]"
          for attempt in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase FETCH_HEAD || exit 1
            if git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"; then exit 0; fi
            sleep 2
          done
          exit 1
