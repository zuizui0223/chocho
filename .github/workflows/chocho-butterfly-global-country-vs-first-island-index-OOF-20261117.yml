name: chocho pre2011 global butterfly country breadth independent OOF later island first-index comparison
on:
  push:
    branches: [analysis/butterfly-trait-public51-20261109]
    paths:
      - scripts/audit_butterfly_global_breadth_vs_post2010_island_firstindex_OOF_20261117.py
      - .github/workflows/chocho-butterfly-global-country-vs-first-island-index-OOF-20261117.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  globally-recorded-butterfly-breadth-vs-later-index:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source numerical dependencies
        run: python -m pip install --disable-pip-version-check 'numpy>=1.26,<3' 'pandas>=2,<3' 'scipy>=1.11,<2' 'scikit-learn>=1.5,<2'
      - name: Source-verified historical GBIF country breadth added to butterfly 51-landmass GBIF first-index prediction
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          set -euo pipefail
          python -m py_compile scripts/audit_butterfly_global_breadth_vs_post2010_island_firstindex_OOF_20261117.py
          python scripts/audit_butterfly_global_breadth_vs_post2010_island_firstindex_OOF_20261117.py \
            --out-dir _global_country_butterfly_index_OOF
      - name: Verify fair same-outcome source controls and no artificial source species absence
        run: |
          python - <<'PY'
          import json,math
          from pathlib import Path
          p=Path('_global_country_butterfly_index_OOF/GLOBAL_COUNTRY_BREADTH_AND_HOST_RESOURCE_FIRSTINDEX_OOF_20261117.json')
          x=json.loads(p.read_text())
          assert x['n_islands']==51 and x['n_butterflies']==222
          assert x['n_excluded_butterflies_fewer_than30_country_records']==3
          assert x['n_future_first_index_events']>=295 and x['n_risk_cells']>=10500
          assert len(x['heldout_scores'])==3
          for v in x['heldout_scores'].values():
              assert len(v['scores'])==4
              assert all(math.isfinite(z['OOF_Brier']) and z['OOF_Brier']>0 for z in v['scores'].values())
              assert len(v['incremental_over_base'])==3
          assert any('CONTEMPORARY WCVP 2024' in s for s in x['limits'])
          print('ORIGINAL_225_GLOBAL_BUTTERFLY_PRE2011_COUNTRY_BREADTH_VS_ISLAND_INDEX_TRANSFER_PASS')
          PY
      - name: Publish source-verified OOF aggregate scores to Draft GEB branch
        run: |
          set -euo pipefail
          mkdir -p results/butterfly_global_GBIF_country_breadth_20261117/
          cp _global_country_butterfly_index_OOF/* results/butterfly_global_GBIF_country_breadth_20261117/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/butterfly_global_GBIF_country_breadth_20261117/
          git diff --cached --quiet && exit 0
          git commit -m 'Archive butterfly country breadth and subsequent first-index OOF source geography sensitivity [skip ci]'
          git pull --rebase origin analysis/butterfly-trait-public51-20261109
          git push origin HEAD:refs/heads/analysis/butterfly-trait-public51-20261109
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chocho-butterfly-GBIF-country-breadth-to-2022-island-index-source-OOF
          path: _global_country_butterfly_index_OOF/
          retention-days: 90
          if-no-files-found: warn
