name: exploratory port host nutrient vs worldwide GBIF prevalence
on:
  pull_request:
    paths:
      - "scripts/exploratory_port_nutrient_global_prevalence.py"
      - "tests/test_exploratory_port_nutrient_global_prevalence.py"
      - ".github/workflows/chocho-port-nutrient-global-prevalence.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  worldwide-observation-control:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Offline ecological estimator tests
        run: |
          python -m pip install --quiet pytest
          python -m pytest -q tests/test_exploratory_port_nutrient_global_prevalence.py
      - name: Retrieve externally pinned German Ellenberg N source
        run: |
          curl -fLsS --retry 3 \
            https://raw.githubusercontent.com/bathyscapher/EVA/73b323983702a74cb9b6867bcebe00a307ea6566/EllenbergsValuesAutomaton/Ellenberg_VascularPlants.csv \
            -o /tmp/ellenberg_germany.tsv
          test -s /tmp/ellenberg_germany.tsv
      - name: Compare port-indexed N vs global plant record countries and observations
        run: |
          python -u scripts/exploratory_port_nutrient_global_prevalence.py \
            --ellenberg /tmp/ellenberg_germany.tsv \
            --bootstrap 2999 \
            --out /tmp/port_n_global_prevalence_receipt.json
          python - <<'PY'
          import json, math
          from pathlib import Path
          d=json.loads(Path('/tmp/port_n_global_prevalence_receipt.json').read_text())
          counts=d['species_matches_from_pinned_German_ellenberg']
          assert counts['eligible_N_host_species']==183
          assert counts['exact_GBIF_matched_species']>=170
          assert counts['global_observation_supported']>=160
          cor=d['correlations']
          assert all(math.isfinite(x) and -1<=x<=1 for x in cor.values()),cor
          assert cor['raw']>0
          assert len(d['species_record_inputs'])==counts['global_observation_supported']
          print('NUTRIENT_GLOBAL_PREVALENCE_SOURCE_AND_MODEL_PASS',cor,counts)
          PY
      - name: Archive indexed global plant prevalence and source audit
        uses: actions/upload-artifact@v4
        with:
          name: port-nutrient-global-gbif-prevalence-20261102
          path: /tmp/port_n_global_prevalence_receipt.json
          retention-days: 30
