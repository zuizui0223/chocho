name: Kyoto two butterfly source data temporal support audit
on:
  workflow_dispatch:
  push:
    branches: [exploration/realized-host-window-v01]
    paths:
      - "docs/exploratory/KYOTO_TEMPORAL_REGROWTH_COMPETITION_PROTOCOL_V01.json"
      - "scripts/audit_kyoto_butterfly_regrowth_source.py"
      - "tests/test_kyoto_butterfly_regrowth_source.py"
      - ".github/workflows/kyoto-butterfly-regrowth-source-gate.yml"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check source row and variable invariants
        run: |
          python -m pip install pytest==8.3.4
          python -m pytest -q tests/test_kyoto_butterfly_regrowth_source.py
      - name: Inspect originally published cage-level and plant-level source tables
        run: |
          python scripts/audit_kyoto_butterfly_regrowth_source.py --receipt results/kyoto_butterfly_regrowth_original_source_v01.json
      - uses: actions/upload-artifact@v4
        with:
          name: kyoto-butterfly-original-source-inventory
          path: results/kyoto_butterfly_regrowth_original_source_v01.json
          retention-days: 30
