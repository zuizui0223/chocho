name: chocho directional Atlantic source flow 2005 predeclared pilot

on:
  push:
    branches: [analysis/atlantic-legacy-oscar-directed-2005-pilot-20261117]
    paths:
      - scripts/analyze_atlantic_noaa_legacy_2005_current_alignment_20261117.py
      - .github/workflows/chocho-atlantic-oscar-2005-directional-alignment.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  test-actual-source-velocities:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          run-id: 43895414730
          github-token: ${{ github.token }}
          name: chocho-original22-TDWG3-geomatched-WPI-coast-points
          path: _src/original22_geom
      - name: Test source signatures and three fixed Atlantic inter-island currents
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/analyze_atlantic_noaa_legacy_2005_current_alignment_20261117.py
          python3 scripts/analyze_atlantic_noaa_legacy_2005_current_alignment_20261117.py \
            --strict-source-ports _src/original22_geom/source22_pinned_WPI_exact_polygon_port_points.csv \
            --out-dir results/oscar_atlantic_2005_aligned_20261117
      - name: Verify every result is source-only and not a seed transport outcome
        run: |
          python3 - <<'PY'
          import json,math
          from pathlib import Path
          p=Path("results/oscar_atlantic_2005_aligned_20261117/corridor_current_alignment_2005.json")
          d=json.loads(p.read_text())
          assert d["status"]=="NOAA_OSCAR_LEGACY_DIRECTIONAL_FLOW_ALIGNMENT_ONLY"
          assert d["strict_source_geometry_run"]==43895414730
          assert len(d["routes"])==3 and len(d["anchors"])==3
          assert d["total_source_queries"]==54
          assert len(d["independent_source_sample_replay"])>1
          assert all(0<=r["finite_cells"]<=18 for r in d["routes"])
          assert all(r["inference"]=="ALONG_CORRIDOR_OCEAN_CURRENT_ALIGNMENT_NOT_SEED_TRANSFER_OR_BUTTERFLY_ARRIVAL" for r in d["routes"])
          print("ATLANTIC_OSCAR_DIRECTIONAL_CURRENT_SOURCE_GATE",json.dumps({
            "queries":d["total_source_queries"],"finite":d["total_source_finite"],
            "available_time_slices":[r["complete_time_slices"] for r in d["routes"]]}))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chocho-original-Atlantic-NOAA-2005-directed-flow-source-pilot
          path: results/oscar_atlantic_2005_aligned_20261117/
          if-no-files-found: warn
          retention-days: 90
