name: chocho Q2 test colonial metropole host-source alignment
on:
  push:
    branches:
      - analysis/island-mainland-host-opportunity-20261102
    paths:
      - .github/workflows/chocho-colonial-host-history-alignment-q2.yml
      - scripts/compare_colonial_host_source_q2.py
      - scripts/test_empire_duration_host_source_q2.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  compare-colonial-source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test actual assigned former imperial metropole versus alternative source homelands
        run: |
          python -m py_compile scripts/compare_colonial_host_source_q2.py scripts/test_empire_duration_host_source_q2.py
          python scripts/compare_colonial_host_source_q2.py \
            --host-source-islands results/colonial-host-native-source-q2/island_source_summary.csv \
            --host-source-audit results/colonial-host-native-source-q2/host_source_audit.json \
            --empire-islands results/colonial-history-island-q2/island_lenzner_empire_crosswalk.csv \
            --empire-overlay-audit results/colonial-history-island-q2/empire_geographic_overlay_audit.json \
            --area-metrics results/island-mainland-resource-area/region_area_metrics.csv \
            --output-dir results/colonial-history-source-q2
      - name: Test full four-empire historical years × larval-host donor-source support
        run: |
          python scripts/test_empire_duration_host_source_q2.py \
            --host-source-islands results/colonial-host-native-source-q2/island_source_summary.csv \
            --host-source-audit results/colonial-host-native-source-q2/host_source_audit.json \
            --empire-islands results/colonial-history-island-q2/island_lenzner_empire_crosswalk.csv \
            --empire-overlay-audit results/colonial-history-island-q2/empire_geographic_overlay_audit.json \
            --area-metrics results/island-mainland-resource-area/region_area_metrics.csv \
            --output-dir results/colonial-history-source-q2
      - name: Preserve source-comparison results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chocho-q2-colonial-historical-source-alignment
          path: results/colonial-history-source-q2/
          if-no-files-found: warn
          retention-days: 90
      - name: Save audited historical-source comparison
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/colonial-history-source-q2/
          git diff --cached --quiet && exit 0
          git commit -m 'Measure historical colonizer native-host alignment with exact permutation null [skip ci]'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
