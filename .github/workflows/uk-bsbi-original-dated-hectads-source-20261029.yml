name: Verify original dated BSBI 10km Plant Atlas source for UK butterfly historical host hindcast
on:
  push:
    branches: [analysis/uk-bsbi-dated-host-join-20261029]
    paths:
      - scripts/audit_bsbi_historical_hectad_source_20261029.py
      - tests/test_bsbi_historical_hectad_source_20261029.py
      - .github/workflows/uk-bsbi-original-dated-hectads-source-20261029.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-plant-atlas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify source-independent schema and never infer plant absence
        run: |
          python -m pip install 'pytest>=8,<10'
          python -m pytest -q tests/test_bsbi_historical_hectad_source_20261029.py
      - name: Download publisher exact 10km map period archive, do not redistribute raw data
        run: |
          mkdir -p _bsbi/raw
          curl -fLsS --retry 2 --retry-delay 3 --connect-timeout 20 --max-time 150 \
            'https://zenodo.org/records/10998003/files/PA2020_10by10kmSquareData.zip?download=1' \
            -o _bsbi/raw/PA2020_10by10kmSquareData.zip
          test "$(stat -c%s _bsbi/raw/PA2020_10by10kmSquareData.zip)" -lt 18000000
      - name: Verify original publisher MD5 and inspect only date-class/geo/taxon column metadata
        run: |
          python scripts/audit_bsbi_historical_hectad_source_20261029.py \
            --original-zip _bsbi/raw/PA2020_10by10kmSquareData.zip \
            --output _bsbi/bsbi_original_historical_host_source_schema_20261029.json
      - name: Publish only original file hashes and field metadata, not plant/hectad rows
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chocho-BSBI-original-historical-hectad-source-schema-20261029
          path: _bsbi/bsbi_original_historical_host_source_schema_20261029.json
          retention-days: 30
          if-no-files-found: warn
