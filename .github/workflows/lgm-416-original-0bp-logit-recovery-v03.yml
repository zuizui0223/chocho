name: chocho restore 416 frozen native-host logits from 0BP source and audit 21ka extrapolation
on:
  push:
    branches: [ecology/lgm-nonanalog-connectivity-sensitivity-v03]
    paths:
      - .github/workflows/lgm-416-original-0bp-logit-recovery-v03.yml
      - scripts/reconstruct_frozen_416_logistic_and_extrapolate_v03.py
      - tests/test_frozen_0bp_logit_recovery_v03.py
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: chocho-frozen-416-modern-model-logit-inversion-v03
  cancel-in-progress: false
jobs:
  restore-from-archived-present-scores-not-unstable-resolver:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit check float32 0BP logistic function reconstruction and 21ka holdout
        run: |
          set -euo pipefail
          python -m pip install 'numpy>=1.26,<3' 'scipy>=1.13,<2' 'scikit-learn>=1.6,<1.9' 'rasterio>=1.4,<2' 'pytest>=8,<9'
          python -m pytest -q tests/test_frozen_0bp_logit_recovery_v03.py tests/test_pmip4_potential_habitat_components_v02.py
          python -m py_compile scripts/reconstruct_frozen_416_logistic_and_extrapolate_v03.py
      - name: Restore exact original 416 source scores, source 6373 reference climates and PMIP4 half degree mask
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input/source416 input/support input/pmip05 input/chelsa
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/12234343435/zip" > /tmp/original416.zip
          echo '8ac33d6f1c98b09fc057c73eaa3fb60278af89780b870864b22b44a9b494ecad  /tmp/original416.zip' | sha256sum -c -
          unzip -q /tmp/original416.zip -d input/source416
          echo '8559ec905cddd1a0b9579530551c9980ab3519daa92902df150a04687bf81159  input/source416/native_host_climate_surface_scores.npz' | sha256sum -c -
          echo '153189ad188a8647c49bb5401b20786098386979ca1f00f1cbc67bf55a0ad733  input/source416/all_518_native_host_hindcast.csv' | sha256sum -c -
          echo '169b9da084d0043abba5c89f008137d6867b554dfb7c7dbe283b750142d220af  results/lgm_416_native_05deg_potential_graph_v02/plant_potential_climate_graph_masks_primary_v02.npz' | sha256sum -c -
          gh api "/repos/zuizui0223/TTF/actions/artifacts/11495066386/zip" > /tmp/support.zip
          unzip -q /tmp/support.zip -d input/support
          echo 'd0fc12f635ec56a442dd37dec06cf3aa06684a00b14f1bb1f2db2f6fe3c4a21f  input/support/wgsrpd3_support_points_v0.1.csv' | sha256sum -c -
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/12239910484/zip" > /tmp/pmip05.zip
          echo '706d482c5e139675951a170e538ceee11249281c77e38da99f37f2b3b7524947  /tmp/pmip05.zip' | sha256sum -c -
          unzip -q /tmp/pmip05.zip -d input/pmip05
          echo 'd8283a8ef177b56fd4554dc5bcc115e62adc5556e445bf5b7492c2c636a2a9db  input/pmip05/coarse_masks_finite_05deg.npz' | sha256sum -c -
      - name: Restore exact original 0BP and 21ka CHELSA variables
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "/repos/zuizui0223/TTF/actions/artifacts/10791389409/zip" > /tmp/chelsa.zip
          echo '0a797c609d26a185ba08d209a71203a584fa60f1045c4a8c335934372cee30b2  /tmp/chelsa.zip' | sha256sum -c -
          unzip -q /tmp/chelsa.zip -d input/chelsa
          rm /tmp/chelsa.zip
          echo '7d82833996006fc1e99b86acb4ea7e80cde29c7f500df739ef48cb9ce145d450  input/chelsa/manifest.json' | sha256sum -c -
          for v in bio01 bio07 bio12 bio15; do
            for t in -190 20; do
              test -s "input/chelsa/historical/CHELSA_TraCE21K_${v}_${t}_V1.0.tif"
            done
          done
      - name: Recover 416 source plant logits using 0BP predictions and verify 21ka independently
        run: |
          set -euo pipefail
          python -u scripts/reconstruct_frozen_416_logistic_and_extrapolate_v03.py \
            --source-models input/source416/all_518_native_host_hindcast.csv \
            --source-scores input/source416/native_host_climate_surface_scores.npz \
            --source-primary-mask results/lgm_416_native_05deg_potential_graph_v02/plant_potential_climate_graph_masks_primary_v02.npz \
            --global-support input/support/wgsrpd3_support_points_v0.1.csv \
            --pmip05 input/pmip05/coarse_masks_finite_05deg.npz \
            --chelsa input/chelsa/historical \
            --out results/lgm_416_native_nonanalog_source_recovery_v03
          python - <<'PYTHON'
          import hashlib,json,os
          from pathlib import Path
          import numpy as np
          d=Path('results/lgm_416_native_nonanalog_source_recovery_v03')
          q=json.loads((d/'summary.json').read_text())
          assert q['modeled_plant_taxa']==416
          assert q['status']=='SOURCE_VERIFIED_EXTRAPOLATION_UNCERTAINTY_NOT_OCCUPIED_LGM_HABITAT'
          assert q['source_21ka_predictions_used_only_for_validation'] is True
          assert q['source_replay_max_absolute_error_0bp']<=1e-5
          assert q['source_holdout_max_absolute_error_21ka']<=1e-5
          assert q['original_main_plant_area_decrease']==289
          assert q['original_416_main_masks_inherited_byte_for_byte'] is True
          z=np.load(d/'plant_potential_climate_masks_extrapolation_included_v03.npz',allow_pickle=False)
          original=np.load('results/lgm_416_native_05deg_potential_graph_v02/plant_potential_climate_graph_masks_primary_v02.npz',allow_pickle=False)
          assert z['mask_0BP'].shape==z['mask_21ka'].shape==(416,32400)
          assert np.array_equal(z['plant_wcvp_ids'],original['plant_wcvp_ids'])
          for epoch in ['0BP','21ka']:
              # Extrapolating new environmental cells cannot erase an original supported site.
              o=np.unpackbits(original['mask_'+epoch],axis=1).astype(bool)
              n=np.unpackbits(z['mask_'+epoch],axis=1).astype(bool)
              assert np.all(o<=n)
          receipt={'schema':'chocho_frozen_0BP_model_to_21ka_holdout_reproduction_v03',
              'run_id':os.environ['GITHUB_RUN_ID'],'sha':os.environ['GITHUB_SHA'],
              'sha256':{p.name:hashlib.sha256(p.read_bytes()).hexdigest()
                        for p in sorted(d.iterdir()) if p.is_file()},
              'source_present_predictions_are_the_only_coefficient_inputs':True,
              'source_21ka_prediction_used_for_validation_only':True,
              'genetic_response_or_ancient_plant_occupancy_used':False}
          (d/'receipt.json').write_text(json.dumps(receipt,sort_keys=True,indent=2)+'\n')
          print(json.dumps(q,sort_keys=True))
          PYTHON
      - name: Commit compact sensitivity products to the isolated PR with source guard
        run: |
          set -euo pipefail
          git fetch origin "${{ github.ref_name }}"
          test "$(git rev-parse FETCH_HEAD)" = "${{ github.sha }}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/lgm_416_native_nonanalog_source_recovery_v03/
          git commit -m 'Archive 0BP-only restored 416 host logistic models and 21ka nonanalog climate sensitivity'
          git push origin "HEAD:${{ github.ref_name }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chocho-frozen-0BP416-model-source-logits-nonanalog-v03
          path: results/lgm_416_native_nonanalog_source_recovery_v03/
          retention-days: 30
          if-no-files-found: warn
