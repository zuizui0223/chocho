name: chocho PMIP4 0.5-degree global paleo-land CHELSA source coverage preflight
on:
  push:
    branches: [ecology/lgm-pmip4-2d-climatic-connectivity-v02]
    paths:
      - .github/workflows/lgm-pmip4-05deg-climate-coverage-v02.yml
      - scripts/audit_pmip4_icefree_05deg_climate_coverage_v02.py
      - tests/test_pmip4_05deg_climate_source_v02.py
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: chocho-pmip4-05deg-source-coverage-v02
  cancel-in-progress: false
jobs:
  no-biology-source-only-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify source-only 0.5-degree grid geometry and missing climate classification
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'numpy>=1.26,<3' 'scipy>=1.13,<2' 'rasterio>=1.4,<2' 'pytest>=8,<9'
          python -m pytest -q tests/test_pmip4_05deg_climate_source_v02.py
          python -m py_compile scripts/audit_pmip4_icefree_05deg_climate_coverage_v02.py
          python - <<'PYTHON'
          import json
          from pathlib import Path
          q=json.loads(Path('docs/supporting/lgm_pmip4_2d_climate_connectivity_v02_contract.json').read_text())
          assert q['status']=='EXPLORATORY_GRAPH_DESIGN_FROZEN_BEFORE_NEW_05DEG_CONNECTIVITY_OUTPUT'
          assert q['grid']['cells']==259200
          assert q['model']['original_eligible_insects']==513
          assert q['grid']['continuous_globe_longitude_wrap'] is True
          print('PASS_SOURCE_ONLY_05DEG_PRELGM_GEOGRAPHY_CONTRACT')
          PYTHON
      - name: Restore only frozen physical and climate SOURCE rasters
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input/pmip4 input/chelsa
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/12234969425/zip" > /tmp/original-pmip4-0-21ka.zip
          echo 'ffe0423b78688dbab54d460125963bfc652f24ca069d8c3d691c33a79ad47e65  /tmp/original-pmip4-0-21ka.zip' | sha256sum -c -
          unzip -q /tmp/original-pmip4-0-21ka.zip -d input/pmip4
          echo '3decf87e11a2d2afe65a7358d904214aea2e5c59ec92ab8227f36070beb98e94  input/pmip4/I6_C.VM5a_10min.21.nc' | sha256sum -c -
          echo '518bdfa9c918cb17090a4380c494572ffd011a2a5b547dab57327faf7ade415a  input/pmip4/I6_C.VM5a_10min.0.nc' | sha256sum -c -
          gh api "/repos/zuizui0223/TTF/actions/artifacts/10791389409/zip" > /tmp/original-chelsa.zip
          echo '0a797c609d26a185ba08d209a71203a584fa60f1045c4a8c335934372cee30b2  /tmp/original-chelsa.zip' | sha256sum -c -
          unzip -q /tmp/original-chelsa.zip -d input/chelsa
          rm /tmp/original-chelsa.zip
          echo '7d82833996006fc1e99b86acb4ea7e80cde29c7f500df739ef48cb9ce145d450  input/chelsa/manifest.json' | sha256sum -c -
          df -h .
      - name: Audit 21ka climate data coverage of newly exposed shelf and persistent PMIP4 ice-free land
        run: |
          set -euo pipefail
          python -u scripts/audit_pmip4_icefree_05deg_climate_coverage_v02.py \
            --pmip0 input/pmip4/I6_C.VM5a_10min.0.nc \
            --pmip21 input/pmip4/I6_C.VM5a_10min.21.nc \
            --chelsa input/chelsa/historical \
            --out results/lgm_pmip4_05deg_climate_source_coverage_v02
          python - <<'PYTHON'
          import json,hashlib,os
          from pathlib import Path
          d=Path('results/lgm_pmip4_05deg_climate_source_coverage_v02')
          q=json.loads((d/'summary.json').read_text())
          assert q['status']=='SOURCE_FIRST_PALEOLAND_CLIMATE_COVERAGE_NOT_SPECIES_CONNECTIVITY'
          assert q['global_regular_cells']==259200
          assert set(q['cases'])=={'any_icefree_subcell','majority_icefree_subcells','all_nine_icefree_subcells'}
          for mode,x in q['cases'].items():
              a=x['source']['newly_ice_free_land_at21ka_05deg_cells']
              c=x['coverage']
              assert c['21ka_climate_available_at_newly_icefree_land']+c['21ka_climate_missing_at_newly_icefree_land']==a
              assert c['21ka_climate_available_at_retained_icefree_land']+c['21ka_climate_missing_at_retained_icefree_land']>=0
          assert q['no_plant_models_or_genetics_used'] is True
          rec={'schema':'chocho_pmip4_05deg_climate_source_v02_receipt','run_id':os.environ['GITHUB_RUN_ID'],
               'sha':os.environ['GITHUB_SHA'],'sha256':{f.name:hashlib.sha256(f.read_bytes()).hexdigest()
                  for f in sorted(d.iterdir()) if f.is_file()},'no_ancient_plant_occupancy_claimed':True}
          (d/'receipt.json').write_text(json.dumps(rec,indent=2,sort_keys=True)+'\n')
          print('PASS_UNBIASED_SOURCE_FIRST_PMIP4_CHELSA_COVERAGE_WITHOUT_BIOLOGY')
          PYTHON
      - name: Save source compatibility audit only
        run: |
          set -euo pipefail
          git fetch origin "${{ github.ref_name }}"
          test "$(git rev-parse FETCH_HEAD)" = "${{ github.sha }}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/lgm_pmip4_05deg_climate_source_coverage_v02/
          git commit -m 'Freeze 21ka and 0ka PMIP4 land versus CHELSA missing-climate coverage on 0.5-degree grid'
          git push origin "HEAD:${{ github.ref_name }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chocho-pmip4-CHELSA-05deg-coverage-v02
          path: results/lgm_pmip4_05deg_climate_source_coverage_v02/
          retention-days: 30
          if-no-files-found: warn
