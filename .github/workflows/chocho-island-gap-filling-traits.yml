name: Species-paired island native-host gap-filling trait audit (239 butterflies)
on:
  push:
    branches: [analysis/port-host-ocean-interaction-20261114]
    paths:
      - scripts/audit_island_host_filling_species_traits_20261115.py
      - .github/workflows/chocho-island-gap-filling-traits.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-locked-239-butterfly-replication:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run frozen species-island/mainland gap decomposition and trait strata
        run: |
          python -m py_compile scripts/audit_island_host_filling_species_traits_20261115.py
          python scripts/audit_island_host_filling_species_traits_20261115.py \
            --out-dir results/island_host_filling_heterogeneity_20261115
      - name: Independent source-summary denominator and ecological-inference audit
        run: |
          python - <<'PY'
          from pathlib import Path
          import csv, json, math
          d=json.loads(Path("results/island_host_filling_heterogeneity_20261115/summary.json").read_text())
          with Path("results/island_host_filling_heterogeneity_20261115/paired_species_contrasts.csv").open() as f:
            rows=list(csv.DictReader(f))
          assert len(rows)==239 and len({x["species"] for x in rows})==239
          m=d["main_equal_butterfly_weight"]
          assert (m["island_fill_advantaged"],m["mainland_fill_advantaged"],m["exact_ties"])==(65,141,33)
          assert abs(m["species_equal_island_minus_mainland_fill_pp"]+5.439870667503801)<1e-10
          assert d["taxonomy_adequate_only"]["n_species"]==215
          assert sum(d["host_family_breadth"][x]["n_species"] for x in d["host_family_breadth"])==239
          assert abs(d["counterfactual_same_species_mainland_fill_applied_to_island_gap_pool"]["actual_island_added_butterfly_region_cells"]-5741)<1e-10
          assert d["original_area_biogeography_matched"]["matched_blocks"]==15
          assert all(x["island_gap_cells"]!="0" for x in rows)
          print("239 PAIRED SOURCE CONTRASTS REPRODUCED; NO REALIZED COLONISATION CLAIMS")
          PY
      - name: Archive original CSV contrasts and source hash locked summaries
        uses: actions/upload-artifact@v4
        with:
          name: chocho-20261115-island-host-filling-species-traits
          path: results/island_host_filling_heterogeneity_20261115/
          if-no-files-found: error
          retention-days: 90
