name: Butterfly climate-conditioned resource geography

on:
  push:
    branches:
      - analysis/resource-redundancy-20261011
    paths:
      - scripts/analyze_butterfly_resource_climate_geonull.py
      - tests/test_butterfly_resource_climate_geonull.py
      - .github/workflows/butterfly-resource-climate-geonull.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  climate-null:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    env:
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install -e '.[test,analysis,review]'
          mkdir -p results/climate-null
      - name: Full repository tests
        id: full-tests
        run: |
          set -o pipefail
          python -m pytest -q 2>&1 | tee results/full_repository_tests.txt
      - name: Require climate and fixed-margin tests
        run: |
          python -m pytest -q tests/test_butterfly_resource_climate_geonull.py tests/test_butterfly_resource_redundancy_geonull.py tests/test_butterfly_resource_redundancy_hostcount.py
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
      - name: Restore exact frozen regional CHELSA extraction
        uses: actions/download-artifact@v4
        with:
          name: butterfly-climate-release-postgate-independent-result-v01
          path: inputs/climate
          github-token: ${{ github.token }}
          repository: zuizui0223/TTF
          run-id: 36270581743
      - name: Check out exact HOSTS source
        uses: actions/checkout@v4
        with:
          repository: globalbioticinteractions/HOSTS
          ref: 808e0b869f9ec1adf8efff87cf6a395adda103e0
          path: _external/HOSTS
      - name: Check out exact WCVP source
        uses: actions/checkout@v4
        with:
          repository: matildabrown/rWCVPdata
          ref: 65bed76bae9d644ccb6ad200c05f9f5071d89e05
          path: _external/WCVP
      - name: Reconstruct exact host and distribution inputs
        run: |
          Rscript scripts/build_wcvp_hosts_null_sidecars.R _external/WCVP _external/HOSTS results/native results/contemporary
      - name: Run climate conditioning and independent mixing sensitivity
        run: |
          python scripts/analyze_butterfly_resource_climate_geonull.py \
            --climate-root inputs/climate \
            --insect-host-csv results/native/insect_host_accepted.csv \
            --native-csv results/native/native_extant_nondoubtful_wgsrpd3.csv \
            --contemporary-csv results/contemporary/extant_nondoubtful_wgsrpd3.csv \
            --replicas 199 \
            --output-dir results/climate-null \
            | tee results/climate_null_console.txt
      - name: Record full-suite outcome
        if: always()
        run: echo 'Full repository tests outcome = ${{ steps.full-tests.outcome }}' | tee results/full_suite_outcome.txt
      - name: Preserve sources and climate-null evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chocho-climate-conditioned-geonull-20261011
          path: |
            results/climate-null/
            results/full_repository_tests.txt
            results/full_suite_outcome.txt
            results/climate_null_console.txt
            results/native/
            results/contemporary/
          retention-days: 30
