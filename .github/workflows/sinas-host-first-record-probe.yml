name: sinas-host-first-record-probe

on:
  push:
    branches:
      - analysis/resource-homogenization-v01
    paths:
      - ".github/workflows/sinas-host-first-record-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Download and filter SInAS 2.5 by canonical taxon
        run: |
          mkdir -p results/sinas-probe
          python - <<'PY'
          import csv, io, json, re, urllib.request
          from pathlib import Path

          url = "https://zenodo.org/api/records/10038256/files/SInAS_AlienSpeciesDB_2.5.csv/content"
          focal = {
              "Lantana camara","Melissa officinalis","Mentha pulegium","Mangifera indica",
              "Vachellia farnesiana","Malva neglecta","Malva sylvestris","Modiola caroliniana",
              "Passiflora edulis","Passiflora quadrangularis","Passiflora suberosa",
              "Sida rhombifolia","Abutilon theophrasti","Alcea rosea",
              "Althaea officinalis","Hibiscus trionum",
          }

          req=urllib.request.Request(url,headers={"User-Agent":"chocho-sinas-probe/0.3"})
          rows=[]
          with urllib.request.urlopen(req,timeout=180) as response:
              text=io.TextIOWrapper(response,encoding="utf-8-sig",newline="")
              reader=csv.DictReader(text,delimiter=" ",skipinitialspace=True)
              header=list(reader.fieldnames or [])
              for row in reader:
                  taxon=str(row.get("Taxon") or "").strip()
                  if taxon in focal:
                      rows.append({"matched_name":taxon,**row})

          def parse_year(value):
              s=str(value or "").strip()
              m=re.search(r"(?<!\d)(1[5-9]\d{2}|20[0-2]\d)(?!\d)",s)
              return None if not m else int(m.group(1))

          out=Path("results/sinas-probe/focal_host_sinas_records_v0.3.csv")
          if rows:
              with out.open("w",newline="",encoding="utf-8") as f:
                  w=csv.DictWriter(f,fieldnames=list(rows[0])); w.writeheader(); w.writerows(rows)
          else:
              out.write_text("",encoding="utf-8")

          by_host={}
          for name in sorted(focal):
              rr=[r for r in rows if r["matched_name"]==name]
              dated=[parse_year(r.get("eventDate")) for r in rr]
              dated=[y for y in dated if y is not None]
              locations=sorted({str(r.get("Location") or "").strip() for r in rr if str(r.get("Location") or "").strip()})
              by_host[name]={
                  "records":len(rr),
                  "locations":len(locations),
                  "location_names":locations,
                  "dated_records":len(dated),
                  "earliest_first_record":min(dated) if dated else None,
              }

          payload={
              "schema":"chocho_sinas_host_first_record_probe_v0.3",
              "source":{"dataset":"SInAS 2.5","zenodo_record":"10038256","url":url},
              "occurrence_header":header,
              "focal_hosts":len(focal),
              "hosts_with_sinas_occurrences":sum(v["records"]>0 for v in by_host.values()),
              "hosts_with_dated_sinas_occurrences":sum(v["dated_records"]>0 for v in by_host.values()),
              "rows":len(rows),
              "by_host":by_host,
          }
          Path("results/sinas-probe/focal_host_sinas_summary_v0.3.json").write_text(
              json.dumps(payload,indent=2)+"\n",encoding="utf-8"
          )
          print(json.dumps(payload,indent=2))
          PY
      - name: Upload SInAS probe
        uses: actions/upload-artifact@v4
        with:
          name: sinas-host-first-record-probe-v03
          path: results/sinas-probe/
          if-no-files-found: error
          retention-days: 14
