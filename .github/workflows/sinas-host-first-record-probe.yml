name: sinas-host-first-record-probe

on:
  push:
    branches:
      - analysis/resource-homogenization-v01
    paths:
      - ".github/workflows/sinas-host-first-record-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Download, join and filter SInAS 2.5
        run: |
          mkdir -p results/sinas-probe
          python - <<'PY'
          import csv, io, json, re, urllib.request
          from collections import defaultdict
          from pathlib import Path

          BASE = "https://zenodo.org/api/records/10038256/files/"
          occurrence_url = BASE + "SInAS_AlienSpeciesDB_2.5.csv/content"
          taxa_url = BASE + "SInAS_AlienSpeciesDB_2.5_FullTaxaList.csv/content"
          focal = {
              "Lantana camara",
              "Melissa officinalis",
              "Mentha pulegium",
              "Mangifera indica",
              "Vachellia farnesiana",
              "Malva neglecta",
              "Malva sylvestris",
              "Modiola caroliniana",
              "Passiflora edulis",
              "Passiflora quadrangularis",
              "Passiflora suberosa",
              "Sida rhombifolia",
              "Abutilon theophrasti",
              "Alcea rosea",
              "Althaea officinalis",
              "Hibiscus trionum",
          }

          def reader_for(url):
              req = urllib.request.Request(url, headers={"User-Agent":"chocho-sinas-probe/0.2"})
              r = urllib.request.urlopen(req, timeout=180)
              text = io.TextIOWrapper(r, encoding="utf-8-sig", newline="")
              return r, csv.DictReader(text, delimiter=" ", skipinitialspace=True)

          rows = []
          main_header = None
          r, reader = reader_for(occurrence_url)
          try:
              main_header = list(reader.fieldnames or [])
              for row in reader:
                  taxon = str(row.get("Taxon") or "").strip()
                  if taxon not in focal:
                      continue
                  rows.append({"matched_name": taxon, **row})
          finally:
              r.close()

          out_path = Path("results/sinas-probe/focal_host_sinas_records_v0.3.csv")
          if rows:
              fields = list(rows[0])
              with out_path.open("w", newline="", encoding="utf-8") as f:
                  w = csv.DictWriter(f, fieldnames=fields)
                  w.writeheader()
                  w.writerows(rows)
          else:
              out_path.write_text("", encoding="utf-8")

          def year_from(value):
              s = str(value or "").strip()
              m = re.search(r"(?<!\\d)(1[5-9]\\d{2}|20[0-2]\\d)(?!\\d)", s)
              return None if not m else int(m.group(1))

          by_name = {}
          for name in sorted(focal):
              rr = [x for x in rows if x["matched_name"] == name]
              years = [(year_from(x.get("eventDate")), x) for x in rr]
              years = [(y,x) for y,x in years if y is not None]
              locations = sorted({str(x.get("Location") or "").strip() for x in rr if str(x.get("Location") or "").strip()})
              by_name[name] = {
                  "records": len(rr),
                  "locations": len(locations),
                  "location_names": locations,
                  "dated_records": len(years),
                  "earliest_first_record": min((y for y,_ in years), default=None),
              }

          payload = {
              "schema":"chocho_sinas_host_first_record_probe_v0.3",
              "source":{
                  "dataset":"SInAS 2.5",
                  "zenodo_record":"10038256",
                  "occurrence_url":occurrence_url,
                  "taxa_url":taxa_url,
              },
              "delimiter":"single-space with quoted fields",
              "taxa_header":taxa_header,
              "occurrence_header":main_header,
              "focal_hosts":len(focal),
              "hosts_resolved_to_taxon_id":sum(bool(ids_by_name.get(name)) for name in focal),
              "hosts_with_sinas_occurrences":sum(v["records"]>0 for v in by_name.values()),
              "rows":len(rows),
              "by_host":by_name,
          }
          Path("results/sinas-probe/focal_host_sinas_summary_v0.3.json").write_text(
              json.dumps(payload, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps(payload, indent=2))
          PY
      - name: Upload SInAS probe
        uses: actions/upload-artifact@v4
        with:
          name: sinas-host-first-record-probe-v03
          path: results/sinas-probe/
          if-no-files-found: error
          retention-days: 14
