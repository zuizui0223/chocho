name: Global butterfly island exposure to modern WPI ports

on:
  push:
    branches: [analysis/butterfly-expansion-maritime-host-relay-20261031]
    paths:
      - "provenance/reviewer_defenses/results/global_island_risk_20261031/build_global_wpi_island_ports.py"
      - ".github/workflows/chocho-global-WPI-island-port-coverage.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  all-GSHHG-WPI-islands:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Original coastline and geodesic port assignment packages
        run: python -m pip install "numpy>=1.26,<3" "geopandas>=1.0,<2" "pyproj>=3.5,<4" "shapely>=2,<3"
      - uses: actions/cache@v4
        with:
          key: chocho-gshhg-shp-237-original-8dbbe7e
          path: _scratch_coastal/gshhg-shp-2.3.7.zip
      - name: Verify original GSHHG SHA
        run: |
          mkdir -p _scratch_coastal
          if test ! -s _scratch_coastal/gshhg-shp-2.3.7.zip; then
            curl -fSL --retry 3 --max-time 360 -o _scratch_coastal/gshhg-shp-2.3.7.zip \
              https://github.com/GenericMappingTools/gshhg-gmt/releases/download/2.3.7/gshhg-shp-2.3.7.zip
          fi
          echo "8dbbe7e071e77e9e75f2d639239099ebca8d5c16d6a07df8169729d49f15cf41  _scratch_coastal/gshhg-shp-2.3.7.zip" | sha256sum --check
      - name: Assign all WPI ports to actual GSHHG landmass shorelines
        run: |
          python provenance/reviewer_defenses/results/global_island_risk_20261031/build_global_wpi_island_ports.py \
            --zip _scratch_coastal/gshhg-shp-2.3.7.zip \
            --work _scratch_coastal/ports_original_global_shp
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: global-modern-WPI-island-port-coverage
          path: |
            provenance/reviewer_defenses/results/global_island_risk_20261031/global_WPI_ports_assigned_to_GSHHG.csv
            provenance/reviewer_defenses/results/global_island_risk_20261031/global_island_port_opportunity.csv
            provenance/reviewer_defenses/results/global_island_risk_20261031/global_WPI_island_port_receipt.json
          retention-days: 60
      - name: Preserve verified source derived WPI assignments
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add provenance/reviewer_defenses/results/global_island_risk_20261031/global_WPI_ports_assigned_to_GSHHG.csv \
             provenance/reviewer_defenses/results/global_island_risk_20261031/global_island_port_opportunity.csv \
             provenance/reviewer_defenses/results/global_island_risk_20261031/global_WPI_island_port_receipt.json
          git diff --cached --quiet && exit 0
          git commit -m "Source-verify full global island versus modern WPI port geography [skip ci]"
          for attempt in 1 2 3 4; do
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase FETCH_HEAD || exit 1
            if git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"; then exit 0; fi
            sleep 2
          done
          exit 1
