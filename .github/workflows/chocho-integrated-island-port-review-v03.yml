name: GEB v0.3 one-paper five-figure verification and coauthor DOCX
on:
  push:
    branches: [analysis/butterfly-trait-public51-20261109]
    paths:
      - scripts/render_island_port_butterfly_fig1_v03.py
      - figures/integrated_island_port_butterfly_v03/Fig1_resource_geography_scales_v03.*
      - scripts/verify_island_port_butterfly_v03.py
      - scripts/build_island_port_butterfly_review_docx_v03.py
      - manuscript/integrated_butterfly_resource_access_20261109/ISLAND_PORT_BUTTERFLY_RESEARCH_ARTICLE_V03.md
      - manuscript/integrated_butterfly_resource_access_20261109/FIGURE_CAPTIONS_V03.md
      - manuscript/integrated_butterfly_resource_access_20261109/TABLE_S1_six_island_cases.md
      - scripts/*island_breeding_relay.py
      - results/island_breeding_relay/**
      - figures/integrated_island_port_butterfly_v03/FigS12_island_breeding_relay.png
      - scripts/analyze_island_resource_gap_filling.py
      - results/island_resource_gap_filling/**
      - figures/integrated_island_port_butterfly_v03/FigS11_native_host_gaps.png
      - scripts/analyze_route_free_host_influence.py
      - scripts/render_route_free_host_influence.py
      - results/route_free_host_influence/**
      - figures/integrated_island_port_butterfly_v03/FigS10_overlap_influence.png
      - scripts/analyze_route_free_port_hosts.py
      - scripts/acquire_route_free_port_flora.py
      - results/route_free_port_hosts/**
      - figures/integrated_island_port_butterfly_v03/FigS9_route_free_ports.png
      - scripts/analyze_native_plus_introduced_27.py
      - results/native_plus_introduced_27/**
      - figures/integrated_island_port_butterfly_v03/FigS8_native_plus_introduced.png
      - scripts/audit_native_hosts_ten_cases.py
      - scripts/render_native_hosts_ten_cases.py
      - results/native_hosts_ten_island_cases/**
      - figures/integrated_island_port_butterfly_v03/FigS7_local_native_hosts.png
      - scripts/trace_top_hosts_to_island_records.py
      - results/top_host_island_chronology/**
      - figures/integrated_island_port_butterfly_v03/FigS6_named_host_chronology.png
      - figures/integrated_island_port_butterfly_v03/FigS5_regional_routes.png
      - figures/integrated_island_port_butterfly_v03/FigS4_annual_maritime_links.png
      - figures/integrated_island_port_butterfly_v03/FigS3_annual_port_host.png
      - figures/integrated_island_port_butterfly_v03/FigS2_port_host_first_index.png
      - figures/integrated_island_port_butterfly_v03/FigS1_six_island_cases.png
      - figures/integrated_island_port_butterfly_v03/Box1_bornholm.png
      - figures/integrated_island_port_butterfly_v03/FIGURE5_V03_SOURCE_RECEIPT.json
      - .github/workflows/chocho-integrated-island-port-review-v03.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-and-coauthor-copy:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify original-source model improvements, abstract limit and five scientific figures
        run: |
          python -m py_compile scripts/verify_island_port_butterfly_v03.py scripts/build_island_port_butterfly_review_docx_v03.py
          python scripts/verify_island_port_butterfly_v03.py | tee /tmp/v03-verification-log.json
      - name: Install review DOCX and PDF tools
        run: |
          python -m pip install --disable-pip-version-check 'python-docx>=1.1,<2'
          if ! command -v pandoc >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y pandoc
          fi
          if ! command -v libreoffice >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y libreoffice-writer
          fi
          if ! command -v pdfinfo >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y poppler-utils
          fi
          command -v pdfinfo
      - name: Generate actual source-matched v0.3 five-figure manuscript DOCX
        run: |
          mkdir -p _scratch_v03
          python scripts/build_island_port_butterfly_review_docx_v03.py \
            --output _scratch_v03/ISLAND_PORT_BUTTERFLIES_ONE_GEB_MANUSCRIPT_V03_REVIEW.docx
      - name: Render Word into PDF and run document structure checks
        run: |
          mkdir -p _scratch_v03/pdf
          libreoffice -env:UserInstallation=file:///tmp/libreoffice-v03-$(date +%s) \
            --headless --convert-to pdf --outdir _scratch_v03/pdf \
            _scratch_v03/ISLAND_PORT_BUTTERFLIES_ONE_GEB_MANUSCRIPT_V03_REVIEW.docx
          test -s _scratch_v03/pdf/ISLAND_PORT_BUTTERFLIES_ONE_GEB_MANUSCRIPT_V03_REVIEW.pdf
          pdfinfo _scratch_v03/pdf/ISLAND_PORT_BUTTERFLIES_ONE_GEB_MANUSCRIPT_V03_REVIEW.pdf | tee _scratch_v03/PDFINFO_REVIEW.txt
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          from docx import Document
          root=Path('_scratch_v03')
          p=root/'ISLAND_PORT_BUTTERFLIES_ONE_GEB_MANUSCRIPT_V03_REVIEW.docx'
          doc=Document(p)
          paras=[x.text for x in doc.paragraphs]
          assert any('Figure 5' in x for x in paras)
          assert all(any('Figure '+str(i) in x for x in paras) for i in range(1,6))
          assert any('6.488%' in x for x in paras)
          with ZipFile(p) as z:
            imgs=[x for x in z.namelist() if x.startswith('word/media/')]
            assert len(imgs)>=18
            relay = Path('figures/integrated_island_port_butterfly_v03/FigS12_island_breeding_relay.png').read_bytes()
            assert any(z.read(name) == relay for name in imgs)
            gaps = Path('figures/integrated_island_port_butterfly_v03/FigS11_native_host_gaps.png').read_bytes()
            assert any(z.read(name) == gaps for name in imgs)
            influence = Path('figures/integrated_island_port_butterfly_v03/FigS10_overlap_influence.png').read_bytes()
            assert any(z.read(name) == influence for name in imgs)
            expanded = Path('figures/integrated_island_port_butterfly_v03/FigS9_route_free_ports.png').read_bytes()
            assert any(z.read(name) == expanded for name in imgs)
            origin_comparison = Path('figures/integrated_island_port_butterfly_v03/FigS8_native_plus_introduced.png').read_bytes()
            assert any(z.read(name) == origin_comparison for name in imgs)
            alternatives = Path('figures/integrated_island_port_butterfly_v03/FigS7_local_native_hosts.png').read_bytes()
            assert any(z.read(name) == alternatives for name in imgs)
            named = Path('figures/integrated_island_port_butterfly_v03/FigS6_named_host_chronology.png').read_bytes()
            assert any(z.read(name) == named for name in imgs)
            summary = Path('figures/integrated_island_port_butterfly_v03/Fig1_resource_geography_scales_v03.png').read_bytes()
            assert any(z.read(name) == summary for name in imgs)
            assert any("Table S1." in x for x in paras)
            assert any("Box 1" in x for x in paras)
          print('V03_DOCX_SOURCE_FIVE_IMAGES_ONE_FIGURE5_AND_MARINE_POSITIVE_RESULT_PASS',len(paras),len(imgs))
          PY
      - name: Archive version-specific DOCX, visual-review PDF, and provenance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chocho-integrated-islands-ports-marine-GEB-v03-coauthor-review
          path: |
            _scratch_v03/ISLAND_PORT_BUTTERFLIES_ONE_GEB_MANUSCRIPT_V03_REVIEW.docx
            _scratch_v03/ISLAND_PORT_BUTTERFLIES_ONE_GEB_MANUSCRIPT_V03_REVIEW.source_receipt.json
            _scratch_v03/pdf/ISLAND_PORT_BUTTERFLIES_ONE_GEB_MANUSCRIPT_V03_REVIEW.pdf
            _scratch_v03/PDFINFO_REVIEW.txt
          retention-days: 60
          if-no-files-found: warn
