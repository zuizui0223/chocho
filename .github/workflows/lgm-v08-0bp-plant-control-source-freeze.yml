name: chocho 0BP-only source-qualification of actual hosts and matched OTHER plant climatic graphs
on:
  push:
    branches: [ecology/lgm-matched-other-plants-graph-null-v08]
    paths: [.github/workflows/lgm-v08-0bp-plant-control-source-freeze.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: chocho-v08-pre-LGM-292-source-alternate-model-qualifier
  cancel-in-progress: false
jobs:
  source-eligibility-without-LGM-graph-response:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/checkout@v4
        with:
          repository: zuizui0223/TTF
          ref: 187e15c6a7b777c119b97b8a43a0d92783ef7c5c
          path: input/TTF
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify pre-LGM source frozen identities and synthetic fail-closed no-data rules
        run: |
          set -euo pipefail
          python -m pip install 'pytest>=8,<9'
          python -m pytest -q tests/test_qualify_original_otherplant_graph_v08.py
          python -m py_compile scripts/qualify_original_otherplant_graph_v08.py
          echo 'c8099e516a42850c8ab946c4cdc23e71afe1e8eb5360a90fcd848365b3cb8075  input/TTF/benchmarks/exploratory/lgm_matched_alternative_plants_current_only_v05/source_bound_0bp_alternatives.json' | sha256sum -c -
          echo '153189ad188a8647c49bb5401b20786098386979ca1f00f1cbc67bf55a0ad733  results/lgm_native_plant_hindcast_v01/all_518_native_host_hindcast.csv' | sha256sum -c -
          python - <<'PYTHON'
          import json
          z=json.load(open('docs/supporting/lgm_otherplant_graph_null_v08_contract.json'))
          assert z['status']=='EXPLORATORY_FIXED_ALTERNATIVE_BOTANICAL_REFERENCE_BEFORE_V08_ANCIENT_PATCH_SCORES'
          assert z['source_eligibility']['source_eligible_insects']==292
          assert z['source_eligibility']['source_eligible_alternative_plant_group_records']==2108
          assert z['graph']['distance_radii_km']==[50,100,150]
          print('PASS_PRE_OUTCOME_V08_SOURCE_ONLY_PRESPECIFIED_ELIGIBILITY')
          PYTHON
      - name: Freeze all 335 original 0BP-only alternative plant model availability before any new 21ka component score
        run: |
          set -euo pipefail
          out=results/lgm_v08_0bp_only_matched_otherplant_model_eligibility
          python scripts/qualify_original_otherplant_graph_v08.py \
            --source-alt-plan input/TTF/benchmarks/exploratory/lgm_matched_alternative_plants_current_only_v05/source_bound_0bp_alternatives.json \
            --all-518-plant-models results/lgm_native_plant_hindcast_v01/all_518_native_host_hindcast.csv \
            --out "$out"
          python - <<'PYTHON'
          import json,csv,hashlib,os
          from pathlib import Path
          d=Path('results/lgm_v08_0bp_only_matched_otherplant_model_eligibility')
          x=json.loads((d/'summary.json').read_text())
          full=json.loads((d/'source_fixed_292_otherplant_groups.json').read_text())
          with (d/'all_335_preoutcome_native_plant_model_eligibility.csv').open(newline='') as f:z=list(csv.DictReader(f))
          assert x['status']=='ELIGIBILITY_ONLY_NO_NEW_LGM_PATCH_OUTCOME_READ'
          assert (x['original_0BP_climate_matched_insects'],x['modelled_actual_host_insects'])==(335,294)
          assert x['complete_known_host_and_at_least_4_group_insects']==292
          assert x['valid_frozen_alternative_group_count']==2108
          assert x['distinct_other_plant_model_taxa']==362
          assert len(z)==335 and len(full['matched_species'])==292
          assert all(len(entry['alternative_groups'])>=4 for entry in full['matched_species'].values())
          assert x['no_new_21ka_climate_or_genetic_patch_response_accessed'] is True
          rec={'schema':'chocho_v08_original_0BP_only_otherplant_model_qualifier',
               'run_id':os.environ['GITHUB_RUN_ID'],'code_commit':os.environ['GITHUB_SHA'],
               'result_sha256':{p.name:hashlib.sha256(p.read_bytes()).hexdigest()
                   for p in sorted(d.iterdir()) if p.is_file()},
               'no_LGM_patch_genetic_or_ancient_occupancy_response_read':True}
          (d/'receipt.json').write_text(json.dumps(rec,indent=2,sort_keys=True)+'\n')
          print(json.dumps(x,sort_keys=True))
          PYTHON
      - name: Commit frozen source-only qualification on isolated draft
        run: |
          set -euo pipefail
          git fetch origin "${{ github.ref_name }}"
          test "$(git rev-parse FETCH_HEAD)" = "${{ github.sha }}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/lgm_v08_0bp_only_matched_otherplant_model_eligibility/
          git commit -m 'Freeze source-only 292 insect 2108 other-plant group native model eligibility'
          git push origin "HEAD:${{ github.ref_name }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chocho-292-source-eligible-0BP-matched-otherplant-groups-v08
          path: results/lgm_v08_0bp_only_matched_otherplant_model_eligibility/
          retention-days: 30
          if-no-files-found: warn
