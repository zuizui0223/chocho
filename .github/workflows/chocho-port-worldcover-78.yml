name: chocho ESA WorldCover all 78 port nonport landcover sources

on:
  pull_request:
    paths:
      - ".github/workflows/chocho-port-worldcover-78.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  matched-78-coasts:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install actual 10m COG pixel readers and test location geometry
        run: |
          python -m pip install --quiet rasterio numpy pytest
          python -m pytest -q tests/test_exploratory_port_worldcover_urban.py
      - name: Retrieve locked WPI78 coastline control and GBIF all-plant source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/urban78
          gh run download 41402076182 --name strict-disjoint-coastal-sites-wpi79 --dir /tmp/urban78 --repo zuizui0223/chocho
          gh run download 41407370295 --name allflora-N-host-vs-other-WPI78 --dir /tmp/urban78 --repo zuizui0223/chocho
          test -s /tmp/urban78/strict_disjoint_wpi79_sites.json
          test -s /tmp/urban78/allplant_N_background_analysis.json
      - name: Sample ESA WorldCover 2021 v200 10m original class pixels at 156 coastal sites
        run: |
          python -u scripts/exploratory_port_worldcover_urban.py \
            --geometry /tmp/urban78/strict_disjoint_wpi79_sites.json \
            --allflora /tmp/urban78/allplant_N_background_analysis.json \
            --cohort 78 --radius-m 500 \
            --output /tmp/urban78/strict_worldcover_2021_78pair_urban.json
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('/tmp/urban78/strict_worldcover_2021_78pair_urban.json').read_text())
          assert (x["n_target_pairs"],x["n_islands_target"]) == (78,35)
          assert len(x["site_buffers"]) == 156
          assert x["summary"]["pairs_with_both_sites_valid"] >= 60, x["summary"]
          print("ESA_WORLDCOVER_78PAIR_35ISLANDS",json.dumps(x["summary"],sort_keys=True))
          PY
      - name: Save raw class-bin pixels and coverage checks for model audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: esa-worldcover-2021-v200-wpi78-urban-original-pixels
          path: /tmp/urban78/strict_worldcover_2021_78pair_urban.json
          if-no-files-found: warn
          retention-days: 30
