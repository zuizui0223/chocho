name: Kyoto original AAI split leaf precision reanalysis
on:
  workflow_dispatch:
  push:
    branches: [exploration/realized-host-window-v01]
    paths:
      - "docs/exploratory/KYOTO_AAI_SPLIT_LEAF_ROBUSTNESS_PROTOCOL_V01.json"
      - "scripts/analyze_kyoto_original_aai_paired_effects.py"
      - "tests/test_kyoto_original_aai_paired_effects.py"
      - ".github/workflows/kyoto-aai-paired-precision.yml"
permissions:
  contents: read
jobs:
  source_and_effect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test pairing/source identity and uncertainty procedure
        run: |
          python -m pip install pytest==8.3.4
          python -m pytest -q tests/test_kyoto_original_aai_paired_effects.py
      - name: Reanalyse originally published 24h AAI effects with whole-leaf resampling
        run: |
          python scripts/analyze_kyoto_original_aai_paired_effects.py --receipt results/kyoto_original_aai_paired_effects_v01.json
      - uses: actions/upload-artifact@v4
        with:
          name: kyoto-original-aai-paired-precision-v01
          path: results/kyoto_original_aai_paired_effects_v01.json
          retention-days: 30
