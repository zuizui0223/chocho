name: build anonymous review bundle

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "docs/**"
      - "benchmarks/**"
      - "data/**"
      - "manuscript/generated/**"
      - "manuscript/butterfly_specialization_claim_map_v0.2.json"
      - "pyproject.toml"
      - ".github/workflows/build-anonymous-review-bundle.yml"
  workflow_dispatch:

concurrency:
  group: anonymous-review-bundle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  anonymous-review-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build deterministic anonymous snapshot
        run: |
          mkdir -p dist
          python scripts/build_anonymous_review_bundle.py \
            --output dist/butterfly_specialization_anonymous_review_bundle.zip \
            --keep-stage _anonymous_stage
          sha256sum dist/butterfly_specialization_anonymous_review_bundle.zip \
            > dist/ANONYMOUS_BUNDLE_SHA256

      - name: Verify overt identity metadata is absent
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path("_anonymous_stage")
          for forbidden_path in (
              "CITATION.cff",
              "MIGRATION_PROVENANCE.md",
              "SOURCE_SNAPSHOT.txt",
              "manuscript/butterfly_specialization_geb_title_page_template_v0.1.md",
              "manuscript/butterfly_specialization_geb_cover_letter_v0.1.md",
              "manuscript/butterfly_specialization_geb_title_page_template_v0.2.md",
              "manuscript/butterfly_specialization_geb_cover_letter_v0.2.md",
              "provenance/RELEASE_MANIFEST.md",
          ):
              assert not (root / forbidden_path).exists(), forbidden_path

          banned = ("zuizui0223", "ruiqi", "zhang.ruiqi")
          hits = []
          for path in root.rglob("*"):
              if not path.is_file():
                  continue
              try:
                  text = path.read_text(encoding="utf-8").lower()
              except UnicodeDecodeError:
                  continue
              for token in banned:
                  if token in text:
                      hits.append((str(path.relative_to(root)), token))
          assert not hits, hits
          PY

      - name: Verify frozen figure-source bytes
        run: |
          cd _anonymous_stage
          echo "894f48dbca1760fc4fa75bfee8f663540ab4b9380f8b9daf2bc09440e8bb0cdc  data/frozen/figure_sources/s1_resource_descriptors.csv" | sha256sum -c -
          echo "7b2a20387d656dbfcd7b3c38ec6a7fe2505474ad51f783dd1f201eb6b7eabd30  data/frozen/figure_sources/anthropogenic_species_metrics.csv" | sha256sum -c -
          echo "b0f16c5fa9a5b4a0842d6d23f69de7a1f5e938a4a96fea426c97df2dd73e63aa  data/frozen/figure_sources/host_contribution_metrics.csv" | sha256sum -c -
          echo "a73dca6e8b669f721d8f2745f27198d9b47a5cbd05dde6146cc8d4f1ddfbf79b  data/frozen/figure_sources/independent_climate_primary_result.json" | sha256sum -c -

      - name: Test anonymous snapshot
        run: |
          cd _anonymous_stage
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,figure]"
          pytest -q

      - name: Regenerate v0.2 manuscript figures inside anonymous snapshot
        run: |
          cd _anonymous_stage
          python scripts/render_butterfly_specialization_v02_figures.py \
            --anthropogenic-csv data/frozen/figure_sources/anthropogenic_species_metrics.csv \
            --matched-null-json benchmarks/exploratory/butterfly_resource_expansion_matched_null_v0.2.json \
            --occurrence-csv data/frozen/figure_sources/occurrence_resource_validation_species.csv \
            --occurrence-null-json benchmarks/exploratory/butterfly_occurrence_overlap_null_v0.1.json \
            --occurrence-species-robustness-json benchmarks/exploratory/butterfly_occurrence_species_robustness_v0.1.json \
            --ceiling-json benchmarks/exploratory/butterfly_expansion_ceiling_sensitivity_v0.1.json \
            --regional-json benchmarks/exploratory/butterfly_regional_robustness_v0.1.json \
            --climate-csv data/frozen/figure_sources/climate_distance_sensitivity_species.csv \
            --climate-effect-json benchmarks/exploratory/butterfly_climate_effect_size_v0.1.json \
            --output-dir _review_figures
          test "$(find _review_figures -maxdepth 1 -name '*.pdf' | wc -l)" -eq 4
          test "$(find _review_figures -maxdepth 1 -name '*.png' | wc -l)" -eq 4

      - uses: actions/upload-artifact@v4
        with:
          name: anonymous-review-bundle
          path: |
            dist/butterfly_specialization_anonymous_review_bundle.zip
            dist/ANONYMOUS_BUNDLE_SHA256
          retention-days: 30
