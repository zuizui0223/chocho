name: BCE source completeness paired gain-support audit
on:
  push:
    branches:
      - analysis/gain-fragility-20261024
    paths:
      - 'scripts/analyze_bce_paired_gain_support_20261024.py'
      - '.github/workflows/bce-gain-support-paired-audit-20261024.yml'
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  paired-bce-source:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned numerical requirement
        run: python -m pip install 'numpy>=1.26,<3'
      - name: Retrieve immutable prior BCE/Clarke source archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/bce_source_20261024
          gh run download 38988757959 --repo "$GITHUB_REPOSITORY" \
            --name butterfly-bce-resource-novelty-sensitivity-v01 \
            --dir /tmp/bce_source_20261024
          find /tmp/bce_source_20261024 -maxdepth 3 -type f -printf '%p %s bytes\n'
      - name: Compute both host-inventory source-sensitivity regressions
        run: |
          python scripts/analyze_bce_paired_gain_support_20261024.py \
            --artifact-dir /tmp/bce_source_20261024 \
            --output provenance/reviewer_defenses/results/butterfly_bce_paired_gain_support_20261024.json
      - name: Archive derived source comparison
        uses: actions/upload-artifact@v4
        with:
          name: butterfly-bce-paired-gain-support-20261024
          path: provenance/reviewer_defenses/results/butterfly_bce_paired_gain_support_20261024.json
      - name: Commit derived source comparison to exploratory branch
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs=require('fs');
            const path='provenance/reviewer_defenses/results/butterfly_bce_paired_gain_support_20261024.json';
            const content=Buffer.from(fs.readFileSync(path)).toString('base64');
            const owner=context.repo.owner,repo=context.repo.repo;
            const ref=context.ref.replace('refs/heads/','');
            let previous;
            try {
              previous=(await github.rest.repos.getContent({owner,repo,path,ref})).data.sha;
            } catch(e) {
              if(e.status!==404) throw e;
            }
            const payload={owner,repo,path,branch:ref,
              message:'Archive source-completeness robustness of butterfly resource gain and host support',
              content};
            if(previous) payload.sha=previous;
            await github.rest.repos.createOrUpdateFileContents(payload);
