name: Original Caterpillars Count seasonal larval source gate
on:
  push:
    branches:
      - analysis/larval-host-seasonal-realization-20261026
    paths:
      - 'scripts/audit_caterpillars_count_original_branch_season_source_20261026.py'
      - '.github/workflows/larval-host-season-native-alien-source-gate-20261026.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit-field-caterpillar-source:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Checkout immutable original field branch caterpillar data
        uses: actions/checkout@v4
        with:
          repository: hurlbertlab/caterpillars-on-plants
          ref: 2c5690ac7c6dba7eca506da886c49781c37617bd
          path: _external/CaterpillarsCount
      - name: Verify exact source Git blobs, original published season denominator and 3 source-matched windows
        run: |
          python -u scripts/audit_caterpillars_count_original_branch_season_source_20261026.py \
            --original-repo _external/CaterpillarsCount \
            --out provenance/reviewer_defenses/results/caterpillars_count_native_alien_season_source_gate_20261026.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: caterpillars-count-2010-2024-season-source-audit
          path: provenance/reviewer_defenses/results/caterpillars_count_native_alien_season_source_gate_20261026.json
          if-no-files-found: ignore
      - name: Archive only aggregate source QC
        if: success()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs=require('fs');
            const path='provenance/reviewer_defenses/results/caterpillars_count_native_alien_season_source_gate_20261026.json';
            const owner=context.repo.owner,repo=context.repo.repo;
            const branch=context.ref.replace('refs/heads/','');
            const content=Buffer.from(fs.readFileSync(path)).toString('base64');
            let sha;
            try{sha=(await github.rest.repos.getContent({owner,repo,path,ref:branch})).data.sha;}
            catch(e){if(e.status!==404)throw e;}
            const args={owner,repo,path,branch,content,
              message:'Archive original 2026 Caterpillars Count seasonal native-alien field larva source QC'};
            if(sha)args.sha=sha;
            await github.rest.repos.createOrUpdateFileContents(args);
