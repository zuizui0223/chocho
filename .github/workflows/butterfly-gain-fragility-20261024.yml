name: Butterfly resource gain-fragility source verification
on:
  push:
    branches:
      - analysis/gain-fragility-20261024
    paths:
      - 'scripts/analyze_butterfly_gain_fragility_20261024.py'
      - '.github/workflows/butterfly-gain-fragility-20261024.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen numerical dependency
        run: python -m pip install 'numpy>=1.26,<3'
      - name: Recalculate all 239 source joins and three genus-cluster models
        run: |
          python scripts/analyze_butterfly_gain_fragility_20261024.py \
            --output provenance/reviewer_defenses/results/butterfly_geographic_gain_fragility_20261024.json
      - name: Repeat exact-source validation against saved output
        run: |
          python scripts/analyze_butterfly_gain_fragility_20261024.py \
            --verify provenance/reviewer_defenses/results/butterfly_geographic_gain_fragility_20261024.json \
            --output /tmp/independent_gain_fragility_result.json
      - name: Upload immutable derived results
        uses: actions/upload-artifact@v4
        with:
          name: butterfly-geographic-gain-fragility-20261024
          path: |
            provenance/reviewer_defenses/results/butterfly_geographic_gain_fragility_20261024.json
            /tmp/independent_gain_fragility_result.json
      - name: Commit source-verified result receipt only on analysis branch
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs=require('fs');
            const path='provenance/reviewer_defenses/results/butterfly_geographic_gain_fragility_20261024.json';
            const content=Buffer.from(fs.readFileSync(path)).toString('base64');
            const owner=context.repo.owner, repo=context.repo.repo;
            const ref=context.ref.replace('refs/heads/','');
            let existing;
            try {
              const response=await github.rest.repos.getContent({owner,repo,path,ref});
              existing=response.data.sha;
            } catch(e) {
              if(e.status!==404) throw e;
            }
            const payload={owner,repo,path,branch:ref,
              message:'Archive reproducible butterfly resource gain and host-support redundancy analysis',content};
            if(existing) payload.sha=existing;
            await github.rest.repos.createOrUpdateFileContents(payload);
