name: exploratory butterfly resource novelty figure

on:
  push:
    branches: [synthesis/nontrivial-macroecology-20261015]
    paths:
      - "scripts/render_butterfly_resource_novelty_figure.py"
      - "scripts/render_butterfly_resource_novelty_separated_figures.py"
      - "tests/test_butterfly_resource_novelty_separated_figures.py"
      - "scripts/render_bce_resource_novelty_sensitivity_figure.py"
      - "tests/test_bce_resource_novelty_sensitivity_figure.py"
      - "provenance/reviewer_defenses/results/butterfly_bce_resource_novelty_inventory_sensitivity_v0.1.json"
      - "tests/test_butterfly_resource_novelty_figure.py"
      - ".github/workflows/butterfly-resource-novelty-figure.yml"
      - "provenance/reviewer_defenses/results/butterfly_*null*.json"
  workflow_dispatch:

concurrency:
  group: butterfly-resource-novelty-figure-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  figure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install figure environment
        run: |
          python -m pip install -e ".[figure,test]"
      - name: Verify frozen-source figure inputs
        run: python -m pytest -q tests/test_butterfly_resource_novelty_figure.py tests/test_bce_resource_novelty_sensitivity_figure.py tests/test_butterfly_resource_novelty_separated_figures.py
      - name: Render checked exploratory figure
        run: |
          python scripts/render_butterfly_resource_novelty_figure.py \
            --plant-null-json provenance/reviewer_defenses/results/butterfly_plant_range_structural_null_two_chains_v0.2.json \
            --climate-null-json provenance/reviewer_defenses/results/butterfly_climate_matched_absorption_v0.1.json \
            --local-null-json provenance/reviewer_defenses/results/butterfly_spatial_null_longchain_qualified_v0.2.json \
            --output-png results/exploratory-resource-novelty/figure_resource_novelty.png \
            --output-svg results/exploratory-resource-novelty/figure_resource_novelty.svg \
            --output-values-json results/exploratory-resource-novelty/figure_resource_novelty_values.json
          test -s results/exploratory-resource-novelty/figure_resource_novelty.png
          test -s results/exploratory-resource-novelty/figure_resource_novelty.svg
          test -s results/exploratory-resource-novelty/figure_resource_novelty_values.json

      - name: Split conceptual main Fig1 from small post-hoc structural sensitivity FigS2
        run: |
          python scripts/render_butterfly_resource_novelty_separated_figures.py \
            --plant-null-json provenance/reviewer_defenses/results/butterfly_plant_range_structural_null_two_chains_v0.2.json \
            --climate-null-json provenance/reviewer_defenses/results/butterfly_climate_matched_absorption_v0.1.json \
            --local-null-json provenance/reviewer_defenses/results/butterfly_spatial_null_longchain_qualified_v0.2.json \
            --output-dir results/exploratory-resource-novelty
          test -s results/exploratory-resource-novelty/figure_main1_geographic_accounting.png
          test -s results/exploratory-resource-novelty/figure_S2_matched_null_sensitivity.svg

      - name: Render source-inventory robustness companion figure
        run: |
          python scripts/render_bce_resource_novelty_sensitivity_figure.py \
            --receipt-json provenance/reviewer_defenses/results/butterfly_bce_resource_novelty_inventory_sensitivity_v0.1.json \
            --output-png results/exploratory-resource-novelty/figure_bce_inventory_sensitivity.png \
            --output-svg results/exploratory-resource-novelty/figure_bce_inventory_sensitivity.svg \
            --output-data-json results/exploratory-resource-novelty/figure_bce_inventory_sensitivity_values.json
          test -s results/exploratory-resource-novelty/figure_bce_inventory_sensitivity.png
          test -s results/exploratory-resource-novelty/figure_bce_inventory_sensitivity.svg
          test -s results/exploratory-resource-novelty/figure_bce_inventory_sensitivity_values.json

      - uses: actions/upload-artifact@v4
        with:
          name: butterfly-exploratory-resource-novelty-figure-v03
          path: results/exploratory-resource-novelty/
          retention-days: 30
