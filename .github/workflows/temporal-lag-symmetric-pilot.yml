name: temporal-lag-symmetric-pilot

on:
  push:
    branches:
      - analysis/resource-homogenization-v01
    paths:
      - ".github/workflows/temporal-lag-symmetric-pilot.yml"
      - "scripts/acquire_butterfly_temporal_lag_symmetric_pilot.py"
      - "docs/exploratory/butterfly_temporal_lag_pilot_pairs_v0.1.csv"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  symmetric-record-window:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout analysis branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install geometry dependency
        run: python -m pip install "shapely>=2,<3"
      - name: Checkout fixed WGSRPD source
        uses: actions/checkout@v4
        with:
          repository: tdwg/wgsrpd
          ref: 52da7828aba9d461dd133c27b3bd7a4407161f54
          path: _external/WGSRPD
      - name: Query hosts and butterflies over the same historical window
        run: |
          mkdir -p results/exploratory
          python scripts/acquire_butterfly_temporal_lag_symmetric_pilot.py \
            --pairs-csv docs/exploratory/butterfly_temporal_lag_pilot_pairs_v0.1.csv \
            --level3-geojson _external/WGSRPD/geojson/level3.geojson \
            --start-year 1800 --end-year 2025 \
            --output-csv results/exploratory/butterfly_temporal_lag_symmetric_host_pairs_v0.2.csv \
            --output-json results/exploratory/butterfly_temporal_lag_symmetric_v0.2.json
      - name: Upload symmetric lag pilot
        uses: actions/upload-artifact@v4
        with:
          name: butterfly-temporal-lag-symmetric-v02
          path: |
            results/exploratory/butterfly_temporal_lag_symmetric_host_pairs_v0.2.csv
            results/exploratory/butterfly_temporal_lag_symmetric_v0.2.json
          if-no-files-found: error
          retention-days: 14
