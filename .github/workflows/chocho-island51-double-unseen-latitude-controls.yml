name: chocho original51 latitude geography sensitivity of AIS and wind under double-unseen blocks

on:
  push:
    branches:
      - analysis/island51-double-unseen-latitude-controls-20261107
    paths:
      - ".github/workflows/chocho-island51-double-unseen-latitude-controls.yml"
      - "scripts/run_island51_latitude_controls.py"
      - "tests/test_run_island51_latitude_controls.py"
      - "results/island51_latitude_controls_20261107/**"
  pull_request:
    paths:
      - ".github/workflows/chocho-island51-double-unseen-latitude-controls.yml"
      - "scripts/run_island51_latitude_controls.py"
      - "tests/test_run_island51_latitude_controls.py"
      - "results/island51_latitude_controls_20261107/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  four-latitude-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install original scientific test and analysis dependencies
        run: |
          python -m pip install -e ".[test,analysis]"
          mkdir -p _ci_latitude
          python -m pip freeze > _ci_latitude/python_environment.txt
      - name: Test frozen original latitude source, pairwise controls and model suite
        run: |
          python -m pytest -q tests/test_run_island51_latitude_controls.py
      - name: Reproduce 30 original comparisons then evaluate full and latitude adjusted circuits
        run: |
          python scripts/run_island51_latitude_controls.py --out-dir _ci_latitude
      - name: Independently reconstruct all predictions, model folds and contrasts
        run: |
          python results/island51_latitude_controls_20261107/verify_latitude_controls.py --results-dir _ci_latitude
      - name: Archive full unrounded scores and source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: island51-latitude-adjusted-double-unseen-marine-circuits
          path: _ci_latitude/
          if-no-files-found: error
          retention-days: 30
