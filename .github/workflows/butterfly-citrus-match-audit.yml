name: Butterfly Citrus name audit
on:
  push:
    branches: [analysis/resource-redundancy-20261011]
    paths: [.github/workflows/butterfly-citrus-match-audit.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: matildabrown/rWCVPdata
          ref: 65bed76bae9d644ccb6ad200c05f9f5071d89e05
          path: wcvp
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
      - name: Inspect candidate names and exact-match exclusions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          Rscript - <<'RS'
          e <- new.env(parent=emptyenv())
          load('wcvp/data/wcvp_names.rda',envir=e)
          load('wcvp/data/wcvp_distributions.rda',envir=e)
          x<-e$wcvp_names
          cols<-c('plant_name_id','taxon_rank','taxon_status','family','taxon_name','accepted_plant_name_id')
          candidates<-x[grepl('^Citrus.*limon', x$taxon_name),cols,drop=FALSE]
          candidates$exact_Citrus_limon_match<-as.character(candidates$taxon_name)=='Citrus limon'
          candidates$species_rank_pass<-tolower(trimws(as.character(candidates$taxon_rank)))=='species'
          write.csv(candidates,'results/citrus_limon_name_candidates.csv',row.names=FALSE,na='')
          ids<-unique(c(as.character(candidates$plant_name_id),as.character(candidates$accepted_plant_name_id)))
          d<-e$wcvp_distributions
          sub<-d[as.character(d$plant_name_id)%in%ids & as.character(d$area_code_l3)=='CUB',c('plant_name_id','area_code_l3','introduced','extinct','location_doubtful'),drop=FALSE]
          write.csv(sub,'results/citrus_limon_cuba_distribution.csv',row.names=FALSE,na='')
          print(candidates); print(sub)
          RS
          sha256sum wcvp/data/wcvp_names.rda wcvp/data/wcvp_distributions.rda results/*.csv > results/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chocho-citrus-name-audit-20261011
          path: results/
          retention-days: 30
