name: Historical pre-2001 GBIF index audit for all 317 butterfly first-index cells
on:
  push:
    branches: [analysis/port-host-ocean-interaction-20261114]
    paths:
      - scripts/screen_pre2001_all_island_first_indices_20261114.py
      - scripts/merge_pre2001_all_island_first_indices_20261114.py
      - .github/workflows/chocho-pre2001-all-317-island-first-index.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-geography-shards:
    name: Historical GBIF batch ${{ matrix.batch }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
        - batch: 1
          islands: "9,19,28,59,94,183,257,456,951"
        - batch: 2
          islands: "10,20,31,65,110,206,260,471,1210"
        - batch: 3
          islands: "12,21,43,79,134,214,276,487,1577"
        - batch: 4
          islands: "13,23,44,81,152,218,321,715"
        - batch: 5
          islands: "15,26,47,85,168,234,391,753"
        - batch: 6
          islands: "17,27,54,89,169,242,397,821"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original GSHHG geography dependencies
        run: python -m pip install --disable-pip-version-check 'numpy>=1.26,<3' 'geopandas>=1.0,<2' 'pyproj>=3.5,<4' 'shapely>=2,<3'
      - uses: actions/cache@v4
        with:
          key: chocho-original-gshhg-shp-237-sha8dbbe7e
          path: _scratch_coastal/gshhg-shp-2.3.7.zip
      - name: Verify exact original GSHHG 2.3.7 source
        run: |
          mkdir -p _scratch_coastal
          if test ! -s _scratch_coastal/gshhg-shp-2.3.7.zip; then
            curl -fSL --retry 3 --max-time 360 -o _scratch_coastal/gshhg-shp-2.3.7.zip https://github.com/GenericMappingTools/gshhg-gmt/releases/download/2.3.7/gshhg-shp-2.3.7.zip
          fi
          echo "8dbbe7e071e77e9e75f2d639239099ebca8d5c16d6a07df8169729d49f15cf41  _scratch_coastal/gshhg-shp-2.3.7.zip" | sha256sum --check
      - name: Screen all frozen first-index events for pre-2001 presence-index
        run: |
          python -m py_compile scripts/screen_pre2001_all_island_first_indices_20261114.py
          python scripts/screen_pre2001_all_island_first_indices_20261114.py \
            --gshhg-zip _scratch_coastal/gshhg-shp-2.3.7.zip \
            --work _scratch_coastal/all317_batch_${{ matrix.batch }} \
            --islands "${{ matrix.islands }}" --batch-id ${{ matrix.batch }} \
            --max-queries 120 --wkt-max-chars 2300 \
            --out-dir results/pre2001_shard_${{ matrix.batch }}
      - name: Archive facet receipts for each source island
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chocho-pre2001-all-batch-${{ matrix.batch }}
          path: results/pre2001_shard_${{ matrix.batch }}/
          if-no-files-found: warn
          retention-days: 90
  merge-317:
    needs: original-geography-shards
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: chocho-pre2001-all-batch-*
          merge-multiple: true
          path: _scratch_pre2001_shards
      - name: Verify all six source shards and original denominators
        run: |
          python -m py_compile scripts/merge_pre2001_all_island_first_indices_20261114.py
          python scripts/merge_pre2001_all_island_first_indices_20261114.py \
            --fragments _scratch_pre2001_shards \
            --out-dir results/pre2001_all_first_indices_20261114
      - name: Validate all 317 later-index cells were screened
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          j=json.loads(Path('results/pre2001_all_first_indices_20261114/analysis_summary.json').read_text())
          assert j['complete_source_status'] and len(j['source_6_shards'])==6
          assert j['statistics']['all_first_indexes']['total']==317
          assert j['statistics']['2011_2017']['total']==221
          assert j['statistics']['2018_2022']['total']==96
          assert j['statistics']['focal_15_host_positive_early']['total']==15
          assert j['statistics']['focal_15_host_positive_early']['pre2001_positive']==12
          print('ALL 317 HISTORICAL SOURCE FLAGS VERIFIED')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: chocho-20261114-all317-pre2001-historical-index-audit
          path: results/pre2001_all_first_indices_20261114/
          if-no-files-found: error
          retention-days: 90
