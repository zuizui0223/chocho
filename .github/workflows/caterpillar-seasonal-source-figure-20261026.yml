name: Real observed caterpillar seasonal plant-use figure
on:
  push:
    branches:
      - analysis/larval-host-seasonal-realization-20261026
    paths:
      - 'scripts/render_caterpillar_seasonal_plant_use_20261026.py'
      - '.github/workflows/caterpillar-seasonal-source-figure-20261026.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render-source-intervals:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install graph tools
        run: python -m pip install 'matplotlib>=3.9,<4' 'numpy>=1.26,<3'
      - name: Plot audited site-bootstrapped seasonal larval branch odds ratio
        run: |
          python scripts/render_caterpillar_seasonal_plant_use_20261026.py \
            --svg docs/exploratory/figures/CaterpillarsCount_seasonal_native_alien_field_use_20261026.svg \
            --png docs/exploratory/figures/CaterpillarsCount_seasonal_native_alien_field_use_20261026.png
      - uses: actions/upload-artifact@v4
        with:
          name: caterpillars-count-season-native-alien-field-use-figure
          path: |
            docs/exploratory/figures/CaterpillarsCount_seasonal_native_alien_field_use_20261026.svg
            docs/exploratory/figures/CaterpillarsCount_seasonal_native_alien_field_use_20261026.png
      - name: Commit aggregate figure without raw field surveys
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs=require('fs');
            const owner=context.repo.owner,repo=context.repo.repo,branch=context.ref.replace('refs/heads/','');
            for (const path of [
              'docs/exploratory/figures/CaterpillarsCount_seasonal_native_alien_field_use_20261026.svg',
              'docs/exploratory/figures/CaterpillarsCount_seasonal_native_alien_field_use_20261026.png'
            ]){
              const content=Buffer.from(fs.readFileSync(path)).toString('base64');
              let sha;
              try {sha=(await github.rest.repos.getContent({owner,repo,path,ref:branch})).data.sha;}
              catch(e){if(e.status!==404)throw e;}
              const args={owner,repo,path,branch,content,message:'Archive site-cluster bootstrap field caterpillar seasonal contrast '+path.split('.').pop()};
              if(sha)args.sha=sha;
              await github.rest.repos.createOrUpdateFileContents(args);
            }
