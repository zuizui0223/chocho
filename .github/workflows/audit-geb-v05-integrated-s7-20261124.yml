name: GEB v0.5 integrate verified S7 historical and port source evidence
on:
  push:
    branches: [analysis/geb-v05-review-data-source-audit-20261120]
    paths: [.github/workflows/audit-geb-v05-integrated-s7-20261124.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recover signed S6 integrated and S7 evidence artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for id in 14912845719 14912771309; do
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "$id.zip"
          done
          echo '364ee811394e254ed505d9aea51d677ad35568415d0fb752376ad3c126633fb8  14912845719.zip' | sha256sum -c -
          echo '335778cfc5ad68db503dd26aae8073fd34bb3575148dbc757f4a3ec17a75a5c5  14912771309.zip' | sha256sum -c -
      - name: Integrate S7 bytes, rerun aggregate audit and inventory anonymity flags
        run: |
          set -euo pipefail
          python - <<'PY'
          import gzip,hashlib,io,json,pathlib,re,zipfile,subprocess,sys
          P=pathlib.Path
          sha=lambda b:hashlib.sha256(b).hexdigest()
          def member(z,name):
              hits=[n for n in z.namelist() if P(n).name==name]
              assert len(hits)==1,(name,hits)
              return z.read(hits[0])
          def load(aid,name,digest):
              with zipfile.ZipFile(f'{aid}.zip') as z: b=member(z,name)
              assert sha(b)==digest
              with zipfile.ZipFile(io.BytesIO(b)) as z:
                  assert z.testzip() is None
                  ns=[i.filename for i in z.infolist() if not i.is_dir()]
                  assert len(ns)==len(set(ns)) and all(not P(n).is_absolute() and '..' not in P(n).parts and '\\' not in n for n in ns)
                  return {n:z.read(n) for n in ns}
          base=load(14912845719,'GEB_V05_INTERNAL_S1_S6_PARTIAL_17_GROUPS_NOT_FOR_REVIEW.zip','b3694b0a3e9660873432c6db75aeebf250c42755a801ae45e0a717bc874f2837')
          s7=load(14912771309,'GEB_V05_S7_INTERNAL_SOURCE_EVIDENCE.zip','05fc49a660480981a4e0e1cb8972f79d4656b13924ce3fa8f9238631df867d4a')
          assert len(base)==170 and len(s7)==20
          m7=json.loads(s7['MANIFEST.json'])
          assert set(m7)==set(s7)-{'MANIFEST.json'}
          for n,h in m7.items(): assert sha(s7[n])==h,n
          with zipfile.ZipFile('14912771309.zip') as z: receipt=member(z,'S7_REPLAY_RECEIPT.json')
          r=json.loads(receipt)
          assert r['status']=='S7_DERIVED_AGGREGATE_REPLAY_AND_SOURCE_RECEIPT_CHECK_PASS_NOT_FULL_RAW_RECONSTRUCTION'
          assert r['source_zip_sha256']=='05fc49a660480981a4e0e1cb8972f79d4656b13924ce3fa8f9238631df867d4a'
          entries=dict(base)
          for n,b in s7.items(): entries['components/s7_evidence/'+n]=b
          entries['source_qa_receipts/S7_REPLAY_RECEIPT.json']=receipt
          assert len(entries)==191
          manifest='MANIFEST_INTERNAL_LIMITED_SCOPE.json'
          m=json.loads(base[manifest])
          m['schema']='GEB_v05_internal_11component_partial_SI_candidate_v8'
          m['component_source']['s7_evidence']={'file_count':20,'source_artifact_component_filename':'GEB_V05_S7_INTERNAL_SOURCE_EVIDENCE.zip','source_artifact_component_sha256':'05fc49a660480981a4e0e1cb8972f79d4656b13924ce3fa8f9238631df867d4a'}
          m['source_qa_receipts'].append('S7_REPLAY_RECEIPT.json')
          m['S7_aggregate_arithmetic_and_prior_source_receipt_consistency_replayed']=True
          m['full_SI_replayed']=False
          m['limitations']+=' S7 archived port counts, historical index cells, and paired means replayed; nutrient, locality medians, and marine prior receipts checked, not fresh upstream models. Historical GBIF provider attribution remains open. Original S6 and S7 evidence may include identifying repository references; preserve exact originals internally and prepare separate anonymized delivery.'
          entries[manifest]=(json.dumps(m,indent=2,ensure_ascii=False)+'\n').encode()
          readme='README_INTERNAL_NOT_FOR_JOURNAL_REVIEW.md'
          entries[readme]=(base[readme].decode().replace('ten-component','eleven-component')+'\n11. S7: run python components/s7_evidence/replay.py from that component directory. Saved aggregate arithmetic and prior source-receipt consistency only. Original port and historical data attribution and external source rights remain open. Internal archive contains original identifying provenance; never send directly to reviewers.\n').encode()
          assert {n for n in base if entries[n]!=base[n]}=={manifest,readme}
          patterns={'owner_account':rb'zuizui0223','author_name':rb'ZHANG[ _\.-]?(?:RUIQI|RACHEL)','email':rb'[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}','local_path':rb'/(?:home|Users|workspace|mnt/data)/[A-Z0-9_.-]+/'}
          flags=[]
          for n,b in entries.items():
              check=gzip.decompress(b) if n.endswith('.gz') else b
              for k,p in patterns.items():
                  if re.search(p,n.encode(),re.I) or re.search(p,check,re.I): flags.append({'file':n,'kind':k})
          out=P('delivery');out.mkdir()
          dest=out/'GEB_V05_INTERNAL_PARTIAL_S1_S7_NOT_FOR_REVIEW.zip'
          with zipfile.ZipFile(dest,'w') as z:
              for n,b in sorted(entries.items()):
                  i=zipfile.ZipInfo(n,(2026,11,24,0,0,0));i.compress_type=zipfile.ZIP_DEFLATED;i.external_attr=0o644<<16;z.writestr(i,b)
          with zipfile.ZipFile(dest) as z:
              assert z.testzip() is None and {n:z.read(n) for n in z.namelist()}==entries
              z.extractall('extracted')
          root=P('extracted/components/s7_evidence')
          subprocess.run([sys.executable,'replay.py'],cwd=root,check=True)
          assert json.loads((root/'S7_RESULT.json').read_text())==r['source_result']
          report={'status':'S7_INTEGRATED_AGGREGATE_REPLAY_PASS_INTERNAL_ONLY','files':191,'prior_members_unchanged':168,'new_component_files':20,'new_receipts':1,'previous_17_groups_preverified':True,'S7_replayed_after_final_extraction':True,'direct_identifier_flags':flags,'direct_identifier_scan_pass':not flags,'zip_sha256':sha(dest.read_bytes()),'zip_size':dest.stat().st_size,'full_SI_replayed':False,'reviewer_access_URL_exists':False,'permanent_archive_DOI_exists':False}
          (out/'INTEGRATION_QA.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GEB-v05-S7-INTEGRATED-191-INTERNAL-ONLY
          path: delivery/
          if-no-files-found: error
          retention-days: 90
