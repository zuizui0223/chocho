name: Original US butterfly survey count schema and source verification
on:
  push:
    branches:
      - analysis/sbus-host-sharing-abundance-20261025
    paths:
      - 'scripts/audit_sbus_original_counts_20261025.py'
      - '.github/workflows/sbus-original-counts-20261025.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  source-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify original CC-BY 55 MB survey count archive MD5 and schema
        run: |
          python scripts/audit_sbus_original_counts_20261025.py \
            --out provenance/reviewer_defenses/results/sbus_original_survey_count_source_gate_20261025.json
      - name: Archive aggregate-only count-source receipt
        uses: actions/upload-artifact@v4
        with:
          name: us-sbus-original-count-source-schema-20261025
          path: provenance/reviewer_defenses/results/sbus_original_survey_count_source_gate_20261025.json
      - name: Preserve original-source receipt in analysis branch only
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs=require('fs');
            const path='provenance/reviewer_defenses/results/sbus_original_survey_count_source_gate_20261025.json';
            const owner=context.repo.owner,repo=context.repo.repo,branch=context.ref.replace('refs/heads/','');
            const content=Buffer.from(fs.readFileSync(path)).toString('base64');
            let sha;
            try{sha=(await github.rest.repos.getContent({owner,repo,path,ref:branch})).data.sha;}
            catch(e){if(e.status!==404)throw e;}
            const p={owner,repo,path,branch,content,message:'Archive true survey counts source QC (aggregate only, original binary not copied)'};
            if(sha)p.sha=sha;
            await github.rest.repos.createOrUpdateFileContents(p);
