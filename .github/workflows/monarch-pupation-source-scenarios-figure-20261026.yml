name: Monarch actual pupation discrepancy evidence figure
on:
  push:
    branches:
      - analysis/monarch-leaf-age-conversion-gate-20261026
    paths:
      - 'scripts/render_monarch_leaf_age_pupation_source_scenarios_20261026.py'
      - '.github/workflows/monarch-pupation-source-scenarios-figure-20261026.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  reproduce-source-label-uncertainty:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install plot dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'matplotlib>=3.9,<4'
      - name: Create two-scenario trial-block pupation interval figure from source-checked receipt
        run: |
          python scripts/render_monarch_leaf_age_pupation_source_scenarios_20261026.py \
            --svg docs/exploratory/figures/Monarch_leaf_age_pupation_discrepant_source_20261026.svg \
            --png docs/exploratory/figures/Monarch_leaf_age_pupation_discrepant_source_20261026.png
      - uses: actions/upload-artifact@v4
        with:
          name: monarch-leaf-age-source-conflict-survival-figure
          path: |
            docs/exploratory/figures/Monarch_leaf_age_pupation_discrepant_source_20261026.svg
            docs/exploratory/figures/Monarch_leaf_age_pupation_discrepant_source_20261026.png
      - name: Archive only source derived vector/raster plot
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs=require('fs');
            const owner=context.repo.owner,repo=context.repo.repo;
            const branch=context.ref.replace('refs/heads/','');
            for(const path of [
              'docs/exploratory/figures/Monarch_leaf_age_pupation_discrepant_source_20261026.svg',
              'docs/exploratory/figures/Monarch_leaf_age_pupation_discrepant_source_20261026.png'
            ]){
              let sha;
              try{sha=(await github.rest.repos.getContent({owner,repo,path,ref:branch})).data.sha;}
              catch(e){if(e.status!==404)throw e;}
              const args={owner,repo,path,branch,
                content:Buffer.from(fs.readFileSync(path)).toString('base64'),
                message:'Archive source-verified original monarch pupation two-scenario plot'};
              if(sha)args.sha=sha;
              await github.rest.repos.createOrUpdateFileContents(args);
            }
