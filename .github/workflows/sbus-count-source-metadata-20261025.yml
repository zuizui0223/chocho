name: SBUS US butterfly count source metadata gate
on:
  push:
    branches:
      - analysis/sbus-host-sharing-abundance-20261025
    paths:
      - 'scripts/audit_sbus_figshare_metadata_20261025.py'
      - '.github/workflows/sbus-count-source-metadata-20261025.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify original Figshare article, fixed butterfly names, file list and licence
        run: |
          python scripts/audit_sbus_figshare_metadata_20261025.py \
            --out provenance/reviewer_defenses/results/sbus_figshare_count_source_metadata_20261025.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbus-2025-counts-original-metadata-gate
          path: provenance/reviewer_defenses/results/sbus_figshare_count_source_metadata_20261025.json
      - name: Commit original source metadata receipt without private survey rows
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs=require('fs');
            const path='provenance/reviewer_defenses/results/sbus_figshare_count_source_metadata_20261025.json';
            const owner=context.repo.owner,repo=context.repo.repo;
            const branch=context.ref.replace('refs/heads/','');
            const content=Buffer.from(fs.readFileSync(path)).toString('base64');
            let sha;try{sha=(await github.rest.repos.getContent({owner,repo,path,ref:branch})).data.sha;}catch(e){if(e.status!==404)throw e;}
            const payload={owner,repo,path,branch,content,message:'Archive primary source license, file sizes and SHA metadata'};
            if(sha)payload.sha=sha;
            await github.rest.repos.createOrUpdateFileContents(payload);
