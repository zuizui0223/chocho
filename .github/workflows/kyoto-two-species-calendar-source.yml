name: Kyoto A/S dated source and stage-overlap audit
on:
  workflow_dispatch:
  push:
    branches: [theory/temporal-resource-competition-v01]
    paths:
      - "scripts/audit_kyoto_calendar_demand_identifiability.py"
      - "tests/test_kyoto_calendar_demand_identifiability.py"
      - "scripts/reconstruct_kyoto_late_instar_intake.py"
      - "tests/test_kyoto_late_instar_intake.py"
      - ".github/workflows/kyoto-two-species-calendar-source.yml"
permissions:
  contents: read
jobs:
  source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Offline parser controls
        run: |
          python -m pip install pytest==8.3.4
          python -m pytest -q tests/test_kyoto_calendar_demand_identifiability.py tests/test_kyoto_late_instar_intake.py
      - name: Source-verifiable date, feeding-sheet, and co-occurring instar audit
        run: |
          python scripts/audit_kyoto_calendar_demand_identifiability.py \
            --receipt results/kyoto_two_species_dated_source_v01.json
      - name: Reconstruct published two-day intake, explicitly not mixed-cage survival
        run: |
          python scripts/reconstruct_kyoto_late_instar_intake.py \
            --receipt results/kyoto_late_instar_intake_v01.json
      - name: Keep the exact source provenance and decision
        uses: actions/upload-artifact@v4
        with:
          name: kyoto-two-species-calendar-source-v01
          path: |
            results/kyoto_two_species_dated_source_v01.json
            results/kyoto_late_instar_intake_v01.json
          retention-days: 30
