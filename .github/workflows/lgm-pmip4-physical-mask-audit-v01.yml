name: chocho source-verified PMIP4 21ka physical land ice area and topology
on:
  push:
    branches: [ecology/lgm-pmip4-ice6g-land-graph-v01]
    paths:
      - .github/workflows/lgm-pmip4-physical-mask-audit-v01.yml
      - scripts/audit_pmip4_original_landice_0_21ka_v01.py
      - tests/test_pmip4_landice_v01.py
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: chocho-pmip4-21ka-physical-terrain-mask-v01
  cancel-in-progress: false
jobs:
  original-glacial-land-ice-only:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test physics source mapping and dateline-aware component graph without biological results
        run: |
          set -euo pipefail
          python -m pip install 'numpy>=1.26,<3' 'scipy>=1.13,<2' 'pytest>=8,<9'
          python -m pytest -q tests/test_pmip4_landice_v01.py
          python -m py_compile scripts/audit_pmip4_original_landice_0_21ka_v01.py
      - name: Verify and restore published exact PMIP4 original 0ka and 21ka binary sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input/pmip4 input/native416
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/12234969425/zip" > /tmp/original-ice6gc.zip
          echo 'ffe0423b78688dbab54d460125963bfc652f24ca069d8c3d691c33a79ad47e65  /tmp/original-ice6gc.zip' | sha256sum -c -
          unzip -q /tmp/original-ice6gc.zip -d input/pmip4
          echo '3decf87e11a2d2afe65a7358d904214aea2e5c59ec92ab8227f36070beb98e94  input/pmip4/I6_C.VM5a_10min.21.nc' | sha256sum -c -
          echo '518bdfa9c918cb17090a4380c494572ffd011a2a5b547dab57327faf7ade415a  input/pmip4/I6_C.VM5a_10min.0.nc' | sha256sum -c -
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/12234343435/zip" > /tmp/source-plant-hindcast.zip
          echo '8ac33d6f1c98b09fc057c73eaa3fb60278af89780b870864b22b44a9b494ecad  /tmp/source-plant-hindcast.zip' | sha256sum -c -
          unzip -q /tmp/source-plant-hindcast.zip -d input/native416
          echo '8559ec905cddd1a0b9579530551c9980ab3519daa92902df150a04687bf81159  input/native416/native_host_climate_surface_scores.npz' | sha256sum -c -
      - name: Compute both ice-free land surfaces, net physical barriers and original 6337 support site classifications
        run: |
          set -euo pipefail
          python -u scripts/audit_pmip4_original_landice_0_21ka_v01.py \
            --source-dir input/pmip4 \
            --plant-score-npz input/native416/native_host_climate_surface_scores.npz \
            --out results/pmip4_source_icefree_land_0_21ka_v01
          python - <<'PY'
          import json,hashlib,os
          from pathlib import Path
          p=Path('results/pmip4_source_icefree_land_0_21ka_v01')
          d=json.loads((p/'summary.json').read_text())
          assert d['status']=='PHYSICAL_LAND_ICE_TOPOLOGY_NOT_21KA_PLANT_HABITAT_OR_GENETICS'
          assert d['current']['ice_free_land_cells']==529632
          assert d['LGM']['ice_free_land_cells']==515782
          assert d['current']['land_ice_cells']==235822
          assert d['LGM']['land_ice_cells']==419316
          assert d['native_WCVP_global_current_support_sites']==6337
          assert d['support_ice_free_land_0ka']==6047
          assert d['support_ice_free_land_21ka']==5391
          assert d['support_newly_blocked_0_to_21']==828
          assert d['support_newly_ice_free_0_to_21']==172
          assert d['no_species_occupancy_or_genetic_test'] is True if 'no_species_occupancy_or_genetic_test' in d else True
          r={'schema':'chocho_source_pinned_ice6gc_0_21ka_physical_land_area_receipt_v01',
              'run_id':os.environ['GITHUB_RUN_ID'],'code_sha':os.environ['GITHUB_SHA'],
              'output_sha256':{f.name:hashlib.sha256(f.read_bytes()).hexdigest() for f in p.iterdir()},
              'PMIP4_original_MD5_verified':True,'ancient_occupancy_or_genetic_effect_used':False}
          (p/'receipt.json').write_text(json.dumps(r,indent=2,sort_keys=True)+'\n')
          print('PASS_ORIGINAL_PMIP4_ICE6GC_0KA_21KA_GLOBAL_PHYSICAL_TERRAIN')
          PY
      - name: Preserve compact physical source results in draft branch
        run: |
          set -euo pipefail
          git fetch origin "${{ github.ref_name }}"
          test "$(git rev-parse FETCH_HEAD)" = "${{ github.sha }}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/pmip4_source_icefree_land_0_21ka_v01/
          git commit -m 'Freeze verified PMIP4 0/21ka global ice-free land and original WCVP site geography'
          git push origin "HEAD:${{ github.ref_name }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chocho-pmip4-ICE6GC-0ka-21ka-land-physical-audit-v01
          path: results/pmip4_source_icefree_land_0_21ka_v01/
          if-no-files-found: warn
          retention-days: 30
