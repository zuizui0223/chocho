name: Preflight complete 225-species historical GBIF query on Catalina
on:
  push:
    branches: [analysis/port-host-ocean-interaction-20261114]
    paths:
      - scripts/screen_pre2001_all_11475_risk_cells_20261114.py
      - .github/workflows/chocho-pre2001-225-catalina-smoke.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-225-species-gbif-facet:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'numpy>=1.26,<3' 'geopandas>=1.0,<2' 'pyproj>=3.5,<4' 'shapely>=2,<3'
      - uses: actions/cache@v4
        with:
          key: chocho-original-gshhg-shp-237-sha8dbbe7e
          path: _scratch_coastal/gshhg-shp-2.3.7.zip
      - name: Check GSHHG original source archive
        run: |
          mkdir -p _scratch_coastal
          if test ! -s _scratch_coastal/gshhg-shp-2.3.7.zip; then
            curl -fSL --retry 3 --max-time 360 -o _scratch_coastal/gshhg-shp-2.3.7.zip https://github.com/GenericMappingTools/gshhg-gmt/releases/download/2.3.7/gshhg-shp-2.3.7.zip
          fi
          echo "8dbbe7e071e77e9e75f2d639239099ebca8d5c16d6a07df8169729d49f15cf41  _scratch_coastal/gshhg-shp-2.3.7.zip" | sha256sum --check
      - name: Request all 225 source butterflies on original Santa Catalina polygon
        run: |
          python scripts/screen_pre2001_all_11475_risk_cells_20261114.py \
            --gshhg-zip _scratch_coastal/gshhg-shp-2.3.7.zip \
            --work _scratch_coastal/smoke_full225 \
            --islands "951" --batch-id "smoke" \
            --max-queries 4 --wkt-max-chars 2300 \
            --out-dir results/pre2001_smoke_full225
          python - <<'PY'
          import csv,json
          from pathlib import Path
          j=json.loads(Path('results/pre2001_smoke_full225/full_history_receipt_batch_smoke.json').read_text())
          assert j['source_status']=='COMPLETE' and j['source_fragment_queries']==1
          rows=list(csv.DictReader(Path('results/pre2001_smoke_full225/full_history_batch_smoke.csv').open()))
          assert len(rows)==225
          p=[r for r in rows if r['speciesKey']=='1920496']
          assert len(p)==1 and int(p[0]['pre2001_indexed_records'])>=1,p
          print('FULL 225 TAXONKEYS SOURCE FILTER AND CATALINA HISTORICAL INDEX VERIFIED')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chocho-pre2001-full225-catalina-smoke
          path: results/pre2001_smoke_full225/
          if-no-files-found: warn
          retention-days: 30
