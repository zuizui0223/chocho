name: temporal-pseudohost-match-bootstrap

on:
  push:
    branches:
      - analysis/resource-homogenization-v01
    paths:
      - ".github/workflows/temporal-pseudohost-match-bootstrap.yml"
      - "scripts/build_wcvp_introduced_plant_pool.R"
      - "scripts/build_butterfly_temporal_pseudohost_matches.py"
      - "scripts/query_butterfly_temporal_pseudohost_history.py"
      - "scripts/analyze_butterfly_temporal_pseudohost_lag.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: temporal-pseudohost-null
  cancel-in-progress: true

jobs:
  match:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: python -m pip install "numpy>=2,<3" "shapely>=2,<3"
      - name: Checkout fixed WCVP
        uses: actions/checkout@v4
        with:
          repository: matildabrown/rWCVPdata
          ref: 65bed76bae9d644ccb6ad200c05f9f5071d89e05
          path: _external/WCVP
      - name: Download frozen interaction sidecar
        uses: actions/download-artifact@v4
        with:
          name: temporal-hindcast-sidecars
          path: _sidecars
          github-token: ${{ github.token }}
          repository: zuizui0223/chocho
          run-id: 37628559686
      - name: Download SInAS 2.5
        run: |
          mkdir -p _external results/exploratory
          python - <<'PY'
          import urllib.request
          url="https://zenodo.org/api/records/10038256/files/SInAS_AlienSpeciesDB_2.5.csv/content"
          req=urllib.request.Request(url,headers={"User-Agent":"chocho-pseudohost-bootstrap/0.1"})
          with urllib.request.urlopen(req,timeout=240) as r, open("_external/SInAS_AlienSpeciesDB_2.5.csv","wb") as f:
              while True:
                  b=r.read(1<<20)
                  if not b: break
                  f.write(b)
          PY
      - name: Build all-plant introduced pool
        run: |
          Rscript scripts/build_wcvp_introduced_plant_pool.R             _external/WCVP             results/exploratory/wcvp_all_introduced_plants_v0.1.csv
      - name: Build matched pseudo-host candidates
        run: |
          python scripts/build_butterfly_temporal_pseudohost_matches.py             --event-host-csv docs/exploratory/butterfly_temporal_lag_event_hosts_v0.1.csv             --insect-host-csv _sidecars/native/insect_host_accepted.csv             --introduced-pool-csv results/exploratory/wcvp_all_introduced_plants_v0.1.csv             --sinas-csv _external/SInAS_AlienSpeciesDB_2.5.csv             --matches-per-host 10             --output-csv results/exploratory/butterfly_temporal_pseudohost_matches_v0.1.csv             --output-json results/exploratory/butterfly_temporal_pseudohost_matches_v0.1.json
      - name: Checkout fixed WGSRPD
        uses: actions/checkout@v4
        with:
          repository: tdwg/wgsrpd
          ref: 52da7828aba9d461dd133c27b3bd7a4407161f54
          path: _external/WGSRPD
      - name: Query exact local record histories
        run: |
          python scripts/query_butterfly_temporal_pseudohost_history.py \
            --matches-csv results/exploratory/butterfly_temporal_pseudohost_matches_v0.1.csv \
            --level3-geojson _external/WGSRPD/geojson/level3.geojson \
            --start-year 1800 \
            --end-year 2025 \
            --request-spacing-seconds 0.25 \
            --output-csv results/exploratory/butterfly_temporal_pseudohost_local_history_v0.1.csv \
            --output-json results/exploratory/butterfly_temporal_pseudohost_local_history_v0.1.json
      - name: Evaluate identity-specific temporal lag null
        run: |
          python scripts/analyze_butterfly_temporal_pseudohost_lag.py \
            --queried-csv results/exploratory/butterfly_temporal_pseudohost_local_history_v0.1.csv \
            --permutations 99999 \
            --seed 20261007 \
            --minimum-dated-pseudos-per-host 3 \
            --output-json results/exploratory/butterfly_temporal_pseudohost_lag_null_v0.1.json \
            --output-cell-csv results/exploratory/butterfly_temporal_pseudohost_lag_cells_v0.1.csv
      - uses: actions/upload-artifact@v4
        with:
          name: butterfly-temporal-pseudohost-null-v01
          path: |
            results/exploratory/butterfly_temporal_pseudohost_matches_v0.1.csv
            results/exploratory/butterfly_temporal_pseudohost_matches_v0.1.json
            results/exploratory/butterfly_temporal_pseudohost_local_history_v0.1.csv
            results/exploratory/butterfly_temporal_pseudohost_local_history_v0.1.json
            results/exploratory/butterfly_temporal_pseudohost_lag_null_v0.1.json
            results/exploratory/butterfly_temporal_pseudohost_lag_cells_v0.1.csv
          if-no-files-found: error
          retention-days: 14
