name: chocho WPI Canary Islands geography correction v02
on:
  push:
    branches:
      - analysis/island-mainland-host-opportunity-20261102
    paths:
      - scripts/rescope_three_gate_WPI_CNY.py
      - .github/workflows/chocho-three-gate-port-CNY-correction.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  geography-only:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reclass only CNY without fetching WPI again
        run: |
          python -m py_compile scripts/rescope_three_gate_WPI_CNY.py
          python scripts/rescope_three_gate_WPI_CNY.py \
            --source-counts results/three-gate-wpi-port/wgsrpd3_port_counts.csv \
            --source-audit results/three-gate-wpi-port/wpi_port_exposure_audit.json \
            --corrected-q1-classifier scripts/analyze_wgsrpd3_island_mainland_resource.py \
            --out-dir results/three-gate-wpi-port-v02
      - name: Save audited 126-island port exposure
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/three-gate-wpi-port-v02/
          git diff --cached --quiet && exit 0
          git commit -m 'Correct Canary island WPI port exposure from published source [skip ci]'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
