name: chocho source-locked 27-pair nutrient turnover and rarefaction

on:
  pull_request:
    paths:
      - "scripts/exploratory_port_n_turnover_rarefaction.py"
      - "tests/test_exploratory_port_n_turnover_rarefaction.py"
      - ".github/workflows/chocho-port-n-turnover-rarefaction.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  no-live-GBIF-only-frozen-source:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate unbiased source-free rarefaction sampling
        run: |
          python -m pip install --quiet pytest
          python -m pytest -q tests/test_exploratory_port_n_turnover_rarefaction.py
      - name: Fetch pinned all-flora record counts and trait mapping with no GBIF calls
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/n_turnover
          gh run download 41407370295 \
            --name allflora-N-host-vs-other-WPI78 \
            --dir /tmp/n_turnover \
            --repo zuizui0223/chocho
          test -s /tmp/n_turnover/allplant_312_facets.jsonl
          test -s /tmp/n_turnover/allplant_GBIF_mapping.json
          test -s /tmp/n_turnover/allplant_N_background_analysis.json
      - name: Fixed 27-pair 6-island turnover and depth-matched index thinning
        run: |
          python -u scripts/exploratory_port_n_turnover_rarefaction.py \
            --raw-facets /tmp/n_turnover/allplant_312_facets.jsonl \
            --mapping /tmp/n_turnover/allplant_GBIF_mapping.json \
            --aggregates /tmp/n_turnover/allplant_N_background_analysis.json \
            --draws 399 --depth-cap 120 --seed 312211 \
            --output /tmp/n_turnover/turnover_rarefaction_receipt.json
          python - <<'PY'
          import json
          from pathlib import Path
          v=json.loads(Path('/tmp/n_turnover/turnover_rarefaction_receipt.json').read_text())
          assert v['comparison_port_pairs']==27
          assert v['comparison_independent_islands']==6
          assert v['specieskey_facet_records_verified']==312
          assert len(v['rarefaction']['individual_draws'])==399
          print('RAREFACTION_27_PAIRED_SOURCE_VERIFIED')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-locked-port-N-turnover-rarefaction-WPI27
          path: /tmp/n_turnover/turnover_rarefaction_receipt.json
          if-no-files-found: warn
          retention-days: 30
