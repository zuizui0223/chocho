name: chocho CIRAD 2022 agricultural-N vs human-N WPI port independent robustness

on:
  pull_request:
    paths:
      - "scripts/exploratory_cirad_n_robustness.py"
      - "tests/test_exploratory_cirad_n_robustness.py"
      - ".github/workflows/chocho-cirad-n-robustness.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  offline-source-locked:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Offline unit tests of independent fixed-effect estimators
        run: |
          python -m pip install --quiet pytest numpy pandas scipy statsmodels rasterio pyproj
          python -m pytest -q tests/test_exploratory_cirad_n_robustness.py
      - name: Retrieve frozen global Jones2015 WWp, WorldCover2021 and CIRAD2022 port N exposures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/cirad_audit/jones /tmp/cirad_audit/urban /tmp/cirad_audit/n
          gh run download 41563940689 --name pangaea-jones2015-5arc-wpi1596-wastewater-wwtp --dir /tmp/cirad_audit/jones --repo zuizui0223/chocho
          gh run download 41562997326 --name hydroWASTE-WPI1596-WorldCover2021-urban --dir /tmp/cirad_audit/urban --repo zuizui0223/chocho
          gh run download 41923811745 --name cirad-2022-human-vs-cropland-N-WPI1596-source-checked --dir /tmp/cirad_audit/n --repo zuizui0223/chocho
          test -s /tmp/cirad_audit/jones/Jones2015_WPI1596_port_grid_census.csv
          test -s /tmp/cirad_audit/urban/WPI1596_worldcover2021_port_measurements.csv
          test -s /tmp/cirad_audit/n/WPI1596_human_crop_N_source_features.csv
      - name: Test fixed-cohort N models, negative controls, same radii and country leave-one-out
        run: |
          python -u scripts/exploratory_cirad_n_robustness.py \
            --jones /tmp/cirad_audit/jones/Jones2015_WPI1596_port_grid_census.csv \
            --urban /tmp/cirad_audit/urban/WPI1596_worldcover2021_port_measurements.csv \
            --grid /tmp/cirad_audit/n/WPI1596_human_crop_N_source_features.csv \
            --out /tmp/cirad_audit/cirad_2022_N_WPI1596_robustness.json
          python - <<'PY'
          import json,math
          from pathlib import Path
          d=json.loads(Path('/tmp/cirad_audit/cirad_2022_N_WPI1596_robustness.json').read_text())
          assert d['matched_1041ports_42countries']
          assert d['matched_1041ports_42countries']
          assert len(d['leave_one_country_out'])==42
          assert abs(d['original_model']['log_crop_N']['beta']-.039927909973897)<1e-10
          for key in ('alien','native'):
              assert math.isfinite(d['negative_controls'][key]['log_crop_N']['beta'])
          print('CIRAD_2022_N_ROBUSTNESS_SOURCE_VERIFIED')
          PY
      - name: Archive analytical receipt, no copyrighted source GPKG replication
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cirad-2022-N-WPI1596-country-robustness
          path: /tmp/cirad_audit/cirad_2022_N_WPI1596_robustness.json
          if-no-files-found: warn
          retention-days: 30
