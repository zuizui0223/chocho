name: Rebuild original155 full forecast panel with three found original source inputs
on:
  push:
    branches: [analysis/geb-v05-review-data-source-audit-20261120]
    paths:
      - .github/workflows/replay-GEB155-full-panel-extra3-20261124.yml
      - scripts/replay_GEB_v05_original155_all_columns_20261124.py
      - tests/test_replay_GEB_v05_original155_all_columns_20261124.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  original-source-panel:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          path: audit
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 42f8fcc3a388e96456c76180d7e56d75dd2ed48c
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned prior successful replay libraries
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'numpy==2.3.5' 'pandas==2.2.3' 'pyarrow==23.0.1' 'scipy==1.18.1' 'scikit-learn==1.7.2' 'pyproj==3.7.2' 'joblib==1.5.3'
          python audit/tests/test_replay_GEB_v05_original155_all_columns_20261124.py
          mkdir -p safe
      - name: Reconstruct all original panel columns from the SHA-verified 13 inputs and original builder
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -u audit/scripts/replay_GEB_v05_original155_all_columns_20261124.py \
            --snapshot source/provenance/reviewer_defenses/results/host_forecast_validation_20261029 \
            --output safe/ORIGINAL155_ALL_PANEL_COLUMNS_REPLAY_20261124.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GEB155-all-panel-columns-from-recovered-source-aggregates-only
          path: safe/ORIGINAL155_ALL_PANEL_COLUMNS_REPLAY_20261124.json
          retention-days: 90
          if-no-files-found: warn
