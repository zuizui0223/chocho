name: "Butterfly candidate migrant-only trait and ocean-access source validation"
on:
  push:
    branches: [analysis/butterfly-trait-public51-20261109]
    paths:
      - scripts/run_public51_author_selected_migrant_access_20261109.py
      - .github/workflows/chocho-public51-author-migrant-access.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate-migrant-index:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original model dependencies
        run: python -m pip install --disable-pip-version-check numpy scikit-learn
      - name: Verify source version and model syntax before science
        run: |
          python -m py_compile scripts/run_public51_author_selected_migrant_access_20261109.py
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path("data/exploratory/public51_author_migrant_20261109/migration_gbif_author2025_crosswalk.csv")
          b=p.read_bytes()
          blob=hashlib.sha1(b"blob "+str(len(b)).encode()+b"\0"+b).hexdigest()
          assert blob=="439dd1034ca16f96ff94222695d98dc39747c2e4"
          assert "NOT_LISTED_OR_TAXON_UNRESOLVED_UNKNOWN" in b.decode()
          print("PASS crosswalk remains original, unlisted=UNKNOWN")
          PY
      - name: Analyze author-reviewed migration-candidate butterflies from pinned 225×51 indexed source
        run: |
          python scripts/run_public51_author_selected_migrant_access_20261109.py \
            --out-dir results/public51_author_selected_migrant_access_20261109
      - name: Preserve all same-row heldout predictions and explicit unknown-status sensitivity
        uses: actions/upload-artifact@v4
        with:
          name: butterfly51-author-selected-migrant-proxy-OOF-20261109
          path: results/public51_author_selected_migrant_access_20261109/
          if-no-files-found: error
          retention-days: 60
