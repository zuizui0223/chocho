name: strict forward Melitaea host decline predictive test
on:
  workflow_dispatch:
  push:
    branches: [exploration/realized-host-window-v01]
    paths:
      - "docs/exploratory/MELITAEA_19YEAR_STRICT_FORWARD_VALIDATION_V01.json"
      - "scripts/analyze_melitaea_19year_strict_forward.py"
      - "tests/test_melitaea_19year_strict_forward.py"
      - ".github/workflows/melitaea-19year-strict-forward.yml"
permissions:
  contents: read
jobs:
  forward:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install fixed model dependencies
        run: |
          python -m pip install numpy==2.1.3 scikit-learn==1.6.1 pytest==8.3.4
      - name: Assert no future-year training information
        run: |
          python -m pytest -q tests/test_melitaea_19year_strict_forward.py
      - name: Fit predeclared forward-only future-year host-backup comparison
        run: |
          python scripts/analyze_melitaea_19year_strict_forward.py --receipt results/melitaea_19year_strict_forward_v01.json
      - uses: actions/upload-artifact@v4
        with:
          name: melitaea-strict-forward-host-backup-v01
          path: results/melitaea_19year_strict_forward_v01.json
          retention-days: 30
