name: Original individual monarch pupation and leaf-development source replay
on:
  push:
    branches:
      - analysis/monarch-leaf-age-conversion-gate-20261026
    paths:
      - 'scripts/analyze_monarch_leaf_age_stage_conversion_20261026.py'
      - '.github/workflows/monarch-leaf-pupation-stage-conversion-20261026.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  exact-original-butterfly-life-stage-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned numerical distribution libraries
        run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.13,<2'
      - name: Checkout original named-monarch top versus bottom leaf source
        uses: actions/checkout@v4
        with:
          repository: kelseyefisher/MilkweedLeafAgeMonarchSuccess
          ref: acbb93c75e1f4810355c6ce03e6076e2303b2a98
          path: _external/MilkweedLeafAgeMonarch
      - name: Audit actual four-trial butterfly pupation and conditional growth under exact source checksums
        run: |
          python -u scripts/analyze_monarch_leaf_age_stage_conversion_20261026.py \
            --source-repo _external/MilkweedLeafAgeMonarch \
            --out provenance/reviewer_defenses/results/monarch_leaf_age_pupation_stage_conversion_20261026.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monarch-4-trial-original-leaf-age-true-pupation-stage-source-audit
          path: provenance/reviewer_defenses/results/monarch_leaf_age_pupation_stage_conversion_20261026.json
          if-no-files-found: ignore
      - name: Archive only experimental outcome summaries, not larvae IDs
        if: success()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs=require('fs');
            const path='provenance/reviewer_defenses/results/monarch_leaf_age_pupation_stage_conversion_20261026.json';
            const owner=context.repo.owner,repo=context.repo.repo;
            const branch=context.ref.replace('refs/heads/','');
            const content=Buffer.from(fs.readFileSync(path)).toString('base64');
            let sha;
            try{sha=(await github.rest.repos.getContent({owner,repo,path,ref:branch})).data.sha;}
            catch(e){if(e.status!==404)throw e;}
            const data={owner,repo,path,branch,content,
              message:'Archive verified butterfly true pupation block uncertainty and stage-conditioned growth'};
            if(sha)data.sha=sha;
            await github.rest.repos.createOrUpdateFileContents(data);
