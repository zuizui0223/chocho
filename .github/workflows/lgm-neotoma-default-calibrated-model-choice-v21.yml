name: chocho Neotoma Alnus 21 LGM-labelled original pollen samples default calibrated chronology sensitivity v21
on:
  push:
    branches: [ecology/lgm-neotoma-21ka-chronology-controls-v19]
    paths:
      - .github/workflows/lgm-neotoma-default-calibrated-model-choice-v21.yml
      - scripts/audit_neotoma_Alnus_model_choice_v21.py
      - tests/test_neotoma_Alnus_model_choice_v21.py
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: chocho-21-sample-Neotoma-default-age-choice-v21
  cancel-in-progress: false
jobs:
  source-only-original-21-sample-chronology-sensitivity:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirm all original twenty-one source sample ages and eleven chronologies before default chronology sensitivity
        run: |
          set -euo pipefail
          python -m pip install 'pytest>=8,<9'
          python -m pytest -q tests/test_neotoma_Alnus_model_choice_v21.py tests/test_neotoma_Alnus_age_controls_v20.py
          python -m py_compile scripts/audit_neotoma_Alnus_model_choice_v21.py
          echo 'aae646cfc66b7efc299a21b4a5ae83f52a9be90543ede2e5f50bedab63b5dbc8  results/lgm_neotoma_21_Alnus_sample_chronology_control_qc_v20/all_21_original_Alnus_age_depth_caveats_v20.csv' | sha256sum -c -
          echo '4f957787237867d210b97bebda8a2ef581b8188ed21146d3419241719e43f386  results/lgm_neotoma_21_Alnus_sample_chronology_control_qc_v20/all_11_original_chronology_metadata_v20.csv' | sha256sum -c -
          echo '6f69c5189746ab3fa4bfd7a2bde929828f15c15cb34aba4e78b05bc2b206c0df  results/lgm_neotoma_21_Alnus_sample_chronology_control_qc_v20/summary.json' | sha256sum -c -
      - name: Independently audit all original calibrated source ages using default chronology on the identical pollen sample IDs
        run: |
          set -euo pipefail
          out=results/lgm_neotoma_21_Alnus_default_chronology_sensitivity_v21
          python scripts/audit_neotoma_Alnus_model_choice_v21.py \
            --v20-samples results/lgm_neotoma_21_Alnus_sample_chronology_control_qc_v20/all_21_original_Alnus_age_depth_caveats_v20.csv \
            --v20-models results/lgm_neotoma_21_Alnus_sample_chronology_control_qc_v20/all_11_original_chronology_metadata_v20.csv \
            --v20-summary results/lgm_neotoma_21_Alnus_sample_chronology_control_qc_v20/summary.json \
            --out "$out"
          python - <<'PY'
          import csv,hashlib,json,os
          from pathlib import Path
          p=Path('results/lgm_neotoma_21_Alnus_default_chronology_sensitivity_v21')
          s=json.loads((p/'summary.json').read_text())
          with (p/'all_21_Alnus_original_vs_default_ages_v21.csv').open(newline='') as f:
              rows=list(csv.DictReader(f))
          assert len(rows)==21
          assert s['status']=='EXPLORATORY_CHRONOLOGY_CHOICE_TRIAGE_NOT_CONFIRMED_21KA_LOCAL_ALNUS_OCCUPANCY'
          x=s['sample_counts']
          assert x['source_original_labelled_18_24ka_samples']==21
          assert x['source_original_nondefault_to_default_calibrated_changed']==10
          assert x['default_calibrated_center_inside_18_24ka']==11
          assert x['default_calibrated_center_outside_18_24ka']==10
          assert x['default_calibrated_center_in_18_24ka_and_reported_reliable_span']==10
          assert x['default_calibrated_center_18_24ka_both_reliable_and_controls_extent']==9
          assert x['source_missing_individual_uncertainty_bounds']==20
          assert s['accepted_independently_calibrated_21ka_samples']==0
          assert s['accepted_species_identified_local_Alnus_glutinosa_trees']==0
          assert not s['genetic_response_read']
          receipt={'schema':'chocho_21_Neotoma_Alnus_default_0BP_vs_LGM_model_choice_v21',
                   'run_id':os.environ['GITHUB_RUN_ID'],'code_sha':os.environ['GITHUB_SHA'],
                   'source_21_sampleIDs_unchanged':True,
                   'source_11_chronology_metadata_unchanged':True,
                   'output_sha256':{f.name:hashlib.sha256(f.read_bytes()).hexdigest()
                        for f in p.iterdir() if f.is_file()},
                   'no_independent_calibrated_age_or_fossil_population_confirmed':True}
          (p/'receipt.json').write_text(json.dumps(receipt,sort_keys=True,indent=2)+'\n')
          print(json.dumps(s,sort_keys=True))
          PY
      - name: Preserve only source-model-choice evidence, without new genotype or ancient plant claims
        run: |
          set -euo pipefail
          git fetch origin "${{ github.ref_name }}"
          test "$(git rev-parse FETCH_HEAD)" = "${{ github.sha }}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/lgm_neotoma_21_Alnus_default_chronology_sensitivity_v21/
          git commit -m 'Archive default calibrated chronology sensitivity on same 21 original Neotoma Alnus pollen samples'
          git push origin "HEAD:${{ github.ref_name }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chocho-21-Alnus-samples-default-calibrated-chronology-v21
          path: results/lgm_neotoma_21_Alnus_default_chronology_sensitivity_v21/
          retention-days: 30
          if-no-files-found: warn
