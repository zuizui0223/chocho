name: Daymet seasonal weather at 14 original rounded Illinois survey classes
on:
  push:
    branches:
      - analysis/sbus-environment-shock-20261026
    paths:
      - 'scripts/audit_sbus_daymet_14region_weather_source_20261026.py'
      - '.github/workflows/sbus-daymet-14bin-weather-source-20261026.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  no-raw-site-weather-source-test:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned monitoring source helper
        run: python -m pip install 'numpy>=1.26,<3'
      - name: Verify NOAA/NASA Daymet seasonal weather at original rounded regional locations
        run: |
          python -u scripts/audit_sbus_daymet_14region_weather_source_20261026.py \
            --out provenance/reviewer_defenses/results/sbus_daymet_14region_daily_source_gate_20261026.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbus-illinois-14coarse-weather-source-metadata
          path: provenance/reviewer_defenses/results/sbus_daymet_14region_daily_source_gate_20261026.json
      - name: Archive coarse 14-region source metadata without public site locations
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs=require('fs');
            const path='provenance/reviewer_defenses/results/sbus_daymet_14region_daily_source_gate_20261026.json';
            const owner=context.repo.owner,repo=context.repo.repo;
            const branch=context.ref.replace('refs/heads/','');
            const content=Buffer.from(fs.readFileSync(path)).toString('base64');
            let sha;
            try{sha=(await github.rest.repos.getContent({owner,repo,path,ref:branch})).data.sha;}
            catch(e){if(e.status!==404)throw e;}
            const props={owner,repo,path,branch,content,message:'Archive source-verified regional Daymet coverage only, never survey coordinates'};
            if(sha)props.sha=sha;
            await github.rest.repos.createOrUpdateFileContents(props);
