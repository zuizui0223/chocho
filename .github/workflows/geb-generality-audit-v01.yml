name: GEB generality audit v01

on:
  push:
    branches:
      - exploration/geb-generality-audit-v1
    paths:
      - ".github/workflows/geb-generality-audit-v01.yml"
      - "scripts/audit_geb_generality.py"
      - "docs/exploratory/geb_generality_audit_protocol_v0.1.json"
  workflow_dispatch:

concurrency:
  group: geb-generality-audit-v01-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"

      - name: Restore exact S1 reconstruction
        uses: actions/download-artifact@v4
        with:
          name: butterfly-resource-envelope-pilot-v01
          path: inputs/reconstruction
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: zuizui0223/TTF
          run-id: 36222306369

      - name: Restore exact frozen independent panel
        uses: actions/download-artifact@v4
        with:
          name: butterfly-climate-release-independent-panel-v01
          path: inputs/panel
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: zuizui0223/TTF
          run-id: 36238195242

      - name: Checkout pinned WCVP
        uses: actions/checkout@v4
        with:
          repository: matildabrown/rWCVPdata
          ref: 65bed76bae9d644ccb6ad200c05f9f5071d89e05
          path: _wcvp

      - name: Checkout pinned HOSTS
        uses: actions/checkout@v4
        with:
          repository: globalbioticinteractions/HOSTS
          ref: 808e0b869f9ec1adf8efff87cf6a395adda103e0
          path: _hosts

      - name: Checkout pinned WGSRPD
        uses: actions/checkout@v4
        with:
          repository: tdwg/wgsrpd
          ref: 52da7828aba9d461dd133c27b3bd7a4407161f54
          path: _wgsrpd

      - name: Verify frozen local inputs
        run: |
          echo "6ec35b8a31e96c971aeaa228a48aae9f107c40c33695f0d470aa4382ca6d635b  data/external/leptraits_consensus_v1.0.csv" | sha256sum -c -
          echo "894f48dbca1760fc4fa75bfee8f663540ab4b9380f8b9daf2bc09440e8bb0cdc  inputs/reconstruction/butterfly-resource-envelope-pilot-v0.1/s1_resource_descriptors.csv" | sha256sum -c -

      - name: Rebuild pinned native host sidecar
        run: |
          Rscript scripts/build_wcvp_hosts_sidecar.R _wcvp _hosts results/native-sidecar
          echo "0a084fb5273e4780b03e015205c87e4545c69f0f8e517feb1a2a3879889508e9  results/native-sidecar/insect_host_accepted.csv" | sha256sum -c -
          echo "c731906315f7452f83ce302c1d36c75ad94afc24ce7e24d461360312244ac558  results/native-sidecar/native_extant_nondoubtful_wgsrpd3.csv" | sha256sum -c -

      - name: Rebuild pinned contemporary host sidecar
        run: |
          Rscript scripts/build_wcvp_hosts_contemporary_sidecar.R _wcvp _hosts results/contemporary-sidecar

      - name: Run prospectively frozen GEB generality audit
        run: |
          mkdir -p results/geb-generality-audit-v0.1
          python scripts/audit_geb_generality.py \
            --protocol-json docs/exploratory/geb_generality_audit_protocol_v0.1.json \
            --leptraits-csv data/external/leptraits_consensus_v1.0.csv \
            --descriptors-csv inputs/reconstruction/butterfly-resource-envelope-pilot-v0.1/s1_resource_descriptors.csv \
            --insect-host-csv results/native-sidecar/insect_host_accepted.csv \
            --native-distribution-csv results/native-sidecar/native_extant_nondoubtful_wgsrpd3.csv \
            --contemporary-distribution-csv results/contemporary-sidecar/extant_nondoubtful_wgsrpd3.csv \
            --level3-geojson _wgsrpd/geojson/level3.geojson \
            --independent-panel-json inputs/panel/panel.json \
            --climate-result-json data/frozen/figure_sources/independent_climate_primary_result.json \
            --output-json results/geb-generality-audit-v0.1/result.json \
            --output-species-region-csv results/geb-generality-audit-v0.1/species_region.csv
          cat results/geb-generality-audit-v0.1/result.json

      - name: Freeze output hashes
        run: |
          cd results/geb-generality-audit-v0.1
          sha256sum result.json species_region.csv > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: geb-generality-audit-v01
          path: results/geb-generality-audit-v0.1/
          retention-days: 30
