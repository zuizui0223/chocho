name: Audit current GEB v0.5 reviewer source package (internal, not anonymous)
on:
  push:
    branches:
      - analysis/geb-v05-review-data-source-audit-20261120
    paths:
      - "scripts/audit_GEB_v05_review_source_bundle_20261120.py"
      - "scripts/verify_chocho_recovered_private_zip_20261120.py"
      - ".github/workflows/audit-geb-v05-review-source-preflight.yml"
  pull_request:
    branches:
      - paper/geb-single-island-port-endemics-20261118
    paths:
      - "scripts/audit_GEB_v05_review_source_bundle_20261120.py"
      - "scripts/verify_chocho_recovered_private_zip_20261120.py"
      - ".github/workflows/audit-geb-v05-review-source-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-current-review-source-lineage:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          path: current
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 3dbf038dab64e8bbc9ba6c0f5b0e19ce1cb2b250
          path: source_main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Source and figure identity preflight; deliberately non-anonymous internal preview
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile current/scripts/audit_GEB_v05_review_source_bundle_20261120.py
          python -m py_compile current/scripts/verify_chocho_recovered_private_zip_20261120.py
          python -u current/scripts/audit_GEB_v05_review_source_bundle_20261120.py \
            --current-root current \
            --source-root source_main \
            --out-dir dist/geb_v05_source_preflight
          python - <<'PY'
          import json,zipfile
          from pathlib import Path
          p=Path("dist/geb_v05_source_preflight")
          j=json.loads((p/"GEB_V05_SOURCE_PREVIEW_AUDIT.json").read_text())
          assert j["state"] == "INTERNAL_EVIDENCE_PREVIEW_ONLY_NOT_JOURNAL_REVIEW_ARCHIVE"
          assert j["figures"]["main_svg_count"] == 4
          assert j["figures"]["SI_svg_count"] == 2
          assert j["figures"]["source_numeric_receipts"] == 8
          assert all(x["exists"] for x in j["included_inventory"])
          assert j["publication_gates"]["anonymous_reviewer_access_and_stable_archive"] == "BLOCKED"
          z=p/"GEB_V05_INTERNAL_SOURCE_PREVIEW_NOT_ANONYMOUS.zip"
          with zipfile.ZipFile(z) as f:
            assert f.testzip() is None
            assert "README_INTERNAL_NOT_FOR_ANONYMOUS_REVIEW.md" in f.namelist()
          print("GEB_V05_SOURCE_PREVIEW_INCOMPLETE_BY_DESIGN_PASS")
          PY
          sha256sum dist/geb_v05_source_preflight/* > dist/geb_v05_source_preflight/SHA256SUMS.txt
      - name: Extract the preview ZIP and independently replay the fixed-239 isolation analyses
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p replay
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          p=Path("dist/geb_v05_source_preflight/GEB_V05_INTERNAL_SOURCE_PREVIEW_NOT_ANONYMOUS.zip")
          with ZipFile(p) as z:
              assert z.testzip() is None
              z.extractall("replay")
          PY
          bash replay/RUN_FIXED239_REPLAY_INTERNAL.sh > replay_run.log 2>&1 || { tail -100 replay_run.log; exit 1; }
          tail -c 2500 replay_run.log
          python - <<'PY'
          from pathlib import Path
          import json
          expected=json.loads(Path("replay/current_paper/results/isolation_port_resource_reanalysis_20261120/SOURCE239_PAPER_RECEIPT_V01.json").read_text())
          root=Path("replay/fixed239_recomputed")
          baseline=json.loads((root/"SOURCE239_ISOLATION_PORT_REANALYSIS.json").read_text())
          spatial=json.loads((root/"SOURCE239_MORAN_MEM10_SPATIAL_SENSITIVITY.json").read_text())
          def close(a,b,n):
              assert abs(float(a)-float(b))<0.0001,(n,a,b)
          models=baseline["models"]
          paper=expected["models"]
          close(models["host_native_239"]["distance"]["beta"],paper["native_host239"]["distance_beta"],"native_distance")
          close(models["host_current_minus_native_z"]["distance"]["beta"],paper["paired_native_current_shift"]["distance_beta"],"slope_shift")
          close(models["plant_introduced"]["ports"]["beta"],paper["introduced_flora"]["ports_beta"],"port_alien")
          close(models["introduced_only_share_logodds_239"]["distance"]["beta"],paper["introduced_only_share_logodds"]["distance_beta"],"share")
          for key,receiptkey,term in [
            ("host_native_239","native_host","distance"),
            ("host_current_minus_native_z","paired_current_minus_native","distance"),
            ("introduced_only_share_logodds_239","introduced_only_share_logodds","distance"),
            ("plant_introduced","introduced_whole_flora","ports")]:
              close(spatial["results"][key]["spatial_MEM10"][term]["beta"],
                    expected["spatial_sensitivity"]["spatial_mem10"][receiptkey][("port" if term=="ports" else term)+"_beta"],key)
          assert baseline["models"]["counts"]["islands"]==126
          assert spatial["active_resource_islands"]==123
          print("ZIP_EXTRACTED_FIXED239_AND_MEM10_SUBANALYSIS_REPLAY_SOURCE_EXACT")
          PY
          cp replay_run.log dist/geb_v05_source_preflight/fixed239_replay.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GEB-v05-internal-source-evidence-preview-NOT-ANONYMOUS-NOT-SUBMISSION
          path: dist/geb_v05_source_preflight/
          if-no-files-found: warn
          retention-days: 90
