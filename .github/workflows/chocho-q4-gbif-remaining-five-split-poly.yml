name: chocho Q4 GBIF full-geometry rescue of remaining five original HTTP400 pairs
on:
  push:
    branches:
      - analysis/island-mainland-host-opportunity-20261102
    paths:
      - scripts/recover_q4_gbif_remaining_polygon_400.py
      - .github/workflows/chocho-q4-gbif-remaining-five-split-poly.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  source-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned-compatible polygon libraries
        run: python -m pip install 'shapely>=2,<3' 'pyproj>=3.6,<4'
      - uses: actions/checkout@v4
        with:
          repository: tdwg/wgsrpd
          ref: 52da7828aba9d461dd133c27b3bd7a4407161f54
          path: _external/WGSRPD
      - name: Recover only remaining source-identified failures with original geometry and documented repeatable POLYGON
        run: |
          python -m py_compile scripts/recover_q4_gbif_remaining_polygon_400.py
          python scripts/recover_q4_gbif_remaining_polygon_400.py \
            --retry-source results/q4-conservative-gbif-retry/http429_original_pilot_retry_subset.csv \
            --previous-audit results/q4-gbif-split-polygon-verified/split_polygon_year_audit.json \
            --wgsrpd3-geojson _external/WGSRPD/geojson/level3.geojson \
            --out-dir results/q4-gbif-split-polygon-remaining-five
      - name: Preserve complete and incomplete subregional query receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chocho-original-five-GBIF-WGSRPD-full-geometry-rescue
          path: results/q4-gbif-split-polygon-remaining-five/
          retention-days: 90
          if-no-files-found: warn
      - name: Persist verified year audit without rewriting original cohort
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/q4-gbif-split-polygon-remaining-five/
          git diff --cached --quiet && exit 0
          git commit -m 'Recover remaining 5 GBIF polygon errors in original Q4 pilot with full coverage QA [skip ci]'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
