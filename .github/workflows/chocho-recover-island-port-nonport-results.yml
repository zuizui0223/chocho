name: Recover 48 completed island port/nonport GBIF site index aggregates
on:
  push:
    branches: [analysis/island-port-nonport-lag-20261109]
    paths:
      - scripts/recover_island_port_nonport_lag_20261109.py
      - .github/workflows/chocho-recover-island-port-nonport-results.yml
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  offline-aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: island-port-nonport-plant-butterfly-index-pilot
          run-id: 42601343703
          github-token: ${{ github.token }}
          path: .
      - name: Verify full site-index CSV archive, recompute paired/island-level inference without GBIF refetch
        run: |
          python -m pip install --quiet --disable-pip-version-check 'numpy>=1.26,<3' 'scipy>=1.12,<2'
          python -u scripts/recover_island_port_nonport_lag_20261109.py
      - name: Commit original source-derived aggregate and independent audit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f results/island_port_nonport_lag_20261109/*.csv results/island_port_nonport_lag_20261109/audit.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Recover 17-island matched port/nonport historical host and butterfly index results [skip ci]'
          git push origin 'HEAD:refs/heads/analysis/island-port-nonport-lag-20261109'
      - name: Archive independently recomputed source-recovery receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: island-port-nonport-lag-audited-aggregates
          path: results/island_port_nonport_lag_20261109/
          retention-days: 30
          if-no-files-found: warn
