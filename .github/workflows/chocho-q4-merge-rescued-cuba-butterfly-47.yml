name: chocho Q4 Cuba rescued botanical chronology integrated into fixed 47 butterfly cases
on:
  push:
    branches:
      - analysis/island-mainland-host-opportunity-20261102
    paths:
      - scripts/merge_q4_six_cuba_into_47_literature_case_chronology.py
      - .github/workflows/chocho-q4-merge-rescued-cuba-butterfly-47.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  source-corrected-chronology:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate six historical Cuban plants and amend only original 84 source rows
        run: |
          python -m py_compile scripts/merge_q4_six_cuba_into_47_literature_case_chronology.py
          python scripts/merge_q4_six_cuba_into_47_literature_case_chronology.py \
            --source-targeted84 results/q4-targeted-literature-hostyear/targeted_introduced_plant_island_years.csv \
            --source-events47 results/q4-targeted-literature-hostyear/literature_case_host_year_order.csv \
            --source-audit results/q4-targeted-literature-hostyear/targeted_literature_hostyear_audit.json \
            --cuba-rescue results/q4-targeted-cuban-host-dates-rescued/six_cuba_targeted_plant_year_results.csv \
            --cuba-audit results/q4-targeted-cuban-host-dates-rescued/six_cuba_targeted_host_date_recovery_audit.json \
            --out-dir results/q4-targeted-literature-hostyear-v02
      - name: Re-run original 47-case three-gate union without calling GBIF or altering GEB
        run: |
          python scripts/join_three_gate_targeted_hostyears.py \
            --original-three-gate-v02 results/three-gate-integrated-v02/island_species_three_gate_case_matrix.csv \
            --targeted-host-years results/q4-targeted-literature-hostyear-v02/literature_47_host_record_order_v02.csv \
            --targeted-host-audit results/q4-targeted-literature-hostyear-v02/Cuba_source_documentation_correction_audit.json \
            --out-dir results/three-gate-integrated-targeted-v04
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path('results/three-gate-integrated-targeted-v04/three_gate_enrichment_audit.json')
          d=json.loads(p.read_text(encoding='utf8'))
          c=d['coverage']
          if (c['candidate_literature_events'],c['with_modern_additional_resource'],
              c['dated_compatible_plant_first_index'],c['prebutterfly_compatible_plant_first_index'],
              c['distinct_butterfly_region_cells_with_prebutterfly_plant_index'],
              c['all_proxy_fields_and_prebutterfly_plant_index'])!=(47,25,25,22,12,12):
              raise SystemExit('Recomputed three-gate source counts do not match certified Cuba chronology')
          if c['biological_last_gate_identified']!=0:
              raise SystemExit('No biological causal gate labels can be inferred')
          d['schema']='chocho_three_gates_enriched_47_case_documented_host_years_v0.4_CUBA_FULL_POLYGON'
          d['source']['six_Cuba_original_HTTP400_GBIF_firstyear_rescues']=6
          d['source']['source_boundary']="47 literature selected historic butterfly records, not colonization risk set"
          p.write_text(json.dumps(d,indent=2,ensure_ascii=False)+'\n',encoding='utf8')
          print('THREE_GATE_CUBA_CASE_V04',json.dumps(c))
          PY
      - name: Upload source proof and integrated 47-case evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chocho-q4-47-butterfly-case-Cuba-hostyear-source-v04
          path: |
            results/q4-targeted-literature-hostyear-v02/
            results/three-gate-integrated-targeted-v04/
          retention-days: 90
          if-no-files-found: warn
      - name: Commit source-bounded case documentation without GEB edits
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/q4-targeted-literature-hostyear-v02/ results/three-gate-integrated-targeted-v04/
          git diff --cached --quiet && exit 0
          git commit -m 'Integrate six new Cuba plant index years into 47 three-gate literature cases without causal arrival labels [skip ci]'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
