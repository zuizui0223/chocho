name: chocho EuDiS sea-dispersal trait × WCVP island-source feasibility

on:
  push:
    branches: [analysis/eudis-thalasso-island-source-gate-20261116]
    paths:
      - scripts/fetch_eudis_v5_thalassochory_20261116.py
      - scripts/audit_eudis_wcvp_island_origin_20261116.R
      - .github/workflows/chocho-eudis-thalasso-wcvp-island-gate.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-feasibility:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: matildabrown/rWCVPdata
          ref: 65bed76bae9d644ccb6ad200c05f9f5071d89e05
          path: _src/WCVP
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
      - name: Verify WCVP original commit and download pinned EuDiS source
        run: |
          set -euo pipefail
          test "$(git -C _src/WCVP rev-parse HEAD)" = "65bed76bae9d644ccb6ad200c05f9f5071d89e05"
          python3 scripts/fetch_eudis_v5_thalassochory_20261116.py --out-dir _src/EuDiS
      - name: Measure actual EuDiS/WCVP overlap and reproduce WCVP island flora
        run: |
          set -euo pipefail
          Rscript scripts/audit_eudis_wcvp_island_origin_20261116.R \
            _src/WCVP _src/EuDiS/EuDiS.csv \
            results/island-mainland-resource-q1/region_metrics.csv \
            results/three-gate-port-all-flora/all_flora_intro_native_wpi_islands.csv \
            results/eudis_thalasso_wcvp_gate_20261116
      - name: Verify that findings are source-coverage only
        run: |
          python3 - <<'PY'
          import csv, json
          from pathlib import Path
          p=Path("results/eudis_thalasso_wcvp_gate_20261116")
          rows=list(csv.DictReader((p/"wcvp_region_origin_eudis_thalasso_coverage.csv").open()))
          assert len(rows)>600
          islands=[x for x in rows if x["class"]=="island"]
          assert len(islands)==252
          assert {x["introduced"] for x in rows}=={"0","1"}
          assert all(int(x["thalasso_trait_1"])<=int(x["EuDiS_matched_species"])<=
                     int(x["WCVP_accepted_species"]) for x in rows)
          source=json.loads(Path("_src/EuDiS/eudis_v5_source_receipt.json").read_text())
          assert source["version"]==5 and source["article_id"]==22251028
          assert source["status"]=="PINNED_SOURCE_TRAITS_NOT_OBSERVED_DISPERSAL"
          summary=list(csv.DictReader((p/"thalasso_origin_cohort_coverage_summary.csv").open()))
          assert len(summary)==4
          print("EUDIS_WCVP_ISLAND_SOURCE_ONLY_GATE_PASS",json.dumps(summary))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chocho-eudis-wcvp-original-island-source-gate-20261116
          path: |
            _src/EuDiS/eudis_v5_source_receipt.json
            results/eudis_thalasso_wcvp_gate_20261116/
          if-no-files-found: warn
          retention-days: 90
