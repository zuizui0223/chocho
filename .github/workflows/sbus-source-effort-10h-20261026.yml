name: Original butterfly survey 10-hour duration data quality check
on:
  push:
    branches:
      - analysis/sbus-host-sharing-abundance-20261025
    paths:
      - 'scripts/audit_sbus_source_effort_10h_20261026.py'
      - '.github/workflows/sbus-source-effort-10h-20261026.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  qc:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install audit source dependency
        run: python -m pip install 'numpy>=1.26,<3'
      - name: Check exact source survey durations against published >10 hour outlier guidance
        run: |
          python scripts/audit_sbus_source_effort_10h_20261026.py \
            --out provenance/reviewer_defenses/results/sbus_original_effort_duration_10h_20261026.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbus-source-survey-duration-validation-20261026
          path: provenance/reviewer_defenses/results/sbus_original_effort_duration_10h_20261026.json
      - name: Commit aggregate-only original survey timing QC receipt
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs=require('fs');
            const path='provenance/reviewer_defenses/results/sbus_original_effort_duration_10h_20261026.json';
            const owner=context.repo.owner,repo=context.repo.repo,branch=context.ref.replace('refs/heads/','');
            const content=Buffer.from(fs.readFileSync(path)).toString('base64');
            let sha;try{sha=(await github.rest.repos.getContent({owner,repo,path,ref:branch})).data.sha;}catch(e){if(e.status!==404)throw e;}
            const z={owner,repo,path,branch,content,message:'Archive source-verified butterfly transect duration QC aggregate'};
            if(sha)z.sha=sha;
            await github.rest.repos.createOrUpdateFileContents(z);
