name: GEB v0.5 integrate S3.6 and S5.5 into internal delivery
on:
  push:
    branches: [analysis/geb-v05-review-data-source-audit-20261120]
    paths:
      - scripts/integrate_GEB_v05_s36_s55_internal_delivery_20261125.py
      - scripts/replay_GEB_v05_s36_s55_derived_panels_20261125.py
      - .github/workflows/geb-v05-s36-s55-integrated-delivery-20261125.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  integrate-and-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: current
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 77c76099bd492d6a9f5cf989196c84946e7d16aa
          path: hierarchy
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 2b73c8328235508f5ea3fa57b8c0874419cbd0b9
          path: observation
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original scientific dependency families
        run: |
          python -m pip install 'numpy>=1.26,<3' 'pandas>=2.2,<3' 'scipy>=1.13,<2' 'statsmodels>=0.14,<1' 'shapely>=2,<3' 'pyproj>=3.6,<4' 'matplotlib>=3.9,<4'
      - name: Download immutable source and prior internal artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p downloads
          for id in 14992228143 14997553306 15001345576; do
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "downloads/$id.zip"
          done
          curl --fail --location --silent --show-error --retry 4 https://raw.githubusercontent.com/tdwg/wgsrpd/52da7828aba9d461dd133c27b3bd7a4407161f54/geojson/level3.geojson -o downloads/level3.geojson
      - name: Extend internal archive and exact file register
        run: |
          set -euo pipefail
          python -m py_compile current/scripts/integrate_GEB_v05_s36_s55_internal_delivery_20261125.py current/scripts/replay_GEB_v05_s36_s55_derived_panels_20261125.py
          python current/scripts/integrate_GEB_v05_s36_s55_internal_delivery_20261125.py \
            --downloads downloads --hierarchy hierarchy --observation observation \
            --out delivery --extracted extracted \
            --replay current/scripts/replay_GEB_v05_s36_s55_derived_panels_20261125.py
      - name: Replay both statistical components from extracted archive
        run: |
          set -euo pipefail
          python -B extracted/components/s36_s55_island_consumer/replay.py --tdwg-geojson "$PWD/downloads/level3.geojson" | tee delivery/S36_S55_EXTRACTED_REPLAY_LOG.txt
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("delivery/INTEGRATED_DELIVERY_SUMMARY.json")
          s=json.loads(p.read_text())
          lines=Path("delivery/S36_S55_EXTRACTED_REPLAY_LOG.txt").read_text().splitlines()
          marker="S36_S55_EXTRACTED_REPLAY_PASS "
          hits=[x[len(marker):] for x in lines if x.startswith(marker)]
          assert len(hits)==1
          r=json.loads(hits[0])
          assert set(r["checks"])=={"S3.6","S5.5_all224"} and min(r["checks"].values())>400
          s["replay_pending"]=False
          s["replay_receipt"]=r
          s["status"]="INTERNAL_ARCHIVE_BYTES_AND_DERIVED_REPLAY_PASS_NOT_REVIEWER_RELEASE"
          p.write_text(json.dumps(s,indent=2)+"\n")
          print("INTEGRATED_INTERNAL_PASS",json.dumps(s))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: geb-v05-integrated-s36-s55-internal-delivery
          path: delivery/
          if-no-files-found: warn
          retention-days: 90
