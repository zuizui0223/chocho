name: chocho Q1 CNY corrected island area control v02
on:
  push:
    branches:
      - analysis/island-mainland-host-opportunity-20261102
    paths:
      - .github/workflows/chocho-q1-area-adjusted-v02.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  correct-adjustment:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install area calculation libraries
        run: python -m pip install "numpy>=1.26,<3" "shapely>=2,<3" "pyproj>=3.6,<4"
      - uses: actions/checkout@v4
        with:
          repository: tdwg/wgsrpd
          ref: 52da7828aba9d461dd133c27b3bd7a4407161f54
          path: _external/WGSRPD
      - name: Recalculate area controls for 126 islands without changing analytical definition
        run: |
          python -m py_compile scripts/analyze_wgsrpd3_island_area_adjusted.py
          python scripts/analyze_wgsrpd3_island_area_adjusted.py \
            --q1-regions results/island-mainland-resource-q1/region_metrics.csv \
            --q1-summary results/island-mainland-resource-q1/island_mainland_summary.json \
            --wgsrpd3-geojson _external/WGSRPD/geojson/level3.geojson \
            --out-dir results/island-mainland-resource-area-v02
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chocho-Q1-CNY-corrected-area-adjustment-v02
          path: results/island-mainland-resource-area-v02/
          retention-days: 90
          if-no-files-found: warn
      - name: Commit corrected geography area checks
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/island-mainland-resource-area-v02/
          git diff --cached --quiet && exit 0
          git commit -m 'Recompute spatial area-adjusted island contrast with Canary Islands correctly classified [skip ci]'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
