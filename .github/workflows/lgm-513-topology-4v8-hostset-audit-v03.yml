name: chocho source-replay 513 native-host climatic graphs with 4 vs 8 neighbors
on:
  push:
    branches: [ecology/lgm-513-host-topology-sensitivity-v03]
    paths:
      - .github/workflows/lgm-513-topology-4v8-hostset-audit-v03.yml
      - scripts/audit_513_2d_resource_topology_v03.py
      - tests/test_audit_513_2d_resource_topology_v03.py
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: chocho-513-insects-349-hostsets-paleo-topology-v03
  cancel-in-progress: false
jobs:
  independent-four-vs-eight-neighbor-host-graph-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/checkout@v4
        with:
          repository: zuizui0223/TTF
          ref: 187e15c6a7b777c119b97b8a43a0d92783ef7c5c
          path: input/TTF
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test dateline-linked 4 versus 8 neighbors, source identity and hostset dependence
        run: |
          set -euo pipefail
          python -m pip install 'numpy>=1.26,<3' 'scipy>=1.13,<2' 'pytest>=8,<9'
          python -m pytest -q tests/test_audit_513_2d_resource_topology_v03.py tests/test_pmip4_potential_habitat_components_v02.py
          python -m py_compile scripts/audit_513_2d_resource_topology_v03.py
          echo 'a28fba9efa8a9dc79c162336f62c883059c5dddbfabec2861f554d038dd98044  input/TTF/benchmarks/exploratory/lgm_external_reference_v01/host_reference_request_manifest.csv' | sha256sum -c -
          echo '169b9da084d0043abba5c89f008137d6867b554dfb7c7dbe283b750142d220af  results/lgm_416_native_05deg_potential_graph_v02/plant_potential_climate_graph_masks_primary_v02.npz' | sha256sum -c -
          echo '1666e33b69297d692deca5054597564390004110266b0cee0934faa7acbb55b8  results/lgm_513_insects_native_host_potential_components_v02/all_641_insect_potential_21ka_host_components_v02.csv' | sha256sum -c -
      - name: Independently regenerate every original 4-neighbor 513-species record and score 8-neighbor sensitivity
        run: |
          set -euo pipefail
          out=results/lgm_513_topology_4v8_hostsets_audit_v03
          mkdir -p "$out"
          python -u scripts/audit_513_2d_resource_topology_v03.py \
            --plant-mask results/lgm_416_native_05deg_potential_graph_v02/plant_potential_climate_graph_masks_primary_v02.npz \
            --insect-host-manifest input/TTF/benchmarks/exploratory/lgm_external_reference_v01/host_reference_request_manifest.csv \
            --original513 results/lgm_513_insects_native_host_potential_components_v02/all_641_insect_potential_21ka_host_components_v02.csv \
            --out "$out"
          python - <<'PYTHON'
          import csv,hashlib,json,os
          from pathlib import Path
          p=Path('results/lgm_513_topology_4v8_hostsets_audit_v03')
          x=json.loads((p/'summary.json').read_text())
          with (p/'all_513_4v8_topology_and_hostset.csv').open(newline='') as f:rows=list(csv.DictReader(f))
          assert x['status']=='EXPLORATORY_POTENTIAL_CLIMATE_TOPOLOGY_SENSITIVITY_NOT_GENETICS'
          assert len(rows)==x['full_host_model_insects']==513
          assert x['distinct_recorded_host_combinations']==349
          assert x['distinct_host_plant_models_used']==363
          assert x['source4_original_insect_values_verified'] is True
          assert x['species_weighted']['potential_suitable_area_declines']==399
          assert x['species_weighted']['four_neighbor_components_decline']==477
          assert x['species_weighted']['eight_neighbor_components_decline']==456
          assert x['species_weighted']['four_neighbor_largest_fraction_declines']==371
          assert x['species_weighted']['eight_neighbor_largest_fraction_declines']==379
          assert x['species_weighted']['four_neighbor_components_and_largest_fraction_both_decline']==351
          assert x['unique_hostset_equal_weight']['four_neighbor_largest_fraction_declines']==252
          receipt={'schema':'chocho_lgm_513_species_349_hostsets_topology_audit_v03',
            'run_id':os.environ['GITHUB_RUN_ID'],'sha':os.environ['GITHUB_SHA'],
            'source_4neighbor_exactly_reproduced':True,
            'results_sha256':{f.name:hashlib.sha256(f.read_bytes()).hexdigest()
                              for f in sorted(p.iterdir()) if f.is_file()},
            'no_genetic_or_occupied_ancient_plant_response':True}
          (p/'receipt.json').write_text(json.dumps(receipt,sort_keys=True,indent=2)+'\n')
          print('PASS_513_SOURCE_LOCKED_INSECTS_349_DISTINCT_HOSTSETS_4V8_SENSITIVITY')
          PYTHON
      - name: Archive independent topology audit on dedicated draft branch
        run: |
          set -euo pipefail
          git fetch origin "${{ github.ref_name }}"
          test "$(git rev-parse FETCH_HEAD)" = "${{ github.sha }}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/lgm_513_topology_4v8_hostsets_audit_v03/
          git commit -m 'Archive exact 513-insect 349-hostset climate-graph topology sensitivity and source checks'
          git push origin "HEAD:${{ github.ref_name }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chocho-513-insects-349-hostsets-4v8-ice6gc-topology-v03
          path: results/lgm_513_topology_4v8_hostsets_audit_v03/
          retention-days: 30
          if-no-files-found: warn
