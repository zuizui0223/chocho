name: Monarch individual Day6 growth to pupation prognostic source-link
on:
  push:
    branches:
      - analysis/monarch-leaf-age-conversion-gate-20261026
    paths:
      - 'scripts/analyze_fisher_monarch_day6_mass_to_pupation_AUC_20261026.py'
      - '.github/workflows/fisher-monarch-day6-pupation-AUC-20261026.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  exact-ID-source-and-null:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    env:
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original source numeric stats
        run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.13,<2'
      - name: Checkout fixed published Fisher experiment animal-ID source
        uses: actions/checkout@v4
        with:
          repository: kelseyefisher/MilkweedLeafAgeMonarchSuccess
          ref: acbb93c75e1f4810355c6ce03e6076e2303b2a98
          path: _external/MilkweedLeafAgeMonarch
      - name: Reconcile 532 original stage records and 270 linked measured larvae, then test AUC vs 20k within-trial-leaf permutations
        run: |
          python -u scripts/analyze_fisher_monarch_day6_mass_to_pupation_AUC_20261026.py \
            --source-repo _external/MilkweedLeafAgeMonarch \
            --out provenance/reviewer_defenses/results/fisher_monarch_Day6_mass_pupation_ID_AUC_20261026.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monarch-original-day6-to-pupation-individual-prognosis-AUC
          path: provenance/reviewer_defenses/results/fisher_monarch_Day6_mass_pupation_ID_AUC_20261026.json
          if-no-files-found: ignore
      - name: Commit source-anonymized association and permutation-null receipt
        if: success()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs=require('fs');
            const path='provenance/reviewer_defenses/results/fisher_monarch_Day6_mass_pupation_ID_AUC_20261026.json';
            const owner=context.repo.owner,repo=context.repo.repo;
            const branch=context.ref.replace('refs/heads/','');
            const content=Buffer.from(fs.readFileSync(path)).toString('base64');
            let sha;
            try{sha=(await github.rest.repos.getContent({owner,repo,path,ref:branch})).data.sha;}
            catch(e){if(e.status!==404)throw e;}
            const data={owner,repo,path,branch,content,
              message:'Archive source-proven individual 6-day larval mass to pupation within-trial rank/AUC null'};
            if(sha)data.sha=sha;
            await github.rest.repos.createOrUpdateFileContents(data);
