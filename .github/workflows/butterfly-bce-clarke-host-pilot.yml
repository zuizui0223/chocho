name: BCE Clarke evidence-filtered butterfly host source pilot
on:
  push:
    branches: [analysis/resource-homogenization-v01]
    paths:
      - scripts/audit_bce_clarke_evidence_host_pilot.py
      - .github/workflows/butterfly-bce-clarke-host-pilot.yml
      - scripts/build_bce_clarke_anonymous_review_addendum.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "beautifulsoup4>=4.12,<5"
      - name: Clone original fixed HOSTS records
        uses: actions/checkout@v4
        with:
          repository: globalbioticinteractions/HOSTS
          ref: 808e0b869f9ec1adf8efff87cf6a395adda103e0
          path: _external/HOSTS
      - name: Audit exact host names on 12 deterministically chosen European butterfly pages
        run: |
          python scripts/audit_bce_clarke_evidence_host_pilot.py \
            --protocol docs/exploratory/BCE_CLARKE_HIGH_EVIDENCE_HOST_PILOT_PROTOCOL_V01.json \
            --focal-csv data/frozen/figure_sources/anthropogenic_species_metrics.csv \
            --hosts-csv _external/HOSTS/resource.csv \
            --output results/bce_clarke/host_source_pilot_v01.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chocho-bce-clarke-evidence-host-pilot-v01
          path: results/bce_clarke/
          retention-days: 30
          if-no-files-found: warn
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download frozen full-92 source-extraction receipt
        uses: actions/download-artifact@v4
        with:
          repository: zuizui0223/chocho
          run-id: 37777242991
          name: chocho-bce-clarke-all92-lexical-source-audit-v01
          path: inputs/lexical
          github-token: ${{ github.token }}
      - name: Download frozen accepted-WCVP butterfly-host source crosswalk
        uses: actions/download-artifact@v4
        with:
          repository: zuizui0223/chocho
          run-id: 37777881774
          name: chocho-bce-clarke-92-wcvp-accepted-host-gap-v01
          path: inputs/wcvp
          github-token: ${{ github.token }}
      - name: Download source-augmented geography audit
        uses: actions/download-artifact@v4
        with:
          repository: zuizui0223/chocho
          run-id: 37778961442
          name: chocho-bce-clarke-accepted-host-europe-geography-v01
          path: inputs/geo
          github-token: ${{ github.token }}
      - name: Download order-deterministic strict Level1 null
        uses: actions/download-artifact@v4
        with:
          repository: zuizui0223/chocho
          run-id: 37791619318
          name: chocho-bce-clarke-continent-preserving-host-source-null-v01
          path: inputs/level1
          github-token: ${{ github.token }}
      - name: Verify all source-conditional quantities and anonymize review addendum
        run: |
          python scripts/build_bce_clarke_anonymous_review_addendum.py \
            --inputs-dir inputs \
            --output results/review/bce_clarke_anonymous_s9_reproducibility_v01.zip
      - name: Verify ZIP integrity and manifest are present
        run: |
          unzip -t results/review/bce_clarke_anonymous_s9_reproducibility_v01.zip
          unzip -Z1 results/review/bce_clarke_anonymous_s9_reproducibility_v01.zip | grep -x 'SHA256SUMS'
          unzip -Z1 results/review/bce_clarke_anonymous_s9_reproducibility_v01.zip | grep -x 'VALIDATED_SUMMARY.json'
      - uses: actions/upload-artifact@v4
        with:
          name: bce-clarke-anonymous-s9-review-addendum-v01
          path: results/review/bce_clarke_anonymous_s9_reproducibility_v01.zip
          if-no-files-found: error
          retention-days: 30
