name: Kyoto original 2012 fixed-native-density pupation timing audit
on:
  workflow_dispatch:
  push:
    branches: [experiment/kyoto-30cage-nearbalanced-v01]
    paths:
      - "scripts/audit_kyoto_original_matched_density_pupation_timeline.py"
      - "tests/test_kyoto_original_matched_density_pupation_timeline.py"
      - "scripts/verify_kyoto_original_native_timeline_receipt.py"
      - "provenance/reviewer_defenses/results/kyoto_original_2012_matched_native_timeline_20261014.json"
      - ".github/workflows/kyoto-original-matched-density-pupation.yml"
permissions:
  contents: read
jobs:
  original-source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate source scope and cohort accounting
        run: |
          python -m pip install pytest==8.3.4
          python -m pytest -q tests/test_kyoto_original_matched_density_pupation_timeline.py
      - name: Download original published MD5-locked file and audit matched native density
        run: |
          python scripts/audit_kyoto_original_matched_density_pupation_timeline.py \
            --receipt results/kyoto_original_2012_matched_A_pupation_timeline_v01.json
      - name: Replay-check ORIGINAL author data against frozen scientific numbers
        run: |
          python scripts/verify_kyoto_original_native_timeline_receipt.py \
            --original results/kyoto_original_2012_matched_A_pupation_timeline_v01.json \
            --frozen provenance/reviewer_defenses/results/kyoto_original_2012_matched_native_timeline_20261014.json
      - name: Archive original-source descriptive receipt with explicit noncausal scope
        uses: actions/upload-artifact@v4
        with:
          name: kyoto-original-2012-pupation-matched-A-source-only
          path: results/kyoto_original_2012_matched_A_pupation_timeline_v01.json
          retention-days: 30
