name: chocho recover final two original WPI ports by exact archived geographic triangulation

on:
  push:
    branches:
      - analysis/island51-circuit-steppingstone-20261106
    paths:
      - "scripts/recover_island51_exact_original_port_ids.py"
      - "tests/test_recover_island51_exact_original_port_ids.py"
      - ".github/workflows/chocho-island51-final-WPI-port-recovery.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  source-verified-original-51-island-port-IDs:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Offline unique geometric identity and false-positive rejection tests
        run: |
          python -m pip install --quiet pytest pandas numpy
          python -m pytest -q tests/test_recover_island51_exact_original_port_ids.py
      - name: Download original NOAA WPI3630 and GSHHG verified 49/51 island matching receipts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/island51verify/wpi /tmp/island51verify/source
          gh run download 42172382077 --name source-recovered-2019-NGA-WPI3630-NOAA-coordinates --dir /tmp/island51verify/wpi --repo zuizui0223/chocho
          gh run download 42173280157 --name chocho-island51-source-GSHHG237-WPI2019-original-reconstruction --dir /tmp/island51verify/source --repo zuizui0223/chocho
          test -s /tmp/island51verify/wpi/ports_2019_source.geojson
          test -s /tmp/island51verify/source/island51_GSHHG_WPI_source_reconstruction.json
      - name: Resolve 2 missing source port identities uniquely from 49 geographically frozen source islands
        run: |
          python -u scripts/recover_island51_exact_original_port_ids.py \
            --probe /tmp/island51verify/source/island51_GSHHG_WPI_source_reconstruction.json \
            --ports /tmp/island51verify/wpi/ports_2019_source.geojson \
            --islands provenance/reviewer_defenses/results/island_host_network_20261030/island_host_network_islands.csv \
            --pairs provenance/reviewer_defenses/results/island_host_network_20261030/island_host_network_pairs.csv \
            --out /tmp/island51verify/island51_original_WPI_ports_coords_unique_source.json
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path('/tmp/island51verify/island51_original_WPI_ports_coords_unique_source.json').read_text())
          assert j["schema"]=="chocho_original_WPI2019_GSHHG237_island51_unique_port_reconstruction_v1"
          assert j["previously_known_source_islands"]==49
          assert set(j["source_missing_ids"])=={"12","26"}
          if j["status"].startswith("ALL_51_"):
              assert j["archive_original_1275_recovered_distance_max_km"]<=1e-6
              assert len(j["verified_source_51_mean_port_points"])==51
          print("ARCHIVED_51_WPI_SOURCE_RECOVERY_GATE",j["status"])
          PY
      - name: Archive exact source recovered 51 mean WPI port locations or failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: island51-NOAA2019-WPI-original-ports-georeference-unique-verification
          path: /tmp/island51verify/island51_original_WPI_ports_coords_unique_source.json
          if-no-files-found: warn
          retention-days: 30
