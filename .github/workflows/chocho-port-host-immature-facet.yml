name: Verify larva and egg indices for fifteen original port-host butterfly cases
on:
  push:
    branches: [analysis/port-host-ocean-interaction-20261114]
    paths:
      - scripts/acquire_port_host_immature_gbif_20261114.py
      - .github/workflows/chocho-port-host-immature-facet.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-verified-targeted-immature-facets:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original GSHHG polygon and audit dependencies
        run: python -m pip install --disable-pip-version-check "numpy>=1.26,<3" "geopandas>=1.0,<2" "pyproj>=3.5,<4" "shapely>=2,<3"
      - uses: actions/cache@v4
        with:
          key: chocho-original-gshhg-shp-237-sha8dbbe7e
          path: _scratch_coastal/gshhg-shp-2.3.7.zip
      - name: Verify byte-identical original GSHHG polygon archive
        run: |
          mkdir -p _scratch_coastal
          if test ! -s _scratch_coastal/gshhg-shp-2.3.7.zip; then
            curl -fSL --retry 3 --max-time 360 -o _scratch_coastal/gshhg-shp-2.3.7.zip https://github.com/GenericMappingTools/gshhg-gmt/releases/download/2.3.7/gshhg-shp-2.3.7.zip
          fi
          echo "8dbbe7e071e77e9e75f2d639239099ebca8d5c16d6a07df8169729d49f15cf41  _scratch_coastal/gshhg-shp-2.3.7.zip" | sha256sum --check
      - name: Build source-locked 15 candidate-host index cases
        run: |
          python scripts/audit_port_host_later_reindex_20261114.py \
            --out-dir results/port_host_reindex_20261114
      - name: Validate targeted source acquisition code
        run: python -m py_compile scripts/acquire_port_host_immature_gbif_20261114.py
      - name: Query bounded original island polygons against GBIF Larva and Egg indices
        run: |
          python scripts/acquire_port_host_immature_gbif_20261114.py \
            --gshhg-zip _scratch_coastal/gshhg-shp-2.3.7.zip \
            --work _scratch_coastal/port_host_immature \
            --cases results/port_host_reindex_20261114/audit.json \
            --out-dir results/port_host_immature_pilot_20261114 \
            --max-wkt-chars 2300 --max-facets 190
      - name: Check acquired cohort and candidly report incomplete source facets
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("results/port_host_immature_pilot_20261114/source_audit.json")
          j=json.loads(p.read_text())
          assert j["cases"]==15 and j["island_groups"]==11 and j["case_stage_rows"]==60
          assert j["facet_queries_attempted"]==j["facet_queries_planned"]
          print("TARGET CASE COHORT AUDITED; source errors:",len(j["facet_query_errors"]))
          PY
      - name: Archive actual case-stage facets and geometry/query receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chocho-20261114-original15-larva-egg-gbif-source
          path: |
            results/port_host_immature_pilot_20261114/
            results/port_host_reindex_20261114/audit.json
          if-no-files-found: warn
          retention-days: 90
