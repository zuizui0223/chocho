name: chocho Q2 shared-empire island resource network test
on:
  push:
    branches:
      - analysis/island-mainland-host-opportunity-20261102
    paths:
      - scripts/test_colonial_host_resource_network_q2.py
      - .github/workflows/chocho-colonial-resource-network-q2.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  network:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numeric and geographic reproducibility dependencies
        run: python -m pip install "numpy>=1.26,<3" "shapely>=2,<3" "pyproj>=3.6,<4"
      - uses: actions/checkout@v4
        with:
          repository: tdwg/wgsrpd
          ref: 52da7828aba9d461dd133c27b3bd7a4407161f54
          path: _external/WGSRPD
      - name: Recover exact 11,455 introduced-host / butterfly / island links
        uses: actions/download-artifact@v4
        with:
          name: chocho-q2-introduced-host-native-source
          run-id: 41370175076
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: zuizui0223/chocho
          path: work/q2
      - name: Compute node-permuted historical network test
        run: |
          python -m py_compile scripts/test_colonial_host_resource_network_q2.py
          python scripts/test_colonial_host_resource_network_q2.py \
            --q2-edges work/q2/introduced_host_source_edges.csv \
            --q2-audit results/colonial-host-native-source-q2/host_source_audit.json \
            --empire-islands results/colonial-history-island-q2/island_lenzner_empire_crosswalk.csv \
            --region-area results/island-mainland-resource-area/region_area_metrics.csv \
            --wgsrpd3-geojson _external/WGSRPD/geojson/level3.geojson \
            --output results/colonial-history-source-q2/shared_empire_resource_network_audit.json
      - name: Upload frozen exploratory network results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chocho-q2-shared-empire-resource-network
          path: results/colonial-history-source-q2/shared_empire_resource_network_audit.json
          retention-days: 90
          if-no-files-found: warn
      - name: Commit audit only after successful calculations
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/colonial-history-source-q2/shared_empire_resource_network_audit.json
          git diff --cached --quiet && exit 0
          git commit -m 'Test shared colonial history versus host-resource network similarity [skip ci]'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
