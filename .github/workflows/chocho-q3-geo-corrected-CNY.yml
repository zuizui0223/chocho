name: chocho Q3 restored GBIF observation under CNY corrected islands v02
on:
  push:
    branches:
      - analysis/island-mainland-host-opportunity-20261102
    paths:
      - scripts/analyze_q3_gbif_observed_island_resource_overlap_v02.py
      - .github/workflows/chocho-q3-geo-corrected-CNY.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  q3-corrected-observation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install official geography library
        run: python -m pip install "shapely>=2,<3"
      - uses: actions/checkout@v4
        with:
          repository: tdwg/wgsrpd
          ref: 52da7828aba9d461dd133c27b3bd7a4407161f54
          path: _external/WGSRPD
      - name: Restore source-locked 5741 corrected resource cells
        uses: actions/download-artifact@v4
        with:
          name: chocho-q2-introduced-host-native-source-v02-CNY
          run-id: 41398149093
          github-token: ${{ github.token }}
          repository: zuizui0223/chocho
          path: work/q2
      - name: Restore DOI GBIF butterfly records independently of Q2 host indexing
        run: |
          mkdir -p work/gbif
          curl --fail --location --show-error --silent --retry 3 --retry-delay 3 \
            --connect-timeout 20 --max-time 300 \
            --output work/gbif/0008693-260928105237408.zip \
            https://api.gbif.org/v1/occurrence/download/request/0008693-260928105237408.zip
      - name: Test modern observed butterfly records at corrected 5741 region opportunities
        run: |
          q2edges="$(find work/q2 -type f -name introduced_host_source_edges.csv)"
          test -n "$q2edges" && test -f "$q2edges"
          python -m py_compile scripts/analyze_q3_gbif_observed_island_resource_overlap_v02.py
          python scripts/analyze_q3_gbif_observed_island_resource_overlap_v02.py \
            --gbif-download-zip work/gbif/0008693-260928105237408.zip \
            --validation-species data/frozen/figure_sources/occurrence_resource_validation_species.csv \
            --q2-edges "$q2edges" \
            --q1-regions results/island-mainland-resource-q1/region_metrics.csv \
            --q1-summary results/island-mainland-resource-q1/island_mainland_summary.json \
            --wgsrpd3-geojson _external/WGSRPD/geojson/level3.geojson \
            --out-dir results/q3-observed-butterfly-island-opportunity-v02
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chocho-q3-GEB31-island-observed-corrected-CNY-v02
          path: results/q3-observed-butterfly-island-opportunity-v02/
          retention-days: 90
          if-no-files-found: warn
      - name: Commit only corrected aggregate Q3 counts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/q3-observed-butterfly-island-opportunity-v02/
          git diff --cached --quiet && exit 0
          git commit -m 'Recheck observed butterfly records against audited Canary-inclusive island resources [skip ci]'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
