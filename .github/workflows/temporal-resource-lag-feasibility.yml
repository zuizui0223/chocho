name: temporal-resource-lag-feasibility

on:
  push:
    branches:
      - analysis/resource-homogenization-v01
    paths:
      - ".github/workflows/temporal-resource-lag-feasibility.yml"
      - "scripts/query_gbif_event_host_first_records.py"
      - "docs/exploratory/butterfly_temporal_lag_event_hosts_v0.1.csv"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout analysis branch
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install spatial dependency
        run: python -m pip install "shapely>=2,<3"
      - name: Checkout pinned WGSRPD geometry
        uses: actions/checkout@v4
        with:
          repository: tdwg/wgsrpd
          ref: 52da7828aba9d461dd133c27b3bd7a4407161f54
          path: _external/WGSRPD
      - name: Query GBIF dated host evidence
        run: |
          mkdir -p results/temporal-lag
          python scripts/query_gbif_event_host_first_records.py \
            --event-host-csv docs/exploratory/butterfly_temporal_lag_event_hosts_v0.1.csv \
            --level3-geojson _external/WGSRPD/geojson/level3.geojson \
            --output-csv results/temporal-lag/event_host_first_records_v0.1.csv \
            --output-json results/temporal-lag/event_host_first_record_summary_v0.1.json
      - name: Upload lag feasibility audit
        uses: actions/upload-artifact@v4
        with:
          name: butterfly-temporal-resource-lag-feasibility-v01
          path: results/temporal-lag/
          if-no-files-found: error
          retention-days: 30
