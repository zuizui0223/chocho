name: chocho original GSHHG uniform ocean finite-volume circuit for 104 WCVP islands

on:
  push:
    branches: [analysis/126-island-native-alien-flora-crossed-marine-20261117]
    paths:
      - scripts/audit_WCVP126_original_GSHHG_uniform_finite_volume_circuit_20261117.py
      - .github/workflows/chocho-WCVP126-GSHHG-original-uniform-circuit.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  original-uniform-finite-volume-electrical-null:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original sparse finite-volume GSHHG source solver dependencies
        run: python -m pip install --disable-pip-version-check 'numpy>=1.26,<3' 'scipy>=1.11,<2' 'pandas>=2.1,<3' 'pyproj>=3.6,<4'
      - uses: actions/download-artifact@v4
        with:
          run-id: 44010673580
          github-token: ${{ github.token }}
          name: chocho-original126-WCVP-GSHHG-sea-geometry-baseline
          path: _src/104_TDWG_original_GSHHG_coast
      - uses: actions/download-artifact@v4
        with:
          run-id: 44010307551
          github-token: ${{ github.token }}
          name: chocho-WCVP126-pair-geography-and-strict-2020-AIS-source-coverage-20261117
          path: _src/original_WCVP_126_regions
      - name: Solve original 189550-node giant marine-component uniform electrical circuit with independent 104 TDWG coastal terminal distributions
        run: |
          set -euo pipefail
          python -m py_compile scripts/audit_WCVP126_original_GSHHG_uniform_finite_volume_circuit_20261117.py
          OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 python scripts/audit_WCVP126_original_GSHHG_uniform_finite_volume_circuit_20261117.py \
            --original-GSHHG-graph data/exploratory/island51_observed_ocean_20261106/coast_0p0625/island51_coastal_ocean_graph.npz \
            --source-coast-audit _src/104_TDWG_original_GSHHG_coast/GSHHG126_sea_geometry_source_coverage_audit.json \
            --source-pairs _src/original_WCVP_126_regions/WCVP126_flora_similarity_strict_WPI2020_geographic_pairs.csv \
            --out-dir results/WCVP126_crossed_native_alien_20261117/uniform_circuit_source
      - name: Validate source-uniform circuit is NOT shortest water path or observed sea current
        run: |
          python - <<'PY'
          import json,csv
          from pathlib import Path
          p=Path("results/WCVP126_crossed_native_alien_20261117/uniform_circuit_source")
          q=json.loads((p/"uniform104_WCVP_GSHHG_source_circuit_numerical_audit.json").read_text())
          assert q["status"]=="SOURCE_VERIFIED_ORIGINAL_UNIFORM_MARINE_CIRCUIT_104_REGIONS_NOT_OCEAN_CURRENTS"
          assert q["source_original_126_WCVP_island_regions"]==126
          assert q["source_verified_104_TDWG_coastal_region_terminals"]==104
          assert q["source_original_104_unordered_pair_resistances"]==5356
          assert q["source_component_marine_nodes"]==189550
          assert q["source_component_marine_edges"]==370996
          assert q["median_positive_uniform_resistance"]>0
          assert q["original_source_solver_numerical_gates"]["max_linear_system_relative_residual"]<=1e-7
          with (p/"WCVP126_original104_uniform_finvol_electrical_resistance.csv").open() as f:
              rows=list(csv.DictReader(f))
          assert len(rows)==5356
          assert all(r["is_current_velocity_or_particle_transport"]=="False" for r in rows)
          print("GSHHG126_REAL_FINITE_VOLUME_UNIFORM_CIRCUIT_ORIGINAL_SOURCE_PASS",
                {"n_pairs":len(rows),"median":q["median_positive_uniform_resistance"],
                 "max_solver_rel_residual":q["original_source_solver_numerical_gates"]["max_linear_system_relative_residual"]})
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chocho-original104-WCVP-GSHHG-finite-volume-uniform-circuit-null
          path: results/WCVP126_crossed_native_alien_20261117/uniform_circuit_source/
          retention-days: 90
          if-no-files-found: warn
