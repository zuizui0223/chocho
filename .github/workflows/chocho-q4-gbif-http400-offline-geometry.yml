name: chocho diagnose GBIF year-facet HTTP400 WKT geometry offline
on:
  push:
    branches:
      - analysis/island-mainland-host-opportunity-20261102
    paths:
      - scripts/diagnose_q4_gbif_http400_polygon.py
      - .github/workflows/chocho-q4-gbif-http400-offline-geometry.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  offline-geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install geographic geometry dependencies
        run: python -m pip install 'shapely>=2,<3' 'pyproj>=3.6,<4'
      - uses: actions/checkout@v4
        with:
          repository: tdwg/wgsrpd
          ref: 52da7828aba9d461dd133c27b3bd7a4407161f54
          path: _external/WGSRPD
      - name: Inspect 12 source-retried records with NO further GBIF requests
        run: |
          python -m py_compile scripts/diagnose_q4_gbif_http400_polygon.py
          python scripts/diagnose_q4_gbif_http400_polygon.py \
            --retry-source results/q4-conservative-gbif-retry/http429_original_pilot_retry_subset.csv \
            --wgsrpd3-geojson _external/WGSRPD/geojson/level3.geojson \
            --out results/q4-http400-offline-geometry/gbif_yearfacet_geometry_audit.json
      - name: Archive full polygon diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chocho-gbif-year-facet-offline-wkt-diagnosis
          path: results/q4-http400-offline-geometry/
          retention-days: 90
          if-no-files-found: warn
      - name: Save geometry result on analysis branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/q4-http400-offline-geometry/gbif_yearfacet_geometry_audit.json
          git diff --cached --quiet && exit 0
          git commit -m 'Document GBIF 400-failing island WKT shapes and nonfailing controls [skip ci]'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
