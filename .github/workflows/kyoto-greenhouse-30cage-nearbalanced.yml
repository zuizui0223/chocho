name: Kyoto 30-cage contrast-optimal near-balanced study checks
on:
  workflow_dispatch:
  push:
    branches: [experiment/kyoto-30cage-nearbalanced-v01]
    paths:
      - "scripts/randomize_kyoto_30cage_nearbalanced.py"
      - "scripts/analyze_kyoto_30cage_nearbalanced.py"
      - "tests/test_kyoto_30cage_nearbalanced_randomization.py"
      - "tests/test_kyoto_30cage_nearbalanced_analysis.py"
      - ".github/workflows/kyoto-greenhouse-30cage-nearbalanced.yml"
permissions:
  contents: read
jobs:
  source-independent:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install math tests only (no animal source data)
        run: python -m pip install pytest==8.3.4 "numpy>=1.26"
      - name: Original cohort and full 10x3 greenhouse design arithmetic
        run: |
          python -m pytest -q \
            tests/test_kyoto_30cage_nearbalanced_randomization.py \
            tests/test_kyoto_30cage_nearbalanced_analysis.py
