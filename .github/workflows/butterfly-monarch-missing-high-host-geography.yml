name: monarch omitted high quality host spatial sensitivity
on:
  push:
    branches: [analysis/resource-homogenization-v01]
    paths:
      - scripts/audit_monarch_missing_high_quality_host_geography.R
      - .github/workflows/butterfly-monarch-missing-high-host-geography.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
      - uses: actions/checkout@v4
        with:
          repository: matildabrown/rWCVPdata
          ref: 65bed76bae9d644ccb6ad200c05f9f5071d89e05
          path: _external/WCVP
      - uses: actions/download-artifact@v4
        with:
          name: temporal-hindcast-sidecars
          path: _sidecars
          github-token: ${{ github.token }}
          repository: zuizui0223/chocho
          run-id: 37628559686
      - name: Rebuild native and contemporary resources with independent high host
        run: |
          mkdir -p results/monarch-host-quality
          Rscript scripts/audit_monarch_missing_high_quality_host_geography.R \
            _external/WCVP \
            _sidecars/native/insect_host_accepted.csv \
            _sidecars/native/native_extant_nondoubtful_wgsrpd3.csv \
            _sidecars/contemporary/extant_nondoubtful_wgsrpd3.csv \
            results/monarch-host-quality
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: butterfly-monarch-high-quality-host-omission-v01
          path: results/monarch-host-quality/
          retention-days: 30
