name: Illinois adult butterfly site-to-weather source gate
on:
  push:
    branches:
      - analysis/sbus-environment-shock-20261026
    paths:
      - 'scripts/audit_sbus_daymet_site_coordinate_gate_20261026.py'
      - '.github/workflows/sbus-illinois-daymet-site-gate-20261026.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  original-survey-weather-source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original adult-data panel parsing dependency
        run: python -m pip install 'numpy>=1.26,<3'
      - name: Audit original Illinois coordinates and NASA Daymet demo API transport
        run: |
          python scripts/audit_sbus_daymet_site_coordinate_gate_20261026.py \
            --out provenance/reviewer_defenses/results/sbus_illinois_daymet_site_source_gate_20261026.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbus-illinois-site-weather-source-feasibility-20261026
          path: provenance/reviewer_defenses/results/sbus_illinois_daymet_site_source_gate_20261026.json
      - name: Archive aggregate only, never survey site coordinates
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs=require('fs');
            const path='provenance/reviewer_defenses/results/sbus_illinois_daymet_site_source_gate_20261026.json';
            const owner=context.repo.owner,repo=context.repo.repo;
            const branch=context.ref.replace('refs/heads/','');
            const content=Buffer.from(fs.readFileSync(path)).toString('base64');
            let sha;
            try{sha=(await github.rest.repos.getContent({owner,repo,path,ref:branch})).data.sha;}
            catch(e){if(e.status!==404)throw e;}
            const v={owner,repo,path,branch,content,message:'Archive field site-weather linkage QC without identifiable location rows'};
            if(sha)v.sha=sha;
            await github.rest.repos.createOrUpdateFileContents(v);
