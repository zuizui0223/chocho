name: Audit original155 30 saved-model static sklearn versions
on:
  push:
    branches: [analysis/geb-v05-review-data-source-audit-20261120]
    paths:
      - .github/workflows/audit-GEB-v05-original155-model-versions-20261124.yml
      - scripts/audit_GEB_v05_original155_saved_model_versions_20261124.py
      - tests/test_GEB_v05_original155_saved_model_versions_20261124.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  saved-model-static-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test source-safe metadata parsing
        run: python tests/test_GEB_v05_original155_saved_model_versions_20261124.py
      - name: Scan 30 hash-checked original model files without unpickling
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p safe
          python -u scripts/audit_GEB_v05_original155_saved_model_versions_20261124.py \
            --output safe/ORIGINAL155_MODEL_STATIC_VERSION_20261124.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GEB155-30-source-model-version-metadata-only
          path: safe/ORIGINAL155_MODEL_STATIC_VERSION_20261124.json
          if-no-files-found: warn
          retention-days: 90
