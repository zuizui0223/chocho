name: chocho verify exact Neotoma chronology IDs of 21 source Alnus pollen age candidates v19
on:
  push:
    branches: [ecology/lgm-neotoma-Alnus-model-id-chronology-qc-v19]
    paths:
      - .github/workflows/lgm-neotoma-21-chronology-ids-v19.yml
      - scripts/audit_neotoma_Alnus_21_frozen_chronologyids_v19.py
      - tests/test_neotoma_Alnus_source_chronologyids_v19.py
      - docs/supporting/lgm_neotoma_Alnus_candidate_chronologies_v19_contract.json
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: chocho-neotoma-21-alnus-sample-explicit-chronologyids-v19
  cancel-in-progress: false
jobs:
  source-chronology-id-metadata-only:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test 21 original source samples, chronology IDs and age-type conflict handling
        run: |
          set -euo pipefail
          python -m pip install 'requests>=2.31,<3' 'pytest>=8,<9'
          python -m pytest -q tests/test_neotoma_Alnus_source_chronologyids_v19.py
          python -m py_compile scripts/audit_neotoma_Alnus_21_frozen_chronologyids_v19.py
          echo '85cb546d43e57c8ff195c09d5dba253e6e2cc88a5cbae4e1eddb762e5c67c6e4  results/lgm_neotoma_Alnus_direct_sample_age_models_v18/all_source_Alnus_sample_age_models_v18.csv' | sha256sum -c -
          echo '934c29c61a9ee8603f54758fcf27f85f1970bd512e39cebf9a44fdebd9a195cf  results/lgm_neotoma_Alnus_direct_sample_age_models_v18/summary.json' | sha256sum -c -
          python - <<'PY'
          import json
          q=json.load(open('docs/supporting/lgm_neotoma_Alnus_candidate_chronologies_v19_contract.json'))
          assert q['status']=='SOURCE_FROZEN_21_CANDIDATE_CHRONOLOGY_ID_LOOKUP_BEFORE_LIVE_QUERIES'
          assert q['sources']['required_source_21_labelled_candidates']==21
          assert q['sources']['required_source_positive_datum_samples']==437
          assert set(q['sources']['required_source_21_candidate_chron_ids'])=={'14556','22662','22683','24197','41351'}
          assert q['acquisition']['six_bounded_requests'] is True
          print('PASS_PREQUERY_FROZEN_ALNUS21_EXACT_MODEL_ID_SCHEMA')
          PY
      - name: Fetch original six fixed Neotoma chronology objects and match each candidate's explicit sample chronologyid
        run: |
          set -euo pipefail
          out=results/lgm_neotoma_21_sample_chronology_ids_v19
          python -u scripts/audit_neotoma_Alnus_21_frozen_chronologyids_v19.py \
            --contract docs/supporting/lgm_neotoma_Alnus_candidate_chronologies_v19_contract.json \
            --original-sample-age-csv results/lgm_neotoma_Alnus_direct_sample_age_models_v18/all_source_Alnus_sample_age_models_v18.csv \
            --out "$out"
          python - <<'PY'
          import csv,json,hashlib,os
          from pathlib import Path
          p=Path('results/lgm_neotoma_21_sample_chronology_ids_v19')
          q=json.loads((p/'summary.json').read_text())
          with (p/'all_21_candidate_direct_sample_chronology_source_crosschecks_v19.csv').open(newline='') as f:sample=list(csv.DictReader(f))
          with (p/'six_source_dataset_chronology_full_fetch_status_v19.csv').open(newline='') as f:source=list(csv.DictReader(f))
          assert len(sample)==21 and len(source)==6
          assert q['status']=='SOURCE_CHRONOLOGY_ID_LINK_QC_NOT_VERIFIED_CALIBRATED_HOST_OCCUPANCY'
          assert q['source_frozen_candidate_samples']==21
          assert sum(q['source_original_21_candidate_chronology_lookup_status_counts'].values())==21
          assert sum(q['source_dataset_query_status_counts'].values())==6
          assert q['sample_age_models_independently_calibrated_n']==0
          assert q['species_diagnostic_pollen_morphology_independently_verified_n']==0
          assert q['source_glacial_occupied_Alnus_populations_accepted']==0
          assert q['insect_genetic_responses_read'] is False
          receipt={'schema':'chocho_neotoma_21_Alnus_full_chronologyid_link_v19_receipt',
            'code_sha':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],
            'input_v18_sample_age_file_sha256':'85cb546d43e57c8ff195c09d5dba253e6e2cc88a5cbae4e1eddb762e5c67c6e4',
            'official_source_responses_sha256':q['source_chronology_response_SHA'],
            'result_sha256':{x.name:hashlib.sha256(x.read_bytes()).hexdigest()
                             for x in sorted(p.iterdir()) if x.is_file()},
            'historical_occupied_plant_sites_claimed':False,
            'insect_genetic_response_used':False}
          (p/'receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          print(json.dumps(q,sort_keys=True))
          PY
      - name: Archive bounded chronological source status, keep full chronology bodies in artifact only
        run: |
          set -euo pipefail
          git fetch origin "${{ github.ref_name }}"
          test "$(git rev-parse FETCH_HEAD)" = "${{ github.sha }}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/lgm_neotoma_21_sample_chronology_ids_v19/all_21_candidate_direct_sample_chronology_source_crosschecks_v19.csv
          git add results/lgm_neotoma_21_sample_chronology_ids_v19/six_source_dataset_chronology_full_fetch_status_v19.csv
          git add results/lgm_neotoma_21_sample_chronology_ids_v19/summary.json
          git add results/lgm_neotoma_21_sample_chronology_ids_v19/receipt.json
          git commit -m 'Audit complete Neotoma original chronology IDs for 21 fixed 18-24ka Alnus source pollen sample metadata'
          git push origin "HEAD:${{ github.ref_name }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chocho-21-alnus-sample-neotoma-chronology-object-id-v19
          path: results/lgm_neotoma_21_sample_chronology_ids_v19/
          retention-days: 30
          if-no-files-found: warn
