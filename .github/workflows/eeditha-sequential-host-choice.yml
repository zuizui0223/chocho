name: exploratory E editha sequential host choice

on:
  workflow_dispatch:
  push:
    branches:
      - exploration/realized-host-window-v01
    paths:
      - "scripts/analyze_eeditha_sequential_oviposition.py"
      - "docs/exploratory/EEDITHA_SEQUENTIAL_OVIPOSITION_PROTOCOL_V01.json"
      - "tests/test_eeditha_sequential_oviposition.py"
      - ".github/workflows/eeditha-sequential-host-choice.yml"

permissions:
  contents: read

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install fixed analysis stack
        run: |
          python -m pip install "numpy==2.1.3" "scikit-learn==1.6.1" "pytest==8.3.4"
      - name: Test timeline, MD5 and non-leakage boundaries
        run: python -m pytest -q tests/test_eeditha_sequential_oviposition.py
      - name: Retrieve primary source and perform only declared model
        run: |
          python scripts/analyze_eeditha_sequential_oviposition.py --receipt results/eeditha_sequential_oviposition_v01.json
      - name: Retain integrity and effect-boundary report
        uses: actions/upload-artifact@v4
        with:
          name: exploratory-eeditha-sequential-choice-v01
          path: results/eeditha_sequential_oviposition_v01.json
          retention-days: 30
