name: Temporal 225-taxon GBIF source
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  request:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Request frozen coordinate source
        env:
          GBIF_USERNAME: ${{ secrets.GBIF_USERNAME }}
          GBIF_PASSWORD: ${{ secrets.GBIF_PASSWORD }}
        run: python scripts/request_temporal_gbif.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: temporal-gbif-source-20261029
          path: artifacts/
          retention-days: 90
