name: chocho verify Neotoma fossil taxonname query integrity with impossible-taxon control
on:
  push:
    branches: [ecology/lgm-neotoma-taxon-filter-integrity-v11]
    paths:
      - .github/workflows/lgm-neotoma-taxon-filter-integrity-v11.yml
      - scripts/audit_neotoma_taxon_filter_integrity_v11.py
      - tests/test_neotoma_taxon_filter_integrity_v11.py
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: chocho-neotoma-taxon-filter-sentinel-v11
  cancel-in-progress: false
jobs:
  audit-before-any-fossil-occupancy-claims:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test original repeated 15 taxon fossil HTTP200 payloads and source taxonomy negative control
        run: |
          set -euo pipefail
          python -m pip install 'pytest>=8,<9' 'requests>=2.31,<3'
          python -m pytest -q tests/test_neotoma_taxon_filter_integrity_v11.py
          python -m py_compile scripts/audit_neotoma_taxon_filter_integrity_v11.py
          echo 'f53676979098828d9467e261c5d27c60a867a09f72c6e254f6c5c9546b9ee90e  results/lgm_neotoma_15_plant_fossil_source_pilot_v01/all_15_taxa_source_query_status.csv' | sha256sum -c -
          echo '18e5d38ecaa3951e4433293b6e6ec793b99beb2d43b03600f0f66a0012fec4dc  results/lgm_neotoma_15_plant_fossil_source_pilot_v01/source_pilot_summary.json' | sha256sum -c -
          echo '153189ad188a8647c49bb5401b20786098386979ca1f00f1cbc67bf55a0ad733  results/lgm_native_plant_hindcast_v01/all_518_native_host_hindcast.csv' | sha256sum -c -
          python - <<'PY'
          import json
          q=json.load(open('docs/supporting/lgm_neotoma_taxon_filter_integrity_v11_contract.json'))
          assert q['status']=='TECHNICAL_NEGATIVE_CONTROL_BEFORE_NEW_FOSSIL_EVIDENCE'
          assert q['probe']['positive_WCVP_model_names']==['Alnus glutinosa','Betula pendula']
          assert q['probe']['query_max_items']==2
          assert q['probe']['sentinel_negative_name']=='Definitelynotaneotomataxon alpha9999'
          assert q['source']['original_successful_json_queries']==12
          assert q['source']['original_distinct_success_body_sha256']==2
          print('PASS_PRE_SOURCE_FOSSIL_QUERY_NEGATIVE_CONTROL_DESIGN')
          PY
      - name: Check live source registry versus nonsense taxon, same-parameter name query, taxon-ID route
        run: |
          set -euo pipefail
          python -u scripts/audit_neotoma_taxon_filter_integrity_v11.py \
            --contract docs/supporting/lgm_neotoma_taxon_filter_integrity_v11_contract.json \
            --original-status results/lgm_neotoma_15_plant_fossil_source_pilot_v01/all_15_taxa_source_query_status.csv \
            --original-summary results/lgm_neotoma_15_plant_fossil_source_pilot_v01/source_pilot_summary.json \
            --models results/lgm_native_plant_hindcast_v01/all_518_native_host_hindcast.csv \
            --out results/lgm_neotoma_taxon_filter_integrity_v11
          python - <<'PY'
          import hashlib,json,os,csv
          from pathlib import Path
          folder=Path('results/lgm_neotoma_taxon_filter_integrity_v11')
          old=json.loads((folder/'original_pilot_payload_identity_audit.json').read_text())
          new=json.loads((folder/'source_filter_integrity_summary.json').read_text())
          assert old['prior_http200_json']==12
          assert old['unique_http200_payload_sha256']==2
          assert sorted(x['query_count'] for x in old['repeated_payload_clusters'])==[5,7]
          assert new['fossil_species_21ka_sample_occurrence_verified'] is False
          assert new['sample_age_model_or_pollen_species_identification_verified'] is False
          assert new['genetic_response_used'] is False
          assert new['original_lgm_host_climate_specificity_result_reopened'] is False
          with (folder/'live_query_controls.csv').open(newline='') as f:r=list(csv.DictReader(f))
          assert len(r)==8
          allowed={'FOSSIL_TAXONNAME_FILTER_INVALID_SENTINEL_MATCHES_REAL_TAXON',
             'FOSSIL_TAXONNAME_FILTER_UNVERIFIED_IDENTICAL_DISTINCT_TAXA',
             'SOURCE_TIMEOUT_OR_INCOMPLETE_NO_FILTER_INTEGRITY_CONCLUSION',
             'IMPOSSIBLE_TAXON_RETURNS_RECORDS_FILTER_UNVERIFIED',
             'PROVISIONAL_DISTINCT_FILTER_RESPONSES_SAMPLES_STILL_UNVERIFIED'}
          assert new['status'] in allowed
          receipt={'schema':'chocho_15_taxa_neotoma_exact_repeated_hash_and_api_filter_probe_v11',
            'run_id':os.environ['GITHUB_RUN_ID'],'code_sha':os.environ['GITHUB_SHA'],
            'source_integrity_status':new['status'],
            'source_sha256':{p.name:hashlib.sha256(p.read_bytes()).hexdigest()
              for p in sorted(folder.iterdir()) if p.is_file()},
            'fossil_species_21ka_occupancy_validated':False,
            'ancient_taxon_geography_or_genetic_response_used':False}
          (folder/'receipt.json').write_text(json.dumps(receipt,sort_keys=True,indent=2)+'\n')
          print('FINISHED_SOURCE_INTEGRITY_DIAGNOSIS_NOT_FOSSIL_OCCUPANCY: '+new['status'])
          PY
      - name: Archive evidence of query-filter validity or failure, never fossil occurrence claims
        run: |
          set -euo pipefail
          git fetch origin "${{ github.ref_name }}"
          test "$(git rev-parse FETCH_HEAD)" = "${{ github.sha }}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/lgm_neotoma_taxon_filter_integrity_v11/
          git commit -m 'Record official Neotoma taxonname/source filter sentinel audit without any LGM occupancy inference'
          git push origin "HEAD:${{ github.ref_name }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chocho-neotoma-15taxa-filter-negative-control-v11
          path: results/lgm_neotoma_taxon_filter_integrity_v11/
          retention-days: 30
          if-no-files-found: warn
