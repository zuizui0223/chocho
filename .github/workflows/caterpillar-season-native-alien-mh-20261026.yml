name: Caterpillars Count actual larval seasonal native-alien matched odds
on:
  push:
    branches:
      - analysis/larval-host-seasonal-realization-20261026
    paths:
      - 'scripts/analyze_caterpillars_count_native_alien_season_mh_20261026.py'
      - '.github/workflows/caterpillar-season-native-alien-mh-20261026.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  original-site-cluster-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install statistical distribution package
        run: python -m pip install 'numpy>=1.26,<3'
      - name: Checkout immutable Caterpillars Count standardized surveys
        uses: actions/checkout@v4
        with:
          repository: hurlbertlab/caterpillars-on-plants
          ref: 2c5690ac7c6dba7eca506da886c49781c37617bd
          path: _external/CaterpillarsCount
      - name: Calculate original matched field branch larva odds ratios with 2000 source-site bootstraps
        run: |
          python -u scripts/analyze_caterpillars_count_native_alien_season_mh_20261026.py \
            --original-repo _external/CaterpillarsCount \
            --out provenance/reviewer_defenses/results/caterpillars_count_native_alien_seasonal_larval_MH_20261026.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: caterpillars-count-seasonal-matched-site-cluster-larval-use
          path: provenance/reviewer_defenses/results/caterpillars_count_native_alien_seasonal_larval_MH_20261026.json
          if-no-files-found: ignore
      - name: Commit derived aggregate only, no original sample or exact location
        if: success()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs=require('fs');
            const path='provenance/reviewer_defenses/results/caterpillars_count_native_alien_seasonal_larval_MH_20261026.json';
            const owner=context.repo.owner,repo=context.repo.repo;
            const branch=context.ref.replace('refs/heads/','');
            const content=Buffer.from(fs.readFileSync(path)).toString('base64');
            let sha;
            try{sha=(await github.rest.repos.getContent({owner,repo,path,ref:branch})).data.sha;}
            catch(e){if(e.status!==404)throw e;}
            const args={owner,repo,path,branch,content,
              message:'Archive real caterpillar plant-native season matching with site bootstrap and authors prior-result boundary'};
            if(sha)args.sha=sha;
            await github.rest.repos.createOrUpdateFileContents(args);
