name: Global butterfly climate analog opportunity macroecology
on:
  push:
    branches:
      - analysis/global-habitat-filter-20261019
    paths:
      - .github/workflows/global-butterfly-climate-analog.yml
      - scripts/analyze_butterfly_climate_analog_macro_20261019.py
      - scripts/analyze_climate_analog_fixedmargin_null_20261019.py
      - scripts/analyze_butterfly_climate_analog_geography_sensitivity_20261019.py
      - scripts/analyze_global_butterfly_habitat_filter_20261019.py
      - data/frozen/figure_sources/**
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  cli-source-pinned-climate-macro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing project numpy dependency
        run: python -m pip install -e .
      - name: Retrieve source-pinned author-only global plant distribution archive (do not redistribute)
        uses: actions/download-artifact@v4
        with:
          name: butterfly-author-anonymous-offline-source-replication-v01
          run-id: 39006554609
          github-token: ${{ github.token }}
          path: _retrieval/author_only
      - name: Verify known exact source ZIP SHA256 and safe contents
        run: |
          python - <<'PY'
          import hashlib, zipfile
          from pathlib import Path
          root=Path("_retrieval/author_only")
          expected="408cb206d7ce4056cee1fbf614762e1a6efb3db4650ff7c2663a7d6d6003e323"
          candidates=list(root.rglob("*.zip"))
          matches=[x for x in candidates if hashlib.sha256(x.read_bytes()).hexdigest()==expected]
          assert len(matches)==1, "AUTHOR_ONLY_SOURCE_ARCHIVE_UNAVAILABLE_OR_SHA_CHANGED: "+str([x.name for x in candidates])
          p=matches[0]
          destination=Path("_retrieval/extracted_source")
          destination.mkdir(parents=True,exist_ok=True)
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              for name in z.namelist():
                  rel=Path(name)
                  assert not rel.is_absolute() and ".." not in rel.parts
              z.extractall(destination)
          assert (destination/"SOURCE_MANIFEST.json").is_file()
          print("PASS source ZIP SHA",expected,"members",len(list(destination.rglob("*"))))
          PY
      - name: Climate-analogue macroecology across original 239 butterflies
        run: |
          mkdir -p artifacts
          python scripts/analyze_butterfly_climate_analog_macro_20261019.py --source-root _retrieval/extracted_source --output-json artifacts/butterfly_climate_analog_macro_20261019.json
          python - <<'PY'
          import json, math
          from pathlib import Path
          r=json.loads(Path("artifacts/butterfly_climate_analog_macro_20261019.json").read_text())
          assert r["negative_gates"]["confirmatory_ecological_causation"] is False
          assert r["negative_gates"]["source_archive_redistribution_authorised"] is False
          for key in ("main_threshold_5_to_95","sensitivity_threshold_10_to_90"):
              d=r[key];n=d["overview"]["species_with_adequate_native_climate"]
              assert 1<=n<=239
              o=d["overview"]["observed_added_climate_analog"]
              a=d["overview"]["added_cells_all"]
              e=d["overview"]["within_continent_reference_expected_analog"]
              assert a>0 and 0<=o<=a and 0<=e<=a
              assert all(0<=x["observed_added_analog_regions"]<=x["eligible_climate_analog_non_native_regions"] for x in d["species_derived"])
              assert all(x["native_climate_supported_regions"]>=10 for x in d["species_derived"])
              assert d["secondary_disturbance_5_region_gate"]["status"] in (
                  "EXPLORATORY_ADJUSTED_ASSOCIATION","NOT_EVALUABLE_TRAIT_CLASS_SUPPORT")
          print("PASS original 239 source geography, climate support, thresholds, null denominator, observation boundaries")
          PY
      - name: Test climate alignment against native-exclusion and region-degree fixed-margin null
        run: |
          python scripts/analyze_climate_analog_fixedmargin_null_20261019.py --source-root _retrieval/extracted_source --output-json artifacts/butterfly_climate_analog_fixedmargin_null_20261019.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("artifacts/butterfly_climate_analog_fixedmargin_null_20261019.json").read_text())
          assert r["species_in_graph"]==239 and r["climate_evaluable_species"]==234
          assert r["source_original_added_units"]==14553 and r["evaluated_added_units"]==14481
          assert r["result"]["0.05"]["observed"]==9451
          assert r["result"]["0.1"]["observed"]==6948
          assert len(r["chains"])==2
          assert [x["seed"] for x in r["chains"]]==[20261019,20261020]
          assert all(len(c["full_draw_history"]["0.05"])==199 for c in r["chains"])
          assert all(len(c["full_draw_history"]["0.1"])==199 for c in r["chains"])
          if r["status"]!="QUALIFIED_EXPLORATORY_MCMC_STRUCTURAL_NULL":
              assert any(not v["qualified"] for v in r["quality"].values())
          print("PASS: source-pinned fixed margins, original regional climate counts, 2×199 audit; significance qualified only if mixing gates pass")
          PY
      - name: Check geographic and native-climate confounding with held-out genera
        run: |
          python scripts/analyze_butterfly_climate_analog_geography_sensitivity_20261019.py --derived-json artifacts/butterfly_climate_analog_macro_20261019.json --output-json artifacts/butterfly_climate_analog_geography_20261019.json
          python - <<'PY'
          import json, math
          from pathlib import Path
          r=json.loads(Path("artifacts/butterfly_climate_analog_geography_20261019.json").read_text())
          assert r["status"]=="POSTHOC_239_BUTTERFLY_GEOGRAPHY_AND_CLIMATE_SENSITIVITY"
          for v in r["by_cutoff"].values():
              assert v["primary_eligible_trait_count"]>150
              raw=v["observed_versus_continent_benchmark"]
              assert sum(t["added"] for t in raw.values())>12000
              assert all(0<=t["observed"]<=t["added"] for t in raw.values())
              x=v["plus_native_continent_and_bio1_bio12"]
              assert x["status"]=="EXPLORATORY_ASSOCIATION"
              assert math.isfinite(x["estimate_associated_minus_avoidant"])
              assert v["out_of_genus_CV_baseline_vs_disturbance_including_geo"]["repeats"]==10
          print("PASS spatial-bias sensitivity, source counts, climate benchmark and genus-heldout controls")
          PY
      - name: Test plant-host network preserving climate-analogue nulls in two independent chains
        run: |
          python scripts/analyze_plant_network_preserving_climate_analog_null_20261019.py --source-root _retrieval/extracted_source --output-json artifacts/butterfly_plant_network_climate_analog_null_20261019.json
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("artifacts/butterfly_plant_network_climate_analog_null_20261019.json").read_text())
          assert x["species"]==239 and x["climate_evaluable_species"]==234
          assert x["plant_introduced_region_edges"]==30373
          assert x["original_butterfly_region_added_all"]==14553
          assert x["original_butterfly_region_added_evaluable"]==14481
          assert x["draws_per_chain"]==199 and x["chain_seeds"]==[20261019,20261020]
          assert len(x["modes"])==2
          assert x["original_observed"]["0.05"]["aligned"]==9451
          assert x["original_observed"]["0.1"]["aligned"]==6948
          for v in x["modes"].values():
              assert len(v["chain_receipts"])==2
              assert [z["seed"] for z in v["chain_receipts"]]==[20261019,20261020]
              assert all(len(y["draws"]["0.05"])==199 for y in v["chain_receipts"])
              assert all(len(y["draws"]["0.1"])==199 for y in v["chain_receipts"])
              if v["status"]!="QUALIFIED_EXPLORATORY_PLANT_NETWORK_MCMC_NULL":
                  assert any(not q["qualified"] for q in v["qualification"].values())
          print("PASS frozen accepted-host links, plant family/geographic/climate strata, native exclusions, two 199-draw chain qualification checks")
          PY
      - name: Upload only macro-derived region COUNT results, not raw plant geography
        uses: actions/upload-artifact@v4
        with:
          name: butterfly-climate-analog-macro-exploratory-only
          path: |
            artifacts/butterfly_climate_analog_macro_20261019.json
            artifacts/butterfly_climate_analog_fixedmargin_null_20261019.json
            artifacts/butterfly_climate_analog_geography_20261019.json
            artifacts/butterfly_plant_network_climate_analog_null_20261019.json
