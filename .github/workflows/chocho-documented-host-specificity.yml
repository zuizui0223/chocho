name: chocho source-matched documented butterfly-host specificity of alien floras

on:
  push:
    branches: [analysis/global-colonial-alien-flora-control-20261031]
    paths:
      - ".github/workflows/chocho-documented-host-specificity.yml"
      - "scripts/analyze_documented_host_specificity.py"
      - "tests/test_documented_host_specificity_20261031.py"
      - "scripts/analyze_documented_host_specificity_v2.py"
      - "scripts/audit_documented_host_prevalence_influence.py"
      - "scripts/analyze_documented_host_prevalence_drivers.py"
      - "tests/test_documented_host_prevalence_drivers_20261101.py"
      - "tests/test_documented_host_specificity_v2_20261031.py"
      - "provenance/reviewer_defenses/results/global_colonial_resource_beta_20261031/documented_host_specificity_lock_v2.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chocho-global-host-specificity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fixed-239-hosts-vs-all-aliens:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install exact dependency floor, run no-source unit tests
        run: |
          python -m pip install "numpy>=1.26" "shapely>=2,<3" "pyproj>=3.7,<4" "pyshp>=2.3" "pytest>=8" ruff
          ruff check --select F821 scripts/analyze_documented_host_specificity.py scripts/analyze_documented_host_specificity_v2.py scripts/audit_documented_host_prevalence_influence.py scripts/analyze_documented_host_prevalence_drivers.py
          python -m pytest tests/test_documented_host_specificity_20261031.py tests/test_documented_host_specificity_v2_20261031.py tests/test_documented_host_prevalence_drivers_20261101.py -q
      - name: Checkout source-locked HOSTS larval hosts
        uses: actions/checkout@v4
        with:
          repository: globalbioticinteractions/HOSTS
          ref: 808e0b869f9ec1adf8efff87cf6a395adda103e0
          path: _external/HOSTS
      - name: Checkout exact butterfly potential-resource beta source
        uses: actions/checkout@v4
        with:
          repository: zuizui0223/chocho
          ref: analysis/global-colonial-host-resource-convergence-20261031
          path: _external/butterfly_beta
      - name: Checkout exact TDWG 369 Level3 polygons
        uses: actions/checkout@v4
        with:
          repository: tdwg/wgsrpd
          ref: 52da7828aba9d461dd133c27b3bd7a4407161f54
          path: _external/wgsrpd
      - name: Fetch exact 2022 published Lenzner GloNAF taxa data
        run: |
          mkdir -p _temp_historical_sources
          curl --fail --show-error --silent --location --retry 2 --connect-timeout 30 --max-time 180 \
            'https://zenodo.org/api/records/6640264/files/lenzner/Eur-Emp-Alien-Flora-v1.0.0.zip/content' \
            --output _temp_historical_sources/lenzner_6640264.zip
          echo '16f5585d2500676951a4b664bbf0ffde  _temp_historical_sources/lenzner_6640264.zip' | md5sum -c -
      - name: Compare all documented hosts separately from full-prevalence-bin matched pseudo-hosts
        run: |
          if [ ! -s provenance/reviewer_defenses/results/global_colonial_resource_beta_20261031/documented_host_specificity_v2.json ]; then
            python scripts/analyze_documented_host_specificity_v2.py \
              --draws 199 \
              --output provenance/reviewer_defenses/results/global_colonial_resource_beta_20261031/documented_host_specificity_v2.json
          fi
          python scripts/audit_documented_host_prevalence_influence.py \
            --output provenance/reviewer_defenses/results/global_colonial_resource_beta_20261031/documented_host_prevalence_leave_bin_out_v1.json
          python scripts/analyze_documented_host_prevalence_drivers.py \
            --output provenance/reviewer_defenses/results/global_colonial_resource_beta_20261031/documented_host_prevalence_drivers_v1.json
      - name: Commit only derived aggregate receipt
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add provenance/reviewer_defenses/results/global_colonial_resource_beta_20261031/documented_host_specificity_v2.json
          git add provenance/reviewer_defenses/results/global_colonial_resource_beta_20261031/documented_host_prevalence_leave_bin_out_v1.json
          git add provenance/reviewer_defenses/results/global_colonial_resource_beta_20261031/documented_host_prevalence_drivers_v1.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Audit full documented hosts and non-cherry-picked source-supported prevalence-matched pseudo-hosts [skip ci]'
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
      - name: Remove all downloaded original source data
        if: always()
        run: rm -rf _external _temp_historical_sources
