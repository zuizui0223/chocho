name: Diagnostic original 1596-port source status vs new GBIF recording effort (not main WCVP)
on:
  push:
    branches:
      - analysis/geb-v05-review-data-source-audit-20261120
    paths:
      - scripts/audit_port1596_source_effort_and_native_candidate_ratio_20261120.py
      - .github/workflows/audit-port1596-GBIF-source-effort-native-candidate-countryFE.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  original-port-source-country-fixed-effect:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          path: current
          persist-credentials: true
      - uses: actions/checkout@v4
        with:
          ref: 3dbf038dab64e8bbc9ba6c0f5b0e19ce1cb2b250
          path: original_source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numerical library versions and validate original 1596 source keys
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "numpy>=1.26,<3" "pandas>=2.2,<3" "scipy>=1.13,<2" "statsmodels>=0.14,<1"
          python -m py_compile current/scripts/audit_port1596_source_effort_and_native_candidate_ratio_20261120.py
      - name: Compare original source status candidates to independently re-indexed GBIF recording effort within countries
        shell: bash
        run: |
          set -euo pipefail
          python current/scripts/audit_port1596_source_effort_and_native_candidate_ratio_20261120.py \
            --original-root original_source --current-root current \
            --out current/results/geb_v05_gbif_source_attribution_20261120/PORT1596_SOURCE_EFFORT_DIAGNOSTIC_20261120.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("current/results/geb_v05_gbif_source_attribution_20261120/PORT1596_SOURCE_EFFORT_DIAGNOSTIC_20261120.json")
          d=json.loads(p.read_text())
          assert d["n_orig_WPI_complete_ports"]==1596
          assert d["new_GBIF_current_positive_ports"]==1461
          assert d["new_GBIF_current_zero_index_ports"]==135
          a=d["cross_snapshot_Spearman_associations"]
          for name,lo,hi in [
            ("contemporary_not_native_in_catalogue__current_GBIF_records",0.82,0.83),
            ("native_in_catalogue__current_GBIF_records",0.84,0.85)
          ]:
            assert lo<a[name]["rho"]<hi
          k=d["country_cluster_primary_record_associations"]
          assert k["candidate_log"]["regressors"]["log_current_GBIF_records"]["beta"]>0
          assert k["native_log"]["regressors"]["log_current_GBIF_records"]["beta"]>0
          interval=k["log_candidate_native_ratio"]["regressors"]["log_current_GBIF_records"]["CI95"]
          assert interval[0]<0<interval[1]
          assert d["country_groups_including_UNKNOWN"]>=140
          assert len(d["country_cluster_log_candidate_native_ratio_sensitivities"])==4
          assert any("MAIN 126-botanical-island" in x for x in d["ecological_qualification"])
          print("EXPLORATORY_SOURCE_ONLY_INTRODUCED_AND_NATIVE_EFFORT_RELATIONSHIP_FROZEN")
          PY
      - name: Write source-qualified Japanese analytical interpretation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          d=json.loads(Path("current/results/geb_v05_gbif_source_attribution_20261120/PORT1596_SOURCE_EFFORT_DIAGNOSTIC_20261120.json").read_text())
          rho=d["cross_snapshot_Spearman_associations"]
          main=d["country_cluster_primary_record_associations"]
          def describe(k):
            z=main[k]["regressors"]["log_current_GBIF_records"]
            return f"beta={z['beta']:+.4f}, 95%CI [{z['CI95'][0]:+.4f},{z['CI95'][1]:+.4f}], p={z['p']:.4g}"
          b=d["country_cluster_two_predictor_sensitivity"]["log_candidate_native_ratio"]["regressors"]
          t=d["country_cluster_log_candidate_native_ratio_sensitivities"]
          lines=[
            "# 1,596 WPI港における、植物観測努力と既知寄主種の収録数（探索的ソース品質診断）",
            "",
            "**元の科学的原稿PR179には統合しない。** 2026-11-20のPR189に保存する、異なる時点の元の種数表と現在GBIF provider index の品質・交絡診断。",
            "",
            "元ソース：完成した1,596港の『native_in_catalogue』『contemporary_not_native_in_catalogue』という既知寄主候補種数。これは野外で生存した宿主の確認や独立した侵入指定ではない。新ソース：同じWPI港IDsの現在(2026-11-20)5km GBIF Plantae記録数/提供元数で、取得日と歴史的WKT検索条件は一致しない。141国＋不詳2港を別の計142国グループとして扱った。",
            "",
            "## 観測値",
            f"- 元の外来候補既知寄主種数 vs 新しいGBIF記録数：Spearman rho={rho['contemporary_not_native_in_catalogue__current_GBIF_records']['rho']:.4f}。",
            f"- 元の在来既知寄主種数 vs 新しいGBIF記録数：Spearman rho={rho['native_in_catalogue__current_GBIF_records']['rho']:.4f}。",
            f"- 新GBIF記録数 vs 新提供元数：Spearman rho={d['new_GBIF_records_and_datasets_Spearman_rho']:.4f}（強く共変動）。",
            "",
            "## 国固定効果＋国クラスタ頑健標準誤差（対数変換）",
            f"- log1p(外来候補) ~ log1p(現在GBIF記録数) ：{describe('candidate_log')}。",
            f"- log1p(在来) ~ log1p(現在GBIF記録数) ：{describe('native_log')}。",
            f"- log((外来候補+0.5)/(在来+0.5)) ~ log1p(現在GBIF記録数)：{describe('log_candidate_native_ratio')}。",
            "",
            "外来候補・在来の絶対的な収録数とも観測記録数と強く連動する。一方、その対数比の国固定効果付き単回帰は0を跨ぐため明瞭な傾きを同定できなかった。**ゼロ効果の証明や正しい生態学的導入比率推定ではない。**",
            f"提供元数も同時に入れた対数比モデルは、記録数beta={b['log_current_GBIF_records']['beta']:+.4f}、提供元数beta={b['log_current_GBIF_datasets']['beta']:+.4f}（提供元p={b['log_current_GBIF_datasets']['p']:.3f}）。記録数と提供元数は共線的で、後者の弱い結果は部分集団で不安定。",
            "",
            "## 比率モデルの限定・感度",
          ]
          for name,rs in t.items():
            z=rs["single_record_model"]["regressors"]["log_current_GBIF_records"]
            lines.append(f"- {name}: n={rs['single_record_model']['n_ports']}, beta={z['beta']:+.4f}, 95%CI [{z['CI95'][0]:+.4f},{z['CI95'][1]:+.4f}]。")
          loo=d["leave_one_original_country_out_log_ratio_record_gradient"]
          lines.extend([
            f"- 国一つずつ除外：{loo['N_dropped_countries']}通り、比率係数の範囲 {loo['min_beta']:+.4f}〜{loo['max_beta']:+.4f}（方向の固定化は有意性・因果性を意味しない）。",
            "",
            "## 出典と論文主張への影響",
            "国別補正も観測努力の代理変数であって因果的な努力補正ではなく、部分的な港調査や同一GBIF提供元に由来する空間・分類バイアス、現在と過去の照会のズレを除去できない。港のWCVP在来/外来floraを使う**本文Fig2Aの126島・WPI港数相関とは別の元データと別の従属変数**である。したがって、本文βを消したり補正したという結論にしてはいけない。",
            "1,596港の現在のdatasetKey 1,482件を、元のGBIF植物データの過去取得時点の引用元として使わない。重複した港バッファ索引ヒット件数から独立観測数や植物量を計算しない。",
            "",
            "出典と数値は同ディレクトリのPORT1596_SOURCE_EFFORT_DIAGNOSTIC_20261120.jsonを使用。元の植物種数表と新しいGBIF記録・提供元数の2系統を、SHA256で固定したスクリプトで再計算している。",
          ])
          p=Path("current/results/geb_v05_gbif_source_attribution_20261120/PORT1596_SOURCE_EFFORT_DIAGNOSTIC_20261120_JA.md")
          p.write_text("\n".join(lines)+"\n",encoding="utf8")
          print("JAPANESE_SOURCE_EFFORT_DIAGNOSTIC_READY",len(lines))
          PY
      - name: Commit only new source-caveated diagnostic and source metrics to PR189
        shell: bash
        run: |
          set -euo pipefail
          cd current
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/geb_v05_gbif_source_attribution_20261120/PORT1596_SOURCE_EFFORT_DIAGNOSTIC_20261120.json results/geb_v05_gbif_source_attribution_20261120/PORT1596_SOURCE_EFFORT_DIAGNOSTIC_20261120_JA.md
          if git diff --cached --quiet; then
            echo "Exactly same original/new-source country FE audit already committed"
          else
            git commit -m "Archive exploratory port1596 original host-status vs NEW GBIF effort country FE audit [skip ci]"
            git push origin HEAD:refs/heads/analysis/geb-v05-review-data-source-audit-20261120
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GBIF-port1596-original-status-NEW-2026-observation-effort-country-FE-QA
          path: |
            current/results/geb_v05_gbif_source_attribution_20261120/PORT1596_SOURCE_EFFORT_DIAGNOSTIC_20261120.json
            current/results/geb_v05_gbif_source_attribution_20261120/PORT1596_SOURCE_EFFORT_DIAGNOSTIC_20261120_JA.md
          if-no-files-found: warn
          retention-days: 90
