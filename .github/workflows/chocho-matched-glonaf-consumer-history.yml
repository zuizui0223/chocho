name: chocho same-region colonial alien-plant versus butterfly-resource history

on:
  push:
    branches: [analysis/global-colonial-alien-flora-control-20261031]
    paths:
      - ".github/workflows/chocho-matched-glonaf-consumer-history.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chocho-matched-glonaf-butterfly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  same-wgsrpd3-historical-exposure:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies and run response-blind synthetic tests
        run: |
          python -m pip install "numpy>=1.26" "shapely>=2,<3" "pyproj>=3.7,<4" "pyshp>=2.3" "pytest>=8" ruff
          ruff check --select F821 scripts/analyze_matched_glonaf_consumer_history.py
          python -m pytest tests/test_matched_glonaf_consumer_history_20261031.py -q
      - name: Checkout pinned source of butterfly beta from independent source-locked study branch
        uses: actions/checkout@v4
        with:
          repository: zuizui0223/chocho
          ref: analysis/global-colonial-host-resource-convergence-20261031
          path: _external/butterfly_beta
      - name: Checkout exact official TDWG level3 geography
        uses: actions/checkout@v4
        with:
          repository: tdwg/wgsrpd
          ref: 52da7828aba9d461dd133c27b3bd7a4407161f54
          path: _external/wgsrpd
      - name: Fetch and checksum primary Lenzner GloNAF and history data
        run: |
          mkdir -p _temp_historical_sources
          curl --fail --show-error --silent --location --retry 2 --connect-timeout 30 --max-time 180 \
            'https://zenodo.org/api/records/6640264/files/lenzner/Eur-Emp-Alien-Flora-v1.0.0.zip/content' \
            --output _temp_historical_sources/lenzner_6640264.zip
          echo '16f5585d2500676951a4b664bbf0ffde  _temp_historical_sources/lenzner_6640264.zip' | md5sum -c -
      - name: Join same 284-region GloNAF flora and fixed 239-butterfly resource change
        run: |
          python scripts/analyze_matched_glonaf_consumer_history.py \
            --source-zip _temp_historical_sources/lenzner_6640264.zip \
            --tdwg _external/wgsrpd/geojson/level3.geojson \
            --lock provenance/reviewer_defenses/results/global_colonial_resource_beta_20261031/matched_glonaf_consumer_lock_v1.json \
            --draws 499
      - name: Commit only derived statistics and region-count audit, no third-party source data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add provenance/reviewer_defenses/results/global_colonial_resource_beta_20261031/matched_glonaf_consumer_history_v1.json
          git add provenance/reviewer_defenses/results/global_colonial_resource_beta_20261031/matched_glonaf_consumer_region_coverage_v1.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Measure original GloNAF vs butterfly historical associations on exact shared WGSRPD3 regions [skip ci]'
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
      - name: Delete source data from runner
        if: always()
        run: rm -rf _temp_historical_sources _external
