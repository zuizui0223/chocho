name: Historic island port botanical land fraction control

on:
  push:
    branches: [analysis/butterfly-expansion-maritime-host-relay-20261031]
    paths:
      - "provenance/reviewer_defenses/results/historical_port_nonport_botany_20261031/audit_land_area_exposure.py"
      - ".github/workflows/chocho-1km-land-fraction-audit.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  area-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install geographic data tools
        run: python -m pip install "numpy>=1.26,<3" "geopandas>=1.0,<2" "pyproj>=3.5,<4" "shapely>=2,<3"
      - name: Restore locked original GSHHG shape
        uses: actions/cache@v4
        with:
          key: chocho-gshhg-shp-237-original-8dbbe7e
          path: _scratch_coastal/gshhg-shp-2.3.7.zip
      - name: Guarantee exact source coastline
        run: |
          mkdir -p _scratch_coastal
          if test ! -s _scratch_coastal/gshhg-shp-2.3.7.zip; then
            curl -fSL --retry 3 --retry-delay 4 --max-time 360 \
               -o _scratch_coastal/gshhg-shp-2.3.7.zip \
               https://github.com/GenericMappingTools/gshhg-gmt/releases/download/2.3.7/gshhg-shp-2.3.7.zip
          fi
          echo "8dbbe7e071e77e9e75f2d639239099ebca8d5c16d6a07df8169729d49f15cf41  _scratch_coastal/gshhg-shp-2.3.7.zip" | sha256sum --check
      - name: Audit land fraction in all 114 historical one-kilometer GBIF buffers
        run: |
          python provenance/reviewer_defenses/results/historical_port_nonport_botany_20261031/audit_land_area_exposure.py \
            --zip _scratch_coastal/gshhg-shp-2.3.7.zip \
            --work _scratch_coastal/extracted-area
      - name: Retain inspectable area control output
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: historical-botany-1km-land-area-audit
          path: |
            provenance/reviewer_defenses/results/historical_port_nonport_botany_20261031/land_fraction_*.csv
            provenance/reviewer_defenses/results/historical_port_nonport_botany_20261031/land_fraction_*.json
          retention-days: 30
      - name: Publish noncausal land-area sensitivity
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add provenance/reviewer_defenses/results/historical_port_nonport_botany_20261031/land_fraction_*.csv \
             provenance/reviewer_defenses/results/historical_port_nonport_botany_20261031/land_fraction_*.json
          git diff --cached --quiet && exit 0
          git commit -m "Audit original coastal land-area imbalance among historical port controls [skip ci]"
          for try in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase FETCH_HEAD || exit 1
            if git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"; then exit 0; fi
          done
          exit 1
