name: chocho PMIP4 physical land ice constraints on 416 plant and 641 insect host climate
on:
  push:
    branches: [ecology/lgm-pmip4-ice6g-land-graph-v01]
    paths:
      - .github/workflows/lgm-pmip4-gate-climate-hosts-v01.yml
      - scripts/pmip4_mask_host_climatic_opportunity_v01.py
      - tests/test_pmip4_masked_climatic_opportunity_v01.py
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: chocho-original-pmip4-mask-on-native-plant-insect-scores-v01
  cancel-in-progress: false
jobs:
  physical-terrain-gated-climate-opportunity:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/checkout@v4
        with:
          repository: zuizui0223/TTF
          ref: 187e15c6a7b777c119b97b8a43a0d92783ef7c5c
          path: input/TTF
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify physically blocked climate suitability rule and absence checks
        run: |
          set -euo pipefail
          python -m pip install 'numpy>=1.26,<3' 'pytest>=8,<9'
          python -m pytest -q tests/test_pmip4_masked_climatic_opportunity_v01.py
          python -m py_compile scripts/pmip4_mask_host_climatic_opportunity_v01.py
      - name: Reuse original PMIP4 source geography and SHA-pinned source 416 plant scores
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input/original_native416
          test -s results/pmip4_source_icefree_land_0_21ka_v01/summary.json
          test -s results/pmip4_source_icefree_land_0_21ka_v01/physical_landice_by_6337_support_sites.npz
          python - <<'PYTHON'
          import json
          from pathlib import Path
          x=json.loads(Path('results/pmip4_source_icefree_land_0_21ka_v01/summary.json').read_text())
          assert x['status']=='PHYSICAL_LAND_ICE_TOPOLOGY_NOT_21KA_PLANT_HABITAT_OR_GENETICS'
          assert x['source_sha256']['21ka']=='3decf87e11a2d2afe65a7358d904214aea2e5c59ec92ab8227f36070beb98e94'
          assert (x['support_ice_free_land_0ka'],x['support_ice_free_land_21ka'])==(6047,5391)
          assert x['support_newly_blocked_0_to_21']==828
          assert x['support_newly_ice_free_0_to_21']==172
          print('PASS_PRIOR_ORIGINAL_VERIFIED_21KA_PHYSICAL_MASK')
          PYTHON
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/12234343435/zip" > /tmp/native416-original.zip
          echo '8ac33d6f1c98b09fc057c73eaa3fb60278af89780b870864b22b44a9b494ecad  /tmp/native416-original.zip' | sha256sum -c -
          unzip -q /tmp/native416-original.zip -d input/original_native416
          echo '8559ec905cddd1a0b9579530551c9980ab3519daa92902df150a04687bf81159  input/original_native416/native_host_climate_surface_scores.npz' | sha256sum -c -
          echo '153189ad188a8647c49bb5401b20786098386979ca1f00f1cbc67bf55a0ad733  input/original_native416/all_518_native_host_hindcast.csv' | sha256sum -c -
          echo 'a28fba9efa8a9dc79c162336f62c883059c5dddbfabec2861f554d038dd98044  input/TTF/benchmarks/exploratory/lgm_external_reference_v01/host_reference_request_manifest.csv' | sha256sum -c -
      - name: Recalculate all 416 plant and all 641 insect ice-free potential climate suitability sites
        run: |
          set -euo pipefail
          python scripts/pmip4_mask_host_climatic_opportunity_v01.py \
            --plant-model input/original_native416/all_518_native_host_hindcast.csv \
            --plant-npz input/original_native416/native_host_climate_surface_scores.npz \
            --host-associations input/TTF/benchmarks/exploratory/lgm_external_reference_v01/host_reference_request_manifest.csv \
            --land-ice-mask results/pmip4_source_icefree_land_0_21ka_v01/physical_landice_by_6337_support_sites.npz \
            --source-physics-summary results/pmip4_source_icefree_land_0_21ka_v01/summary.json \
            --out results/pmip4_icefree_416plants_641insects_v01
          python - <<'PYTHON'
          import csv,hashlib,json,os
          from pathlib import Path
          p=Path('results/pmip4_icefree_416plants_641insects_v01')
          q=json.loads((p/'summary.json').read_text())
          with (p/'all_641_insects_physically_masked_v01.csv').open(newline='') as f:r=list(csv.DictReader(f))
          with (p/'all_416_plants_physically_masked_v01.csv').open(newline='') as f:plants=list(csv.DictReader(f))
          assert q['status']=='POTENTIAL_CLIMATIC_SITES_WITH_PHYSICAL_LAND_ICE_GATING_NOT_CONNECTIVITY'
          assert len(r)==641 and len(plants)==416
          assert q['insects_without_geography_mask']['decrease']==478
          assert q['insects_with_geography_mask']['decrease']==488
          assert q['plants_without_geography_mask']['decrease']==366
          assert q['plants_with_geography_mask']['decrease']==373
          assert q['insect_availability_status_counts']=={
             'COMPLETE':513,'PARTIAL_UNSCORED':83,'NONE_UNSCORED':45}
          assert q['no_true_historical_host_occupancy_or_genetic_response_used'] is True
          receipt={'schema':'chocho_original_PMIP4_masked_WCVP_climate_host_source_receipt_v01',
                   'code_sha':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],
                   'outputs_sha256':{a.name:hashlib.sha256(a.read_bytes()).hexdigest()
                     for a in sorted(p.iterdir()) if a.is_file()},
                   'PMIP4_original_source_MDs_verified':True,
                   'genetic_ancient_plant_occupancy_or_corridor_claimed':False}
          (p/'receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          print('PASS_SOURCE_VERIFIED_416_PLANT_513_INSECT_PHYSICAL_TERRAIN_SENSITIVITY')
          PYTHON
      - name: Archive source-bound 416 and 641 status and physical constraints on draft branch
        run: |
          set -euo pipefail
          git fetch origin "${{ github.ref_name }}"
          test "$(git rev-parse FETCH_HEAD)" = "${{ github.sha }}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/pmip4_icefree_416plants_641insects_v01/
          git commit -m 'Freeze 416 WCVP-native plants and 513 insect opportunities under PMIP4 21ka ice-free land barrier'
          git push origin "HEAD:${{ github.ref_name }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chocho-PMIP4-icefree-416-plants-641-insects-v01
          path: results/pmip4_icefree_416plants_641insects_v01/
          if-no-files-found: warn
          retention-days: 30
