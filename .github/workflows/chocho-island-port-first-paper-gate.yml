name: Island-port first paper 40-island source gate
on:
  push:
    paths:
      - '.github/workflows/chocho-island-port-first-paper-gate.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  island-port-40-cohort:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compute all 40 island aggregates against source-pinned 1 km same-island controls
        run: |
          python provenance/reviewer_defenses/results/island_port_first_paper_20261031/audit_primary40_control_support.py \
            --root . \
            --output provenance/reviewer_defenses/results/island_port_first_paper_20261031/primary_40island_landcover_and_host_support.json
      - name: Commit independent source-locked observational control audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add provenance/reviewer_defenses/results/island_port_first_paper_20261031/primary_40island_landcover_and_host_support.json
          git diff --cached --quiet && exit 0
          git commit -m "Record source-recomputed 40-island/273-port observed control support and observational correlations [skip ci]"
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
