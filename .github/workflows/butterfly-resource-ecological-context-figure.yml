name: butterfly resource novelty ecological context Figure 3

on:
  push:
    branches:
      - synthesis/nontrivial-macroecology-20261015
    paths:
      - "scripts/render_butterfly_resource_ecological_context_figure.py"
      - "tests/test_butterfly_resource_ecological_context_figure.py"
      - ".github/workflows/butterfly-resource-ecological-context-figure.yml"
  workflow_dispatch:

concurrency:
  group: butterfly-resource-context-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  render-context:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install numpy, matplotlib and pytest
        run: python -m pip install -e ".[figure,test]"
      - name: Verify frozen native resource and occurrence definitions
        run: python -m pytest -q tests/test_butterfly_resource_ecological_context_figure.py
      - name: Render ecological context panels
        run: |
          python scripts/render_butterfly_resource_ecological_context_figure.py \
            --species-csv data/frozen/figure_sources/anthropogenic_species_metrics.csv \
            --occurrence-csv data/frozen/figure_sources/occurrence_resource_validation_species.csv \
            --precision-json provenance/reviewer_defenses/results/butterfly_expansion_equivalence_v0.1.json \
            --overlap-null-json provenance/reviewer_defenses/results/butterfly_occurrence_overlap_null_v0.1.json \
            --output-png results/resource-novelty-figure3/figure3_ecological_context.png \
            --output-svg results/resource-novelty-figure3/figure3_ecological_context.svg \
            --output-data-json results/resource-novelty-figure3/figure3_context_source_values.json
          test -s results/resource-novelty-figure3/figure3_ecological_context.png
          test -s results/resource-novelty-figure3/figure3_ecological_context.svg
          test -s results/resource-novelty-figure3/figure3_context_source_values.json
      - uses: actions/upload-artifact@v4
        with:
          name: butterfly-resource-novelty-ecological-context-figure3-v01
          path: results/resource-novelty-figure3/
          retention-days: 30
