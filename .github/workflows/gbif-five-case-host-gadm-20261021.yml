name: Strict HOSTS WCVP plant × butterfly GADM1 co-detection, five frozen cases
on:
  push:
    branches: [analysis/gbif-macro-recovery-20261020]
    paths:
      - "scripts/audit_gbif_five_host_gadm_cocoverage_20261021.py"
      - "tests/test_gbif_five_host_gadm_cocoverage_20261021.py"
      - ".github/workflows/gbif-five-case-host-gadm-20261021.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-matched-plant-gadm:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check exact botanical taxon and host-opportunity cohort
        run: |
          python -m pip install "pytest>=8,<10"
          pytest -q tests/test_gbif_five_host_gadm_cocoverage_20261021.py
      - name: Retrieve indexed plant observations within all original GADM1 country units
        run: |
          mkdir -p _host_gadm
          python scripts/audit_gbif_five_host_gadm_cocoverage_20261021.py \
            --source-five provenance/reviewer_defenses/results/gbif_country_20261020/gbif_source_introduced_hosts_five_cases_20261021.json \
            --juvenile-gadm provenance/reviewer_defenses/results/gbif_country_20261020/gbif_juvenile_gadm1_conditional_20261021.json \
            --all-stage provenance/reviewer_defenses/results/gbif_country_20261020/gbif_positive48_gadm_lifestage_facets_20261020.json \
            --output _host_gadm/gbif_plant_butterfly_gadm_five_20261021.json
      - name: Preserve source-matched aggregate-only plant records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chocho-five-case-host-plant-gadm-source-20261021
          path: _host_gadm/*.json
          if-no-files-found: warn
          retention-days: 30
