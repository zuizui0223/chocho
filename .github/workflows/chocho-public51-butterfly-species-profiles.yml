name: "Butterfly identities - nearest prior indexed island candidate source profiles"

on:
  push:
    branches: [analysis/butterfly-trait-public51-20261109]
    paths:
      - scripts/profile_public51_butterfly_species_index_events_20261109.py
      - .github/workflows/chocho-public51-butterfly-species-profiles.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-butterfly-species:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen source-dependent numerical packages
        run: python -m pip install --disable-pip-version-check numpy scikit-learn
      - name: Compute and verify butterfly-first event identity profiles
        run: |
          python scripts/profile_public51_butterfly_species_index_events_20261109.py --out-dir results/public51_butterfly_species_index_profiles_20261109
      - name: Archive complete 270 observational species-island records and species-level distance summaries
        uses: actions/upload-artifact@v4
        with:
          name: butterfly-original51-indexed-event-species-profiles-20261109
          path: results/public51_butterfly_species_index_profiles_20261109/
          if-no-files-found: error
          retention-days: 60
