name: chocho source-verified 21 LGM-labelled Alnus pollen samples age-control depth and reliability QC v20
on:
  push:
    branches: [ecology/lgm-neotoma-21ka-chronology-controls-v19]
    paths:
      - .github/workflows/lgm-neotoma-age-controls-sample-depth-v20.yml
      - scripts/audit_neotoma_Alnus_age_controls_v20.py
      - tests/test_neotoma_Alnus_age_controls_v20.py
      - docs/supporting/lgm_neotoma_chronology_control_depth_qc_v20_contract.json
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: chocho-21-Alnus-fossil-11chronology-age-controls-v20
  cancel-in-progress: false
jobs:
  exact-original-age-depth-support:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit-test source chronology bounds and exact sample control depth and verify v18 labels
        run: |
          set -euo pipefail
          python -m pip install 'pytest>=8,<9'
          python -m pytest -q tests/test_neotoma_Alnus_age_controls_v20.py
          python -m py_compile scripts/audit_neotoma_Alnus_age_controls_v20.py
          echo '85cb546d43e57c8ff195c09d5dba253e6e2cc88a5cbae4e1eddb762e5c67c6e4  results/lgm_neotoma_Alnus_direct_sample_age_models_v18/all_source_Alnus_sample_age_models_v18.csv' | sha256sum -c -
          echo '22e2ceae388c704dcc1dc21d6e71605f674807ec3ab3dce004956b9220d674f4  results/lgm_neotoma_Alnus_direct_sample_age_models_v18/all_source_Alnus_sample_datum_v18.csv' | sha256sum -c -
          echo '934c29c61a9ee8603f54758fcf27f85f1970bd512e39cebf9a44fdebd9a195cf  results/lgm_neotoma_Alnus_direct_sample_age_models_v18/summary.json' | sha256sum -c -
          echo 'bc70337b6cff34fac59823bd4861bb3ebed315099915bbc94e996cfc0ae67166  results/lgm_neotoma_Alnus_chronology_source_controls_v19/summary.json' | sha256sum -c -
          echo 'd29c8c1848316d11a58014ec3a452f65b6fdfe582cd5df041d4b4e7b8ba5baa5  results/lgm_neotoma_Alnus_chronology_source_controls_v19/all_11_chronology_plus_six_dataset_source_routes.json' | sha256sum -c -
      - name: Restore exact eleven original Neotoma official chronology source JSON bodies with SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input/neotoma_v19
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/12463050740/zip" > /tmp/neotoma-original-chronologies-v19.zip
          echo 'f01683540e34ba722ba65ed484c88139a323b23d6427da58a50be63f2e526650  /tmp/neotoma-original-chronologies-v19.zip' | sha256sum -c -
          unzip -q /tmp/neotoma-original-chronologies-v19.zip -d input/neotoma_v19
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          expected=json.loads(Path('results/lgm_neotoma_Alnus_chronology_source_controls_v19/receipt.json').read_text())['source_bodies']
          for f,sha in expected.items():
              raw=(Path('input/neotoma_v19/raw_api_responses')/f).read_bytes()
              assert hashlib.sha256(raw).hexdigest()==sha,f
          assert len(expected)==18
          print('PASS_11_NEOTOMA_CHRONOLOGY_PLUS_SIX_DATASET_ORIGINAL_SOURCE_BODIES')
          PY
      - name: Audit exact 21 source-labelled pollen samples against actual original age controls and reliable age spans
        run: |
          set -euo pipefail
          python -u scripts/audit_neotoma_Alnus_age_controls_v20.py \
            --contract docs/supporting/lgm_neotoma_chronology_control_depth_qc_v20_contract.json \
            --source-dir input/neotoma_v19/raw_api_responses \
            --v18-ages results/lgm_neotoma_Alnus_direct_sample_age_models_v18/all_source_Alnus_sample_age_models_v18.csv \
            --v18-samples results/lgm_neotoma_Alnus_direct_sample_age_models_v18/all_source_Alnus_sample_datum_v18.csv \
            --v18-summary results/lgm_neotoma_Alnus_direct_sample_age_models_v18/summary.json \
            --v19-summary results/lgm_neotoma_Alnus_chronology_source_controls_v19/summary.json \
            --v19-receipt results/lgm_neotoma_Alnus_chronology_source_controls_v19/receipt.json \
            --v19-routes results/lgm_neotoma_Alnus_chronology_source_controls_v19/all_11_chronology_plus_six_dataset_source_routes.json \
            --out results/lgm_neotoma_21_Alnus_sample_chronology_control_qc_v20
          python - <<'PY'
          import csv,hashlib,json,os
          from pathlib import Path
          root=Path('results/lgm_neotoma_21_Alnus_sample_chronology_control_qc_v20')
          q=json.loads((root/'summary.json').read_text())
          with (root/'all_21_original_Alnus_age_depth_caveats_v20.csv').open(newline='') as f: r=list(csv.DictReader(f))
          with (root/'all_11_original_chronology_metadata_v20.csv').open(newline='') as f: models=list(csv.DictReader(f))
          assert q['status']=='SOURCE_CHRONOLOGY_DEPTH_AND_RELIABILITY_CAVEATS_NOT_VERIFIED_FOSSIL_SPECIES'
          assert q['original_v18_source_labelled_18_24ka_positive_sample_n']==21
          assert q['original_v19_official_chronologies']==11
          assert len(r)==21 and len(models)==11
          assert q['descriptive_counts']['nondefault_source_chronology']==10
          assert q['descriptive_counts']['source_sample_missing_both_age_bounds']==20
          assert q['descriptive_counts']['beyond_oldest_reliable_age_span']==1
          assert q['descriptive_counts']['deeper_than_last_returned_source_control']==18
          assert q['descriptive_counts']['within_returned_control_depth_extent']==3
          assert q['descriptive_counts']['bracket_control_age_gap_over_10000_BP']==3
          assert q['ancient_21ka_Alnus_occupied_plant_populations_accepted']==0
          assert q['original_sample_ages_independently_calibrated']==0
          assert not q['genetic_response_used']
          receipt={'schema':'chocho_Neotoma_direct_Alnus_21ka_chronology_controls_v20_receipt',
           'run_id':os.environ['GITHUB_RUN_ID'],'code_sha':os.environ['GITHUB_SHA'],
           'v19_original_full_11_chronology_source_hashes_verified':True,
           'sha256_outputs':{f.name:hashlib.sha256(f.read_bytes()).hexdigest()
               for f in sorted(root.iterdir()) if f.is_file()},
           'no_verified_local_Alnus_population_or_genetic_response':True}
          (root/'receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          print(json.dumps(q,sort_keys=True))
          PY
      - name: Commit source-linked original 21 pollen age-depth audit results
        run: |
          set -euo pipefail
          git fetch origin "${{ github.ref_name }}"
          test "$(git rev-parse FETCH_HEAD)" = "${{ github.sha }}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/lgm_neotoma_21_Alnus_sample_chronology_control_qc_v20/
          git commit -m 'Archive 21 Alnus pollen sample age source chronology reliability and control-depth audit'
          git push origin "HEAD:${{ github.ref_name }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chocho-original-Neotoma-21-Alnus-samples-age-depth-controls-v20
          path: results/lgm_neotoma_21_Alnus_sample_chronology_control_qc_v20/
          retention-days: 30
          if-no-files-found: warn
