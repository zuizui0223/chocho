name: Diagnose original GSHHG large 51-island geometries
on:
  push:
    branches: [analysis/butterfly-trait-public51-20261109]
    paths:
      - scripts/diagnose_public51_complex_geometry_20261109.py
      - .github/workflows/chocho-public51-geometry-diagnosis.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-boundary-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original polygon processing toolchain
        run: python -m pip install --disable-pip-version-check "numpy>=1.26,<3" "geopandas>=1.0,<2" "pyproj>=3.5,<4" "shapely>=2,<3"
      - uses: actions/cache@v4
        with:
          key: chocho-original-gshhg-shp-237-sha8dbbe7e
          path: _scratch_coastal/gshhg-shp-2.3.7.zip
      - name: Verify original GSHHG archive
        run: |
          mkdir -p _scratch_coastal
          if test ! -s _scratch_coastal/gshhg-shp-2.3.7.zip; then
            curl -fSL --retry 3 --max-time 360 -o _scratch_coastal/gshhg-shp-2.3.7.zip https://github.com/GenericMappingTools/gshhg-gmt/releases/download/2.3.7/gshhg-shp-2.3.7.zip
          fi
          echo "8dbbe7e071e77e9e75f2d639239099ebca8d5c16d6a07df8169729d49f15cf41  _scratch_coastal/gshhg-shp-2.3.7.zip" | sha256sum --check
      - name: Source island 15 and 21 geometry complexity, no GBIF request
        run: |
          python scripts/diagnose_public51_complex_geometry_20261109.py \
            --gshhg-zip _scratch_coastal/gshhg-shp-2.3.7.zip \
            --work _scratch_coastal/geometry_diagnosis \
            --islands 15,21 \
            --out-dir results/public51_geometry_diagnosis_20261109
      - uses: actions/upload-artifact@v4
        with:
          name: original51-geometry-diagnosis-15-21
          path: results/public51_geometry_diagnosis_20261109/
          if-no-files-found: error
          retention-days: 45
