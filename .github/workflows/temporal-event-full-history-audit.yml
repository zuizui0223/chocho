name: temporal-event-full-history-audit

on:
  push:
    branches:
      - analysis/resource-homogenization-v01
    paths:
      - ".github/workflows/temporal-event-full-history-audit.yml"
      - "scripts/query_gbif_butterfly_event_first_records.py"
      - "docs/exploratory/butterfly_temporal_stageA_event_cells_v0.1.csv"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout analysis branch
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install spatial dependency
        run: python -m pip install "shapely>=2,<3"
      - name: Checkout pinned WGSRPD geometry
        uses: actions/checkout@v4
        with:
          repository: tdwg/wgsrpd
          ref: 52da7828aba9d461dd133c27b3bd7a4407161f54
          path: _external/WGSRPD
      - name: Audit event cells against full GBIF history
        run: |
          mkdir -p results/temporal-event-audit
          python scripts/query_gbif_butterfly_event_first_records.py \
            --event-csv docs/exploratory/butterfly_temporal_stageA_event_cells_v0.1.csv \
            --level3-geojson _external/WGSRPD/geojson/level3.geojson \
            --output-csv results/temporal-event-audit/event_full_history_v0.1.csv \
            --output-json results/temporal-event-audit/event_full_history_summary_v0.1.json
      - name: Upload event audit
        uses: actions/upload-artifact@v4
        with:
          name: butterfly-temporal-event-full-history-v01
          path: results/temporal-event-audit/
          if-no-files-found: error
          retention-days: 30
