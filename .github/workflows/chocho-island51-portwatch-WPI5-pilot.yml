name: chocho bounded five-source-WPI ports against official IMF PortWatch registry
on:
  push:
    branches:
      - analysis/island51-portwatch-global-connections-source-20261107
    paths:
      - ".github/workflows/chocho-island51-portwatch-WPI5-pilot.yml"
      - "scripts/audit_island51_portwatch_five_WPI_source_pilot.py"
      - "tests/test_audit_island51_portwatch_five_WPI_source_pilot.py"
      - "results/island51_portwatch_global_connections_20261107/WPI5_SAMPLE_PROTOCOL.md"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  original_five_WPI_source_examples_only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install small source-only test dependency
        run: python -m pip install pytest
      - name: Validate original WPI source identities and source-only matching rules
        run: python -m pytest -q tests/test_audit_island51_portwatch_five_WPI_source_pilot.py
      - name: Query 5 small original WPI coordinate boxes, up to 15 PortWatch registry rows each
        run: |
          mkdir -p _ci_portwatch_WPI5
          python scripts/audit_island51_portwatch_five_WPI_source_pilot.py --out-dir _ci_portwatch_WPI5
      - name: Archive original source-to-PortWatch example matching decisions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-WPI5-to-PortWatch-bounded-registry-sample
          path: _ci_portwatch_WPI5/
          retention-days: 30
          if-no-files-found: error
      - name: Commit only bounded WPI example source match receipt, no source network harvest
        if: success()
        run: |
          TARGET=results/island51_portwatch_global_connections_20261107
          cp _ci_portwatch_WPI5/WPI5_bounded_registry_source_pilot_receipt.json "$TARGET/"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add "$TARGET"
          if ! git diff --cached --quiet; then
            git commit -m "Archive only five original WPI-to-PortWatch source ID compatibility checks"
            git push origin HEAD:analysis/island51-portwatch-global-connections-source-20261107
          fi
