name: chocho 416 native plants to 641 insect climatic resource opportunity audit
on:
  push:
    branches: [ecology/lgm-native-plant-hindcast-run-v01]
    paths:
      - .github/workflows/lgm-native-host-resource-aggregate-v01.yml
      - scripts/aggregate_native_plant_lgm_insect_opportunity_v01.py
      - tests/test_aggregate_native_plant_lgm_insect_opportunity_v01.py
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: chocho-native-insect-resource-opportunity-v01
  cancel-in-progress: false
jobs:
  audit-plant-hindcast-and-climatic-resource:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/checkout@v4
        with:
          repository: zuizui0223/TTF
          ref: 187e15c6a7b777c119b97b8a43a0d92783ef7c5c
          path: input/TTF
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independently test any-host union source and absence rules
        run: |
          set -euo pipefail
          python -m pip install 'numpy>=1.26,<3' 'pytest>=8,<9'
          python -m pytest -q tests/test_aggregate_native_plant_lgm_insect_opportunity_v01.py
          python -m py_compile scripts/aggregate_native_plant_lgm_insect_opportunity_v01.py
      - name: Restore and verify byte-identical 416 WCVP-native host climate outputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input/native_416
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/12234343435/zip" > /tmp/original416.zip
          echo '8ac33d6f1c98b09fc057c73eaa3fb60278af89780b870864b22b44a9b494ecad  /tmp/original416.zip' | sha256sum -c -
          unzip -q /tmp/original416.zip -d input/native_416
          echo 'c345e52f893aa23a2ed6ccb0a675b56db92f1c9f246cb662c866cbce85b916c0  input/native_416/summary.json' | sha256sum -c -
          echo '153189ad188a8647c49bb5401b20786098386979ca1f00f1cbc67bf55a0ad733  input/native_416/all_518_native_host_hindcast.csv' | sha256sum -c -
          echo '8559ec905cddd1a0b9579530551c9980ab3519daa92902df150a04687bf81159  input/native_416/native_host_climate_surface_scores.npz' | sha256sum -c -
          echo 'a28fba9efa8a9dc79c162336f62c883059c5dddbfabec2861f554d038dd98044  input/TTF/benchmarks/exploratory/lgm_external_reference_v01/host_reference_request_manifest.csv' | sha256sum -c -
          python - <<'PYTHON'
          import csv,json
          from pathlib import Path
          p=Path('input/native_416')
          q=json.loads((p/'summary.json').read_text())
          with (p/'all_518_native_host_hindcast.csv').open(newline='') as f:r=list(csv.DictReader(f))
          assert len(r)==518 and q['model_complete_taxa']==416
          assert q['global_sites_comparable_0BP_vs_21ka']==6337
          assert q['no_lgm_occupancy_or_genetic_response_claim'] is True
          print('PASS_PINNED_416_NATIVE_PLANT_CHELSA_SCORE_ARTIFACT_AND_ORIGINAL_HOST_IDS')
          PYTHON
      - name: Calculate all 641 insect potential climate resource masks from known host associations
        run: |
          set -euo pipefail
          mkdir -p results/lgm_insect_native_host_climate_opportunity_v01
          python -u scripts/aggregate_native_plant_lgm_insect_opportunity_v01.py \
            --plant-summary input/native_416/summary.json \
            --plant-models input/native_416/all_518_native_host_hindcast.csv \
            --plant-scores input/native_416/native_host_climate_surface_scores.npz \
            --insect-hosts input/TTF/benchmarks/exploratory/lgm_external_reference_v01/host_reference_request_manifest.csv \
            --out results/lgm_insect_native_host_climate_opportunity_v01
          python - <<'PYTHON'
          import csv,hashlib,json,os,statistics
          from pathlib import Path
          out=Path('results/lgm_insect_native_host_climate_opportunity_v01')
          q=json.loads((out/'summary.json').read_text())
          with (out/'all_641_insect_climatic_resource_opportunity.csv').open(newline='') as f:rows=list(csv.DictReader(f))
          assert len(rows)==641
          assert q['status']=='EXPLORATORY_CLIMATIC_RESOURCE_OPPORTUNITY_NOT_LGM_OCCUPANCY_OR_GENETICS'
          assert q['species_status_counts']=={'COMPLETE_KNOWN_HOST_MODELS':513,
            'PARTIAL_KNOWN_HOST_MODELS_NOT_SCORED':83,
            'NO_KNOWN_HOST_MODELS':45}
          assert q['species_LGM_climate_opportunity_decrease']==478
          assert q['species_LGM_climate_opportunity_increase']==35
          assert q['common_climate_support_sites']==6337
          assert -1<q['median_species_delta_LGM_minus_present']<0
          print(json.dumps(q,sort_keys=True))
          receipt={'schema':'chocho_native_host_climate_resource_641_v01_source_receipt',
            'run_id':os.environ['GITHUB_RUN_ID'],'code_sha':os.environ['GITHUB_SHA'],
            'original_416_plant_score_npz_sha256':'8559ec905cddd1a0b9579530551c9980ab3519daa92902df150a04687bf81159',
            'summary_sha256':hashlib.sha256((out/'summary.json').read_bytes()).hexdigest(),
            'species_csv_sha256':hashlib.sha256((out/'all_641_insect_climatic_resource_opportunity.csv').read_bytes()).hexdigest(),
            'genetic_or_historical_plant_occupancy_read':False}
          (out/'receipt.json').write_text(json.dumps(receipt,sort_keys=True,indent=2)+'\n')
          PYTHON
      - name: Preserve compact plant SDM result and all insect decisions on branch
        run: |
          set -euo pipefail
          mkdir -p results/lgm_native_plant_hindcast_v01
          cp input/native_416/summary.json results/lgm_native_plant_hindcast_v01/summary.json
          cp input/native_416/all_518_native_host_hindcast.csv results/lgm_native_plant_hindcast_v01/all_518_native_host_hindcast.csv
          cp input/native_416/receipt.json results/lgm_native_plant_hindcast_v01/receipt.json
          git fetch origin "${{ github.ref_name }}"
          test "$(git rev-parse FETCH_HEAD)" = "${{ github.sha }}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/lgm_native_plant_hindcast_v01/ results/lgm_insect_native_host_climate_opportunity_v01/
          git commit -m 'Archive 416 native-host climatic niches and 641 insect climate-resource opportunities with source receipts'
          git push origin "HEAD:${{ github.ref_name }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chocho-native-416-plant-641-insect-climate-opportunity-v01
          path: |
            results/lgm_native_plant_hindcast_v01/
            results/lgm_insect_native_host_climate_opportunity_v01/
          if-no-files-found: warn
          retention-days: 30
