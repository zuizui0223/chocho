name: chocho 292 insect known-host versus 0BP-matched other real plants LGM same-edge graph null
on:
  push:
    branches: [ecology/lgm-matched-other-plants-graph-null-v08]
    paths: [.github/workflows/lgm-v08-otherplant-sameedge-null.yml]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: chocho-292-insects-2108-otherplant-group-LGM-common-edges-v08
  cancel-in-progress: false
jobs:
  native-WCVP-host-specificity-ecological-null-without-genotypes:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/checkout@v4
        with:
          repository: zuizui0223/TTF
          ref: 187e15c6a7b777c119b97b8a43a0d92783ef7c5c
          path: input/TTF
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test paired four-way source contact and verify 292 pre-outcome frozen eligibility
        run: |
          set -euo pipefail
          python -m pip install 'numpy>=1.26,<3' 'scipy>=1.13,<2' 'pytest>=8,<9'
          python -m pytest -q tests/test_0bp_matched_otherplant_patch_contact_v08.py tests/test_common_modern_sampling_edges_v06.py tests/test_modern_anchor_paleo_host_graph_v05.py
          python -m py_compile scripts/audit_0bp_matched_otherplant_patch_contact_v08.py
          echo 'bb791eff085ba46ba6012efff0310a3a01d88144f4d0d18ef5b1160ff2c0aa10  results/lgm_v08_0bp_only_matched_otherplant_model_eligibility/source_fixed_292_otherplant_groups.json' | sha256sum -c -
          echo '7b5a30433d0d20107041a24b22bcd6d19f4f708e8552cfc553f8afb105559d09  results/lgm_513_original_modern_paired_edges_v06/all_513_original_edges_paired_contact_v06.csv' | sha256sum -c -
          python - <<'PY'
          import json
          x=json.load(open('results/lgm_v08_0bp_only_matched_otherplant_model_eligibility/summary.json'))
          y=json.load(open('docs/supporting/lgm_otherplant_graph_null_v08_contract.json'))
          assert x['no_new_21ka_climate_or_genetic_patch_response_accessed']
          assert y['status']=='EXPLORATORY_FIXED_ALTERNATIVE_BOTANICAL_REFERENCE_BEFORE_V08_ANCIENT_PATCH_SCORES'
          assert (x['complete_known_host_and_at_least_4_group_insects'],x['valid_frozen_alternative_group_count'])==(292,2108)
          print('PASS_PRE_LGM_SOURCE_LOCKED_292_REAL_HOST_2108_OTHER_PLANT_GROUPS')
          PY
      - name: Restore original modern sampling locality pairs and byte-for-byte host climate source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input/original642geography input/PMIP4
          echo '92e19da615ffc2003a90569afd4089eb24871f1fc0df69cc3aface4263b96dc4  input/TTF/provenance/data/historical_host_memory_geometry_642_canonical_v01.tar.xz' | sha256sum -c -
          tar -xJf input/TTF/provenance/data/historical_host_memory_geometry_642_canonical_v01.tar.xz -C input/original642geography
          echo '037cd8fa1f059fb67c349a465540d3d5fac469b5d14a2a4d2658d74c036c0ae9  input/original642geography/historical_host_memory_localities_v0.1.csv' | sha256sum -c -
          echo 'ab10a876895cf00817e8ce555665ebb78a0f2ac64323d2e93c213e1857738ba9  input/original642geography/historical_host_memory_edges_v0.1.csv' | sha256sum -c -
          echo '169b9da084d0043abba5c89f008137d6867b554dfb7c7dbe283b750142d220af  results/lgm_416_native_05deg_potential_graph_v02/plant_potential_climate_graph_masks_primary_v02.npz' | sha256sum -c -
          echo '67c0d99852b8b8896559dbc0da07504bcb07a6ad7c017afa0eb86e31d40acc2a  results/lgm_416_native_nonanalog_source_recovery_v03/plant_potential_climate_masks_extrapolation_included_v03.npz' | sha256sum -c -
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/12239910484/zip" > /tmp/PMIP4_frozen_halfdegree.zip
          echo '706d482c5e139675951a170e538ceee11249281c77e38da99f37f2b3b7524947  /tmp/PMIP4_frozen_halfdegree.zip' | sha256sum -c -
          unzip -q /tmp/PMIP4_frozen_halfdegree.zip -d input/PMIP4
          echo 'd8283a8ef177b56fd4554dc5bcc115e62adc5556e445bf5b7492c2c636a2a9db  input/PMIP4/coarse_masks_finite_05deg.npz' | sha256sum -c -
      - name: Score exact same modern locality edges under actual host and real other plants in both glacial eras
        run: |
          set -euo pipefail
          out=results/lgm_292_source_matched_otherplant_sameedge_null_v08
          python -u scripts/audit_0bp_matched_otherplant_patch_contact_v08.py \
            --model-plan results/lgm_v08_0bp_only_matched_otherplant_model_eligibility/source_fixed_292_otherplant_groups.json \
            --old-v06 results/lgm_513_original_modern_paired_edges_v06/all_513_original_edges_paired_contact_v06.csv \
            --localities input/original642geography/historical_host_memory_localities_v0.1.csv \
            --edges input/original642geography/historical_host_memory_edges_v0.1.csv \
            --primary-mask results/lgm_416_native_05deg_potential_graph_v02/plant_potential_climate_graph_masks_primary_v02.npz \
            --extrap-mask results/lgm_416_native_nonanalog_source_recovery_v03/plant_potential_climate_masks_extrapolation_included_v03.npz \
            --terrain input/PMIP4/coarse_masks_finite_05deg.npz \
            --out "$out"
          python - <<'PY'
          import csv,json,os,hashlib
          from pathlib import Path
          q=Path('results/lgm_292_source_matched_otherplant_sameedge_null_v08')
          a=json.loads((q/'summary.json').read_text())
          with (q/'all_source_plant_group_fourway_contact_v08.csv').open(newline='') as f:g=list(csv.DictReader(f))
          with (q/'all_292_insect_summary_v08.csv').open(newline='') as f:s=list(csv.DictReader(f))
          assert a['status']=='EXPLORATORY_HOST_SPECIFIC_PATCH_CLIMATE_NEGATIVE_CONTROL_NOT_GENETIC_OR_OCCUPANCY'
          assert (a['source_group_scenario_radius_rows'],len(g))==(12648,12648)
          assert (a['source_species_scenario_radius_rows'],len(s))==(1752,1752)
          assert a['source_qualified_actual_hosts_plus_four_otherplant_groups']==292
          assert a['source_replayed_original_host_v06_scenario_radius_rows']==1752
          assert len(a['by_scenario_radius'])==6
          for r in g:
              assert 0<=int(r['fourway_exact_common_original_edges_n'])<=int(r['all_original_edges_n'])
              if r['actual_minus_alternate_paired_delta']!='':
                  assert abs(float(r['actual_minus_alternate_paired_delta']))<=2.000001
          receipt={'schema':'chocho_292_insect_2108_otherplant_climatic_patch_null_v08_source_receipt',
             'run_id':os.environ['GITHUB_RUN_ID'],'source_commit':os.environ['GITHUB_SHA'],
             'output_sha256':{x.name:hashlib.sha256(x.read_bytes()).hexdigest()
                for x in sorted(q.iterdir()) if x.is_file()},
             'data_selected_before_any_new_LGM_patch_result':True,
             'ancient_plant_occupancy_or_genetic_response_used':False,
             'original_TTF_alt_plant_climate_specificity_test_reopened':False}
          (q/'receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          print(json.dumps(a['by_scenario_radius'],sort_keys=True))
          PY
      - name: Archive full result and non-evaluability statuses without changing source control
        run: |
          set -euo pipefail
          git fetch origin "${{ github.ref_name }}"
          test "$(git rev-parse FETCH_HEAD)" = "${{ github.sha }}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/lgm_292_source_matched_otherplant_sameedge_null_v08/
          git commit -m 'Archive 292 insects 2108 source-matched other-plant LGM same-edge host-climate specificity null'
          git push origin "HEAD:${{ github.ref_name }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chocho-source-292-insects-2108-otherplant-fourway-glacial-patch-null-v08
          path: results/lgm_292_source_matched_otherplant_sameedge_null_v08/
          retention-days: 30
          if-no-files-found: warn
