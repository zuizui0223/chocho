name: exploratory Melitaea host fallback feasibility

on:
  workflow_dispatch:
  push:
    branches: [exploration/realized-host-window-v01]
    paths:
      - "docs/exploratory/MELITAEA_TWO_HOST_FALLBACK_PROTOCOL_V01.json"
      - "scripts/audit_melitaea_host_fallback_panel.py"
      - "tests/test_melitaea_host_fallback_panel.py"
      - ".github/workflows/melitaea-host-fallback-source-gate.yml"

permissions:
  contents: read

jobs:
  source-and-design:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "pytest==8.3.4"
      - name: Check source denial and exposure preceding outcome
        run: python -m pytest -q tests/test_melitaea_host_fallback_panel.py
      - name: Check original archive and count independent host-decline events
        run: python scripts/audit_melitaea_host_fallback_panel.py --receipt results/melitaea_host_fallback_source_gate_v01.json
      - uses: actions/upload-artifact@v4
        with:
          name: melitaea-host-fallback-source-gate-v01
          path: results/melitaea_host_fallback_source_gate_v01.json
          retention-days: 30
