    paths: [.github/workflows/audit-geb-v05-s7-and-s6-integration-20261124.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: afbd44422e6ca442622a358e72bad4d4abbf4a65
