name: chocho inspect six original Neotoma Alnus pollen sample-specific chronological source records v18
on:
  push:
    branches: [ecology/lgm-neotoma-original-sample-pollen-ages-v18]
    paths:
      - .github/workflows/lgm-neotoma-direct-sample-ages-v18.yml
      - scripts/audit_neotoma_direct_Alnus_source_sampleages_v18.py
      - tests/test_neotoma_Alnus_direct_sample_ages_v18.py
      - docs/supporting/lgm_neotoma_alnus_direct_sample_ages_v18_contract.json
  workflow_dispatch:
permissions:
  actions: read
  contents: write
concurrency:
  group: chocho-Neotoma-six-raw-dataset-Alnus-positive-datum-ages-v18
  cancel-in-progress: false
jobs:
  six-source-dataset-sample-only:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test source-datum numeric value and unique sample age chronological identity
        run: |
          set -euo pipefail
          python -m pip install 'pytest>=8,<9'
          python -m pytest -q tests/test_neotoma_Alnus_direct_sample_ages_v18.py
          python -m py_compile scripts/audit_neotoma_direct_Alnus_source_sampleages_v18.py
          python - <<'PY'
          import json
          p=json.load(open('docs/supporting/lgm_neotoma_alnus_direct_sample_ages_v18_contract.json'))
          assert p['status']=='PREDECLARED_SAMPLE_LEVEL_SOURCE_CHECK_NO_ACCEPTED_LGM_OCCUPANCY'
          assert p['source']['taxonid']==1299 and p['source']['no_new_api_queries'] is True
          assert len(p['source']['dataset_sha256'])==len(p['source']['dataset_site'])==6
          assert p['rules']['calibrated_source_candidate'].startswith("Exact age source label")
          print('PASS_SOURCE_ONLY_BEFORE_NEW_SIX_RAW_SAMPLE_RESULT')
          PY
      - name: Restore original six SHA verified full Neotoma downloads, no new HTTP to fossil API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input/v16_source
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/12427662101/zip" > /tmp/Neotoma_six_full_v16.zip
          echo '7af90fc6be66b8c4fbde85e45189db3da9b8c033678fd46e2b94b5510f63231e  /tmp/Neotoma_six_full_v16.zip' | sha256sum -c -
          unzip -q /tmp/Neotoma_six_full_v16.zip -d input/v16_source
          python - <<'PY'
          import hashlib,gzip,json
          from pathlib import Path
          contract=json.load(open('docs/supporting/lgm_neotoma_alnus_direct_sample_ages_v18_contract.json'))
          for did,expected in contract['source']['dataset_sha256'].items():
              p=Path('input/v16_source/source_original_downloads')/f'dataset_{did}.json.gz'
              assert p.is_file(),p
              with gzip.open(p,'rb') as f:raw=f.read()
              assert hashlib.sha256(raw).hexdigest()==expected,did
          print('PASS_ALL_SIX_SHA_PINNED_RAW_NEOTOMA_DATASET_SAMPLE_SOURCE_BODIES')
          PY
      - name: Audit all Alnus taxonid1299 datum-bearing source samples and ALL their chronology records
        run: |
          set -euo pipefail
          out=results/lgm_neotoma_Alnus_direct_sample_age_models_v18
          python -u scripts/audit_neotoma_direct_Alnus_source_sampleages_v18.py \
            --contract docs/supporting/lgm_neotoma_alnus_direct_sample_ages_v18_contract.json \
            --full-source-dir input/v16_source/source_original_downloads \
            --out "$out"
          python - <<'PY'
          import csv,json,hashlib,os
          from pathlib import Path
          p=Path('results/lgm_neotoma_Alnus_direct_sample_age_models_v18')
          q=json.loads((p/'summary.json').read_text())
          def rows(name):
              with (p/name).open(newline='') as f:return list(csv.DictReader(f))
          source_samples=rows('all_source_Alnus_sample_datum_v18.csv')
          source_ages=rows('all_source_Alnus_sample_age_models_v18.csv')
          src=rows('six_source_dataset_pollen_age_inventory_v18.csv')
          assert q['status']=='SOURCE_DATUM_SAMPLE_CHRONOLOGY_CANDIDATES_NOT_VERIFIED_LGM_OCCUPANCY'
          assert q['source_original_datasets']==len(src)==6
          assert q['source_sample_rows_with_Alnus_taxon1299']==len(source_samples)
          assert q['source_age_model_rows_for_Alnus_labeled_samples']==len(source_ages)
          assert len({(v['datasetid'],v['sampleid']) for v in source_samples})==len(source_samples)
          assert q['original_sample_ages_independently_calibrated']==0
          assert q['source_Alnus_pollen_morphology_independently_validated']==0
          assert q['accepted_21ka_Alnus_host_occupied_population_sites']==0
          assert q['original_frozen_known_host_specificity_negative_results_unchanged']
          assert sum(int(v.get('positive_datum_sample_n') or 0) for v in src)==q['source_positive_datum_samples_total']
          print('PASS_ALL_SOURCE_SAMPLE_AGES_REPORT_NO_21KA_OCCUPANCY_OR_GENETICS')
          receipt={'schema':'chocho_Alnus_six_original_sample_age_models_v18',
              'run_id':os.environ['GITHUB_RUN_ID'],'head_sha':os.environ['GITHUB_SHA'],
              'source_hashes':q['source_sha256'],
              'result_sha256':{f.name:hashlib.sha256(f.read_bytes()).hexdigest()
                  for f in sorted(p.iterdir()) if f.is_file()},
              'known_host_ancestral_occupancy_confirmed':False,
              'sample_age_model_calibration_independently_validated':False,
              'genetic_response_opened':False}
          (p/'receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY
      - name: Archive bounded sample and chronology age audit on isolated exploratory branch
        run: |
          set -euo pipefail
          git fetch origin "${{ github.ref_name }}"
          test "$(git rev-parse FETCH_HEAD)" = "${{ github.sha }}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/lgm_neotoma_Alnus_direct_sample_age_models_v18/
          git commit -m 'Archive direct Neotoma six dataset Alnus taxon datum and multiple sample chronology metadata with inference firewall'
          git push origin "HEAD:${{ github.ref_name }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chocho-neotoma-six-full-dataset-source-samples-Alnus-age-v18
          path: results/lgm_neotoma_Alnus_direct_sample_age_models_v18/
          retention-days: 30
          if-no-files-found: warn
