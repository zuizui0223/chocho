name: Source-locked butterfly larval-host niche and lagged adult counts
on:
  push:
    branches:
      - analysis/sbus-host-sharing-abundance-20261025
    paths:
      - 'scripts/analyze_sbus_illinois_niche_counts_20261025.py'
      - '.github/workflows/sbus-illinois-host-niche-count-pilot-20261025.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ecological-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
      - name: Install numerical environment
        run: python -m pip install 'numpy>=1.26,<3'
      - name: Checkout pinned original HOSTS
        uses: actions/checkout@v4
        with:
          repository: globalbioticinteractions/HOSTS
          ref: 808e0b869f9ec1adf8efff87cf6a395adda103e0
          path: _external/HOSTS
      - name: Checkout pinned original WCVP
        uses: actions/checkout@v4
        with:
          repository: matildabrown/rWCVPdata
          ref: 65bed76bae9d644ccb6ad200c05f9f5071d89e05
          path: _external/WCVP
      - name: Build accepted larval host ID crosswalk using original source
        run: |
          Rscript scripts/build_wcvp_hosts_null_sidecars.R \
            _external/WCVP _external/HOSTS results/native results/contemporary
      - name: Audit real butterfly standardized site-year counts and fit conditional lagged coexistence
        run: |
          python scripts/analyze_sbus_illinois_niche_counts_20261025.py \
            --accepted-host-csv results/native/insect_host_accepted.csv \
            --out provenance/reviewer_defenses/results/sbus_illinois_host_niche_abundance_pilot_20261025.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: us-sbus-niche-competition-lagged-count-pilot-20261025
          path: provenance/reviewer_defenses/results/sbus_illinois_host_niche_abundance_pilot_20261025.json
          if-no-files-found: ignore
      - name: Preserve source aggregate only on isolated analysis branch
        if: success()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs=require('fs');
            const path='provenance/reviewer_defenses/results/sbus_illinois_host_niche_abundance_pilot_20261025.json';
            const owner=context.repo.owner,repo=context.repo.repo,branch=context.ref.replace('refs/heads/','');
            const content=Buffer.from(fs.readFileSync(path)).toString('base64');
            let sha;
            try{sha=(await github.rest.repos.getContent({owner,repo,path,ref:branch})).data.sha;}
            catch(e){if(e.status!==404)throw e;}
            const p={owner,repo,path,branch,content,message:'Archive original host-niche observational abundance result with explicit inference limits'};
            if(sha)p.sha=sha;
            await github.rest.repos.createOrUpdateFileContents(p);
