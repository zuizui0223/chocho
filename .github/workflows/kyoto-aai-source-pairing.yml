name: Kyoto AAI split-leaf source pairing audit
on:
  workflow_dispatch:
  push:
    branches: [exploration/realized-host-window-v01]
    paths:
      - "scripts/audit_kyoto_aai_paired_leaf_schema.py"
      - "tests/test_kyoto_aai_paired_leaf_schema.py"
      - ".github/workflows/kyoto-aai-source-pairing.yml"
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test exact original pairing audit
        run: |
          python -m pip install pytest==8.3.4
          python -m pytest -q tests/test_kyoto_aai_paired_leaf_schema.py
      - name: Retrieve author original leaf halves and larval 24h outcomes
        run: |
          python scripts/audit_kyoto_aai_paired_leaf_schema.py --receipt results/kyoto_original_aai_pairing_v01.json
      - uses: actions/upload-artifact@v4
        with:
          name: kyoto-aai-split-leaf-original-source-audit
          path: results/kyoto_original_aai_pairing_v01.json
          retention-days: 30
