name: UKBMS site abundance source feasibility 2026-10-25
on:
  push:
    branches:
      - analysis/ukbms-niche-competition-20261025
    paths:
      - 'scripts/audit_ukbms_site_indices_population_gate_20261025.py'
      - '.github/workflows/ukbms-population-competition-source-gate-20261025.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  source-first-feasibility:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Acquire original official relative-abundance indices and report verified schema
        run: |
          python scripts/audit_ukbms_site_indices_population_gate_20261025.py \
            --out provenance/reviewer_defenses/results/ukbms_site_abundance_source_gate_20261025_v02.json
      - name: Upload privacy-minimal source schema receipt only
        uses: actions/upload-artifact@v4
        with:
          name: ukbms-site-indices-2024-source-gate-20261025-v02
          path: provenance/reviewer_defenses/results/ukbms_site_abundance_source_gate_20261025_v02.json
      - name: Archive verifiable aggregated source gate in separate branch
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs=require('fs');
            const path='provenance/reviewer_defenses/results/ukbms_site_abundance_source_gate_20261025_v02.json';
            const content=Buffer.from(fs.readFileSync(path)).toString('base64');
            const owner=context.repo.owner,repo=context.repo.repo;
            const branch=context.ref.replace('refs/heads/','');
            let sha;
            try{sha=(await github.rest.repos.getContent({owner,repo,path,ref:branch})).data.sha;}
            catch(e){if(e.status!==404)throw e;}
            const props={owner,repo,path,content,branch,message:'Archive UKBMS first-party abundance source availability and 239-species crosswalk gate'};
            if(sha)props.sha=sha;
            await github.rest.repos.createOrUpdateFileContents(props);
