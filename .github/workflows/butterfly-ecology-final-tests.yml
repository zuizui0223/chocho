name: butterfly ecology final tests

on:
  push:
    branches:
      - analysis/resource-homogenization-v01
    paths:
      - ".github/workflows/butterfly-ecology-final-tests.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  final-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"

      - name: Restore exact S1 resource reconstruction
        uses: actions/download-artifact@v4
        with:
          name: butterfly-resource-envelope-pilot-v01
          path: inputs/s1
          github-token: ${{ github.token }}
          repository: zuizui0223/TTF
          run-id: 36222306369

      - name: Checkout fixed HOSTS source
        uses: actions/checkout@v7
        with:
          repository: globalbioticinteractions/HOSTS
          ref: 808e0b869f9ec1adf8efff87cf6a395adda103e0
          path: _external/HOSTS

      - name: Checkout fixed WCVP source
        uses: actions/checkout@v7
        with:
          repository: matildabrown/rWCVPdata
          ref: 65bed76bae9d644ccb6ad200c05f9f5071d89e05
          path: _external/WCVP

      - name: Checkout fixed WGSRPD source
        uses: actions/checkout@v7
        with:
          repository: tdwg/wgsrpd
          ref: 52da7828aba9d461dd133c27b3bd7a4407161f54
          path: _external/WGSRPD

      - name: Rebuild exact butterfly-host distribution sidecars
        run: |
          Rscript scripts/build_wcvp_hosts_null_sidecars.R \
            _external/WCVP _external/HOSTS results/native results/contemporary

      - name: Run level1-constrained homogenization null
        run: |
          mkdir -p results/ecology-final
          python scripts/analyze_butterfly_resource_homogenization_level1_null.py \
            --descriptors-csv inputs/s1/butterfly-resource-envelope-pilot-v0.1/s1_resource_descriptors.csv \
            --insect-host-csv results/native/insect_host_accepted.csv \
            --native-distribution-csv results/native/native_extant_nondoubtful_wgsrpd3.csv \
            --contemporary-distribution-csv results/contemporary/extant_nondoubtful_wgsrpd3.csv \
            --level3-geojson _external/WGSRPD/geojson/level3.geojson \
            --permutations 499 --seed 20261007 \
            --output-json results/ecology-final/resource_homogenization_level1_null.json

      - name: Run resource connectivity test
        run: |
          python scripts/analyze_butterfly_resource_connectivity.py \
            --descriptors-csv inputs/s1/butterfly-resource-envelope-pilot-v0.1/s1_resource_descriptors.csv \
            --insect-host-csv results/native/insect_host_accepted.csv \
            --native-distribution-csv results/native/native_extant_nondoubtful_wgsrpd3.csv \
            --contemporary-distribution-csv results/contemporary/extant_nondoubtful_wgsrpd3.csv \
            --level3-geojson _external/WGSRPD/geojson/level3.geojson \
            --permutations 499 --seed 20261007 \
            --output-json results/ecology-final/resource_connectivity.json \
            --output-species-csv results/ecology-final/resource_connectivity_species.csv

      - name: Run competition break-even sensitivity
        run: |
          python scripts/analyze_butterfly_competition_break_even.py \
            --descriptors-csv inputs/s1/butterfly-resource-envelope-pilot-v0.1/s1_resource_descriptors.csv \
            --insect-host-csv results/native/insect_host_accepted.csv \
            --native-distribution-csv results/native/native_extant_nondoubtful_wgsrpd3.csv \
            --contemporary-distribution-csv results/contemporary/extant_nondoubtful_wgsrpd3.csv \
            --output-json results/ecology-final/competition_break_even.json \
            --output-species-csv results/ecology-final/competition_break_even_species.csv

      - name: Run introduced-host dependency ledger
        run: |
          python scripts/analyze_butterfly_introduced_host_dependency.py \
            --descriptors-csv inputs/s1/butterfly-resource-envelope-pilot-v0.1/s1_resource_descriptors.csv \
            --insect-host-csv results/native/insect_host_accepted.csv \
            --native-distribution-csv results/native/native_extant_nondoubtful_wgsrpd3.csv \
            --contemporary-distribution-csv results/contemporary/extant_nondoubtful_wgsrpd3.csv \
            --output-json results/ecology-final/introduced_host_dependency.json \
            --output-csv results/ecology-final/introduced_host_dependency.csv

      - uses: actions/upload-artifact@v4
        with:
          name: butterfly-ecology-final-tests
          path: results/ecology-final/
          retention-days: 30
