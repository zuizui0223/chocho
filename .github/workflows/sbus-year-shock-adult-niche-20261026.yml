name: Illinois butterfly shared calendar-year shock falsification
on:
  push:
    branches:
      - analysis/sbus-environment-shock-20261026
    paths:
      - 'scripts/analyze_sbus_year_shock_niche_synchrony_20261026.py'
      - '.github/workflows/sbus-year-shock-adult-niche-20261026.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  source-lock-year-shock:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
      - name: Install numerical source
        run: python -m pip install 'numpy>=1.26,<3'
      - uses: actions/checkout@v4
        with:
          repository: globalbioticinteractions/HOSTS
          ref: 808e0b869f9ec1adf8efff87cf6a395adda103e0
          path: _external/HOSTS
      - uses: actions/checkout@v4
        with:
          repository: matildabrown/rWCVPdata
          ref: 65bed76bae9d644ccb6ad200c05f9f5071d89e05
          path: _external/WCVP
      - name: Recreate accepted larval host species graph
        run: |
          Rscript scripts/build_wcvp_hosts_null_sidecars.R \
            _external/WCVP _external/HOSTS results/native results/contemporary
      - name: Test fixed Illinois 640 pairs with source-leave-one-site-year effects and 199 butterfly-host null graphs
        run: |
          python -u scripts/analyze_sbus_year_shock_niche_synchrony_20261026.py \
            --accepted-host-csv results/native/insect_host_accepted.csv \
            --out provenance/reviewer_defenses/results/sbus_illinois_year_shock_niche_synchrony_20261026.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sbus-illinois-year-common-shock-source-null-20261026
          path: provenance/reviewer_defenses/results/sbus_illinois_year_shock_niche_synchrony_20261026.json
          if-no-files-found: ignore
      - name: Archive original source scalar null and year-shock QC, no survey locations
        if: success()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs=require('fs');
            const path='provenance/reviewer_defenses/results/sbus_illinois_year_shock_niche_synchrony_20261026.json';
            const owner=context.repo.owner,repo=context.repo.repo;
            const branch=context.ref.replace('refs/heads/','');
            const content=Buffer.from(fs.readFileSync(path)).toString('base64');
            let sha;
            try{sha=(await github.rest.repos.getContent({owner,repo,path,ref:branch})).data.sha;}
            catch(e){if(e.status!==404)throw e;}
            const props={owner,repo,path,branch,content,
              message:'Archive fixed-pair site-leave-out year-shock adult synchrony falsification'};
            if(sha)props.sha=sha;
            await github.rest.repos.createOrUpdateFileContents(props);
