name: Disturbance trait macro verification
on:
  push:
    branches:
      - analysis/disturbance-filter-macro-20261024
    paths:
      - 'scripts/analyze_butterfly_disturbance_resource_gain_20261024.py'
      - 'provenance/reviewer_defenses/results/butterfly_disturbance_resource_gain_20261024.json'
      - 'data/frozen/figure_sources/*.csv'
      - '.github/workflows/disturbance-trait-macro-20261024.yml'
  workflow_dispatch:
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical requirement
        run: python -m pip install 'numpy>=1.26'
      - name: Recompute source-locked 5,000-genus bootstraps
        run: |
          python scripts/analyze_butterfly_disturbance_resource_gain_20261024.py \
            --compare-json provenance/reviewer_defenses/results/butterfly_disturbance_resource_gain_20261024.json \
            --out /tmp/butterfly_disturbance_macro_20261024.json
      - name: Upload independent replay
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: butterfly-disturbance-trait-20261024
          path: /tmp/butterfly_disturbance_macro_20261024.json
          if-no-files-found: ignore
