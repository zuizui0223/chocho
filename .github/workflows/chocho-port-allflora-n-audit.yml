name: chocho source-locked all-flora N independent island robustness

on:
  pull_request:
    paths:
      - "scripts/exploratory_port_allflora_N_offline_audit.py"
      - "tests/test_exploratory_port_allflora_N_offline_audit.py"
      - ".github/workflows/chocho-port-allflora-n-audit.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  source-only-no-GBIF:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Source-free tests
        run: |
          python -m pip install --quiet pytest
          python -m pytest -q tests/test_exploratory_port_allflora_N_offline_audit.py
      - name: Read complete prior successful source receipt without new GBIF requests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/nflora_full
          gh run download 41407370295 --name allflora-N-host-vs-other-WPI78 --dir /tmp/nflora_full --repo zuizui0223/chocho
          test -s /tmp/nflora_full/allplant_N_background_analysis.json
          mkdir -p /tmp/nflora_full/geography
          gh run download 41402076182 --name strict-disjoint-coastal-sites-wpi79 \
            --dir /tmp/nflora_full/geography --repo zuizui0223/chocho
          test -s /tmp/nflora_full/geography/strict_disjoint_wpi79_sites.json
      - name: Audit independent island sign shifts, leave-one-island robustness and sampling bias
        run: |
          python scripts/exploratory_port_allflora_N_offline_audit.py \
            --source /tmp/nflora_full/allplant_N_background_analysis.json \
            --geometry /tmp/nflora_full/geography/strict_disjoint_wpi79_sites.json \
            --output /tmp/nflora_full/allflora_N_exact_island_audit.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/nflora_full/allflora_N_exact_island_audit.json').read_text())
          assert d["source_original_78_geom_no_overlap"]
          val=d["results"]["base"]["same_exact_port_pairs_period_change"]["target_minus_background"]
          assert (val["pairs"],val["islands"])==(27,6),val
          assert abs(val["island_mean"]-.1493596770601339)<1e-9
          print("ALL_FLORA_N_INDEPENDENT_ISLAND_SOURCE_AUDIT_PASS")
          PY
      - name: Upload reusable no-network sensitivity receipt
        uses: actions/upload-artifact@v4
        with:
          name: allflora-N-WPI78-island-robustness
          path: /tmp/nflora_full/allflora_N_exact_island_audit.json
          retention-days: 30
