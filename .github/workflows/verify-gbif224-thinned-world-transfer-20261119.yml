name: Verify GBIF224 host predictor transfer to completely unseen TDWG Level1
on:
  push:
    branches: [analysis/gbif224-thinned-world-transfer-20261119]
    paths:
      - scripts/audit_gbif224_thinned_world_transfer_20261119.py
      - results/gbif224_thinned_world_transfer_20261119/PROTOCOL.md
      - .github/workflows/verify-gbif224-thinned-world-transfer-20261119.yml
  pull_request:
    branches: [main]
    paths:
      - scripts/audit_gbif224_thinned_world_transfer_20261119.py
      - results/gbif224_thinned_world_transfer_20261119/PROTOCOL.md
      - .github/workflows/verify-gbif224-thinned-world-transfer-20261119.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-gbif-original-source-refit:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          path: current
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: dfd49cfcf9fb01a3db47cc611aae8cdd9c53cda0
          path: frozen
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: globalbioticinteractions/HOSTS
          ref: 808e0b869f9ec1adf8efff87cf6a395adda103e0
          path: frozen/_external/HOSTS
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: bb4d8f00fbdb97fa2d90f606a8c9e7e0620646f2
          path: frozen/_external/butterfly_beta
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: tdwg/wgsrpd
          ref: 52da7828aba9d461dd133c27b3bd7a4407161f54
          path: frozen/_external/wgsrpd
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install original-source numerical and spatial dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "numpy>=1.26,<3" "pandas>=2.2,<3" "shapely>=2.1,<3" "pyproj>=3.7,<4" "pyshp>=2.3"
          python -m py_compile current/scripts/audit_gbif224_thinned_world_transfer_20261119.py
      - name: Reacquire pinned published GloNAF flora source without raw GBIF observations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p frozen/_temp_historical_sources
          curl --fail --show-error --silent --location --retry 2 \
            --connect-timeout 30 --max-time 240 \
            'https://zenodo.org/api/records/6640264/files/lenzner/Eur-Emp-Alien-Flora-v1.0.0.zip/content' \
            --output frozen/_temp_historical_sources/lenzner_6640264.zip
          echo '16f5585d2500676951a4b664bbf0ffde  frozen/_temp_historical_sources/lenzner_6640264.zip' | md5sum -c -
      - name: Reproduce original 169 region H/O predictor + 29x2 source-thinned H/O fitted models
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p current/_result
          python -u current/scripts/audit_gbif224_thinned_world_transfer_20261119.py \
            --frozen-root frozen \
            --current-scripts current/scripts \
            --output current/_result/GBIF224_thinned_entire_world_transfer_20261119.json
      - name: Validate matched original source and all primary and adverse simulation outcomes
        shell: bash
        run: |
          python - <<'PY'
          import json, math
          from pathlib import Path
          p=Path("current/_result/GBIF224_thinned_entire_world_transfer_20261119.json")
          d=json.loads(p.read_text())
          assert d["sample"]["butterflies"]==224
          assert d["sample"]["regions"]==169
          assert d["sample"]["original_pairs"]==14196
          assert d["sample"]["leave_one_region_out_folds"]==169
          assert d["source"]["all_4_original_models_exactly_reproduced"] is True
          assert d["source"]["exact_raw_prior_and_late_Jaccard_for_each_pair"] is True
          assert d["source"]["all_eight_original_entire_world_holdout_scores_reproduced"] is True
          assert d["source"]["original_raw_entire_world_transfer"]["n_worlds_improve"]==7
          assert abs(d["source"]["original_source_H_after_O_pct"]-.09129078138747806)<1e-8
          assert set(d["results"])=={"dataset_key_calendar_day","indexed_candidate_record_count"}
          for key,z in d["results"].items():
              assert z["draw_count"]==29
              assert len(z["per_draw"])==29
              geographic=z["strict_entire_TDWG_Level1_world_holdout"]
              assert geographic["n_simulations"]==29
              assert set(geographic["per_world"])==set("12345678")
              assert geographic["per_world"]["6"]["original_raw"]["regions_held_out"]==2
              assert geographic["per_world"]["8"]["original_raw"]["H_after_O_MSE_improvement_pct"]<0
              assert geographic["world_equal_mean_MSE_gain_pct"]["n_draws"]==29
              for world,row in geographic["per_world"].items():
                  assert row["n_draws"]==29
                  assert row["original_raw"]["source_test_pairs"]>0
                  assert math.isfinite(row["median_H_after_O_MSE_gain_pct"])
              for draw in z["per_draw"]:
                  w=draw["world_transfer"]
                  assert len(w["per_world"])==8
                  assert math.isfinite(w["world_equal_mean_MSE_gain_pct"])
              assert z["num_draws_with_undefined_outcome_pairs"] in range(30)
              assert z["num_draws_with_undefined_prior_pairs"] in range(30)
              assert 0<=z["H_after_O_held_region_MSE_reduction_pct"]["fraction_positive"]<=1
              for row in z["per_draw"]:
                  assert math.isfinite(row["H_after_O_MSE_gain_percent"])
                  assert row["held_regions_M3_better"]+row["held_regions_M3_worse"]<=169
                  assert row["mean_MSE_M2"]>0
          print("PASS original 169 regional + 8 entire-world source holdouts and all 29x2 strict biogeographic refits")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GBIF224-29x2-entire-unseen-world-host-transfer
          path: current/_result/
          if-no-files-found: warn
          retention-days: 90
      - name: Remove raw external botanical and source copies
        if: always()
        run: rm -rf frozen
