name: chocho Q2 beneficiary geography by native host resources
on:
  push:
    branches:
      - analysis/island-mainland-host-opportunity-20261102
    paths:
      - scripts/analyze_q2_resource_beneficiary_origin.py
      - .github/workflows/chocho-q2-beneficiary-native-resource-geography.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  beneficiary-geography:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
      - uses: actions/checkout@v4
        with:
          repository: globalbioticinteractions/HOSTS
          ref: 808e0b869f9ec1adf8efff87cf6a395adda103e0
          path: _external/HOSTS
      - uses: actions/checkout@v4
        with:
          repository: matildabrown/rWCVPdata
          ref: 65bed76bae9d644ccb6ad200c05f9f5071d89e05
          path: _external/WCVP
      - name: Restore fixed Q2 butterfly–plant–island edges
        uses: actions/download-artifact@v4
        with:
          name: chocho-q2-introduced-host-native-source
          run-id: 41370175076
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: zuizui0223/chocho
          path: work/q2
      - name: Reconstruct exact butterfly native-host footprints
        run: |
          Rscript scripts/build_wcvp_hosts_null_sidecars.R \
            _external/WCVP _external/HOSTS work/native work/contemporary
      - name: Attribute island gains to beneficiary source geography
        run: |
          python -m py_compile scripts/analyze_q2_resource_beneficiary_origin.py
          python scripts/analyze_q2_resource_beneficiary_origin.py \
            --panel-csv data/frozen/figure_sources/anthropogenic_species_metrics.csv \
            --host-csv work/native/insect_host_accepted.csv \
            --native-distribution work/native/native_extant_nondoubtful_wgsrpd3.csv \
            --q2-edges work/q2/introduced_host_source_edges.csv \
            --q2-audit results/colonial-host-native-source-q2/host_source_audit.json \
            --level1-json data/frozen/wgsrpd3_level1_lookup_v0.1.json \
            --q1-region-metrics results/island-mainland-resource-q1/region_metrics.csv \
            --empire-islands results/colonial-history-island-q2/island_lenzner_empire_crosswalk.csv \
            --output-dir results/colonial-beneficiary-geography-q2
      - name: Upload full reproducibility tables
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chocho-q2-butterfly-resource-beneficiaries
          path: results/colonial-beneficiary-geography-q2/
          retention-days: 90
          if-no-files-found: warn
      - name: Save beneficiary results to analysis branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/colonial-beneficiary-geography-q2/
          git diff --cached --quiet && exit 0
          git commit -m 'Audit original native-host resource geography of butterflies gaining on islands [skip ci]'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
