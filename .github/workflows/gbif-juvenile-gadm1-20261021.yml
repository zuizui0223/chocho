name: Source-conditional GADM1 localization of 39 GBIF juvenile-stage labels
on:
  push:
    branches:
      - analysis/gbif-macro-recovery-20261020
    paths:
      - "scripts/audit_gbif_juvenile_gadm1_20261021.py"
      - "tests/test_gbif_juvenile_gadm1_20261021.py"
      - "provenance/reviewer_defenses/protocols/GBIF_JUVENILE_GADM1_CONDITIONAL_20261021.md"
      - ".github/workflows/gbif-juvenile-gadm1-20261021.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  juvenile-gadm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: No-network source and query-contract tests
        run: |
          python -m pip install "pytest>=8,<10"
          pytest -q tests/test_gbif_juvenile_gadm1_20261021.py
      - name: Restore already completed raw aggregate queries from first attempt
        uses: actions/download-artifact@v4
        with:
          name: chocho-juvenile-gadm1-conditional-20261021
          run-id: 39448612865
          github-token: ${{ github.token }}
          path: _juvenile_archived
      - name: Independently replay all 15 completed GBIF conditional GADM1 facets
        run: |
          mkdir -p _juvenile
          test -f _juvenile_archived/gbif_juvenile_gadm1_20261021.json
          python scripts/audit_gbif_juvenile_gadm1_20261021.py \
            --frozen-positive48 provenance/reviewer_defenses/results/gbif_country_20261020/gbif_positive48_gadm_lifestage_facets_20261020.json \
            --replay-results _juvenile_archived/gbif_juvenile_gadm1_20261021.json \
            --output _juvenile/gbif_juvenile_gadm1_20261021.json
      - name: Preserve aggregate juvenile location counts even on provider failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chocho-juvenile-gadm1-conditional-20261021
          path: _juvenile/*.json
          if-no-files-found: warn
          retention-days: 30
