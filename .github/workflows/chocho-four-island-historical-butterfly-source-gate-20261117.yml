name: chocho four-island historic butterfly GBIF first-index source and geographic-quality gate
on:
  push:
    branches: [analysis/butterfly-trait-public51-20261109]
    paths:
      - scripts/audit_four_island_prior_butterfly_records_20261117.py
      - .github/workflows/chocho-four-island-historical-butterfly-source-gate-20261117.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-record-source-and-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline source-pinned 4-island source match and Jaccard
        run: |
          set -euo pipefail
          python -m py_compile scripts/audit_four_island_prior_butterfly_records_20261117.py
          python scripts/audit_four_island_prior_butterfly_records_20261117.py --output-dir _four_island_history_index
      - name: Strict independent validation and separate island versus national-island scope
        run: |
          python - <<'PY'
          import csv,json,math
          from collections import Counter
          from pathlib import Path
          root=Path('_four_island_history_index')
          x=json.loads((root/'FOUR_ISLAND_HISTORY_VS_GBIF_317_SOURCE_AUDIT_20261117.json').read_text())
          rows=list(csv.DictReader((root/'FOUR_ISLAND_317_FIRST_INDICES_SOURCE_STATUS_20261117.csv').open()))
          q=x['cohort']; a=x['recorded_community_Jaccard']
          assert (q['species'],q['landmasses'],q['species_island_cells'],q['later_first_index_cells'])==(225,51,11475,317)
          assert (q['geographically_named_island_source_matches'],q['national_island_2006_checklist_matches'],q['independent_sources_before_GBIF'])==(19,14,33)
          assert (q['as_yet_unverified_first_indices'],len(rows))==(284,317)
          assert q['unmatched_2006_exact_binomial_but_not_absent']==['Ypthima huebneri']
          assert (a['original_early_GBIF_only_cells'],a['cumulative_through_2022_indexed_cells'])==(736,1053)
          assert a['historical_source_additions'][-1]['early_indexed_or_prior_source_cells']==769
          assert [z['early_indexed_or_prior_source_cells'] for z in a['historical_source_additions']]==[748,751,755,769]
          assert math.isclose(a['original_early_mean_Jaccard'],0.12096325473271494,abs_tol=1e-10)
          assert math.isclose(a['cumulative_through_2022_mean_Jaccard'],0.17777287436807873,abs_tol=1e-10)
          assert math.isclose(a['historical_source_additions'][2]['mean_early_Jaccard'],0.1270751832600804,abs_tol=1e-10)
          assert math.isclose(a['historical_source_additions'][3]['mean_early_Jaccard'],0.12806690628478226,abs_tol=1e-10)
          assert len({(z['speciesKey'],z['landmass_id']) for z in rows})==317
          ct=Counter(z['historical_source_status'] for z in rows)
          assert ct['prior_publication_exact_named_island']==19
          assert ct['prior_publication_national_island_checklist']==14
          assert ct['searched_2006_checklist_no_exact_binomial_unresolved']==1
          assert ct['not_reviewed']==283
          assert {z['source_geographic_resolution'] for z in rows if z['historical_source_status']=='prior_publication_national_island_checklist'}=={'national_island_not_exact_geo_point'}
          assert all(z['native_status']=='unknown' and z['reproductive_establishment_status']=='unknown'
                     and z['island_endemic_status']=='unassessed' for z in rows)
          print('FOUR_ISLAND_CROSS_SOURCE_NUMBERS_AND_GEOGRAPHIC_SCOPE_PASS')
          PY
      - name: "Negative tests: reject future-dated and wrong-island records or claims about endemism"
        run: |
          python - <<'PY'
          import importlib.util
          spec=importlib.util.spec_from_file_location('four','scripts/audit_four_island_prior_butterfly_records_20261117.py')
          m=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(m)
          tables=[m.source(k) for k in m.PINS]
          for index,key,value in [(5,'landmass_id','471'),(5,'checklist_publication_year','2018'),
                                  (5,'butterfly_origin_status','native'),(5,'source_url','https://example.org/missing'),
                                  (4,'endemicity_status','single_island_endemic'),(2,'earliest_independent_record_year_upper_bound','2022'),
                                  (3,'butterfly_endemicity_status','single_island_endemic')]:
              a=[[dict(y) for y in x] for x in tables]
              a[index][0][key]=value
              try:m.run(*a)
              except (ValueError,KeyError):pass
              else:raise AssertionError('Incorrectly accepted invalid evidence '+key)
          print('NO_UNSOURCED_NATIVE_OR_ENDEMICITY_OR_COLONIZATION_PROMOTION_PASS')
          PY
      - name: Archive classified but not presumed-absent GBIF candidate cells
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chocho-4-island-19-exact-14-national-GBIF-317-historic-source-gate
          path: _four_island_history_index/
          retention-days: 90
          if-no-files-found: warn
