name: Original western monarch juvenile-stage and milkweed source audit
on:
  push:
    branches:
      - analysis/monarch-host-stage-realization-20261026
    paths:
      - 'scripts/audit_western_monarch_stage_host_phenology_source_20261026.py'
      - '.github/workflows/western-monarch-juvenile-host-source-20261026.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  acquire-and-quality-check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read exact 2026-10-08 public Dryad archive and check seven Asclepias phenophases and monarch instars
        run: |
          python -u scripts/audit_western_monarch_stage_host_phenology_source_20261026.py \
            --out provenance/reviewer_defenses/results/western_monarch_stage_host_phenology_source_gate_20261026.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: western-monarch-stage-host-dryad-source-qc-20261026
          path: provenance/reviewer_defenses/results/western_monarch_stage_host_phenology_source_gate_20261026.json
          if-no-files-found: ignore
      - name: Archive source aggregate counts, never raw Dryad site observations
        if: success()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs=require('fs');
            const path='provenance/reviewer_defenses/results/western_monarch_stage_host_phenology_source_gate_20261026.json';
            const owner=context.repo.owner,repo=context.repo.repo;
            const branch=context.ref.replace('refs/heads/','');
            const content=Buffer.from(fs.readFileSync(path)).toString('base64');
            let sha;
            try{sha=(await github.rest.repos.getContent({owner,repo,path,ref:branch})).data.sha;}
            catch(e){if(e.status!==404)throw e;}
            const args={owner,repo,path,branch,content,
              message:'Archive original Diethelm 2026 monarch larval stage and host phenology source QC only'};
            if(sha)args.sha=sha;
            await github.rest.repos.createOrUpdateFileContents(args);
