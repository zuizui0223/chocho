name: frozen WCVP cultivated Senna distribution check
on:
  push:
    branches: [analysis/resource-homogenization-v01]
    paths:
      - "scripts/audit_cultivated_senna_wcvp_distribution.R"
      - ".github/workflows/butterfly-cultivated-senna-wcvp-check.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
      - uses: actions/checkout@v4
        with:
          repository: matildabrown/rWCVPdata
          ref: 65bed76bae9d644ccb6ad200c05f9f5071d89e05
          path: _external/WCVP
      - name: Audit native/introduced status for four published Senna hosts
        run: |
          mkdir -p results/cultivated-senna
          Rscript scripts/audit_cultivated_senna_wcvp_distribution.R _external/WCVP results/cultivated-senna/senna_wcvp_region_summary_v01.csv results/cultivated-senna/senna_wcvp_region_records_v01.csv
      - uses: actions/upload-artifact@v4
        with:
          name: butterfly-cultivated-senna-wcvp-v01
          path: results/cultivated-senna/
          if-no-files-found: error
          retention-days: 30
