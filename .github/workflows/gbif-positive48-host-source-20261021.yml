name: Source-exact butterfly introduced host candidates for 5 juvenile positive country cases
on:
  push:
    branches: [analysis/gbif-macro-recovery-20261020]
    paths:
      - "scripts/derive_gbif_positive48_introduced_hosts_20261021.py"
      - "tests/test_gbif_positive48_introduced_hosts_20261021.py"
      - ".github/workflows/gbif-positive48-host-source-20261021.yml"
      - "provenance/reviewer_defenses/protocols/GBIF_LOCAL_HOST_BRIDGE_20261021.md"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original-source-host-candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Test closed original source/host candidate definition
        run: |
          python -m pip install -e ".[analysis,test]"
          pytest -q tests/test_gbif_positive48_introduced_hosts_20261021.py
      - name: Restore original validated HOSTS WCVP BCE CHELSA source
        uses: actions/download-artifact@v4
        with:
          run-id: 39006554609
          name: butterfly-author-anonymous-offline-source-replication-v01
          github-token: ${{ github.token }}
          path: _author_source_zip
      - name: Verify original source zip checksum and extract safely
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,zipfile
          want="408cb206d7ce4056cee1fbf614762e1a6efb3db4650ff7c2663a7d6d6003e323"
          zips=[p for p in Path("_author_source_zip").rglob("*.zip") if hashlib.sha256(p.read_bytes()).hexdigest()==want]
          assert len(zips)==1,"Original author source missing or SHA changed"
          target=Path("_source")
          target.mkdir()
          with zipfile.ZipFile(zips[0]) as z:
              assert z.testzip() is None
              assert all(not Path(n).is_absolute() and ".." not in Path(n).parts for n in z.namelist())
              z.extractall(target)
          assert (target/"SOURCE_MANIFEST.json").exists()
          print("PASS original 239-butterfly HOSTS/WCVP/BCE source zip")
          PY
      - name: Rebuild original WCVP host candidates without redistributing the author source
        run: |
          mkdir -p _candidate
          python scripts/derive_gbif_positive48_introduced_hosts_20261021.py \
            --source-root _source \
            --crosswalk data/exploratory/gbif_country_20261020/country_wgsrpd_links.csv \
            --positive48 provenance/reviewer_defenses/results/gbif_country_20261020/gbif_positive48_gadm_lifestage_facets_20261020.json \
            --juvenile-readout provenance/reviewer_defenses/results/gbif_country_20261020/gbif_juvenile_gadm1_readout_20261021.json \
            --output _candidate/source_verified_introduced_host_candidates.json
      - name: Upload derived five-case subset, never original HOSTS/WCVP archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chocho-introduced-host-five-case-20261021
          path: _candidate/*.json
          if-no-files-found: warn
          retention-days: 30
