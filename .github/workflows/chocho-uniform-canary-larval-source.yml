name: chocho uniform independent Canary larval-source ascertainment
on:
  push:
    branches: [analysis/island-endemic-host-synonyms-20261118]
    paths:
      - scripts/audit_uniform_canary_source_20261118.py
      - scripts/summarize_uniform_canary_hosts_20261118.py
      - scripts/audit_independent42_original239_taxonomic_selection_20261118.py
      - scripts/audit_independent42_multisource_host_union_20261118.py
      - .github/workflows/chocho-uniform-canary-larval-source.yml
      - provenance/reviewer_defenses/results/island_endemic_synonym_origin_20261118/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  uniform-source-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: HTML parser and source-independent 33-species source fetch
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check beautifulsoup4==4.12.3
          python3 scripts/audit_uniform_canary_source_20261118.py --out-dir results/uniform_canary_source_20261118
      - name: Validate uniformly sourced 24 larval host-genus lists and quantify family-conditioned source bias
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/summarize_uniform_canary_hosts_20261118.py
          python3 scripts/summarize_uniform_canary_hosts_20261118.py \
            --uniform-csv results/uniform_canary_source_20261118/uniform_polinizadores_ciclo_vital_canary33.csv \
            --out-dir results/uniform_canary_source_20261118
      - name: Reconcile independent 42 butterfly identity with original GEB239 homotypic names
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/audit_independent42_original239_taxonomic_selection_20261118.py
          python3 scripts/audit_independent42_original239_taxonomic_selection_20261118.py \
            --out-dir results/uniform_canary_source_20261118
      - name: Reconcile all 42 independent butterfly taxa across three host evidence streams without duplicate counting
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/audit_independent42_multisource_host_union_20261118.py
          python3 scripts/audit_independent42_multisource_host_union_20261118.py \
            --uniform-validated-csv results/uniform_canary_source_20261118/uniform_canary33_host_genus_verified.csv \
            --out-dir results/uniform_canary_source_20261118
      - name: Verify all independent butterfly queries and source semantics
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('results/uniform_canary_source_20261118/uniform_source_summary.json')
          obj=json.loads(p.read_text(encoding='utf8'))
          assert obj['universe_n']==33 and obj['queried_n']==33
          assert len(obj['all_statuses'])==33
          assert obj['cohorts']['endemic_confirmed']['original_independent_n']==13
          assert obj['cohorts']['native_nonendemic_secure']['original_independent_n']==5
          assert obj['cohorts']['native_nonendemic_probable']['original_independent_n']==14
          assert obj['cohorts']['introduced_probable']['original_independent_n']==1
          q=json.loads((p.parent/'uniform_canary33_host_genus_summary.json').read_text())
          assert q['n']==33
          assert q['source_species_pages_with_named_larval_host_genus']==24
          assert q['combined_original_exact_HOSTS_plus_uniform']==26
          assert q['origin_strata']['endemic_confirmed']['uniform_source_larval_genus']==6
          assert q['native_nonendemic_combined']['uniform_source_larval_genus']==18
          assert q['source_availability_family_conditional']['one_sided_conditional_fixed_family_origin_page_totals']>0
          identity=json.loads((p.parent/'original239_homotypic_selection_summary.json').read_text())
          assert identity['source_exact_original239_n']==12
          assert identity['source_confirmed_homotypic_original239_min']==13
          assert identity['cohorts']['Canary_native_nonendemic19']['source_verified_homotypic_239']==10
          assert identity['cohorts']['Madeira_native_nonendemic7']['source_verified_homotypic_239']==7
          union=json.loads((p.parent/'independent42_multisource_larval_genus_union.json').read_text())
          assert union['independent_species_n']==42
          assert union['combined_documented_host_genus_lower_bound_n']==35
          assert union['uniform_source_new_larval_hosts_additional_n']==4
          assert union['cohorts']['Canary_native_nonendemic19']['source_documented_genus_n']==19
          assert union['cohorts']['Canary_endemic13']['source_documented_genus_n']==7
          assert union['cohorts']['Madeira_extant_endemic3']['source_documented_genus_n']==3
          print('COMPLETE_33_UNIFORM_LARVAL_SOURCE_QUERIES_VALID')
          for origin,record in obj['cohorts'].items():
            print(origin,json.dumps(record,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chocho-uniform-canary-larval-source-33-20261118
          path: results/uniform_canary_source_20261118/
          retention-days: 90
          if-no-files-found: warn
