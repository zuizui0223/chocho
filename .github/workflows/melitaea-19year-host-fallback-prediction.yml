name: prospective Melitaea 19-year host-change prediction
on:
  workflow_dispatch:
  push:
    branches: [exploration/realized-host-window-v01]
    paths:
      - "docs/exploratory/MELITAEA_19YEAR_FALLBACK_FIT_ADDENDUM_V01.json"
      - "scripts/analyze_melitaea_19year_host_fallback_prediction.py"
      - "tests/test_melitaea_19year_host_fallback_prediction.py"
      - ".github/workflows/melitaea-19year-host-fallback-prediction.yml"
permissions:
  contents: read
jobs:
  heldout:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install fixed modelling toolchain
        run: |
          python -m pip install numpy==2.1.3 scikit-learn==1.6.1 pytest==8.3.4
      - name: Verify no future host leakage and source integrity
        run: |
          python -m pytest -q tests/test_melitaea_19year_fallback_support.py tests/test_melitaea_19year_host_fallback_prediction.py
      - name: Estimate out-of-year incremental predictive value
        run: |
          python scripts/analyze_melitaea_19year_host_fallback_prediction.py --receipt results/melitaea_19year_host_fallback_prediction_v01.json
      - uses: actions/upload-artifact@v4
        with:
          name: melitaea-19year-heldout-host-backup-v01
          path: results/melitaea_19year_host_fallback_prediction_v01.json
          retention-days: 30
