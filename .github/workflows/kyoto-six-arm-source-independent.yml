name: Kyoto six-arm identity by edible food: source-independent checks

on:
  workflow_dispatch:
  push:
    branches: [experiment/kyoto-six-arm-identity-food-v01]
    paths:
      - "scripts/randomize_kyoto_six_arm_identity_food.py"
      - "scripts/analyze_kyoto_six_arm_identity_food.py"
      - "tests/test_kyoto_six_arm_randomization.py"
      - "tests/test_kyoto_six_arm_identity_food.py"
      - ".github/workflows/kyoto-six-arm-source-independent.yml"

permissions:
  contents: read

jobs:
  six-arm-source-independent:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install offline validation dependency only
        run: python -m pip install pytest==8.3.4
      - name: Verify six-arm randomization, cohort semantics and contrast bounds
        run: |
          python -m pytest -q \
            tests/test_kyoto_six_arm_randomization.py \
            tests/test_kyoto_six_arm_identity_food.py
