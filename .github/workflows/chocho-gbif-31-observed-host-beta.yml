name: chocho observed GBIF butterfly assemblages versus host and other alien flora

on:
  push:
    branches: [analysis/global-colonial-alien-flora-control-20261031]
    paths:
      - ".github/workflows/chocho-gbif-31-observed-host-beta.yml"
      - "scripts/analyze_gbif_31_observed_host_beta.py"
      - "tests/test_gbif_31_observed_host_beta_20261101.py"
      - "provenance/reviewer_defenses/results/global_colonial_resource_beta_20261031/gbif_31_observed_beta_model_lock_v1.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chocho-observed31-host-beta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  independent-observation-composition-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install mapping and reproducibility dependencies; test source-free behavior
        run: |
          python -m pip install 'numpy>=1.26' 'shapely>=2,<3' 'pyproj>=3.7,<4' 'pyshp>=2.3' 'pytest>=8' ruff
          ruff check --select F821 scripts/analyze_gbif_31_observed_host_beta.py
          python -m pytest tests/test_gbif_31_observed_host_beta_20261101.py -q
      - name: Checkout frozen original HOSTS
        uses: actions/checkout@v4
        with:
          repository: globalbioticinteractions/HOSTS
          ref: 808e0b869f9ec1adf8efff87cf6a395adda103e0
          path: _external/HOSTS
      - name: Checkout source-locked GEB butterfly 239 host beta control data
        uses: actions/checkout@v4
        with:
          repository: zuizui0223/chocho
          ref: analysis/global-colonial-host-resource-convergence-20261031
          path: _external/butterfly_beta
      - name: Checkout official TDWG 369 region geographies
        uses: actions/checkout@v4
        with:
          repository: tdwg/wgsrpd
          ref: 52da7828aba9d461dd133c27b3bd7a4407161f54
          path: _external/wgsrpd
      - name: Fetch exact DOI GBIF observations and MD5-pinned published alien plant source
        run: |
          mkdir -p _private_observations _temp_historical_sources
          curl --fail --show-error --silent --location --retry 2 --connect-timeout 25 --max-time 240 \
            'https://api.gbif.org/v1/occurrence/download/request/0008693-260928105237408.zip' \
            --output _private_observations/gbif_31_2026.zip
          echo 'f629abab1f64c5e858956f91c4cdfe499e4d9fe0b39768df84e8bd47bbafa464  _private_observations/gbif_31_2026.zip' | sha256sum -c -
          curl --fail --show-error --silent --location --retry 2 --connect-timeout 25 --max-time 180 \
            'https://zenodo.org/api/records/6640264/files/lenzner/Eur-Emp-Alien-Flora-v1.0.0.zip/content' \
            --output _temp_historical_sources/lenzner_6640264.zip
          echo '16f5585d2500676951a4b664bbf0ffde  _temp_historical_sources/lenzner_6640264.zip' | md5sum -c -
      - name: Measure 30-butterfly observed beta and region-held-out GloNAF host specificity
        run: |
          python scripts/analyze_gbif_31_observed_host_beta.py \
            --output provenance/reviewer_defenses/results/global_colonial_resource_beta_20261031/gbif_31_observed_host_beta_pilot_v1.json \
            --pairs provenance/reviewer_defenses/results/global_colonial_resource_beta_20261031/gbif_31_observed_host_beta_pairs_v1.csv
      - name: Preserve only source-verified aggregate beta and model scores
        run: |
          # A new source-code or cohort revision can arrive during a long
          # archival replay. Never publish an old result over newer code,
          # nor let two identical source runs conflict on the same JSON path.
          git fetch origin "${GITHUB_REF_NAME}"
          if ! git diff --quiet "origin/${GITHUB_REF_NAME}" -- \
               scripts/analyze_gbif_31_observed_host_beta.py \
               scripts/audit_gbif_31_butterfly_wgsrpd3_source.py \
               provenance/reviewer_defenses/results/global_colonial_resource_beta_20261031/gbif_31_observed_beta_model_lock_v1.json; then
            echo 'Science source changed since checkout; stale run will not publish derived output'
            exit 0
          fi
          existing='provenance/reviewer_defenses/results/global_colonial_resource_beta_20261031/gbif_31_observed_host_beta_pilot_v1.json'
          if git cat-file -e "origin/${GITHUB_REF_NAME}:${existing}" 2>/dev/null; then
            if git show "origin/${GITHUB_REF_NAME}:${existing}" | cmp - "${existing}"; then
              echo 'Exact same source-derived beta result already exists; no duplicate commit'
              exit 0
            fi
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add provenance/reviewer_defenses/results/global_colonial_resource_beta_20261031/gbif_31_observed_host_beta_pilot_v1.json
          git add provenance/reviewer_defenses/results/global_colonial_resource_beta_20261031/gbif_31_observed_host_beta_pairs_v1.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Test independent observed GBIF 30-butterfly composition beyond general flora under region holdout [skip ci]'
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
      - name: Erase downloaded GPS occurrences and third-party plant distributions
        if: always()
        run: rm -rf _private_observations _temp_historical_sources _external
