name: Monarch day-six larval mass to pupation source-AUC visual QA
on:
  push:
    branches:
      - analysis/monarch-leaf-age-conversion-gate-20261026
    paths:
      - 'scripts/render_monarch_day6_mass_pupation_AUC_20261026.py'
      - '.github/workflows/monarch-day6-pupation-AUC-figure-20261026.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit-figure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install plotting dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'matplotlib>=3.9,<4'
      - name: Render source-verified individual monarch stage AUC, null interval and trial heterogeneity
        run: |
          python scripts/render_monarch_day6_mass_pupation_AUC_20261026.py \
            --svg docs/exploratory/figures/Monarch_Day6_to_pupation_prognostic_AUC_20261026.svg \
            --png docs/exploratory/figures/Monarch_Day6_to_pupation_prognostic_AUC_20261026.png
      - uses: actions/upload-artifact@v4
        with:
          name: monarch-real-individual-day6-growth-pupation-source-AUC-figure
          path: |
            docs/exploratory/figures/Monarch_Day6_to_pupation_prognostic_AUC_20261026.svg
            docs/exploratory/figures/Monarch_Day6_to_pupation_prognostic_AUC_20261026.png
      - name: Archive original noncausal prognosis diagram to exploratory branch
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs=require('fs');
            const owner=context.repo.owner,repo=context.repo.repo,branch=context.ref.replace('refs/heads/','');
            for(const path of [
              'docs/exploratory/figures/Monarch_Day6_to_pupation_prognostic_AUC_20261026.svg',
              'docs/exploratory/figures/Monarch_Day6_to_pupation_prognostic_AUC_20261026.png'
            ]){
              let sha;
              try{sha=(await github.rest.repos.getContent({owner,repo,path,ref:branch})).data.sha;}
              catch(e){if(e.status!==404)throw e;}
              const params={owner,repo,path,branch,
                content:Buffer.from(fs.readFileSync(path)).toString('base64'),
                message:'Archive exact stage-linked butterfly prognostic AUC '+path.split('.').pop()};
              if(sha)params.sha=sha;
              await github.rest.repos.createOrUpdateFileContents(params);
            }
