name: Real South African Lepidoptera intercept detections by import commodity and sampling regime
on:
  push:
    branches: [analysis/arrival-interception-establishment-dryad-20261027]
    paths:
      - scripts/analyze_sa_import_lepidoptera_detection_by_commodity_20261027.py
      - tests/test_sa_import_lepidoptera_detection_by_commodity_20261027.py
      - provenance/reviewer_defenses/protocols/SOUTH_AFRICA_PLANT_IMPORT_INTERCEPTION_20261027.md
      - .github/workflows/sa-import-lepidoptera-route-detection-20261027.yml
  pull_request:
    branches: [analysis/arrival-resource-channel-decoupling-20261027]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-26295-tested-versus-untested-lepidoptera-commodity-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate source original taxonomic identity and nonrandom detection denominators
        run: |
          python -m pip install 'pytest>=8,<10'
          python -m pytest -q tests/test_sa_import_lepidoptera_detection_by_commodity_20261027.py
      - name: Audit original public Figshare SHA and count REAL Lepidoptera taxon detections within inspected samples
        run: |
          mkdir -p _invasion
          python scripts/analyze_sa_import_lepidoptera_detection_by_commodity_20261027.py \
            --original239 data/frozen/figure_sources/anthropogenic_species_metrics.csv \
            --output _invasion/SA_1994_2019_lepidoptera_commodities_20261027.json
      - name: Guard actual source NA vs tested 0, original 239 and observational noncausal inference
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("_invasion/SA_1994_2019_lepidoptera_commodities_20261027.json").read_text())
          assert r["schema"]=="chocho_SA_original_plant_import_lepidoptera_interception_routes_20261027_v01"
          assert r["status"]=="SOURCE_COMPLETE_RAW_LAB_SAMPLE_LEPIDOPTERA_COMMODITY_CONDITIONAL_DETECTION"
          assert r["samples"]["all_source_rows"]["original_raw_samples"]==26295
          assert r["samples"]["all_source_rows"]["lepidoptera_tested_samples"]==15851
          assert r["samples"]["original_source_regime_eligible_26291_rows"]["original_raw_samples"]==26291
          assert r["samples"]["original_source_regime_eligible_26291_rows"]["detected_Lepidoptera_sample_rows"]==175
          assert r["samples"]["original_four_source_regime_unidentified_footer_or_unclassified_rows"]["detected_Lepidoptera_sample_rows"]==3
          assert r["samples"]["all_source_rows"]["detected_Lepidoptera_sample_rows"]==178
          assert r["samples"]["all_source_rows"]["lepidoptera_NOT_TESTED_samples"]==10443
          assert r["Lepidoptera_taxon_metadata"]["butterfly_taxon_population_frozen"]==239
          for v in r["samples"]["by_sampling_regime_and_material_class"]:
              assert v["lepidoptera_tested_samples"]==(
                v["detected_Lepidoptera_sample_rows"]+
                v["original_tested_negative_samples"])
          assert all("importer.code" not in d for d in r["samples"]["by_original_commodity"])
          assert r["published_samples_are_cleaned_subset_not_original_raw"]["unreplicated_exclusions"]==1016
          print("PASS 26295 original raw, 15851 tested, 178 order-level Lepidoptera positives, explicit regime/type, no 239-population colonization inference")
          PY
      - name: Upload only original aggregate source-level commodity/field detection counts
        uses: actions/upload-artifact@v4
        with:
          name: chocho-SA-lepidoptera-commodity-arrival-sampling-20261027
          path: _invasion/SA_1994_2019_lepidoptera_commodities_20261027.json
          retention-days: 30
          if-no-files-found: error
