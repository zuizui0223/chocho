name: chocho area-adjusted island host resource Q1
on:
  push:
    branches:
      - analysis/island-mainland-host-opportunity-20261102
    paths:
      - "scripts/analyze_wgsrpd3_island_area_adjusted.py"
      - ".github/workflows/chocho-island-area-adjusted-q1.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  area-adjusted:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned scientific geometry dependencies
        run: python -m pip install "numpy>=1.26,<3" "shapely>=2,<3" "pyproj>=3.6,<4"
      - uses: actions/checkout@v4
        with:
          repository: tdwg/wgsrpd
          ref: 52da7828aba9d461dd133c27b3bd7a4407161f54
          path: _external/WGSRPD
      - name: Compute adjusted area-by-island contrast without using butterfly GBIF
        run: |
          python -m py_compile scripts/analyze_wgsrpd3_island_area_adjusted.py
          python scripts/analyze_wgsrpd3_island_area_adjusted.py \
            --q1-regions results/island-mainland-resource-q1/region_metrics.csv \
            --q1-summary results/island-mainland-resource-q1/island_mainland_summary.json \
            --wgsrpd3-geojson _external/WGSRPD/geojson/level3.geojson \
            --out-dir results/island-mainland-resource-area
      - name: Upload audited area comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chocho-island-area-adjusted-q1
          path: results/island-mainland-resource-area/
          if-no-files-found: warn
          retention-days: 90
      - name: Commit only small region-level analysis results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/island-mainland-resource-area/area_adjusted_summary.json \
            results/island-mainland-resource-area/region_area_metrics.csv
          git diff --cached --quiet && exit 0
          git commit -m "Audit island resource contrast with official geodesic area controls [skip ci]"
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
