name: chocho public maritime port-to-port data identity probe

on:
  push:
    branches: [analysis/island-port-observed-association-first-20261031]
    paths:
      - .github/workflows/chocho-public-port-od-source-probe.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  public-metadata-only:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe the public Mendeley Data dataset metadata without route downloads
        run: |
          python provenance/reviewer_defenses/results/island_observational_robustness_20261031/probe_mendeley_port_od.py
      - name: Download CC BY AIS triplet 2020 archive and audit schema
        run: |
          mkdir -p _private_source_stage
          curl --fail --show-error --silent --location --retry 1 --connect-timeout 20 --max-time 180 \
            'https://zenodo.org/records/10783698/files/triplet_2020.zip?download=1' \
            --output _private_source_stage/triplet_2020.zip
          echo 'af27e1bef1f706e2e29ed53aee47ff10  _private_source_stage/triplet_2020.zip' | md5sum -c -
          python provenance/reviewer_defenses/results/island_observational_robustness_20261031/probe_zenodo_ais_triplets_2020.py
      - name: Remove third-party raw AIS ZIP from runner
        if: always()
        run: rm -rf _private_source_stage
      - name: Preserve public discovery receipt only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add provenance/reviewer_defenses/results/island_observational_robustness_20261031/port_to_port_source_discovery_20261031.json
          if [ -f provenance/reviewer_defenses/results/island_observational_robustness_20261031/zenodo_ais_2020_archive_schema.json ]; then
            git add provenance/reviewer_defenses/results/island_observational_robustness_20261031/zenodo_ais_2020_archive_schema.json
          fi
          git diff --cached --quiet && exit 0
          git commit -m 'Record public port-to-port dataset discovery limitations [skip ci]'
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
