name: Kyoto 4-arm greenhouse BIBD independent checks

on:
  workflow_dispatch:
  push:
    branches: [experiment/kyoto-4arm-three-cage-bibd-v01]
    paths:
      - "scripts/randomize_kyoto_four_arm_greenhouse_bibd.py"
      - "scripts/analyze_kyoto_four_arm_greenhouse_bibd.py"
      - "tests/test_kyoto_four_arm_greenhouse_bibd_randomization.py"
      - "tests/test_kyoto_four_arm_greenhouse_bibd_analysis.py"
      - ".github/workflows/kyoto-greenhouse-bibd.yml"

permissions:
  contents: read

jobs:
  synthetic-structural:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deterministic offline test and numeric requirements
        run: python -m pip install pytest==8.3.4 "numpy>=1.26"
      - name: Validate randomization and age-independent adult-cohort analysis
        run: |
          python -m pytest -q \
            tests/test_kyoto_four_arm_greenhouse_bibd_randomization.py \
            tests/test_kyoto_four_arm_greenhouse_bibd_analysis.py
