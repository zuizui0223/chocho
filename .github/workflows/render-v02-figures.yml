name: render butterfly manuscript v0.2 figures

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - review/geb-null-validation-v02
    paths:
      - "scripts/render_butterfly_specialization_v02_figures.py"
      - "data/frozen/figure_sources/anthropogenic_species_metrics.csv"
      - "data/frozen/figure_sources/occurrence_resource_validation_species.csv"
      - "data/frozen/figure_sources/climate_distance_sensitivity_species.csv"
      - "provenance/reviewer_defenses/results/butterfly_resource_expansion_matched_null_v0.2.json"
      - "provenance/reviewer_defenses/results/butterfly_resource_expansion_hostbias_null_v0.1.json"
      - "provenance/reviewer_defenses/results/butterfly_host_plant_prominence_expansion_v0.1.json"
      - "provenance/reviewer_defenses/results/butterfly_occurrence_overlap_null_v0.1.json"
      - "provenance/reviewer_defenses/results/butterfly_occurrence_species_robustness_v0.1.json"
      - "provenance/reviewer_defenses/results/butterfly_expansion_ceiling_sensitivity_v0.1.json"
      - "provenance/reviewer_defenses/results/butterfly_regional_robustness_v0.1.json"
      - "provenance/reviewer_defenses/results/butterfly_climate_effect_size_v0.1.json"
      - ".github/workflows/render-v02-figures.yml"

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install figure environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[figure]"
      - name: Render v0.2 figures
        run: |
          python scripts/render_butterfly_specialization_v02_figures.py             --anthropogenic-csv data/frozen/figure_sources/anthropogenic_species_metrics.csv             --matched-null-json provenance/reviewer_defenses/results/butterfly_resource_expansion_matched_null_v0.2.json             --hostbias-null-json provenance/reviewer_defenses/results/butterfly_resource_expansion_hostbias_null_v0.1.json             --plant-prominence-json provenance/reviewer_defenses/results/butterfly_host_plant_prominence_expansion_v0.1.json             --occurrence-csv data/frozen/figure_sources/occurrence_resource_validation_species.csv             --occurrence-null-json provenance/reviewer_defenses/results/butterfly_occurrence_overlap_null_v0.1.json             --occurrence-species-robustness-json provenance/reviewer_defenses/results/butterfly_occurrence_species_robustness_v0.1.json             --ceiling-json provenance/reviewer_defenses/results/butterfly_expansion_ceiling_sensitivity_v0.1.json             --regional-json provenance/reviewer_defenses/results/butterfly_regional_robustness_v0.1.json             --climate-csv data/frozen/figure_sources/climate_distance_sensitivity_species.csv             --climate-effect-json provenance/reviewer_defenses/results/butterfly_climate_effect_size_v0.1.json             --output-dir manuscript/generated/v0.2_figures
      - name: List outputs
        run: |
          ls -lh manuscript/generated/v0.2_figures
      - uses: actions/upload-artifact@v4
        with:
          name: butterfly-specialization-v02-figures
          path: manuscript/generated/v0.2_figures/
          retention-days: 30
