name: US butterfly repeat-survey abundance QC
on:
  push:
    branches:
      - analysis/sbus-host-sharing-abundance-20261025
    paths:
      - 'scripts/audit_sbus_program_repeatability_20261025.py'
      - '.github/workflows/sbus-repeat-transect-abundance-gate-20261025.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repeatability-qc:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit original programme-level repeat surveys, effort and explicit zero data
        run: |
          python scripts/audit_sbus_program_repeatability_20261025.py \
            --out provenance/reviewer_defenses/results/sbus_original_program_repeatability_20261025.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbus-2025-survey-repeatability-source-audit
          path: provenance/reviewer_defenses/results/sbus_original_program_repeatability_20261025.json
      - name: Archive original programme QC aggregate only
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs=require('fs');
            const path='provenance/reviewer_defenses/results/sbus_original_program_repeatability_20261025.json';
            const owner=context.repo.owner,repo=context.repo.repo,branch=context.ref.replace('refs/heads/','');
            const content=Buffer.from(fs.readFileSync(path)).toString('base64');
            let sha;try{sha=(await github.rest.repos.getContent({owner,repo,path,ref:branch})).data.sha;}catch(e){if(e.status!==404)throw e;}
            const z={owner,repo,path,content,branch,message:'Archive original butterfly survey repeatability and effort QC'};
            if(sha)z.sha=sha;
            await github.rest.repos.createOrUpdateFileContents(z);
