name: Butterfly mapped gain and host-support figure
on:
  push:
    branches:
      - analysis/gain-fragility-20261024
    paths:
      - 'scripts/render_butterfly_gain_host_support_20261024.py'
      - '.github/workflows/butterfly-gain-support-figure-20261024.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render-audited-figure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install plotting requirements
        run: python -m pip install 'numpy>=1.26,<3' 'matplotlib>=3.9,<4'
      - name: Render raw and adjusted, source-verified analyses
        run: |
          python scripts/render_butterfly_gain_host_support_20261024.py \
            --svg docs/exploratory/figures/butterfly_gain_host_support_20261024.svg \
            --png docs/exploratory/figures/butterfly_gain_host_support_20261024.png
      - name: Upload publication-ready vector and raster graphics
        uses: actions/upload-artifact@v4
        with:
          name: butterfly-gain-host-support-figure-20261024
          path: |
            docs/exploratory/figures/butterfly_gain_host_support_20261024.svg
            docs/exploratory/figures/butterfly_gain_host_support_20261024.png
      - name: Commit audited figure to isolated analysis branch
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs=require('fs');
            const owner=context.repo.owner,repo=context.repo.repo;
            const ref=context.ref.replace('refs/heads/','');
            for(const path of [
              'docs/exploratory/figures/butterfly_gain_host_support_20261024.svg',
              'docs/exploratory/figures/butterfly_gain_host_support_20261024.png'
            ]){
              const content=Buffer.from(fs.readFileSync(path)).toString('base64');
              let previous;
              try {
                previous=(await github.rest.repos.getContent({owner,repo,path,ref})).data.sha;
              }catch(e){if(e.status!==404)throw e;}
              const payload={owner,repo,path,branch:ref,
                message:'Archive source-verified resource gain-support figure '+path.split('.').pop(),
                content};
              if(previous)payload.sha=previous;
              await github.rest.repos.createOrUpdateFileContents(payload);
            }
