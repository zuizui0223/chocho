name: GloBI larval host observation pilot
on:
  push:
    branches:
      - analysis/globi-larval-host-source-pilot-20261024
    paths:
      - 'scripts/audit_globi_larval_host_macro_source_20261024.py'
      - '.github/workflows/globi-larval-host-source-pilot-20261024.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  source-feasibility:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test four outcome-blind GloBI transport queries
        run: |
          python scripts/audit_globi_larval_host_macro_source_20261024.py \
            --smoke --out /tmp/globi_smoke.json
      - name: Run full fixed pilot only if source replies are parseable
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import subprocess
          import sys
          x=json.loads(Path('/tmp/globi_smoke.json').read_text(encoding='utf-8'))
          good=sum(t['status'] in ('COMPLETE','PAGINATION_REQUIRED') for t in x['taxa'])
          final='provenance/reviewer_defenses/results/globi_larval_host_feasibility_20261024.json'
          Path(final).parent.mkdir(parents=True, exist_ok=True)
          if good:
              print(f'Parseable smoke replies: {good}. Running response-blind 20-taxon gate.')
              subprocess.run([sys.executable, 'scripts/audit_globi_larval_host_macro_source_20261024.py',
                              '--out', final], check=True)
          else:
              x['status'] = 'SOURCE_GATE_API_TRANSPORT_UNAVAILABLE_NOT_NEGATIVE_EVIDENCE'
              x['next_decision'] = x['status']
              x['full_20_taxon_gate_executed'] = False
              Path(final).write_text(json.dumps(x, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
              print('No parseable source replies; archived smoke, no biological inference.')
          PY
      - name: Archive privacy-minimized derived source counts
        uses: actions/upload-artifact@v4
        with:
          name: chocho-globi-larval-source-pilot-20261024
          path: provenance/reviewer_defenses/results/globi_larval_host_feasibility_20261024.json
      - name: Commit aggregate source receipt to exploratory branch
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = 'provenance/reviewer_defenses/results/globi_larval_host_feasibility_20261024.json';
            const content = Buffer.from(fs.readFileSync(path)).toString('base64');
            const owner = context.repo.owner, repo = context.repo.repo;
            let existing;
            try {
              const response = await github.rest.repos.getContent({owner,repo,path,ref:context.ref});
              existing = response.data.sha;
            } catch(e) {
              if (e.status !== 404) throw e;
            }
            const input = {owner,repo,path,branch:context.ref.replace('refs/heads/',''),
                           message:'Archive source-gated GloBI observation feasibility counts',
                           content};
            if (existing) input.sha = existing;
            const commit = await github.rest.repos.createOrUpdateFileContents(input);
            core.info('Source receipt committed '+commit.data.commit.sha);
