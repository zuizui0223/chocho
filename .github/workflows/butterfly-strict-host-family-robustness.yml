name: butterfly strict host identity family robustness
on:
  push:
    branches: [analysis/resource-homogenization-v01]
    paths: ["scripts/audit_butterfly_host_identity_lineage_loo.py",".github/workflows/butterfly-strict-host-family-robustness.yml"]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        seed: [20261008, 20261009]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "shapely>=2,<3"
      - uses: actions/download-artifact@v4
        with:
          name: butterfly-resource-envelope-pilot-v01
          path: _s1
          github-token: ${{ github.token }}
          repository: zuizui0223/TTF
          run-id: 36222306369
      - uses: actions/download-artifact@v4
        with:
          name: temporal-hindcast-sidecars
          path: _sidecars
          github-token: ${{ github.token }}
          repository: zuizui0223/chocho
          run-id: 37628559686
      - uses: actions/download-artifact@v4
        with:
          name: butterfly-climate-release-postgate-independent-result-v01
          path: _climate
          github-token: ${{ github.token }}
          repository: zuizui0223/TTF
          run-id: 36270581743
      - uses: actions/checkout@v4
        with:
          repository: tdwg/wgsrpd
          ref: 52da7828aba9d461dd133c27b3bd7a4407161f54
          path: _external/WGSRPD
      - name: Fixed six-family exclusion and seed replication
        run: |
          mkdir -p results/family-robustness
          python scripts/audit_butterfly_host_identity_lineage_loo.py --descriptors-csv _s1/butterfly-resource-envelope-pilot-v0.1/s1_resource_descriptors.csv --insect-host-csv _sidecars/native/insect_host_accepted.csv --native-distribution-csv _sidecars/native/native_extant_nondoubtful_wgsrpd3.csv --contemporary-distribution-csv _sidecars/contemporary/extant_nondoubtful_wgsrpd3.csv --level3-geojson _external/WGSRPD/geojson/level3.geojson --climate-crossfit-csv _climate/unit_climate_crossfit.csv --leptraits-csv data/external/leptraits_consensus_v1.0.csv --permutations 499 --seed ${{ matrix.seed }} --output-json results/family-robustness/strict_family_loo_seed_${{ matrix.seed }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: strict-host-identity-family-robustness-${{ matrix.seed }}
          path: results/family-robustness/
          retention-days: 30
