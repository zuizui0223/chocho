name: exploratory island port vs nonport coastal geometry
on:
  pull_request:
    paths:
      - "scripts/exploratory_port_nonport_coast.py"
      - "scripts/exploratory_port_nonport_botany.py"
      - "tests/test_exploratory_port_nonport_coast.py"
      - "tests/test_exploratory_port_nonport_botany.py"
      - ".github/workflows/chocho-exploratory-coastal-botanical.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebuild-matched-island-coast:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install geospatial prerequisites
        run: python -m pip install --quiet pyshp shapely pyproj numpy pytest
      - name: Validate deterministic geometrics
        run: python -m pytest -q tests/test_exploratory_port_nonport_coast.py tests/test_exploratory_port_nonport_botany.py
      - name: Rebuild source-locked GSHHG + World Port Index paired sample
        run: |
          python -u scripts/exploratory_port_nonport_coast.py \
            --shore-candidates-per-island 384 \
            --out /tmp/matched_coast_control_sites.json
          python - <<'PY'
          import json
          from pathlib import Path
          obj=json.loads(Path("/tmp/matched_coast_control_sites.json").read_text())
          rows=obj["rows"]
          assert len(rows)==79
          assert len({x["island_id"] for x in rows})==36
          assert obj["source_gshhg_sha256"]=="8dbbe7e071e77e9e75f2d639239099ebca8d5c16d6a07df8169729d49f15cf41"
          assert all(r["nonport_distance_from_wpi_km"] is None or r["nonport_distance_from_wpi_km"]>=0 for r in rows)
          print("MATCHED_WPI79_COAST_RECEIPT", json.dumps(obj["summary"],sort_keys=True))
          PY
      - name: Fetch pinned independent plant-indicator table
        run: |
          curl --fail --location --silent --show-error --retry 3 \
            https://raw.githubusercontent.com/bathyscapher/EVA/73b323983702a74cb9b6867bcebe00a307ea6566/EllenbergsValuesAutomaton/Ellenberg_VascularPlants.csv \
            -o /tmp/ellenberg_vascular_plants_germany.tsv
          test -s /tmp/ellenberg_vascular_plants_germany.tsv
      - name: Evaluate equal-radius GBIF port vs nonport plant composition across 12 islands
        run: |
          python -u scripts/exploratory_port_nonport_botany.py \
            --sites /tmp/matched_coast_control_sites.json \
            --ellenberg /tmp/ellenberg_vascular_plants_germany.tsv \
            --pilot-pairs 12 \
            --min-general-plant-records 30 \
            --min-N-trait-species 2 \
            --out /tmp/matched_coast_botanical_pilot.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/matched_coast_botanical_pilot.json').read_text())
          assert d['sample_design']['selected_pairs']==12
          assert d['sample_design']['intended_observations']==48
          assert len(d['observations'])==48
          assert 0 <= d['match_audit']['gbif_strict_exact_accepted_species_resolved'] <= 183
          assert len(d['paired_summary']['pair_rows'])==24
          print('GBIF_BOTANICAL_12PAIRS_VERIFIED', json.dumps(d['paired_summary']['periods'],sort_keys=True))
          PY
      - name: Upload independently reconstructed site locations
        uses: actions/upload-artifact@v4
        with:
          name: island-port-nonport-reselected-sites
          path: |
            /tmp/matched_coast_control_sites.json
            /tmp/matched_coast_botanical_pilot.json
          retention-days: 30
