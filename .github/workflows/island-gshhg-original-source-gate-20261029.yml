name: Official GSHHG 2.3.7 true island shoreline source gate
on:
  push:
    branches: [analysis/island-isolation-port-geography-20261029]
    paths:
      - scripts/audit_island_gshhg_original_source_20261029.py
      - tests/test_island_gshhg_original_source_20261029.py
      - .github/workflows/island-gshhg-original-source-gate-20261029.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-island-source:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate fail-closed original island release source
        run: |
          python -m pip install 'pytest>=8,<10'
          python -m pytest -q tests/test_island_gshhg_original_source_20261029.py
      - name: Fetch official release and SHA-lock original GSHHG high resolution Level1 land
        run: |
          mkdir -p _island
          python scripts/audit_island_gshhg_original_source_20261029.py \
            --output _island/chocho_islands_gshhg_237_original_source_gate_20261029.json
      - name: Upload geometry eligibility receipt only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chocho-original-island-GSHHG-237-shoreline-source-20261029
          path: _island/chocho_islands_gshhg_237_original_source_gate_20261029.json
          retention-days: 30
          if-no-files-found: warn
