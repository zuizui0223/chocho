name: chocho colonial history source-geometry audit

on:
  push:
    branches: [analysis/lenzner-colonial-region-source-20261031]
    paths:
      - ".github/workflows/chocho-colonial-lenzner-source-audit.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  historical-source-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect published Lenzner et al. colonial-flora dataset source and file list
        run: python scripts/probe_lenzner_colonial_source.py
      - name: Preserve metadata, source files not republished
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add provenance/reviewer_defenses/results/global_colonial_resource_beta_20261031/lenzner_zenodo_colonial_metadata.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Audit Lenzner empire-flora dataset and region source files [skip ci]'
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
