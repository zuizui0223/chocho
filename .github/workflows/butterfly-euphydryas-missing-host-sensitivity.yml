name: Euphydryas two missing host resource sensitivity
on:
  push:
    branches: [analysis/resource-homogenization-v01]
    paths:
      - scripts/analyze_euphydryas_missing_hosts_augmentation.py
      - scripts/build_euphydryas_missing_hosts_wcvp.R
      - .github/workflows/butterfly-euphydryas-missing-host-sensitivity.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
      - name: Checkout pinned HOSTS
        uses: actions/checkout@v4
        with:
          repository: globalbioticinteractions/HOSTS
          ref: 808e0b869f9ec1adf8efff87cf6a395adda103e0
          path: _external/HOSTS
      - name: Checkout pinned WCVP
        uses: actions/checkout@v4
        with:
          repository: matildabrown/rWCVPdata
          ref: 65bed76bae9d644ccb6ad200c05f9f5071d89e05
          path: _external/WCVP
      - name: Reconstruct exact original and targeted corrected botanical inputs
        run: |
          Rscript scripts/build_wcvp_hosts_null_sidecars.R \
            _external/WCVP _external/HOSTS results/euphydryas_augment/native results/euphydryas_augment/contemporary
          Rscript scripts/build_euphydryas_missing_hosts_wcvp.R \
            _external/WCVP results/euphydryas_augment/additions
      - name: Analyze only two independently recorded omitted hosts
        run: |
          python scripts/analyze_euphydryas_missing_hosts_augmentation.py \
            --protocol-json docs/exploratory/EUPHYDRYAS_MISSING_CASTILLEJA_AUGMENTATION_PROTOCOL_V01.json \
            --original-interaction-csv results/euphydryas_augment/native/insect_host_accepted.csv \
            --original-native-csv results/euphydryas_augment/native/native_extant_nondoubtful_wgsrpd3.csv \
            --original-contemporary-csv results/euphydryas_augment/contemporary/extant_nondoubtful_wgsrpd3.csv \
            --augmented-taxa-csv results/euphydryas_augment/additions/focal_taxon_matches.csv \
            --augmented-native-csv results/euphydryas_augment/additions/castilleja_native.csv \
            --augmented-contemporary-csv results/euphydryas_augment/additions/castilleja_contemporary.csv \
            --output-json results/euphydryas_augment/euphydryas_missing_hosts_completeness_v01.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chocho-euphydryas-two-host-completeness-sensitivity-v01
          path: results/euphydryas_augment/euphydryas_missing_hosts_completeness_v01.json
          if-no-files-found: warn
          retention-days: 30
