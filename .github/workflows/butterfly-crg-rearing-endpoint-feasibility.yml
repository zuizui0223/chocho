name: independent CRG butterfly rearing endpoint feasibility
on:
  push:
    branches: [analysis/resource-homogenization-v01]
    paths:
      - "scripts/probe_independent_crg_butterfly_rearing_endpoints.py"
      - ".github/workflows/butterfly-crg-rearing-endpoint-feasibility.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: butterfly-resource-envelope-pilot-v01
          path: _s1
          github-token: ${{ github.token }}
          repository: zuizui0223/TTF
          run-id: 36222306369
      - name: Probe independent CRG rearings without equating successes to survival rates
        run: |
          mkdir -p results/crg-butterfly-rearing
          python scripts/probe_independent_crg_butterfly_rearing_endpoints.py \
            --protocol-json docs/exploratory/CRG_BUTTERFLY_REARING_FEASIBILITY_PROTOCOL_V01.json \
            --descriptors-csv _s1/butterfly-resource-envelope-pilot-v0.1/s1_resource_descriptors.csv \
            --leptraits-csv data/external/leptraits_consensus_v1.0.csv \
            --output-json results/crg-butterfly-rearing/crg_rearing_endpoint_feasibility_v0.1.json \
            --output-records-csv results/crg-butterfly-rearing/crg_rearing_endpoint_source_records_v0.1.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-crg-butterfly-rearing-endpoint-v01
          path: results/crg-butterfly-rearing/
          retention-days: 30
          if-no-files-found: warn
