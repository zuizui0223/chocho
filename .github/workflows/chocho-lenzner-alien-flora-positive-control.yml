name: chocho positive control historical empires and published alien plant communities

on:
  push:
    branches:
      - analysis/global-colonial-alien-flora-control-20261031
    paths:
      - ".github/workflows/chocho-lenzner-alien-flora-positive-control.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chocho-colonial-alien-positive-${{ github.ref }}
  cancel-in-progress: false

jobs:
  original-glonaf-positive-control:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bounded analysis dependencies and test
        run: |
          python -m pip install numpy pytest ruff
          ruff check --select F821 scripts/test_lenzner_alien_flora_history_control.py
          python -m pytest tests/test_lenzner_alien_positive_control_20261031.py -q
      - name: Fetch fixed 2022 published original, do not redistribute
        run: |
          mkdir -p _temp_historical_sources
          curl --fail --show-error --silent --location --retry 2 --connect-timeout 30 --max-time 180 \
            'https://zenodo.org/api/records/6640264/files/lenzner/Eur-Emp-Alien-Flora-v1.0.0.zip/content' \
            --output _temp_historical_sources/lenzner_6640264.zip
          echo '16f5585d2500676951a4b664bbf0ffde  _temp_historical_sources/lenzner_6640264.zip' | md5sum -c -
      - name: Compute original GloNAF alien-flora colonial-history positive-control association
        run: |
          python scripts/test_lenzner_alien_flora_history_control.py \
            --zip _temp_historical_sources/lenzner_6640264.zip \
            --max-pairs 90000 --draws 199 \
            --output provenance/reviewer_defenses/results/global_colonial_resource_beta_20261031/colonial_alien_flora_positive_control_v1.json
      - name: Commit derived aggregate and keep original archive private to runner
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add provenance/reviewer_defenses/results/global_colonial_resource_beta_20261031/colonial_alien_flora_positive_control_v1.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Test source-pinned GloNAF alien-flora legacy as positive control [skip ci]'
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
      - name: Delete downloaded source dataset
        if: always()
        run: rm -rf _temp_historical_sources
