name: chocho Neotoma six Alnus fossil occurrence to explicit sample chronology v17
on:
  push:
    branches: [ecology/lgm-neotoma-occurrence-sample-age-crosswalk-v17]
    paths:
      - .github/workflows/lgm-neotoma-six-occid-sample-chronology-v17.yml
      - scripts/neotoma_six_occid_exact_sample_chronology_v17.py
      - tests/test_neotoma_six_occid_sample_chronology_v17.py
      - docs/supporting/lgm_neotoma_six_occurrence_sample_chronology_v17_contract.json
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: chocho-six-source-occurrence-to-calibration-link-v17
  cancel-in-progress: false
jobs:
  exact-sample-id-chrons-no-genotype-response:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test exact occurrence-to-sample link requiring typed source identifiers
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'requests>=2.31,<3' 'pytest>=8,<9'
          python -m pytest -q tests/test_neotoma_six_occid_sample_chronology_v17.py tests/test_neotoma_six_full_dataset_age_v16.py
          python -m py_compile scripts/neotoma_six_occid_exact_sample_chronology_v17.py
          echo '3d47fe9a31cb6a04ce60aa0f1d7fc8dd7fb1508d3966d6f3a7dc6942ddfa9efc  results/lgm_neotoma_idage_18_24ka_source_candidates_v13/bounded_18_24ka_sample_taxon_proxy_checks.csv' | sha256sum -c -
          python - <<'PY'
          import json
          c=json.load(open('docs/supporting/lgm_neotoma_six_occurrence_sample_chronology_v17_contract.json'))
          assert c['status']=='SOURCE_ONLY_FROZEN_SIX_FIRST_OCCURRENCE_ID_JOIN_TEST_BEFORE_NEW_HTTP'
          assert c['source']['original_27_metadata_candidate_rows']==27
          assert c['test']['choose_one_per_dataset'].startswith('smallest numerical occurrenceid')
          assert c['test']['one_request_per_id'] is True
          assert c['scope_guardrails'][-1].startswith('No insect')
          print('PASS_PREQUERY_6_SOURCE_FIRST_OCCURRENCEID_FROZEN')
          PY
      - name: Verify exact previous Neotoma full source ZIP and each of six original dataset files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input/source_v16
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/12427662101/zip" > /tmp/Neotoma_six_full_v16.zip
          echo '7af90fc6be66b8c4fbde85e45189db3da9b8c033678fd46e2b94b5510f63231e  /tmp/Neotoma_six_full_v16.zip' | sha256sum -c -
          unzip -q /tmp/Neotoma_six_full_v16.zip -d input/source_v16
          python - <<'PY'
          import json,hashlib,gzip
          from pathlib import Path
          contract=json.load(open('docs/supporting/lgm_neotoma_six_occurrence_sample_chronology_v17_contract.json'))
          sha=contract['source']['source_v16_dataset_sha256']
          p=Path('input/source_v16/source_original_downloads')
          assert len(sha)==6 and all((p/f'dataset_{k}.json.gz').exists() for k in sha)
          for did,expected in sha.items():
              with gzip.open(p/f'dataset_{did}.json.gz','rb') as f:raw=f.read()
              assert hashlib.sha256(raw).hexdigest()==expected
          print('PASS_ALL_SIX_ORIGINAL_FULL_SOURCE_BODIES_SHA256')
          PY
      - name: Query only frozen first occurrence ID per dataset; never match by age or numeric proximity
        run: |
          set -euo pipefail
          out=results/lgm_neotoma_six_occid_sample_age_crosswalk_v17
          python -u scripts/neotoma_six_occid_exact_sample_chronology_v17.py \
            --contract docs/supporting/lgm_neotoma_six_occurrence_sample_chronology_v17_contract.json \
            --candidates results/lgm_neotoma_idage_18_24ka_source_candidates_v13/bounded_18_24ka_sample_taxon_proxy_checks.csv \
            --raw-dir input/source_v16/source_original_downloads \
            --out "$out"
          python - <<'PY'
          import json,csv,hashlib,os
          from pathlib import Path
          d=Path('results/lgm_neotoma_six_occid_sample_age_crosswalk_v17')
          q=json.loads((d/'summary.json').read_text())
          with (d/'six_site_first_occurrence_sample_age_link_v17.csv').open(newline='') as f:rows=list(csv.DictReader(f))
          assert len(rows)==q['original_six_datasets']==6
          assert len(q['preselected_source_occurrence_ids'])==6
          assert q['status']=='SOURCE_ONLY_SAMPLE_ID_CHRONOLOGY_JOIN_AUDIT_NOT_OCCUPIED_GLACIAL_HOST'
          assert q['sample_age_earlier_than_18ka_and_younger_than_24ka_CALIBRATED_VERIFIED']==0
          assert q['LGM_alnus_population_occupancy_accepted']==0
          assert not q['source_only_no_genetic_response_or_21ka_occupancy'] is False
          assert sum(q['source_status_counts'].values())==6
          receipt={'schema':'chocho_neotoma_six_sampleID_to_chronology_exact_join_v17',
                   'run_id':os.environ['GITHUB_RUN_ID'],'code_sha':os.environ['GITHUB_SHA'],
                   'source_hashes':{p.name:hashlib.sha256(p.read_bytes()).hexdigest()
                     for p in sorted(d.iterdir()) if p.is_file()},
                   'sample_chronology_model_independently_verified':False,
                   'independent_species_diagnostic_pollen_morphology_verified':False,
                   'fossil_population_presence_claimed':False,
                   'genetic_response_opened':False}
          (d/'receipt.json').write_text(json.dumps(receipt,sort_keys=True,indent=2)+'\n')
          print(json.dumps(q,sort_keys=True))
          PY
      - name: Archive only bounded structured source output without raw original fossil datasets
        run: |
          set -euo pipefail
          git fetch origin "${{ github.ref_name }}"
          test "$(git rev-parse FETCH_HEAD)" = "${{ github.sha }}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/lgm_neotoma_six_occid_sample_age_crosswalk_v17/summary.json
          git add results/lgm_neotoma_six_occid_sample_age_crosswalk_v17/six_site_first_occurrence_sample_age_link_v17.csv
          git add results/lgm_neotoma_six_occid_sample_age_crosswalk_v17/receipt.json
          git commit -m 'Audit exact sample/chronology ID joins of fixed first Alnus fossil occurrence per six Neotoma sites'
          git push origin "HEAD:${{ github.ref_name }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chocho-Neotoma-Alnus-six-occid-to-sample-chronology-v17
          path: results/lgm_neotoma_six_occid_sample_age_crosswalk_v17/
          retention-days: 30
          if-no-files-found: warn
