name: chocho three gate NASA POWER 1981–2025 climate screening
on:
  push:
    branches:
      - analysis/island-mainland-host-opportunity-20261102
    paths:
      - scripts/audit_three_gate_nasa_power_climate.py
      - .github/workflows/chocho-three-gate-nasa-power.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  nasa-power:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimal geometry dependencies
        run: python -m pip install 'shapely>=2,<3'
      - uses: actions/checkout@v4
        with:
          repository: tdwg/wgsrpd
          ref: 52da7828aba9d461dd133c27b3bd7a4407161f54
          path: _external/WGSRPD
      - name: Query NASA POWER only once per WGSRPD3 macroregion
        run: |
          python -m py_compile scripts/audit_three_gate_nasa_power_climate.py
          python scripts/audit_three_gate_nasa_power_climate.py \
            --literature-cases data/frozen/exploratory_island_butterfly_invasion_literature_seed_20261102.csv \
            --wgsrpd3-geojson _external/WGSRPD/geojson/level3.geojson \
            --out-dir results/three-gate-nasa-power
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chocho-three-gate-nasa-power-dated-island-panel
          path: results/three-gate-nasa-power/
          retention-days: 90
          if-no-files-found: warn
      - name: Commit audit and annual climate data, without altering original GEB manuscript
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/three-gate-nasa-power/
          git diff --cached --quiet && exit 0
          git commit -m 'Add source-locked POWER annual climate context for island butterfly historical first records [skip ci]'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
