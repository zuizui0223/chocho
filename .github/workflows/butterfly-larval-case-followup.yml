name: Butterfly larval case source followup
on:
  push:
    branches: [analysis/larval-evidence-20261011]
    paths: [.github/workflows/butterfly-larval-case-followup.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linked-records:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Full optional test environment
        run: |
          set -euo pipefail
          mkdir -p results
          python -m pip install -e '.[test,analysis,review]'
          python -m pytest -q | tee results/full_tests.txt
      - name: Retrieve bounded exact observations and host-taxon identities
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, hashlib, time
          from pathlib import Path
          from urllib.request import Request, urlopen
          from datetime import datetime, timezone
          root=Path('results'); audit=[]
          def get(endpoint):
              time.sleep(1.3)
              url='https://api.inaturalist.org/v1/'+endpoint
              with urlopen(Request(url,headers={'User-Agent':'chocho-public-larval-evidence-verification/20261011'}),timeout=35) as f:
                  raw=f.read()
              audit.append({'url':url,'sha256':hashlib.sha256(raw).hexdigest(),'retrieved_utc':datetime.now(timezone.utc).isoformat()})
              return json.loads(raw)['results']
          taxa=[]
          for ident in (129327,54297,83989,287170,166213):
              for x in get('taxa/'+str(ident)):
                  taxa.append({k:x.get(k) for k in ('id','name','rank','is_active','ancestor_ids','preferred_common_name','conservation_status','wikipedia_url')})
          (root/'exact_host_taxa.json').write_text(json.dumps(taxa,indent=2))
          obs=[]
          ids=(361335797,363585138,363586114,363586246,17789987,146491774,104728138,149830902,352794478,352794479)
          for ident in ids:
              for x in get('observations/'+str(ident)):
                  keys=('id','uri','observed_on','description','quality_grade','captive','obscured','geoprivacy','taxon_geoprivacy','geojson','positional_accuracy','place_guess','annotations','ofvs','license_code')
                  obj={k:x.get(k) for k in keys}
                  obj['taxon']={k:(x.get('taxon') or {}).get(k) for k in ('id','name','rank','ancestor_ids')}
                  obj['observer_id']=(x.get('user') or {}).get('id')
                  obj['photos']=[{k:p.get(k) for k in ('id','url','license_code')} for p in (x.get('photos') or [])]
                  obs.append(obj)
                  if ident in (363585138,363586246,17789987):
                      photo=(x.get('photos') or [None])[0]
                      if photo and photo.get('url'):
                          url=photo['url'].replace('/square.','/large.')
                          time.sleep(1.3)
                          with urlopen(Request(url,headers={'User-Agent':'chocho-research-source-review/20261011'}),timeout=35) as f: image=f.read()
                          (root/(str(ident)+'_source_photo.jpg')).write_bytes(image)
                          audit.append({'url':url,'sha256':hashlib.sha256(image).hexdigest(),'purpose':'Internal source-image review; no image reuse in final scientific data bundle','license_code':photo.get('license_code')})
          (root/'linked_observations.json').write_text(json.dumps(obs,indent=2))
          (root/'requests.json').write_text(json.dumps(audit,indent=2))
          print(json.dumps({'taxa':taxa,'observations':[{k:x.get(k) for k in ('id','taxon','quality_grade','observed_on','place_guess')} for x in obs]},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chocho-larval-linked-source-audit-20261011
          path: results/
          retention-days: 30
