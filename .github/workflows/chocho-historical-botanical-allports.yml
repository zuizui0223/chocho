name: Complete all 23 historical port botanical year and species-key facets
on:
  push:
    paths:
      - '.github/workflows/chocho-historical-botanical-allports.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  botanical-allports:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Requery 2001-2010 all 23 matched WPI port site taxon-year facets
        run: |
          python provenance/reviewer_defenses/results/historical_host_controls_20261031/acquire_all_ports_botanical_facets.py \
            --root . \
            --output provenance/reviewer_defenses/results/historical_host_controls_20261031/daily_botanical_all23ports_20261031.json \
            --artifact work/local_all23ports_specieskey_year.csv.gz
      - uses: actions/upload-artifact@v4
        with:
          name: historical-all23-port-taxon-year-source-20261031
          path: work/local_all23ports_specieskey_year.csv.gz
          retention-days: 7
          if-no-files-found: error
      - name: Commit only aggregate island/port source coverage
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add provenance/reviewer_defenses/results/historical_host_controls_20261031/daily_botanical_all23ports_20261031.json
          git diff --cached --quiet && exit 0
          git commit -m "Record complete WPI-matched historical plant taxon-year coverage for all 23 ports [skip ci]"
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
