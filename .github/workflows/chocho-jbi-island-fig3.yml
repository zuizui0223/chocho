name: chocho JBI Figure 3 port whole flora vs larval hosts

on:
  push:
    branches:
      - manuscript/island-resources-marine-access-jbi-v02-20261108
    paths:
      - "scripts/render_jbi_island_fig3.py"
      - ".github/workflows/chocho-jbi-island-fig3.yml"
  pull_request:
    paths:
      - "scripts/render_jbi_island_fig3.py"
      - ".github/workflows/chocho-jbi-island-fig3.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-audited-fig3:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MPLBACKEND: "Agg"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install figure dependencies
        run: python -m pip install "matplotlib>=3.9,<4" "numpy>=1.26,<3"
      - name: Verify original source blobs and render Figure 3
        run: python scripts/render_jbi_island_fig3.py --out-dir _ci_jbi_fig3
      - name: Archive source-verified figure and receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jbi-fig3-source-verified-port-flora-conditional-hosts
          path: |
            _ci_jbi_fig3/fig3_port_flora_host_coefficients.png
            _ci_jbi_fig3/fig3_port_flora_host_coefficients.svg
            _ci_jbi_fig3/fig3_port_flora_host_coefficients.pdf
            _ci_jbi_fig3/fig3_receipt.json
          if-no-files-found: error
          retention-days: 30
