name: chocho NOAA old OSCAR global 2005 original source coastal reachability gate

on:
  push:
    branches: [analysis/126-island-native-alien-flora-crossed-marine-20261117]
    paths:
      - scripts/audit_NOAA2005_original_global126_ocean_velocity_source_gate_20261117.py
      - .github/workflows/chocho-NOAA-old-OSCAR-2005-global126-source-coast.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  actual-historical-global-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Decode actual NOAA source grids and original GSHHG coast geometry
        run: python -m pip install --disable-pip-version-check 'numpy>=1.26,<3' 'netCDF4>=1.7,<2' 'pyproj>=3.6,<4'
      - uses: actions/download-artifact@v4
        with:
          run-id: 44010673580
          github-token: ${{ github.token }}
          name: chocho-original126-WCVP-GSHHG-sea-geometry-baseline
          path: _src/126_coastal_anchors
      - name: Actually query original public NOAA legacy OSCAR 2005 1-degree decimated global u/v with three fixed original time indices
        run: |
          set -euo pipefail
          python -m py_compile scripts/audit_NOAA2005_original_global126_ocean_velocity_source_gate_20261117.py
          python scripts/audit_NOAA2005_original_global126_ocean_velocity_source_gate_20261117.py \
            --GSHHG-graph data/exploratory/island51_observed_ocean_20261106/coast_0p0625/island51_coastal_ocean_graph.npz \
            --anchors-receipt _src/126_coastal_anchors/GSHHG126_sea_geometry_source_coverage_audit.json \
            --out-dir results/WCVP126_crossed_native_alien_20261117/global_NOAA2005_source
      - name: Strict source-data publication gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("results/WCVP126_crossed_native_alien_20261117/global_NOAA2005_source/NOAA2005_global126_coastal_current_source_eligibility.json")
          z=json.loads(p.read_text())
          assert z["status"]=="GLOBAL_NOAA_OLD_OSCAR_ACTUAL_UV_SOURCE_COVERAGE_NOT_126_ISLAND_PARTICLE_TRANSPORT"
          assert z["all_original_WCVP_islands"]==126
          assert z["source_GSHHG_shore_graph_valid_islands"]==104
          assert z["NOAA_not_NASA_daily_v2"]
          assert z["NOAA_original_global_1deg_3dates_shape"]==[3,161,401]
          assert z["NOAA_original_valid_u_and_v_cell_times"]>0
          assert len(z["126_source_region_release_eligibility"])==126
          assert z["strict_126_original_sea_current_directed_arrival_probabilities_verified"] is False
          print("NOAA_2005_GLOBAL_ORIGINAL_SOURCE_ONLY_PREP_FOR_126_ISLANDS_PASS",
             {"valid_all3":z["source_islands_valid_noaa_all_three_release_dates"],
              "valid_any":z["source_islands_valid_noaa_at_least_one_release_date"]})
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chocho-original-NOAA2005-global126-source-coast-validity
          path: results/WCVP126_crossed_native_alien_20261117/global_NOAA2005_source/
          retention-days: 90
          if-no-files-found: warn
