name: GEB reviewer defenses

on:
  workflow_dispatch:
  push:
    branches:
      - review/geb-null-validation-v02
    paths:
      - "scripts/analyze_butterfly_resource_expansion_matched_null.py"
      - "scripts/analyze_butterfly_resource_expansion_hostbias_null.py"
      - "scripts/analyze_butterfly_climate_distance_sensitivity.py"
      - "scripts/summarize_butterfly_occurrence_resource_validation.py"
      - "docs/exploratory/butterfly_resource_expansion_matched_null_v0.2.json"
      - "docs/exploratory/butterfly_resource_expansion_hostbias_null_v0.1.json"
      - ".github/workflows/geb-reviewer-defenses.yml"

jobs:
  matched-null:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"

      - name: Install Python environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Restore exact S1 resource reconstruction
        uses: actions/download-artifact@v4
        with:
          name: butterfly-resource-envelope-pilot-v01
          path: inputs/s1
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: zuizui0223/TTF
          run-id: 36222306369

      - name: Checkout fixed HOSTS source
        uses: actions/checkout@v4
        with:
          repository: globalbioticinteractions/HOSTS
          ref: 808e0b869f9ec1adf8efff87cf6a395adda103e0
          path: _external/HOSTS

      - name: Checkout fixed WCVP source
        uses: actions/checkout@v4
        with:
          repository: matildabrown/rWCVPdata
          ref: 65bed76bae9d644ccb6ad200c05f9f5071d89e05
          path: _external/WCVP

      - name: Rebuild exact host-family and distribution sidecars
        run: |
          Rscript scripts/build_wcvp_hosts_sidecar.R _external/WCVP _external/HOSTS results/native
          Rscript scripts/build_wcvp_hosts_contemporary_sidecar.R _external/WCVP _external/HOSTS results/contemporary

      - name: Run family-composition matched null
        run: |
          mkdir -p results/geb-reviewer-defense
          python scripts/analyze_butterfly_resource_expansion_matched_null.py             --protocol-json docs/exploratory/butterfly_resource_expansion_matched_null_v0.2.json             --descriptors-csv inputs/s1/butterfly-resource-envelope-pilot-v0.1/s1_resource_descriptors.csv             --insect-host-csv results/native/insect_host_accepted.csv             --native-distribution-csv results/native/native_extant_nondoubtful_wgsrpd3.csv             --contemporary-distribution-csv results/contemporary/extant_nondoubtful_wgsrpd3.csv             --output-json results/geb-reviewer-defense/family_composition_matched_null.json             --output-csv results/geb-reviewer-defense/family_composition_matched_null_species.csv

      - name: Run host-bias matched nulls
        run: |
          python scripts/analyze_butterfly_resource_expansion_hostbias_null.py \
            --protocol-json docs/exploratory/butterfly_resource_expansion_hostbias_null_v0.1.json \
            --descriptors-csv inputs/s1/butterfly-resource-envelope-pilot-v0.1/s1_resource_descriptors.csv \
            --insect-host-csv results/native/insect_host_accepted.csv \
            --native-distribution-csv results/native/native_extant_nondoubtful_wgsrpd3.csv \
            --contemporary-distribution-csv results/contemporary/extant_nondoubtful_wgsrpd3.csv \
            --output-json results/geb-reviewer-defense/hostbias_matched_null.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: geb-family-composition-matched-null-v01
          path: results/geb-reviewer-defense/
          retention-days: 30

  spatial-and-occurrence:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install mapping environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . "shapely>=2,<3"

      - name: Restore independent occurrence summary
        uses: actions/download-artifact@v4
        with:
          name: butterfly-climate-release-postgate-summary-v01
          path: inputs/summary
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: zuizui0223/TTF
          run-id: 36270581743

      - name: Restore independent climate result
        uses: actions/download-artifact@v4
        with:
          name: butterfly-climate-release-postgate-independent-result-v01
          path: inputs/climate
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: zuizui0223/TTF
          run-id: 36270581743

      - name: Checkout official WGSRPD geometry
        uses: actions/checkout@v4
        with:
          repository: tdwg/wgsrpd
          ref: 52da7828aba9d461dd133c27b3bd7a4407161f54
          path: _wgsrpd

      - name: Recompute occurrence-side validation
        run: |
          mkdir -p results/geb-reviewer-defense
          python scripts/summarize_butterfly_occurrence_resource_validation.py             --overlap-json inputs/summary/native_contemporary_overlap.json             --output-json results/geb-reviewer-defense/occurrence_resource_validation.json
          diff -u             benchmarks/exploratory/butterfly_occurrence_resource_validation_v0.1.json             results/geb-reviewer-defense/occurrence_resource_validation.json || true

      - name: Run spatial sensitivity
        run: |
          python scripts/analyze_butterfly_climate_distance_sensitivity.py             --unit-climate-csv inputs/climate/unit_climate_crossfit.csv             --primary-result-json inputs/climate/primary_result.json             --level3-geojson _wgsrpd/geojson/level3.geojson             --output-json results/geb-reviewer-defense/climate_distance_sensitivity.json             --output-csv results/geb-reviewer-defense/climate_distance_sensitivity_species.csv

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: geb-spatial-occurrence-sensitivity-v01
          path: results/geb-reviewer-defense/
          retention-days: 30
