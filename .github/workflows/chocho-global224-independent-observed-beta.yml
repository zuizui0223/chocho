name: chocho original global 224 butterfly observed beta vs host and alien flora

on:
  push:
    branches: [analysis/global-colonial-alien-flora-control-20261031]
    paths:
      - ".github/workflows/chocho-global224-independent-observed-beta.yml"
      - "scripts/analyze_gbif_global224_observed_beta.py"
      - "tests/test_gbif_global224_observed_beta_20261101.py"
      - "provenance/reviewer_defenses/results/global_colonial_resource_beta_20261031/gbif_global224_observed_beta_lock_v1.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chocho-global224-observed-beta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  world-region-butterfly-host-specificity:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate independent response analysis without original GBIF coordinates
        run: |
          python -m pip install "numpy>=1.26,<3" "pandas>=2.2,<3" \
            "shapely>=2.1,<3" "pyproj>=3.7,<4" "pyshp>=2.3" "pytest>=8" ruff
          ruff check --select F821 scripts/analyze_gbif_global224_observed_beta.py
          python -m pytest -q tests/test_gbif_global224_observed_beta_20261101.py
      - name: Checkout exact HOSTS larval host source
        uses: actions/checkout@v4
        with:
          repository: globalbioticinteractions/HOSTS
          ref: 808e0b869f9ec1adf8efff87cf6a395adda103e0
          path: _external/HOSTS
      - name: Checkout earlier frozen global WCVP/HOSTS butterfly potential-resource results
        uses: actions/checkout@v4
        with:
          repository: zuizui0223/chocho
          ref: analysis/global-colonial-host-resource-convergence-20261031
          path: _external/butterfly_beta
      - name: Checkout exact 369 official TDWG polygons
        uses: actions/checkout@v4
        with:
          repository: tdwg/wgsrpd
          ref: 52da7828aba9d461dd133c27b3bd7a4407161f54
          path: _external/wgsrpd
      - name: Reacquire published GloNAF only, no GBIF raw point download
        run: |
          mkdir -p _temp_historical_sources
          curl --fail --show-error --silent --location --retry 2 --connect-timeout 30 --max-time 180 \
            'https://zenodo.org/api/records/6640264/files/lenzner/Eur-Emp-Alien-Flora-v1.0.0.zip/content' \
            --output _temp_historical_sources/lenzner_6640264.zip
          echo '16f5585d2500676951a4b664bbf0ffde  _temp_historical_sources/lenzner_6640264.zip' | md5sum -c -
      - name: Model independent observed GBIF butterfly assemblages and contrast documented host vs other alien flora
        run: |
          python scripts/analyze_gbif_global224_observed_beta.py \
            --output provenance/reviewer_defenses/results/global_colonial_resource_beta_20261031/gbif_global224_observed_beta_v1.json \
            --region-fold-csv provenance/reviewer_defenses/results/global_colonial_resource_beta_20261031/gbif_global224_observed_beta_region_holdout_v1.csv
      - name: Freeze only aggregate findings and geography-heldout scores
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          prefix=provenance/reviewer_defenses/results/global_colonial_resource_beta_20261031
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("provenance/reviewer_defenses/results/global_colonial_resource_beta_20261031/gbif_global224_observed_beta_v1.json")
          x=json.loads(p.read_text())
          assert x["schema"]=="chocho_global224_GBIF_observed_WGSRPD3_2018_2024_beta_v1"
          assert x["cohort"]["global_source_mapped_candidate_species"]==224
          assert x["cohort"]["region_count"]>=35
          assert x["cohort"]["evaluated_region_pairs"]>=400
          print("Original full-global independent observation:",x["cohort"])
          PY
          git add "${prefix}/gbif_global224_observed_beta_v1.json" \
                  "${prefix}/gbif_global224_observed_beta_region_holdout_v1.csv"
          git diff --cached --quiet && exit 0
          # Prevent a stale model from replacing a new source-lock revision.
          git fetch origin "${GITHUB_REF_NAME}"
          if ! git diff --quiet "origin/${GITHUB_REF_NAME}" -- \
              scripts/analyze_gbif_global224_observed_beta.py \
              "${prefix}/gbif_global224_observed_beta_lock_v1.json" \
              "${prefix}/gbif_global224_annual_v1.audit.json"; then
            echo 'Source cohort or model changed during experiment; skip stale publication'
            exit 0
          fi
          git commit -m 'Measure independent global 224-butterfly observed community geography against known hosts and general alien flora [skip ci]'
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
      - name: Remove third-party flora source files
        if: always()
        run: rm -rf _external _temp_historical_sources
